      const brkCap=Math.max(CFG.AI.BRK_DRV_MIN, CFG.AI.BRK_DRV*muRoad(v.s)*skillFx().brkK - CFG.G*Math.max(0,-(v.grade||0))*CFG.AI.GRADE_BRK); // gravity eats brakes downhill ← CFG.AI
      const stopGap = closing*closing/(2*brkCap) + 15 + v.v*0.48;
      if(leadGap < stopGap*1.30) d.warn=1;                       // heads up
      if(leadGap < stopGap*0.75) d.warn=2;                       // BRAKE NOW
      // DITCH DODGE: if even full braking won't clear it and no lane is open,
      // aim for the shoulder — the ditch is bouncy, the bumper is expensive
      if(leadGap < stopGap*0.40 && (v.v-lead.v)>9 && lead.v<8 && !d.ditching && d.passState!==1){
        let laneFree=false;
        for(const alt of ownD){ if(Math.abs(alt-v.lane)>0.8){
          let clr=true;
          for(const o of S.traffic){ if(o.dir>0&&Math.abs(o.lane-alt)<1.1&&o.s>v.s-8&&o.s<v.s+leadGap+16) clr=false; }
          if(clr){ laneFree=true; break; } } }
        if(!laneFree && !stopBlocksShoulder(v.s, v.s+leadGap+16, Math.sign(v.lane)||1)){
          // an emergency swerve really does hand the lane back — and it must drop
          // the stash too, or the pass machine would put us back in a lane we
          // dived out of for a reason
          d.ditching=1.6; d._ditchArm=1; d.heldLane=null; d.holdResume=null; }
      }
      if(d.ditching && leadGap>stopGap*1.3) d.ditching=0;        // threat cleared: release
      if(leadGap < stopGap){
        if(d.passState===3){ d.passState=1; d.passT=0; d.passTgt=lead; } // committed: go around
        else if(d.passState!==1){
          // a LEAD TAPPING ITS BRAKES adds 2.0 to 'closing' for stopping-distance
          // purposes, which is right — but it shouldn't also drag our target
          // under the lead's actual speed when we aren't gaining. In a queue of
          // brake-lights that stacked into a permanent slow-down.
          const rawCl=v.v-lead.v;
          d.vTarget=Math.min(d.vTarget, rawCl>1? lead.v*0.9 : lead.v);
          d.brakeEmg=Math.min(1,(stopGap-leadGap)/stopGap*1.8);
        } else if(lead!==d.passTgt && Math.abs(lead.lane-v.lane)<1.3){
          // a DIFFERENT car squatting in the pass lane is a wall, not a target:
          // full emergency, full distance
          d.vTarget=Math.min(d.vTarget, lead.v*0.9);
          d.brakeEmg=Math.min(1,(stopGap-leadGap)/stopGap*1.8);
        } else if(Math.abs(lead.lane-v.lane)<1.3 && leadGap<stopGap*0.55){
          // our own target, not laterally clear yet: brake AND steer
          d.brakeEmg=Math.min(1,(stopGap*0.55-leadGap)/(stopGap*0.55)*1.8);
        }
      }
      // HOLDING THE GAS = "go". Don't wait until we're about to hit something:
      // if there's a slower car ahead and a safe way past, take it. This is an
      // idle game — the pedal is the whole vocabulary.
      if(S.input.gas && !S.input.steerOn && d.passState===0 && d.passCool<=0
         && leadGap<Math.min(34+v.v*1.3,110) && lead.v < v.v+1){
        let want=null;
        if(ownD.length>1 && Math.abs(LN_L-v.lane)>0.5) want=LN_L;
        // ...but the pedal never sends CALM over the centreline. The chauffeur
        // will use another lane on its own side all day; crossing the line is
        // something only your hands may ask for (flick / holding it out there).
        else if(!MODE.tcs && pfD.onc && pfD.onc.length
                && oncClear(Math.abs(pfD.onc[0]),(v.v+(pfD.ms||28))*3.4+60)) want=pfD.onc[0];
        if(want!==null){
          let clr=true;
          for(const o of S.traffic){ if(Math.abs(o.lane-want)<1.2 && o.s>v.s-10 && o.s<v.s+46+v.v*1.7 && (o.dir>0||want<0)) clr=false; }
          if(clr) commitPass(lead,want);
        }
      }
      // human is flooring it into a bumper: AI grabs the wheel if a gap exists
      if(S.input.gas && !S.input.steerOn && d.passState===0 && leadGap<stopGap*0.9){
        let clr=true;
        for(const c of S.traffic){ if(c.dir<0 && c.s>v.s-10 && c.s<v.s+150+v.v*3.5) clr=false; }
        if(clr){
          // BORROW, don't confiscate. This is the path a player on the throttle
          // hits constantly — hold a lane, keep your foot in, close on a bumper,
          // and the AI takes the wheel to get you round. It used to bin the held
          // lane on the way past, so the manoeuvre ended in autonomous cruise and
          // the car slid back to the kerb. That is the "it won't stay in the lane
          // I put it in" report, and this line is where it came from.
          if(d.heldLane!=null) d.holdResume=d.heldLane;
          d.passState=1; d.passT=0; d.passTgt=lead; d.heldLane=null; }
      }
    }
  }
  // ── PATH LEAD + WALL-AHEAD GOVERNOR ───────────────────────────────────
  // The single biggest source of AI wrecks was attacking a slow 12 m bus at
  // motorway speed: the pass machine or the drift buried the brake and the
  // Viggen posted its condolences. Find the nearest car genuinely IN our path,
  // ahead, on a sight-line that SCALES WITH SPEED (braking distance + a beat),
  // and treat a slow heavy vehicle as the moving wall it is — ease onto it
  // early so pace never exceeds what the brakes can shed before its tail. The
  // pass machine can still go around (once we're off its lane the cap lifts);
  // this only stops us arriving faster than physics allows.
  const sightLine = 22 + v.v*v.v/(2*CFG.AI.BRK_DRV);          // metres we must see to stop
  let pathLead=null, pathGap=1e9;
  for(const c of S.traffic){ if(c.dir>0 && c.s>v.s-4){ const g=c.s-v.s;
    if(g<pathGap && g<sightLine && Math.abs(c.lane-v.lane)<2.2){ pathLead=c; pathGap=g; }
    if(c.tr){ const gt=c.tr.s-v.s;                // the box, not the cab, is what's close
      if(gt>-4 && gt<pathGap && gt<sightLine && Math.abs(c.tr.lane-v.lane)<2.2){ pathLead=c; pathGap=gt; } } } }
  if(pathLead && d.passState!==1){
    const heavy=(pathLead.type==="lorry"||pathLead.type==="semi"||pathLead.type==="trailer");
    if(heavy && pathLead.v < v.v-3){                          // a wall with a numberplate
      d.vTarget=Math.min(d.vTarget, pathLead.v + Math.max(0,(pathGap-(20+v.v*0.7)))*0.32);
      if(v.v <= pathLead.v+0.5) d.vTarget=Math.max(d.vTarget, pathLead.v); // already matched: stop shaving
      // and if we're genuinely inside its stopping distance, brake for real —
      // the soft cap alone let racing coast into the back of the slow ones.
      const stop=(v.v-pathLead.v)*(v.v-pathLead.v)/(2*CFG.AI.BRK_DRV)+16+v.v*0.5;
      if(pathGap < stop){ d.brakeEmg=Math.max(d.brakeEmg||0, Math.min(1,(stop-pathGap)/stop*1.7)); }
    }
  }
  // ===== CHASE: fleeing-car behaviours, layered on top of the MODE table =====
  if(S.chase && S.chase.active){
    // CALM is the law-abiding one: with a cop on the radar or actively chasing,
    // it eases to the posted limit — so it neither trips the trap nor racks up a
    // violation — UNLESS the player is holding the gas. (Chase-context only; it
    // never touches Calm's normal idle cruising away from a cop.)
    if(S.aiMode==="calm" && !S.input.gas){
      d.vTarget=Math.min(d.vTarget, roadSpeedLimitAt(v.s)+1);
    }
    // PULL-OVER: Spirited yields once it has been over the line long enough;
    // Calm only if the player forced it over (see governor above). Racing and
    // Drift never pull over — their only exit is to outrun the cop.
    const canPullOver = (S.aiMode==="spirited" || S.aiMode==="calm");
    if(!S.chase.pulledOver && canPullOver && S.chase.violationT > CFG.CHASE.pullOverAfterS){
      S.chase.pulledOver=true; S.chase.pullOverT=CFG.CHASE.pullOverHoldS; S.chase.violationT=0;
    }
    if(S.chase.pulledOver){
      S.chase.pullOverT-=dt;
      d.vTarget=0;                                         // brake to a stop (longitudinal below honors it)
      const dside=Math.sign(v.lane)||1;                    // ease onto the shoulder — same pattern as d.ditching
      d.steer=Math.max(-1,Math.min(1,(dside*(profAt(v.s).edge+0.6)-v.lane)*0.55));
      if(S.chase.pullOverT<=0){ d.steer=0; bustChase(); }  // ticket written, cop departs
    }
  }
  // longitudinal control — full commitment, not a chauffeur
  if(d.hot){ d.vTarget=Math.min(d.vTarget, v.v>24? v.v-1 : 24); }   // let it breathe
  const err=d.vTarget-v.v;
  if(err>0){ d.pedal=Math.min(1, d.pedal+dt*6, 0.30+err*0.9); d.brake=0; }
  else {
    // COAST FIRST. Being a touch over the planned pace is not an emergency:
    // lift and let drag and engine braking do it. Only lean on the pedal once
    // the overspeed is real. Calm keeps its chauffeur reflex and brakes at
    // once; the sportier temperaments get a deadband, so they stop "braking
    // for overspeed" on every gentle crest and bend. Safety still overrides —
    // brakeEmg below and the corner planner both bypass this entirely.
    const dead = MODE.tcs? 0.2 : 2.2;
    d.pedal=Math.max(0,d.pedal-dt*8);
    d.brake=Math.min(1, Math.max(0,(-err-dead))*0.42);
    if(-err>5.5)d.panic=1;                                        // hairpins get the stamp too
  }
  if(d.brakeEmg){ d.brake=Math.max(d.brake,d.brakeEmg); d.pedal=0; d.brakeEmg=0; d.panic=1; }
  if(d.hot)        d.pedal=Math.min(d.pedal,0.55);                   // coolant diplomacy
  else if(d.hotIC) d.pedal=Math.min(d.pedal,0.72);                   // let the core breathe
  // Calm's TCS is PREDICTIVE: it knows the budget and never asks for more.
  if(MODE.tcs){
    const trim=TRIMS[S.trim], m=trim.kg+CFG.CREW_KG, g=CFG.G;
    const muV=CFG.GRIP.MU0*(S.parts.lsd?CFG.GRIP.LSD:1)*(S.parts.susp?CFG.GRIP.SUSP:1)*(S.parts.arb?CFG.GRIP.ARB:1)*muRoad(v.s); // ← CFG.GRIP
    const looseLong=(profAt(v.s).dirt||profAt(v.s).gravel)? 1.20 : 1;   // same drive-traction model as vehicleStep — don't ask for less than the tyre can bulldoze
    const budget=0.95*muV*(m*g*0.62)/(1+0.95*muV*0.19)*looseLong - Math.abs(v.latG)*m*g*0.55;
    const FperTq=gearsNow()[S.dt.gear-1]*finalNow()*0.90/wheelRNow();
    const tqMax=Math.max(30, budget/FperTq);
    d.pedal=Math.min(d.pedal, (tqMax*1.02)/(trim.tqNm+TUNES[S.tune].tq));
  }
  // ---- MANUAL OVERRIDES: your hands beat the robot ----
  const I=S.input;
  // your hands beat the robot. An expo curve softens the first part of the
  // wheel travel (less darty on a straight / small corrections) while keeping
  // full lock available for the tight stuff. Only the human input is shaped;
  // the AI's steer stays linear so its feed-forward math holds.
  if(I.steerOn){ const s=Math.max(-1,Math.min(1,I.steer));
    d.steer = s*(0.50+0.50*s*s); d.passState=0;   // progressive per side, but real authority mid-travel; full lock at the edge
    // FLICK = "GO". A deliberate shove toward the passing side is an
    // instruction, not noise — remember it for a moment after you let go, so
    // the driver picks the overtake up instead of meekly tucking back in.
    if(Math.abs(s)>0.16){ d.flick=Math.sign(s); d.flickT=1.4; }  // a nudge counts; touch input is brief
  }
  // Let go while already out on the far side? That is a committed overtake, not
  // a stray input — adopt it and run the line, rather than tucking back in and
  // handing the queue back to you.
  if(!I.steerOn && d.passState===0 && lead && v.lane<-0.5 && d.passCool<=0
     && pfD.onc && pfD.onc.length && lead.v < v.v+2){
    let mine=pfD.onc[0];
    for(const L of pfD.onc) if(Math.abs(L-v.lane)<Math.abs(mine-v.lane)) mine=L;
    commitPass(lead,mine);
  }
  if(d.flickT>0){
    d.flickT-=dt;
    if(!I.steerOn && d.flick && lead && d.passState===0 && d.passCool<=0){
      // which way did they ask? On this road "left" means toward lower lane
      // numbers (the passing side); right means the outside/kerb side.
      const wantL = d.flick<0;
      let tgtLane=null;
      if(wantL){
        if(ownD.length>1 && Math.abs(LN_L-v.lane)>0.5) tgtLane=LN_L;                  // a real lane on our own side
        // THE LICENCE GATES THE ROBOT, NOT YOU. laneAuth exists to stop the AI
        // helping itself to the oncoming lane on its own initiative. When YOU
        // put the car there it is an instruction, and refusing it is why a
        // stock car "just gets back out". Safety still has a veto: the far side
        // must be provably clear.
        else if(pfD.onc && pfD.onc.length && oncClear(Math.abs(pfD.onc[0]),(v.v+(pfD.ms||28))*3.2+50))
          tgtLane=pfD.onc[0];
      } else if(ownD.length>1 && Math.abs(LN_R-v.lane)>0.5) tgtLane=LN_R;             // undertake on the outside
      if(tgtLane!==null){
        let clr=true;                                     // don't send them into an occupied lane
        for(const c of S.traffic){
          if(Math.abs(c.lane-tgtLane)<1.2 && c.s>v.s-10 && c.s<v.s+40+v.v*1.6 && (c.dir>0||tgtLane<0)) clr=false;
        }
        if(clr) commitPass(lead,tgtLane);
      }
      d.flick=0; d.flickT=0;
    }
  }
  if(I.gas){
    // YOUR FOOT IS YOURS. Holding the gas is full throttle in every
    // temperament — the mode changes the DRIVER, not your right pedal. (An
    // earlier pass throttled you back in Calm; that was wrong.)
    d.pedal=1;
    // What the mode DOES change is how early the driver beside you reaches for
    // the brake. That request stands — it is no longer zeroed by your throttle,
    // which is what made "chill mode" exactly as fatal as Racing. A conservative
    // driver simply asks sooner and holds it longer, so you carry less speed and
    // get more margin to mash; Racing barely asks at all. The pedal lights up
    // either way: that is your cue to lift. Eventually you must — no amount of
    // AI braking saves a blind hairpin taken at 130.
    if((d.brake||0)>0.02) d.panic=1;                 // the driver means it: stamp, don't feather
    if(!I.steerOn){ // weave through: steer for the lane with the most headway
      const lanes=[LN_L,LN_R];
      const hzn=(v.v+30)*4.2;
      if(LV.lanes>=3 && oncClear(1.7,hzn)) lanes.push(-1.7);
      if(LV.lanes>=4 && oncClear(5.1,hzn*1.15)) lanes.push(-5.1);
      const head=lanes.map(L=>{ let g=1e9;
        for(const c of S.traffic){ if(c.s>v.s && Math.abs(c.lane-L)<1.2 && (c.dir>0||L<0)){ g=Math.min(g,c.s-v.s); } }
        return g; });
      const curI=lanes.reduce((bi,L,i)=>Math.abs(v.lane-L)<Math.abs(v.lane-lanes[bi])?i:bi,0);
      if(head[curI] < 60+v.v*1.0){
        let bi=curI; for(let i=0;i<lanes.length;i++) if(head[i]>head[bi]) bi=i;
        let occ=false;
        for(const c of S.traffic){ if(Math.abs(c.lane-lanes[bi])<1.2&&c.s>v.s-14&&c.s<v.s+10) occ=true; }
        if(!occ){
          // ADD the weave to the corner steer — never replace it. Overwriting
          // d.steer here meant that holding the gas through a bend cancelled the
          // steering FOR the bend, and the car drove straight into the scenery.
          const weave=Math.max(-0.55,Math.min(0.55,(lanes[bi]-v.lane)*0.5));
          d.steer=Math.max(-1,Math.min(1, d.steer + weave));
        }
      }
    }
  }
  if(I.brake){ d.brake=1; d.pedal=0; }
  // HEAT MANAGEMENT: the long game. Each temperament has a coolant line it
  // respects — cross it and the right foot gets diplomatic until things cool.
  { const th={calm:100,spirited:106,racing:112,drift:108}[S.aiMode]||106;
    const e2=S.eng;
    if(e2.coolT!==undefined){
      if(e2.coolT>th || e2.steam) d.hot=1;
      else if(e2.coolT<th-7) d.hot=0;
    }
    if(e2.iat!==undefined && e2.iat> (hwCeils().knockPivot+16)) d.hotIC=1;
    else if(e2.iat!==undefined && e2.iat< (hwCeils().knockPivot+6)) d.hotIC=0;
  }
  // DRIFT: throw the weight. Entry flick -> tail steps toward the outside ->
  // counter-steer catch -> gather it up and blend into the road at exit. Only
  // clean corners, only with room; the pass machine always outranks the show.
  d._drifting=0;
  // must we brake for something in our path RIGHT NOW? (closing, inside its
  // stopping distance) — the trigger to scrub a slide instead of powering it.
  const brakeNow = !!pathLead && (v.v-pathLead.v)>2
        && pathGap < ((v.v-pathLead.v)*(v.v-pathLead.v)/(2*CFG.AI.BRK_DRV) + 12 + v.v*0.55);
  if(MODE.drift && d.passState===0 && !S.input.steerOn){
    const cv=curvAt(v.s+8);
    // room to START a slide: nothing close ahead-and-closing, nothing right
    // beside us. A distant car does NOT abort a slide already underway — that
    // left the car ploughing wide mid-corner. Instead a committed slide SCRUBS
    // (below): brake in, no power-over, the drift itself sheds the speed.
    const startBubble=Math.max(40, 20+v.v*1.4);
    let room=true;
    for(const c of S.traffic){ const ahead=c.s-v.s;
      if(Math.abs(ahead)<15 && Math.abs(c.lane-v.lane)<3){ room=false; break; }
      if(ahead>0 && ahead<startBubble && c.v<v.v-1 && Math.abs(c.lane-v.lane)<3){ room=false; break; } }
    const want=Math.abs(cv)>1/(S.arcade?320:250) && v.v>(S.arcade?12:15) && (room || d.driftA>0.15);
    if(want && !(d.driftA>0)) d.driftT=0;                       // fresh corner, fresh throw
    if(want) d.driftA=Math.min(1,(d.driftA||0)+dt*2.4);
    else     d.driftA=Math.max(0,(d.driftA||0)-dt*2.8);
    if(want && d.driftA>0.02){
      d._drifting=1;                                            // actively holding a slide
      const dir=Math.sign(cv||d.driftDir||1); d.driftDir=dir;
      d.driftT=(d.driftT||0)+dt;
      const entry=Math.max(0,1-d.driftT/0.5);                   // first half second
      let sl=(d.driftT<2.4? Math.sin(Math.min(Math.PI,d.driftT/2.4*Math.PI))
                            : 0.72+0.10*Math.sin(d.driftT*7))*d.driftA;
      // ARCADE: the assist holds the tail out for the WHOLE curve — the slide
      // lives exactly as long as the corner does, then hands the car back.
      if(S.arcade && Math.abs(curvAt(v.s+12))>1/300) sl=Math.max(sl, 0.80*d.driftA);
      // ATTACK: brake stab shifts the weight onto the nose, steering flicks in
      d.brake=Math.max(d.brake, 0.55*entry);
      d.steer += dir*1.3*entry;
      // THE THROW: a real angle now — the nose points well into the corner
      // while the path continues. Bigger and quicker than the old timid wobble.
      const yawTgt=dir*0.42*sl;
      v.driftYaw=(v.driftYaw||0)+(yawTgt-(v.driftYaw||0))*Math.min(1,dt*8);
      // tail steps toward the outside; the driver holds it there
      const pfDft=profAt(v.s), innDft=pfDft.own.length? Math.max(0.8,pfDft.own[0]-0.7) : 0.8;
      v.lane=Math.min(pfDft.edge-0.5,Math.max(innDft, v.lane - dir*sl*dt*2.2)); // was hardcoded 1.0..6.6 — off-road on dirt, timid on 6-lanes
      // POWER-OVER vs SCRUB: normally throttle held through the slide keeps it
      // rotating. But if we're closing on something in the path, the slide turns
      // into a brake — the hockey-stop into the corner. Power-over can no longer
      // bury the emergency brake into the back of a bus.
      if(brakeNow && !(MODE.arc && S.input.gas)){
        d.pedal=0; d.brake=Math.max(d.brake, Math.min(1, 0.5+(v.v-pathLead.v)*0.06)); d.panic=1;
      }
      else if(d.driftT>0.4) d.pedal=Math.max(d.pedal, 0.76*sl);
      // ── ARCADE, PEDAL ABUSE vs LIFT ─────────────────────────────────────
      // Hold it down and the slide goes BIG: more angle, the line runs wide to
      // the outside, and all that yaw scrubs speed — epic to watch, slower on
      // the stopwatch. And if the outer lane is occupied and you still won't
      // lift, there is no grip left to get you across: you rear-end it. That's
      // the deal. LIFT and the driver repairs the line — gathers the angle and
      // takes the inside again, smoothly, no snap.
      if(MODE.arc){
        if(S.input.gas){
          const abuse=Math.min(1,(v.v-(d.vPlan||v.v))/8);           // how far past the plan we insist
          if(abuse>0){
            v.driftYaw=(v.driftYaw||0)+dir*0.30*abuse*Math.min(1,dt*6);   // hang it out further
            v.lane=Math.min(pfDft.edge-0.35, v.lane + dir*abuse*dt*2.6);  // run WIDE, toward the outside
            v.v=Math.max(0, v.v - abuse*sl*3.2*dt);                        // the yaw scrubs the speed away
            v.slip=Math.max(v.slip, Math.min(1, 0.70*sl+0.30*abuse));
          }
        } else if((d.driftA||0)>0.10){
          // the repair: tighten back toward the inside line and let the angle go
          const innerT=Math.max(innDft, pfDft.own.length? pfDft.own[0]-0.4 : 0.8);
          v.lane += (innerT*Math.sign(v.lane||1) - v.lane)*Math.min(1,dt*1.5)*0.55;
          v.driftYaw=(v.driftYaw||0)*(1-Math.min(1,dt*2.2));
          d.driftCS=(d.driftCS||0)*(1-Math.min(1,dt*2.2));
        }
      }
      d.driftCS = -dir*sl*1.25;                                 // big visible counter-steer
      v.slip=Math.max(v.slip,0.70*sl);                          // tires narrating
    }
  } else if(d.driftA){ d.driftA=Math.max(0,d.driftA-dt*2.8); }
  // ── DRIFT EXIT — gather it up and blend into the road ahead ──────────────
  // No snap to straight. The nose unwinds toward the road's tangent while the
  // last of the slide scoots the car square in its lane, and the counter-steer
  // bleeds off in step. The unwind quickens as the exit opens out, so the nose
  // arrives on the new straight — not on the corner it just left.
  if(!d._drifting && (Math.abs(v.driftYaw||0)>0.004 || Math.abs(d.driftCS||0)>0.008 || d.driftA>0.02)){
    const cvAhead=Math.abs(curvAt(v.s + 9 + v.v*0.7));
    const straightening=Math.max(0, 1 - cvAhead*300);        // 1 once the road ahead has opened up
    const rate=Math.min(1, dt*(2.0 + 3.2*straightening));    // gentle in a bend, brisk on the open exit
    v.driftYaw=(v.driftYaw||0)*(1-rate);                     // rotation eases to zero = aligned with the path
    // Square up in the lane we're EXITING through — the nearest lane centre to
    // where the slide left us — NOT a migration to the mode's far cruise lane.
    // (Ordinary lane-keeping can drift us home later, gently, on the straight.)
    const pfEx=profAt(v.s), cand=pfEx.own.concat(pfEx.onc||[]);
    let sq=cand.length?cand[0]:v.lane;
    for(const L of cand) if(Math.abs(L-v.lane)<Math.abs(sq-v.lane)) sq=L;
    v.lane += (sq - v.lane) * rate * 0.85;                   // the last of the slide scoots us square
    d.driftCS=(d.driftCS||0)*(1-rate);                       // counter-steer unwinds with the angle
    // blend the hands off the slide and onto the square-up line while any
    // angle remains, then hand cleanly back to normal steering
    const gatherW=Math.min(1, Math.abs(v.driftYaw||0)/0.10 + (d.driftA||0)*3);
    if(gatherW>0.04) d.steer = d.steer*(1-gatherW) + (sq - v.lane)*1.2*gatherW;
    d.driftA=Math.max(0,(d.driftA||0)-dt*3.0);
    if((v.slip||0)>0) v.slip=Math.max(0, v.slip - dt*2.0);   // grip returns as it squares up
  }
  // ── CASUAL PARKING ────────────────────────────────────────────────────
  // Once you've eased off the tarmac beside a stop, the driver hands you the
  // car and suspends its own throttle. With no pedal input: a hand on the wheel
  // creeps forward at walking pace so you can position; letting go eases to a
  // stop. Your own gas/brake always win. Steer back onto the road and normal
  // driving takes over again — he'll take off.
  { const rsLot=restStopNear(v.s);
    const inLot = rsLot && v.lane > pfD.edge-0.6;      // off the tarmac, on the apron (stops are always on the right)
    if(inLot && !I.gas && !I.brake){
      d.passState=0; d.holdResume=null; d.ditching=0; d.brakeEmg=0; d.driftA=0; d.warn=0;
      if(I.steerOn){                                    // a hand on the wheel
        const leaving = I.steer < -0.15;                // steering left = heading back onto the tarmac
        const cap = leaving ? 7.5 : 3.6;                // roll out when leaving; gentle creep when positioning
        const err = cap - v.v;
        d.pedal = err>0 ? Math.min(leaving?0.35:0.20, err*0.09) : 0;
        d.brake = v.v>cap+1.5 ? 0.25 : 0;
      } else {                                          // hands off in the lot: settle to a stop
        d.pedal = 0; d.brake = Math.min(1, 0.30 + v.v*0.05); d.panic=1;
      }
    }
  }
  // CORNERING FEED-FORWARD + HEADING DAMPING: the car now carries a heading
  // error through a bend (see vehicleStep). The AI matches the road's curvature
  // and damps that error so idle driving tracks its line without ringing. A human
  // gets none of this — they steer the corner, and holding straight draws a
  // straight line through the apexes.
  if(!I.steerOn && Math.abs(v.driftYaw||0)<=0.06){
    const authP=Math.max(0.15, Math.min(1, v.v/7));
    // during the release handoff, the merge controller (above) owns heading with
    // its own gentle damping — the gain-5 psi slam here is exactly the old hard
    // yank, so suppress it and keep only the cornering feed-forward.
    const psiDamp = d._handActive ? 0 : (v.psi||0)*AI_PSI_DAMP;
    d.steer += (v.curv||0)/(authP*STEER_KAPPA) - psiDamp;
    d.steer = Math.max(-1, Math.min(1, d.steer));
  }
  // slew limits: hands and feet move at human speed
  d.steerS=d.steerS||0;
  // MANUAL beats the robot: the player's wheel is a near-instant connection to
  // the front axle, NOT filtered by driver-skill (LV.slew) or the AI's hand
  // speed. The AI's own rates (the else branch) are untouched, so with no input
  // held the AI-vs-AI trajectory is bit-identical to before.
  // The wheel unwinds toward centre faster than it winds away from it: turn-in
  // is smooth and deliberate, recovery is quick, which kills the darty feel.
  const returning = (d.steer - d.steerS)*d.steerS < 0;   // stepping back toward zero?
  const sRate = S.input.steerOn ? (returning ? 30 : 21)*dt
                                : (d._handActive ? 14*dt                       // catch the release briskly
                                : (d.passState?5.6:3.4)*LV.slew*dt); // skill sharpens the AI's hands
  d.steerS+=Math.max(-sRate,Math.min(sRate, d.steer-d.steerS));
  d.brakeS=d.brakeS||0;
  // a HELD brake pedal is hard too; released, it falls back to the AI's normal
  // release rate so a recent manual stab still bleeds off like a human foot.
  const bUp = S.input.brake ? 60*dt : (d.panic?28:6)*dt;   // panic stamps the pedal, smoothness be damned
  const bDn = S.input.brake ? 60*dt : 9*dt;
  d.brakeS+=Math.max(-bDn,Math.min(bUp, d.brake-d.brakeS));
  // BRAKE LIGHT: real brake REQUESTS only — the AI driver's and yours. Never
  // engine braking, never coasting (that's the audible fuel-cut, not a pedal).
  // The point is to tell you when to lift: the AI's request survives here even
  // when your held gas overrides it, so an amber pedal under your own throttle
  // means "the driver wants the brake and you're outvoting him."
  d.brakeCue=Math.max(d.brake||0, S.input.brake?1:0);
  d.brakeCueS=d.brakeCueS||0;
  d.brakeCueS+=Math.max(-bDn,Math.min(bUp, d.brakeCue-d.brakeCueS));
  d.panic=0;
}

/* ============================ TRAFFIC =================================== */
const VTYPES={
  sedan:{len:4.5, w:1.78, hK:1.00, vK:1.00,  wt:30},
  wagon:{len:4.75,w:1.78, hK:1.06, vK:0.98,  wt:22},
  hatch:{len:3.92,w:1.70, hK:0.98, vK:1.02,  wt:16},
  van:  {len:5.40,w:1.90, hK:1.45, vK:0.90,  wt:12},
  lorry:{len:9.60,w:2.45, hK:1.85, vK:0.62,  wt:12},
  // THE SEMI: a cab that may or may not be pulling a trailer. They are two
  // linked entities — the cab drives, the trailer follows on the drawbar — so
  // each gets its own depth in the painter's sort and its own hitbox, and a
  // bobtail cab running solo is just a semi with no trailer attached.
  semi: {len:6.20,w:2.50, hK:1.88, vK:0.68,  wt:6},   // cab-over tractor unit
  trailer:{len:13.6,w:2.55,hK:2.00, vK:0.68, wt:0}   // the box rides a touch taller than the cab; wt 0 = never spawns alone
};
// FIFTH WHEEL, not a drawbar. On a real semi the trailer's kingpin sits OVER
// the tractor's rear axle, so the box overhangs the cab by a couple of metres
// instead of trailing behind a gap. Negative = overlap.
const SEMI_HITCH=-3.6;
function pickVType(r){ let acc=0,tot=0; for(const k in VTYPES)tot+=VTYPES[k].wt;
  r*=tot; for(const k in VTYPES){acc+=VTYPES[k].wt; if(r<acc)return k;} return "sedan"; }
/* Free-flow target for a same-direction traffic car, expressed RELATIVE to the
   posted limit. A 'lane' car ebbs from limit-5 up to the limit; a 'fast' car
   cruises from the limit up to limit+5 — both wandering slowly on their own
   phase. Scaled by the vehicle's vK so a lorry stays a lorry even at speed. */
function npcCornerV(c){
  // NPC corner sense. Not a sim — one look down the road at what's coming and
  // the same v = sqrt(mu.g.R) every driver in the world obeys, with a healthy
  // sandbag because these are commuters, not racers. Without it traffic held
  // the posted limit through hairpins as if on rails, which both looked wrong
  // and quietly made the player's own AI look timid: it slows for bends, they
  // didn't, so on anything twisty the queue simply walked away.
  const dir=c.dir>0?1:-1;
  const look=14+c.v*1.5;
  let cv=0;
  for(let a=8;a<=look;a+=11) cv=Math.max(cv, Math.abs(curvAt(c.s+dir*a)));
  if(cv<1e-5) return 1e9;
  const mu=0.70*muRoad(c.s)*(VTYPES[c.type||"sedan"].vK||1);
  return Math.max(7, Math.sqrt(Math.max(0.05,mu)*CFG.G/cv));
}
function roleTargetSpeed(c, limitMs, t){
  const wander = 2.5*Math.sin(t/(c.oscPeriod||10) + (c.oscPhase||0));
  const base = c.role==='fast' ? limitMs+2.5+wander : limitMs-2.5+wander;
  return Math.max(6, base*(VTYPES[c.type||"sedan"].vK||1));
}
function trafficStep(dt){
  const v=S.veh;
  // spawn — the forest roads are empty; the motorway is not
  const pfT=profAt(v.s+300);
  const spawnK=(pfT.dirt||pfT.gravel)? CFG.GEN.looseTrafficK : 1;
  if(S.traffic.length<8 && R()<dt*CFG.GEN.trafficRate*spawnK){
    let dir = R()<0.42?-1:1;
    const sSpawn = v.s + (dir>0? 240+R()*300 : (S.drv.passState? 760:420)+R()*400); // no mid-pass ambushes
    const pfS = profAt(sSpawn);                                // the road THEY stand on
    if(dir<0 && pfS.onc.length===0) dir=1;                     // one-way: nothing comes at you
    const vt=pickVType(R());
    const set = dir>0? pfS.own : pfS.onc.map(x=>-x);           // lane menus per profile
    const lanePick = set.length>1 ? (R()<0.68? set[set.length-1] : set[0]) : set[0];
    // ROLE (same-direction only): Fast Lane Cars cruise at/above the limit and
    // pick off Lane Cars; Lane Cars ebb below it and rarely pass. Heavy vehicles
    // and single-lane roads are always plodders.
    const heavy=(vt==="lorry"||vt==="semi");
    const role = dir>0 ? ((heavy||pfS.own.length<=1)? 'lane' : (R()<0.35?'fast':'lane')) : null;
    const oscPhase=R()*Math.PI*2, oscPeriod=8+R()*6;
    const spawnV = dir>0
        ? roleTargetSpeed({role,type:vt,oscPhase,oscPeriod}, roadSpeedLimitAt(sSpawn), S.t)
        : (16+R()*9)*VTYPES[vt].vK;
    S.traffic.push({
      s: sSpawn,
      v: spawnV,
      dir, lane: dir>0? lanePick : -lanePick,
      type:vt, role, oscPhase, oscPeriod,
      col: ["#8a8f96","#5b6a7e","#7e5b5b","#4e5e4e","#c8c9cc"][Math.floor(R()*5)]
    });
    const nc=S.traffic[S.traffic.length-1];
    // only Fast Lane Cars hunt overtakes — Lane Cars essentially never spawn aggro
    // HITCH UP. Most semis are pulling something; some run bobtail. The trailer
    // is a real linked entity with its own position, depth and hitbox — not a
    // longer cab — so it sorts and collides on its own terms.
    if(vt==="semi" && R()<0.94){    // bobtail cabs are a rare sight
      nc.tr={ s:nc.s, lane:nc.lane, dir:nc.dir, v:nc.v, type:"trailer", brk:0,
              col:["#d8dade","#c9ccd1","#8f959c","#b64a3e","#3f5d7e"][Math.floor(R()*5)], _cab:nc };
    }
    if(dir>0 && role==='fast' && R()<0.55 && pfS.own.length>1){ nc.aggro=true; nc.col="#2f3338"; } // stripes need room
    if(dir>0 && pfS.median && R()<0.18) nc.exiter=true;        // someone's getting off ahead
  }
  // NPC car-following: same-direction traffic brakes for whatever is ahead
  // of it in its lane — the player included. Nobody drives blind here.
  for(const c of S.traffic){
    if(c.dir>0){
      if(c.v0===undefined)c.v0=c.v;
      // free-flow target: role-relative to the posted limit, wandering slowly.
      // A car mid-overtake (npass) gets a temporary boost over its role target
      // (+10 for a Fast Lane Car, +7 for a Lane Car).
      const limitMs=roadSpeedLimitAt(c.s);
      let freeFlow = c.role ? roleTargetSpeed(c, limitMs, S.t) : c.v0;
      if(c.npass) freeFlow = roleTargetSpeed(c, limitMs, S.t) + (c.role==='fast'?10:7);
      freeFlow = Math.min(freeFlow, npcCornerV(c));      // drive the road, not the rails
      let ga=1e9, tv=0;
      if(v.s>c.s && v.s-c.s<ga && Math.abs(v.lane-c.lane)<2.0){ga=v.s-c.s;tv=v.v;}
      for(const o of S.traffic){ if(o!==c&&o.dir>0&&o.s>c.s&&o.s-c.s<ga&&Math.abs(o.lane-c.lane)<2.0){ga=o.s-c.s;tv=o.v;} }
      const need=(c.aggro?6+c.v*0.9:10+c.v*1.4)
                 + Math.max(0,c.v-tv)*2.4;             // closing fast = hang back further
      // the mountain taxes everyone — but the stripe crowd has the power to pay
      const gN=roadAt(c.s).grade;
      const gF=Math.max(0.55,Math.min(1.22, 1 - Math.max(0,gN)*(c.aggro?1.4:2.6) + Math.max(0,-gN)*1.1));
      let vt=freeFlow*gF, cornerBound=false;
      for(const la of [16,45,85,150]){                 // braking-distance corner scan, NPC edition
        const cvN=Math.abs(curvAt(c.s+la));
        if(cvN>1e-4){
          const vc2=Math.sqrt(muRoad(c.s+la)*CFG.G/cvN)*0.92;
          const vAllow=Math.sqrt(vc2*vc2 + 2*2.9*la);  // plan gently, brake with reserve
          if(vAllow<vt){ vt=vAllow; cornerBound=true; }
        }
      }
      if(ga<need){
        const panic = ga<need*0.45;                    // brake lights and religion
        const nv=Math.max(Math.min(tv*0.95,c.v), c.v-(panic?9.2:6.5)*dt);
        c.brk = nv<c.v-0.01 ? 1 : Math.max(0,(c.brk||0)-dt*3); c.v=nv; }
      else { const acc=2.5*Math.max(0.35,1-Math.max(0,gN)*6);      // uphill pulls sap NPC torque too
        if(c.v<vt) c.v=Math.min(vt, c.v+acc*dt);
        else if(c.v>vt+0.5) c.v=Math.max(vt, c.v-(cornerBound?5.0:1.1)*dt);
        c.brk=Math.max(0,(c.brk||0)-dt*3); }
      // aggro overtakes: pull out when stuck, clear of oncoming AND the player
      if(c.aggro){
        c.lnT=(c.lnT===undefined?c.lane:c.lnT);
        const pfC=profAt(c.s), ownC=pfC.own;
        const LNC=ownC[ownC.length-1], LNP=ownC.length>1? ownC[ownC.length-2] : ownC[0];
        if(!c.npass){
          if(ownC.length>1 && ga<need*1.7 && tv<c.v0-3 && Math.abs(c.lane-LNC)<1){
            let clr=true;
            for(const o of S.traffic){ if(o!==c&&o.dir>0&&Math.abs(o.lane-LNP)<1&&o.s>c.s-30&&o.s<c.s+70) clr=false; }
            // the player counts if IN the pass lane OR heading there — and the
            // behind-window scales with closure (a 70 mph Saab eats 50 m fast)
            const pIn = Math.abs(v.lane-LNP)<2.4 || (S.drv.passState && (S.drv.passLane||0)<LNP+1.3);
            if(pIn && v.s>c.s-(40+Math.max(0,v.v-c.v)*3.5) && v.s<c.s+90) clr=false;
            if(clr){ c.npass=1; c.lnT=LNP; }
          }
        } else {
          let stillBlocked=false;
          for(const o of S.traffic){ if(o!==c&&o.dir>0&&Math.abs(o.lane-LNC)<1&&o.s>c.s-14&&o.s<c.s+12+c.v*1.1) stillBlocked=true; }
          if(v.s>c.s-(26+v.v*1.2) && v.s<c.s+12 && Math.abs(v.lane-LNC)<1) stillBlocked=true; // never cut in on the player
          if(!stillBlocked){ c.npass=0; c.lnT=LNC; }
        }
      }
      // LANE HONESTY — for EVERY same-direction car, aggro or not:
      // settle onto the current profile, MERGE BEFORE the road narrows,
      // zipper politely, take your exit, never cruise the ditch.
      {
        const pfC=profAt(c.s), ownC=pfC.own;
        const LNC=ownC[ownC.length-1];
        // preemptive merge: if the lane you're in won't exist by the time you
        // get there, start moving NOW — signalling at the seam is how vans end
        // up in fields. The horizon scales with speed (a fixed 120 m was under
        // 5 s for a motorway car), and we no longer refuse the merge just
        // because the target lane hasn't appeared yet: the seam taper means the
        // road is still wide here, which is exactly when it's safe to move.
        if(!c.npass && !c.exiter){
          const pfN=profAt(c.s+Math.max(120, c.v*6)), ownN=pfN.own;
          if(ownN.length && !ownN.some(l=>Math.abs(l-c.lane)<0.9)){
            let tgtM=ownN[0];
            for(const l2 of ownN) if(Math.abs(l2-c.lane)<Math.abs(tgtM-c.lane)) tgtM=l2;
            if(Math.abs(tgtM)<=edgeAt(c.s)) c.lnT=tgtM;
          }
        }
        if(c.exiter){
          let exS=0;
          for(const sg of S.road.segs){ if(sg.s0>c.s+95) break;
            for(const ft of (sg.feat||[])) if(ft.type==="exit" && ft.s>c.s-20 && ft.s<c.s+95){ exS=ft.s; break; }
            if(exS) break; }
          if(exS){ c.lnT=pfC.edge-0.6; if(c.s>exS+35){ c.s=v.s-9999; } }  // signal late, exit crisp, gone
        }
        if(!c.npass){
          // settle only when the lane you wanted no longer EXISTS here —
          // a left-lane cruiser on the motorway is traffic, not a mistake
          const near=ownC.reduce((b,l)=>Math.abs(l-c.lane)<Math.abs(b-c.lane)?l:b, ownC[0]);
          if(c.lnT===undefined) c.lnT=near;
          else if(!c.exiter && !ownC.some(l=>Math.abs(l-c.lnT)<0.4)) c.lnT=near;
        }
        let tgtL=(c.lnT===undefined?LNC:c.lnT);
        const offEdge=Math.abs(c.lane)>pfC.edge-0.3;
        if(offEdge && !(c.exiter&&c.lnT>=pfC.edge-0.9)){ tgtL=LNC; c.lnT=LNC; }
        // ZIPPER: don't slide into an occupied lane — slot in behind instead
        if(Math.abs(tgtL-c.lane)>0.6){
          let occ=null;
          for(const o of S.traffic){ if(o!==c&&o.dir>0&&Math.abs(o.lane-tgtL)<1.2
            && o.s>c.s-12 && o.s<c.s+14+c.v*0.9) occ=o; }
          const pOcc=Math.abs(v.lane-tgtL)<1.3 && v.s>c.s-14 && v.s<c.s+14+c.v*0.9;
          if(occ||pOcc){
            c.v=Math.max(5, c.v-6.5*dt); c.brk=1;          // brake to open the zipper gap
            if(!offEdge) tgtL=c.lane;                       // hold your lane while it opens
          }
        }
        const ez=offEdge? 4.8 : 3;   // in the ditch: hurry back
        c.lane += Math.max(-ez*dt, Math.min(ez*dt, tgtL-c.lane));
      }
    }
    if(c.dir<0){                                   // oncoming keeps its lane honest too:
      const pfO=profAt(c.s);                       // a -5.1 car entering a landsväg
      // Look AHEAD the way same-direction cars do (they had a 120 m preemptive
      // merge; oncoming had none, so a bus doing 16 m/s was still crossing 7 m
      // of lane change when the trees arrived — hence buses parked in the ditch
      // well past the narrowing). Merge against the profile it's about to enter,
      // and hurry if it's already outside the tapered edge.
      const pfN=profAt(c.s-120);                   // oncoming travels toward decreasing s
      const oncO=(pfN.onc && pfN.onc.length)? pfN.onc : pfO.onc;
      // CURRENT position decides. This used to look 120 m up the road first, so
      // a car standing on a one-way stretch was spared whenever the stretch
      // BEYOND it was two-way — which is exactly how wrong-way traffic ended up
      // on one-way roads.
      if(!pfO.onc || !pfO.onc.length){ c.s = v.s-9999; }
      else if(oncO && oncO.length){
        let tgt=oncO[0]; for(const l2 of oncO) if(Math.abs(l2-c.lane)<Math.abs(tgt-c.lane)) tgt=l2;
        const outside=Math.abs(c.lane)>edgeAt(c.s)-0.3;
        const rate=(outside?4.4:2.2)*dt;
        c.lane += Math.max(-rate, Math.min(rate, tgt-c.lane));
      }
    }
    if(c.dir<0){                                   // oncoming slow for bends too
      if(c.v0===undefined) c.v0=c.v;
      const tO=Math.min(c.v0, npcCornerV(c));
      c.v += Math.max(-8*dt, Math.min(5*dt, tO-c.v));
    }
    c.s += (c.dir>0? c.v : -c.v)*dt;
    if(c.tr){                                        // drawbar: the box follows the cab
      const back=(VTYPES.semi.len+VTYPES.trailer.len)*0.5+SEMI_HITCH;
      c.tr.s = c.s - c.dir*back;                     // always behind, whichever way it faces
      c.tr.lane += (c.lane-c.tr.lane)*Math.min(1,dt*3.2);  // tracks in, lags a touch through bends
      c.tr.v=c.v; c.tr.dir=c.dir; c.tr.brk=c.brk;
    }
  }
  // cull
  S.traffic=S.traffic.filter(c=> c.s>v.s-120 && c.s<v.s+900);
  // CLEAN PASS ledger: every same-direction car you genuinely drive past
  // writes its own little cheque the moment it falls behind — a line of six
  // pays six, stacked above the driver pill. 'Clean' means you never touched
  // THAT car; contact marks it dirty for life. Each car pays exactly once.
  for(const c of S.traffic){
    if(c.dir<0) continue;
    const halfLen=(VTYPES[c.type||"sedan"].len||4.5)/2;
    if(c.s > v.s+2) c._wasAhead=true;
    else if(c._wasAhead && c.s < v.s-(halfLen+2.5)){
      c._wasAhead=false;
      if(!c._passPaid && !c._dirty && !S.wreck && v.v>c.v+0.5 && v.v>9){
        c._passPaid=1;
        // a crawling lorry pays pocket money; hunting down the stripe crowd pays real kronor
        const pay=Math.round((60 + Math.pow(Math.max(0,c.v-8),1.9)*6) * S.mult * (c.aggro?1.5:1) * CFG.ECON.payK);
        S.kr+=pay; addXp(c.aggro?30:18);
        cheque("\u2713 CLEAN PASS +"+fmtMoney(pay)+(c.v>22?" — FAST ONE":""));
      }
    }
  }
  // collision check — true-width hitboxes, contact RESOLUTION, and re-arming
  // cooldowns. (Was: half-width lat boxes from a stale /1.9 unit conversion,
  // plus one-shot _scr/_hard latches that made a car intangible after the
  // first kiss, plus no rear-end case — a tailgate tap read as a HARD HIT.)
  const solids=[];                                  // cars AND any trailers they tow
  for(const c of S.traffic){ solids.push(c); if(c.tr) solids.push(c.tr); }
  for(const c of solids){
    c._scrT=Math.max(0,(c._scrT||0)-dt); c._hardT=Math.max(0,(c._hardT||0)-dt);
    c._nudgeT=Math.max(0,(c._nudgeT||0)-dt);
    if(S.crashed) continue;
    const T=VTYPES[c.type||"sedan"];
    const hitLen=(T.len+4.63)/2, hitLat=(T.w+1.76)/2*0.90;   // metres, honest widths (10% forgiveness)
    const dS=c.s-v.s, dL=c.lane-v.lane;
    if(Math.abs(dS)<hitLen && Math.abs(dL)<hitLat){
      c._dirty=1;                                            // touched: THIS car never pays a clean-pass cheque
      const closing=Math.abs(v.v-(c.dir>0?c.v:-c.v));
      const latOverlap=hitLat-Math.abs(dL);
      if(c.dir>0 && closing<7 && latOverlap>=hitLat*0.5){
        // BUMPER TAP — the tailgate case: match speeds, resolve the overlap,
        // stay tangible. No phantom hard hits, no ghosting through the boot.
        if(dS>0){ v.s=c.s-hitLen; v.v=Math.min(v.v,c.v); c.brk=1; }
        else    { c.s=v.s-hitLen; c.v=Math.min(c.v,v.v); c.brk=1; }
        v.bounce=Math.max(v.bounce||0,0.7);
        if(!(c._nudgeT>0)){ c._nudgeT=1.5; sndThud(0.35);
          if(!S.easy){ S.bodyDmg=Math.min(100,(S.bodyDmg||0)+0.5); }
          toast("BUMPER TAP \u2014 bumpers do their one job. Mind the gap."); }
      } else if(c.dir>0 && closing<7){
        // A SCRAPE: mirrors kiss, paint trades. Costs money, not the car.
        if(!(c._scrT>0)){ c._scrT=1.4; S.scrapes=(S.scrapes||0)+1; sndScrape();
          const ding=Math.round((110+v.v*16)*S.mult*0.4);
          if(!S.easy){ S.kr=Math.max(0,S.kr-ding);
            S.dmg=S.dmg||{}; S.dmg.scuff=(S.dmg.scuff||0)+1; }
          v.v*=0.96; c.v*=0.97;
          toast("SCRAPE \u2014 bodywork \u2212"+fmtMoney(S.easy?0:ding)+". The mirror folds, the pride doesn't.");
        }
        v.lane = c.lane - Math.sign(dL||1)*hitLat*1.02;      // fully separated: no machine-gun scrapes
      } else if(closing<14 && !S.wreck){
        // A HARD HIT: metal folds, both cars stagger, everyone keeps their life
        if(!(c._hardT>0)){ c._hardT=1.2; sndThud(1); sndScrape();
          v.v*=0.55; c.v=Math.max(4,c.v*0.7);
          v.driftYaw=(v.driftYaw||0)+(dL<0?0.28:-0.28);
          v.bounce=Math.max(v.bounce||0,1.5);
          applyDamage(5+closing*0.8, 8+closing*1.6,
            "\uD83D\uDCA5 HARD HIT \u2014 "+spdStr(closing)+" closing into a "+(c.type||"sedan")+". Panels fold, everyone breathes.");
        }
        if(latOverlap<hitLat*0.5) v.lane = c.lane - Math.sign(dL||1)*hitLat*1.02;
        else if(c.dir>0){ if(dS>0){ v.s=c.s-hitLen; v.v=Math.min(v.v,c.v); } else { c.s=v.s-hitLen; c.v=Math.min(c.v,v.v); } }
      } else if(!S.wreck){
        startWreck("The "+TRIMS[S.trim].nm+" met a "+(c.type||"sedan")+" at "+spdStr(closing)+" closing. Insurance shrugs in Swedish.", c);
      }
    }
  }
}
/* ============================ CHASE ==================================== */
/* Hidden speed traps trip a chase when you blow past over the limit. A cop
   pulls off the shoulder, lights blazing, and runs the reduced-state pursuit
   controller in copStep(). The fleeing car keeps its normal MODE-table driving
   from driverStep — the chase only adds the pull-over / outrun / busted layer. */
function radarCheck(){                       // RADAR DETECTOR HUD: is a cop-trap in range?
  const v=S.veh;
  const rangeM=Math.max(80, Math.min(400, v.v*5));   // ~5 s of warning at current speed
  let hit=null;
  for(const sg of S.road.segs){
    if(sg.s0 > v.s+rangeM) break;
    for(const ft of (sg.feat||[])){
      if(ft.type==="trap" && ft.hasCop && !ft.triggered && ft.s>v.s && ft.s<v.s+rangeM){ hit=ft; break; }
    }
    if(hit) break;
  }
  S.radar = hit ? { on:true, s:hit.s, dist:hit.s-v.s } : { on:false };
}
function trapTriggerCheck(){                  // crossing a live cop-trap while speeding starts the chase
  const v=S.veh;
  if(S.chase.active) return;
  for(const sg of S.road.segs){
    if(sg.s0 > v.s+20) break;
    for(const ft of (sg.feat||[])){
      if(ft.type==="trap" && ft.hasCop && !ft.triggered && ft.s>v.s-3 && ft.s<v.s+3){
        ft.triggered=true;                     // consumed either way — you only cross once
        const overBy = v.v - (roadSpeedLimitAt(v.s) + CFG.CHASE.triggerOverMs);
        if(overBy>0) startChase(ft);
      }
    }
  }
}
function startChase(trap){
  S.chase={active:true, busted:false, pulledOver:false, violationT:0, pullOverT:0, t:0, _loseT:0};
  const edge=profAt(trap.s).edge, side=trap.side||1;
  S.cop={ s:trap.s, lane:side*(edge+0.5), v:0, pullingOut:1.3, pedal:0, brake:0, brk:0,
          type:"sedan", dir:1, col:"#eef1f4", police:1 };   // parked on the shoulder, about to pounce
  toast("\uD83D\uDEA8 SPEED TRAP \u2014 blue lights in the mirror. Lose them, or pull over.");
}
function endChase(evaded){                     // cop turns back — you got away (or it timed out)
  if(evaded){ toast("\uD83D\uDCA8 LOST THEM \u2014 the blue lights fade in the mirror."); addXp(40); }
  S.chase={active:false, busted:false, pulledOver:false, violationT:0, pullOverT:0};
  S.cop=null; S.radar={on:false};
}
function bustChase(){                          // stopped on the shoulder long enough — ticket written
  const fine=Math.round(1500*S.mult);
  if(!S.easy) S.kr=Math.max(0,S.kr-fine);
  toast("\uD83D\uDE94 PULLED OVER \u2014 licence, registration, and a fine of "+fmtMoney(S.easy?0:fine)+". They pull away.");
  S.chase={active:false, busted:true, pulledOver:false, violationT:0, pullOverT:0};
  S.cop=null; S.radar={on:false};
}
function copStep(dt){
  const c=S.cop, v=S.veh;
  if(!c) return;
  if(S.chase.pulledOver){ c.v=0; c.brake=1; c.brk=1; return; }   // holds station behind the stopped car
  if(c.pullingOut>0){                          // the "pulls out, lights blazing" beat
    c.pullingOut-=dt;
    c.v=Math.min(20, c.v+9*dt);
    c.lane += Math.max(-1.4*dt, Math.min(1.4*dt, v.lane*0.6 - c.lane));
    c.s += c.v*dt; c.brk=0;
    return;
  }
  // grip ceiling per fleeing temperament: Racing outpaces the cop by design,
  // the cop never runs a drift FSM of its own — it just follows on grip.
  const ceilByMode={calm:0.55, spirited:0.75, racing:0.95, drift:0.85};
  const grip=ceilByMode[S.aiMode]!==undefined?ceilByMode[S.aiMode]:0.75;
  const followGap=14 + c.v*0.9;                // sit this far behind, never rear-end
  const gapErr=(v.s-followGap) - c.s;
  let vLimit=Infinity;                          // corner-aware cap (same shape as driverStep's scan)
  for(let s=0; s<c.v*c.v/(2*7.5)+60; s+=12){
    const cv=curvAt(c.s+s);
    if(Math.abs(cv)>1e-5){ const mu=0.92*wxMu()*grip;
      vLimit=Math.min(vLimit, Math.sqrt(mu*CFG.G/Math.abs(cv))); }
  }
  // straight-line ceiling scaled by temperament (mirrors the fleeing car's own
  // pace cap): Racing/Drift top out ABOVE the cop, so a long stretch lets them
  // pull away; Calm/Spirited sit well under it, so the cop stays glued to them.
  const vCeil = 78*grip;                        // 78 ≈ the sim's absolute top (vTop)
  const catchUp = gapErr>0 ? (6 + gapErr*0.4) : 0;   // only reel in when actually behind
  const vTarget=Math.min(vLimit, vCeil, v.v + catchUp);
  const err=vTarget-c.v;
  c.pedal=err>0? Math.min(1, 0.3+err*0.3) : 0;
  c.brake=err<0? Math.min(1, -err*0.35) : 0;
  c.brk = c.brake>0.15 ? 1 : 0;                 // brake lights, same shape as traffic
  c.v=Math.max(0, c.v + (c.pedal*8 - c.brake*9)*dt);   // lightweight integrator (traffic-car pattern)
  c.s += c.v*dt;
  c.lane += Math.max(-0.9*dt, Math.min(0.9*dt, v.lane - c.lane));  // pure-pursuit onto the fleeing lane
}
function chaseStep(dt){
  S.chase = S.chase || {active:false};          // survive a load that predates the chase system
  if(!S.chase.active){ trapTriggerCheck(); return; }
  const c=S.cop, v=S.veh;
  copStep(dt);
  if(!c){ S.chase.active=false; return; }
  S.chase.t=(S.chase.t||0)+dt;
  const gap = v.s - c.s;                         // how far ahead the fleeing car is
  // violation timer: over the margin winds it up, under it unwinds (twice as fast)
  const overBy = v.v - (roadSpeedLimitAt(v.s)+CFG.CHASE.violationThresholdMs);
  if(overBy>0 && c.pullingOut<=0 && !S.chase.pulledOver) S.chase.violationT += dt;
  else S.chase.violationT = Math.max(0, S.chase.violationT - dt*2);
  // OUTRUN: hold a big gap for long enough (or exhaust the cop's patience) and it gives up
  if(gap > CFG.CHASE.loseGapM) S.chase._loseT=(S.chase._loseT||0)+dt; else S.chase._loseT=0;
  if(!S.chase.pulledOver && (S.chase._loseT>CFG.CHASE.loseHoldS || S.chase.t>CFG.CHASE.maxS)){ endChase(true); }
}
function stopBlocksShoulder(sLo, sHi, side){    // is an occupied-shoulder 'stop' feature in this range?
  for(const sg of S.road.segs){
    if(sg.s0 > sHi) break;
    for(const ft of (sg.feat||[])){
      if(ft.type==="stop" && ft.side===side && ft.s>sLo-8 && ft.s<sHi+8) return true;
    }
  }
  return false;
}
/* Damage model, alpha exit: nothing ends the run by force. Hits and ditches
   cost health and panels; the car gets slower, hotter, and more crooked until
   YOU decide at the garage — repair on the bench, or scrap & shop. */
function dmgK(){ return S.easy? 0 : 1; }             // EASY MODE: the story, never the bill
function applyDamage(eng, body, why){
  S.engHealth=Math.max(0,(S.engHealth===undefined?100:S.engHealth)-eng*dmgK());
  S.bodyDmg=Math.min(100,(S.bodyDmg||0)+body*dmgK());
  S.crashed=true;                                    // one-frame event flag (telemetry/tests)
  if(body>=6) S._crashCAt=S.t;                        // a real hit slams chromatic aberration to max (decays over 2 min)
  if(why) toast(why);
  if(isLimp() && !S._limpToast){ S._limpToast=1;
    toast("\u2620 She's done for today \u2014 nurse her to the GARAGE. Repair on the bench, or scrap & shop."); }
}
function isLimp(){ return (S.engHealth!==undefined&&S.engHealth<=3) || (S.bodyDmg||0)>=85; }
function startWreck(cause,hit){ sndCrash();
  const v=S.veh;
  if(S.wreck || S.crashed) return;
  S.wreck={t:0, cause, hit,
    dur: 1.6 + Math.min(1.4, v.v*0.045),
    spinDir: (hit? Math.sign(v.lane-hit.lane)||1 : (v.lane>0?1:-1)),
    roll: v.v>27,                                  // real speed = the car goes over
    outSide: Math.sign(v.lane)||1};
  v.wreckV0=v.v; S.wreck.wreckSpd=Math.min(34,v.v);
}
function wreckStep(dt){
  const w=S.wreck, v=S.veh; if(!w) return;
  w.t+=dt;
  const p=Math.min(1,w.t/w.dur);
  v.v=Math.max(0, v.v - (7.5+v.wreckV0*0.10)*dt);              // ploughing sheds speed, not instantly
  v.s+=v.v*dt;
  v.driftYaw=(v.driftYaw||0) + w.spinDir*dt*(3.2-p*2.0);       // the spin winds up then settles
  v.lane += w.outSide*dt*(2.6-p*1.8);                          // carried off toward the verge
  const edgeK=edgeAt(v.s)+2.6;
  v.lane = Math.max(-edgeK, Math.min(edgeK, v.lane));
  if(w.roll) v.rollA=(v.rollA||0) + dt*(5.2-p*3.4)*w.spinDir;  // over she goes
  const jit=Math.sin(v.s*3.1)+0.7*Math.sin(v.s*7.3);
  v.bounce=jit*Math.min(1,v.v/12)*9;
  S.engHealth=Math.max(0,(S.engHealth||0) - dt*(45/w.dur)*dmgK());    // the damage arrives over time
  for(const c of S.traffic){ if(c.s>v.s-40&&c.s-v.s<90&&Math.abs(c.lane)<7){ c.brk=1; c.v=Math.max(0,c.v-6*dt); } } // everyone lifts for a wreck — oncoming included, so it isn't re-speared
  if(p>=1 || v.v<1.5){
    const rolled=w.roll;

   St. Gallen never put its name on a big-turbo map; Maptun will sell you the
   last page of the binder. Asking a house for a file it does not make is how

function houseMaxStage(){ const p=PROV(); return p.diy? TUNES.length-1 : (p.maxStage!==undefined? p.maxStage : TUNES.length-1); }
/* ── QUICK UPGRADE KITS ────────────────────────────────────────────────────
   A stage is never just a file. partChain walks the prerequisites the way the
   shop would: a downpipe wants an exhaust behind it, a hybrid turbo wants the
   turbo it bolts to, injectors want a pump. Everything that stage needs, in
   fitting order, plus every file between here and there. */
function partChain(id,out){
  const p=PARTS.find(q=>q.id===id); if(!p) return out;
  if(p.needPart) partChain(p.needPart,out);
  if(p.needTurbo && turboOrder(S.turboKey||TRIMS[S.trim].turbo)<turboOrder(p.needTurbo)){
    const tp=PARTS.filter(q=>q.turbo&&turboOrder(q.turbo)>=turboOrder(p.needTurbo))
                  .sort((a,b)=>turboOrder(a.turbo)-turboOrder(b.turbo))[0];
    if(tp && tp.id!==id) partChain(tp.id,out);
  }
  if(!out.includes(id) && !needMet(id)) out.push(id);
  return out;
}
function stageKit(target){

      const pp=PARTS.find(q=>q.id===id);
      if(dz && pp && (pp.turbo||id==="inj"||id==="pistons")) continue;   // a different religion
      partChain(id,parts);

  let cost=0;
  for(const id of parts){ const pp=PARTS.find(q=>q.id===id); if(pp) cost+=pp.kr; }
  const tunes=[];
  if(!diy) for(let st=(S.tune||0)+1; st<=target; st++){ tunes.push(st); cost+=tunePrice(TUNES[st]); }
  else cost+=Math.round(tunePrice(TUNES[target])*0.35);   // your own labour, the shop's parts

  let trim, roll=R();

     they existed in the tables and could never appear in an advert. Weighted by
     family instead: the 9-3 OG line still dominates and still tracks the tier you
     came shopping for, and everything else turns up at the rate it actually does
     in the small ads. A 9000 Aero is rare because a good 9000 Aero IS rare. */
  const FAM=[

    {w:0.13, pick:()=>7+Math.floor(R()*3)},        // 9-3 Sport Sedan
    {w:0.12, pick:()=>10+Math.floor(R()*4)},       // 900 NG — and the 1999 HOT

  ];

  // B205E never existed: B205/B235 arrived with the MY2000 facelift, and the

  // bodyshell was sold, so the two facts cannot contradict each other.
  // The year comes from the ENGINE and nothing else. This used to clamp hard to
  // 1998-2002 because the garage was one bodyshell — which quietly forced every

  const yLo=(t.yrs? t.yrs[0] : (eRec? eRec.yrs[0] : 1998));
  const yHi=(t.yrs? t.yrs[1] : (eRec? eRec.yrs[1] : 2002));
  const year=ri(Math.min(yLo,yHi), Math.max(yLo,yHi));
  const auto=!t.diesel && trim<4 && R()<0.30;
  const gearbox=auto? "4-speed automatic":"FM55 5-speed manual";
  const odoKm=Math.round((105000+R()*245000)/1000)*1000;
  const col=SAAB_COLS[Math.floor(R()*SAAB_COLS.length)], intr=Math.floor(R()*INTERIORS.length);
  // ── COSMETIC (rust) and MECHANICAL, rolled SEPARATELY ───────────────────
  // Rust is paint and sills. It changes what the photos look like, how
  // confident the seller sounds, and how far he will come down. It does not
  // touch a single mechanical number.
  const cr=R();
  const rustPct=Math.max(0,Math.min(96, Math.round(
      cr<0.22? R()*8 : cr<0.62? 10+R()*28 : cr<0.88? 38+R()*30 : 68+R()*28)));
  const mr=R();
  const mech=Math.max(4,Math.min(100, Math.round(
      mr<0.12? 92+R()*8 : mr<0.66? 56+R()*32 : mr<0.90? 28+R()*27 : 6+R()*21)));
  const faults=MKT_FAULT.filter(f=>mech<=f.at && R()<0.72).slice(0,4);
  const maint=[]; { const nMaint = mech>85? ri(3,6) : mech>55? ri(1,3) : ri(0,1);
    const pool=MKT_MAINT.slice();
    for(let q=0;q<nMaint && pool.length;q++) maint.push(pool.splice(Math.floor(R()*pool.length),1)[0]); }
  // ── MODIFICATIONS: a prefix of the build path, or a cautionary tale ─────
  const mods=[]; let badTune=false, buildKind="stock";
  const br=R();
  if(br<0.60){ buildKind="stock"; }
  else if(br<0.84){ buildKind="bolt-ons";                       // sensible, shallow
    for(let q=0;q<ri(1,4);q++) mods.push(MKT_BUILD[q]); }
  else if(br<0.93){ buildKind="tasteful";                        // deep, and in order
    const depth=ri(6,t.diesel?9:13);
    for(let q=0;q<depth;q++) mods.push(MKT_BUILD[q]); }
  else if(br<0.99){ buildKind="marketplace";                     // the end, without the middle
    mods.push("intake","exh");
    if(!t.diesel) mods.push(pick(["t_18","t_19","t_28"]));
    if(R()<0.4) mods.push("ic");
    badTune=true; }
  else { buildKind="lunatic";                                    // extremely rare, and explained
    if(!t.diesel) mods.push("t_3076","dp"); else mods.push("dp","exh");
    badTune=R()<0.7; }
  const okMods=mods.filter(id=>{ const P0=PARTS.find(q=>q.id===id);
    if(!P0) return false;
    if(t.diesel && (P0.turbo||id==="inj"||id==="lpgkit"||id==="pistons")) return false;
    if(P0.naOnly && t.turbo!=="na") return false;
    return true; });
  // ── WHO IS SELLING, AND WHY ─────────────────────────────────────────────
  let seller=pick(MKT_SELLERS);
  if(buildKind==="tasteful" && R()<0.6) seller=MKT_SELLERS[R()<0.5?0:1];
  if(buildKind==="marketplace" && R()<0.55) seller=MKT_SELLERS[5];
  if(mech<25 && R()<0.5) seller=MKT_SELLERS[R()<0.5?3:4];
  const story=wpick(MKT_STORY);
  const who=pick(MKT_NAMES)+", "+pick(MKT_PLACE);
  // ── THE ASK, IN REAL MONEY ──────────────────────────────────────────────
  // An OG 9-3 is a two-to-three-thousand-dollar car. A properly sorted
  // enthusiast Viggen is a fifteen-thousand-dollar car. Everything in between
  // is condition, mileage and whether the modifications were done in order.
  /* PRICE IS A RANGE, NOT A BASE TIMES FIVE MULTIPLIERS. The old form indexed a
     seven-entry array by trim id — fine when there were seven cars, undefined the
     moment there were twenty-three, and undefined propagates straight through to
     NaN on the card. It was also uncontrollable: multiplying five factors gave a
     48x spread when the real market is about 12x.
     Now every car states what a rough one and a mint one are actually worth, and
     a single quality score walks between them. The gamma biases toward the low
     end, because most cars for sale are ordinary and the good ones are the event. */
  const uLo = t.usdLo!==undefined? t.usdLo : 1400;
  const uHi = t.usdHi!==undefined? t.usdHi : 9000;
  const qMech = mech/100;                                  // 0 rough  → 1 mint
  const qRust = 1-rustPct/100;
  const qOdo  = 1-Math.max(0,Math.min(1,(odoKm-90000)/260000));
  const qMod  = buildKind==="tasteful"? 0.86
              : buildKind==="bolt-ons"? 0.56
              : buildKind==="marketplace"? 0.24
              : buildKind==="lunatic"? 0.30 : 0.50;
  const qAuto = auto? -0.06 : 0;
  /* MULTIPLICATIVE, NOT ADDITIVE. A weighted sum let a car with one good trait
     coast to a decent score, so the median came out at fifteen thousand dollars.
     Real cars have to be good at EVERYTHING to be worth real money — tired and
     clean is still tired — so the terms multiply and a single bad one drags the
     whole thing down. The exponent then pushes the middle of the market toward
     the bottom of each car's range, because most cars for sale are ordinary. */
  let q = Math.pow(Math.max(0.05,qMech),1.05)
        * (0.42+0.58*qRust) * (0.52+0.48*qOdo) * (0.66+0.68*qMod)
        * (1+qAuto) * Math.min(1.18, story.k);
  q = Math.max(0, Math.min(1, q*(0.93+R()*0.14)));
  const askUSD = Math.max(uLo*0.72,
    (uLo + (uHi-uLo)*Math.pow(q, CFG.ECON.priceGamma)) * CFG.ECON.priceK);
  const price=Math.max(300, Math.round(askUSD/USD_PER_KR/50)*50);
  // ── WHAT THE AD SAYS ────────────────────────────────────────────────────
  const lines=[];
  if(seller.id==="clueless"&&R()<0.45) lines.push(R()<0.5?"Runs.":"Selling my dads saab. Turbo works great.");
  else if(seller.id==="desperate") lines.push("Needs to go this week, first with cash takes it. Open to offers, within reason.");
  else if(seller.id==="meticulous") lines.push("Fastidiously maintained and documented. I would like it to go to someone who will keep it that way.");
  else if(seller.id==="enthusiast") lines.push("Sorted properly, not quickly. Happy to talk through everything that has been done.");
  else if(seller.id==="estate") lines.push("Selling on behalf of the family. I know very little about it beyond what is in the folder.");
  else lines.push(mech>85?"Good honest car, drives faultlessly.":mech>50?"Drives well, a few marks of life. No time wasters.":"Ran when parked. Starts on the second try.");
  if(maint.length && seller.id!=="clueless") lines.push("Recently done: "+maint.join(", ")+".");
  if(faults.length){
    if(seller.id==="meticulous"||seller.id==="enthusiast") lines.push("In the interest of honesty: "+faults.map(f=>f.t).join("; ")+".");
    else if(seller.id==="clueless") lines.push(R()<0.5?"Might need a service or something.":"There is a light on the dash but it drives fine.");
    else if(R()<0.6) lines.push("Not perfect \u2014 "+faults[0].t+".");
  }
  if(okMods.length){
    const nm=okMods.map(m=>(PARTS.find(q=>q.id===m)||{}).nm||m);
    lines.push((buildKind==="tasteful"?"Built in the right order over four years: ":"Fitted by me: ")+nm.join(", ")+".");
  }
  if(badTune) lines.push(seller.id==="clueless"
    ? "It has a chip in it I think. Goes really fast."
    : "It has a map on it from the previous owner. I would get that looked at.");
  if(rustPct>60) lines.push(seller.id==="clueless"?"Bit of surface rust, nothing structural.":"Honest about the rust \u2014 see photos. Sills need doing.");
  else if(rustPct<12) lines.push("Paint is genuinely lovely for the year.");
  lines.push(story.t);
  if(t.diesel) lines.push("Diesel \u2014 pulls from idle like a tractor, sips fuel, will outlive us all. Imported, so the paperwork took a while.");
  // internal game-scale mileage: the odometer drives rust/price above, this is
  // what the sim's own wear model has always spoken
  const miles=Math.round(60+(odoKm-105000)/245000*190);
  return {i, trim, year, auto, gearbox, odoKm, miles, col, intr, rustPct, health:mech,
    faults:faults.map(f=>f.t), maint, mods:okMods, badTune, buildKind,
    price, askUSD:Math.round(askUSD), seller, who, story:story.t, lines,
    barn:trim>base && trim<5, oddity:trim>=5,
    photos:Math.min(6, 2+Math.floor(rustPct/22)+(okMods.length?1:0))};
}
/* ── THE PHOTOS ────────────────────────────────────────────────────────────
   Deliberately terrible. Nobody is rendering a car here: it is a slab of the
   paint colour, a couple of panel lines, and however much rust the listing
   earned. Frame 0 is the "whole car" shot, badly cropped and slightly tilted
   like every marketplace photo ever taken; the rest are the close-ups an
   honest seller takes of the sills and a dishonest one doesn't.          */
function drawListingPhoto(c,w,h,li,k){
  const rng=mulb(li.i*7919+k*613+li.rustPct*31+li.health*7);
  const R=()=>rng();
  c.clearRect(0,0,w,h);
  const close = k>0;
  // the "photographer": phone held crooked, thumb over a corner, bad light
  c.fillStyle = k%3===2? "#2a2b2f" : k%3===1? "#1e2024" : "#3a3d42";   // driveway/garage/tarmac
  c.fillRect(0,0,w,h);
  c.save();
  c.translate(w/2,h/2); c.rotate((R()-0.5)*(close?0.16:0.09)); c.translate(-w/2,-h/2);
  const pw = close? w*(1.5+R()*0.7) : w*(0.84+R()*0.22);
  const ph = close? h*(1.5+R()*0.7) : h*(0.42+R()*0.14);
  const px = close? -pw*0.25*R() : w*0.06+(R()-0.5)*w*0.10;
  const py = close? -ph*0.2*R()  : h*0.30+(R()-0.5)*h*0.12;
  c.fillStyle=li.col[1]; c.fillRect(px,py,pw,ph);
  // a shaded lower half: the only nod to a body shape
  const g=c.createLinearGradient(0,py,0,py+ph);
  g.addColorStop(0,"rgba(255,255,255,0.16)"); g.addColorStop(0.55,"rgba(255,255,255,0)");
  g.addColorStop(1,"rgba(0,0,0,0.34)"); c.fillStyle=g; c.fillRect(px,py,pw,ph);
  // PANEL LINES \u2014 a few intersecting straights, nothing more
  c.strokeStyle="rgba(0,0,0,0.42)"; c.lineWidth=Math.max(1,w*0.005);
  const nLines=close? 1+Math.floor(R()*2) : 3+Math.floor(R()*3);
  for(let q=0;q<nLines;q++){
    const vert=R()<0.62;
    c.beginPath();
    if(vert){ const x=px+pw*(0.12+R()*0.76); c.moveTo(x,py); c.lineTo(x+(R()-0.5)*w*0.03,py+ph); }
    else    { const y=py+ph*(0.25+R()*0.6);  c.moveTo(px,y); c.lineTo(px+pw,y+(R()-0.5)*h*0.03); }
    c.stroke();
  }
  // RUST \u2014 brown/orange splotches, heavier low down and heavier on close-ups
  const blobs=Math.round((close? 10:4) + li.rustPct*(close?0.42:0.16));
  for(let q=0;q<blobs;q++){
    const bx=px+pw*R(), by=py+ph*(0.42+R()*0.62);
    if(by<py||by>py+ph) continue;
    const rr=(close? w*0.02:w*0.008)*(0.5+R()*2.4);
    const hue=R(); c.fillStyle= hue<0.34?"rgba(122,63,26,0.80)" : hue<0.7?"rgba(160,88,32,0.68)" : "rgba(78,48,30,0.85)";
    c.beginPath();
    for(let a=0;a<7;a++){ const an=a/7*6.283, rad=rr*(0.55+R()*0.9);
      const X=bx+Math.cos(an)*rad, Y=by+Math.sin(an)*rad*0.72;
      a?c.lineTo(X,Y):c.moveTo(X,Y); }
    c.closePath(); c.fill();
    if(R()<0.35){ c.fillStyle="rgba(38,26,18,0.75)";            // a hole in the middle of a bad one
      c.beginPath(); c.ellipse(bx,by,rr*0.35,rr*0.24,0,0,6.283); c.fill(); }
  }
  // DENTS & SCRATCHES \u2014 simple shapes, per the brief
  const dents=Math.round((100-li.health)/34 + (li.rustPct>50?1:0));
  for(let q=0;q<dents;q++){
    const dx=px+pw*(0.1+R()*0.8), dy=py+ph*(0.2+R()*0.7);
    c.fillStyle="rgba(0,0,0,0.26)";
    c.beginPath(); c.ellipse(dx,dy,w*0.03*(0.6+R()),h*0.03*(0.6+R()),R()*3,0,6.283); c.fill();
    c.strokeStyle="rgba(240,240,240,0.30)"; c.lineWidth=1;
    c.beginPath(); c.moveTo(dx-w*0.03,dy+h*0.01); c.lineTo(dx+w*0.04,dy-h*0.012); c.stroke();
  }
  if(!close){                                                    // two dark blobs = wheels
    c.fillStyle="#14161a";
    for(const u of [0.22,0.78]){ c.beginPath();
      c.ellipse(px+pw*u, py+ph*0.99, pw*0.075, ph*0.20, 0,0,6.283); c.fill(); }
  }
  c.restore();
  // the thumb, obviously
  if(k===0||R()<0.3){ c.fillStyle="rgba(196,150,124,0.55)";
    c.beginPath(); c.ellipse(w*(R()<0.5?0.03:0.97), h*0.92, w*0.09, h*0.13, 0,0,6.283); c.fill(); }
  c.fillStyle="rgba(255,255,255,0.30)"; c.font="bold 8px monospace";
  c.fillText((close?"IMG_00":"IMG_0")+(k+3)+".JPG", 5, h-5);
}
/* ── NEGOTIATION ──────────────────────────────────────────────────────────
   Believable, not complicated. The seller has a floor made of his own
   personality, softened by rust (he knows what it looks like), by a rough
   mechanical report, and by how many times you have already come back. The
   clueless one has a wide wobble on purpose: he may take a silly number.  */
function offerVerdict(li, amount){
  const M=mktSeed(), tries=(M.tried&&M.tried[li.i])||0;
  const rng=mulb(li.i*31337 + tries*7717 + (M.seed>>>3));
  const sl=li.seller;
  let floor = sl.firm
    - (li.rustPct/100)*0.13          // he has seen the sills too
    - (li.health<40? 0.07:0)         // and he knows what it sounds like
    - tries*0.035                    // you came back. that means something
    - (li.buildKind==="marketplace"||li.badTune? 0.05:0)
    + (li.buildKind==="tasteful"? 0.05:0);
  floor = Math.max(0.42, Math.min(1.0, floor + (rng()-0.5)*sl.wobble*2));
  const ratio = amount/li.price;
  if(ratio>=1) return {ok:true, why:"Full ask. He shakes your hand before you finish the sentence."};
  if(ratio>=floor) return {ok:true, why:sl.id==="clueless"
      ? "He thinks about it for a moment, says \u201cyeah alright\u201d, and asks if you take Swish."
      : sl.id==="desperate" ? "He exhales. \u201cDone. Can you take it today?\u201d"
      : "He looks at the car, then at you, then back at the car. \u201cGo on then.\u201d"};
  const miss=(floor-ratio);
  return {ok:false, floorHint:Math.round(li.price*floor),
    why: miss>0.28 ? (sl.id==="meticulous"
        ? "He stops replying. You have insulted a man with a folder of receipts."
        : "A short laugh, and no.")
      : miss>0.12 ? "\u201cThat's a long way off what it's worth.\u201d He is not moving yet."
      : "\u201cClose. Not quite.\u201d He is nearly there \u2014 try again a little higher."};
}

function drawSaabSide(ctx2,w,h,col,health,rng0){
  // side profile: the OG 9-3 five-door. Hood slope, fast windshield, roof arc
  // into the long hatch, hockey-stick beltline. Rust tells the health story.
  ctx2.clearRect(0,0,w,h);
  const gY=h*0.82, L=w*0.86, x0=w*0.07;
  ctx2.fillStyle="rgba(0,0,0,0.30)"; ctx2.beginPath(); ctx2.ellipse(x0+L/2,gY+3,L*0.5,5,0,0,6.283); ctx2.fill();
  const P=(u,v2)=>[x0+u*L, gY-v2*h];
  ctx2.fillStyle=col;
  ctx2.beginPath();
  ctx2.moveTo(...P(0.02,0.10)); ctx2.lineTo(...P(0.03,0.26));      // front bumper -> nose
  ctx2.lineTo(...P(0.10,0.335));                                   // headlight brow
  ctx2.lineTo(...P(0.34,0.40));                                    // the long hood
  ctx2.quadraticCurveTo(...P(0.44,0.62), ...P(0.55,0.655));        // fast windshield -> roof
  ctx2.quadraticCurveTo(...P(0.70,0.665), ...P(0.80,0.55));        // roof arc
  ctx2.quadraticCurveTo(...P(0.93,0.40), ...P(0.965,0.30));        // THE HATCH — long slope
  ctx2.lineTo(...P(0.975,0.10));                                   // tail
  ctx2.closePath(); ctx2.fill();
  ctx2.fillStyle="rgba(18,26,36,0.92)";                            // glasshouse
  ctx2.beginPath();
  ctx2.moveTo(...P(0.375,0.40)); ctx2.quadraticCurveTo(...P(0.455,0.60),...P(0.555,0.615));
  ctx2.lineTo(...P(0.685,0.62)); ctx2.quadraticCurveTo(...P(0.78,0.60),...P(0.865,0.435));
  ctx2.lineTo(...P(0.80,0.42)); ctx2.lineTo(...P(0.42,0.415)); ctx2.closePath(); ctx2.fill();
  ctx2.strokeStyle=col; ctx2.lineWidth=Math.max(2,w*0.014);        // B & C pillars
  ctx2.beginPath(); ctx2.moveTo(...P(0.60,0.415)); ctx2.lineTo(...P(0.615,0.62)); ctx2.stroke();
  ctx2.beginPath(); ctx2.moveTo(...P(0.755,0.42)); ctx2.lineTo(...P(0.80,0.585)); ctx2.stroke();
  // hockey-stick beltline
  ctx2.strokeStyle="rgba(255,255,255,0.22)"; ctx2.lineWidth=1.4;
  ctx2.beginPath(); ctx2.moveTo(...P(0.09,0.32)); ctx2.lineTo(...P(0.74,0.405));
  ctx2.quadraticCurveTo(...P(0.80,0.43),...P(0.86,0.43)); ctx2.stroke();
  // wheels
  for(const u of [0.215,0.79]){ const [wx,wy]=P(u,0);
    ctx2.fillStyle="#0b0c0e"; ctx2.beginPath(); ctx2.arc(wx,wy,h*0.145,0,6.283); ctx2.fill();
    ctx2.fillStyle="#3a3e44"; ctx2.beginPath(); ctx2.arc(wx,wy,h*0.078,0,6.283); ctx2.fill(); }
  // lights
  ctx2.fillStyle="#d9dce0"; const [hx,hy]=P(0.035,0.235); ctx2.fillRect(hx,hy,w*0.05,h*0.055);
  ctx2.fillStyle="#a3271f"; const [tx,ty]=P(0.935,0.235); ctx2.fillRect(tx,ty,w*0.038,h*0.055);
  // rust: the health told visually — look closely before you buy
  if(health<88){ const rng=mulb(rng0||7); const n=Math.round((88-health)/6);
    for(let i=0;i<n;i++){ const u=0.06+rng()*0.85, v2=0.06+rng()*0.16;
      ctx2.fillStyle="rgba(112,63,32,"+(0.25+rng()*0.45).toFixed(2)+")";
      ctx2.beginPath(); ctx2.ellipse(...P(u,v2), 2+rng()*(health<30?7:3), 1.5+rng()*2.5, rng()*3,0,6.283); ctx2.fill(); } }
}

  if(health<40) S.jobs.push({...PROCS.waterPump,id:"waterPump",done:[],delivery:1});

  // it is not derived from mileage or from engine health any more, because those

  // asking for more than the hardware wants to give.

  // work through before the car was yours to enjoy. Now it is your car and your
  // decision: drive it, fix it, build it, or ignore the noises like everyone else.
  toast(li.year+" "+t.nm+" \u2014 key in hand from "+li.who.split(",")[0]+" for "+fmtMoney(paid)+"."
    +" Trade-in banked +"+fmtMoney(tradeIn)+"."
    +(li.faults.length? " It came with: "+li.faults[0]+"." : " Nothing on the list to fix.")
    +(li.badTune? " And somebody else's map on the ECU." : "")

$("classified").addEventListener("click",e=>{

/* a shuffle-bag so consecutive riders don't look/sound the same — cheapest
   variation there is: reshuffle indices, deal them out, reshuffle when empty */
function paxStyleNext(){
  if(!S.paxBag||!S.paxBag.length){
    S.paxBag=PAX_STYLES.map((_,i)=>i);
    for(let i=S.paxBag.length-1;i>0;i--){ const j=(R()*(i+1))|0; const t=S.paxBag[i];S.paxBag[i]=S.paxBag[j];S.paxBag[j]=t; }
  }
  return S.paxBag.pop();
}

   This entire block — STORY, STORYLINES and the whole PAX_* passenger system —
   was destroyed collaterally when the classifieds were rewritten: a structural
   replacement spanning two function boundaries took 365 lines of unrelated data
   with it. storyStep() runs every frame and referenced STORY, so the main loop
   threw a ReferenceError on EVERY animation frame — which is the frozen game.
   Restored verbatim from the original. The lesson, written down where it will be
   read again: never replace a range by two independent anchors without checking
   what lives between them. */

/* ======================================================================= *
 *  RIDERS — the roadside micro-biomes, the people who wait at them, and   *
 *  the speech system that lets them talk. Built so a WRITER never has to   *
 *  touch code: to give the game words, add strings to STORYLINES below.    *
 *  Everything else (who's waiting, boarding, anxiety, the speech bubble,   *
 *  saving progress) is wired up here already.                              *
 * ======================================================================= */

/* ---- 1. THE WRITER'S DESK ---------------------------------------------
   A storyline is now a small BRANCHING CONVERSATION. Still just data — no
   code to touch. The shape:

     { id:"myrider", who:["nurse"],   // who: rider kinds it can attach to
                                       //      (omit or null = anyone)
       start:"s0",                     // which node they open with
       nodes:{
         s0:{ say:"What the rider says.",        // string, OR
              // say:{t:"...", anx:8},           //   {t, anx} to also move nerves
              choices:[                           // what YOU (the driver) can say back
                { r:"Your reply.", to:"next" },   //  r: your line   to: next node
                { r:"Blunt reply.", to:"other", anx:10 }, // a reply can spike nerves
                { r:"(say nothing)", to:"quiet" } // r can be an action in ()
              ] },
         next:{ say:"They answer.", choices:[ ... ] },
         quiet:{ say:{t:"A closing line.", anx:-8} }   // NO choices == the story is told
       } }

   Rules, the whole API:
   - A node with `choices` shows tappable buttons a beat after the line lands.
   - A node with NO choices (or an empty list) is an ENDING — once they say it,
     their story's told and they'll step out at the next rest stop.
   - `next:"nodeId"` on a choiceless node makes a RAMBLE: the line plays, then it
     flows on to `next` on its own a moment later. String several together and a
     rider monologues at their own pace — this is how you get variable length and
     a looser rhythm instead of question-answer-question-answer. Tapping the
     bubble during a ramble just moves it along early.

   - Keep lines short — the bubble is small and the road is the real star.
