  const inner=Math.max(0, Math.abs(x-vpX)-halfExtent);
  const edgeA=Math.max(0,Math.min(1,(W*0.62-inner)/(W*0.30)));
  const alpha=Math.min(nearA, edgeA);
  if(alpha<=0.02){ ctx.restore(); return; }
  if(alpha<1) ctx.globalAlpha*=alpha;
  const rise=CFG.CAM.h*sc*(1-kFar);
  const hi=S.night?0.45:1;
  const det=Math.max(0,Math.min(1,(cwF-10)/12));          // detail fades in, never switches on
  const isBig=(c.type==="lorry"||c.type==="semi"||c.type==="trailer");
  // ---- GROUND SHADOW: stretches along the flank, not a fixed disc ----------
  // THE SHADOW MUST STAY UNDER THE CAR. It was offset by the flank and sized by
  // the flank, both unbounded — so on a close pass it became a ~750 px black
  // oval sitting 600 px away from the vehicle it belonged to. That is the dark
  // blob on the road. Same disease as the tyres: bound it to the body.
  const shFl=Math.min(flank, cwF*1.4);
  ctx.save();
  ctx.translate(x+fs*shFl*0.34, gy+bh*0.02); ctx.scale(1,0.30);
  const shR=cwF*0.62+shFl*0.42;
  const shG=ctx.createRadialGradient(0,0,0, 0,0, shR);
  shG.addColorStop(0,"rgba(0,0,0,0.46)"); shG.addColorStop(0.62,"rgba(0,0,0,0.22)");
  shG.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=shG; ctx.beginPath(); ctx.arc(0,0,shR,0,7); ctx.fill();
  ctx.restore();
  // ---- FLANK (drawn first: it recedes, the face always paints over it) -----
  const yB=gy-ride, yBelt=yB-bodyH*P.hb, yTop=gy-bh;     // roof unchanged; body starts at the sill
  if(flank>0.6){
    const fGround=gy-rise;                                // far end's ground line
    const fx=x+fs*flank, fyB=fGround-ride*kFar, fyBelt=fyB-bodyH*P.hb*kFar, fyTop=fGround-bh*kFar;
    const nw0=hw*P.w0, nw1=hw*P.w1, nw2=hw*P.w2;
    const fw0=nw0*kFar, fw1=nw1*kFar, fw2=nw2*kFar;
    // body side
    ctx.beginPath();
    ctx.moveTo(x+fs*nw0, yB);
    ctx.lineTo(x+fs*nw1, yBelt);
    ctx.lineTo(x+fs*nw2, yTop+bh*0.02);
    ctx.lineTo(fx+fs*fw2, fyTop+bh*0.02);
    ctx.lineTo(fx+fs*fw1, fyBelt);
    ctx.lineTo(fx+fs*fw0, fyB);
    ctx.closePath();
    const sg=ctx.createLinearGradient(x,0,fx,0);          // turned away from the light: darker down its length
    sg.addColorStop(0, shade(c.col,0.84));
    sg.addColorStop(0.55,shade(c.col,0.70));
    sg.addColorStop(1, shade(c.col,0.56));
    ctx.fillStyle=sg; ctx.fill();
    // side glass: follows the roofline, inset — the contour that says "modelled"
    if(!isBig || det>0.2){
      ctx.beginPath();
      ctx.moveTo(x+fs*nw2*0.98, yTop+bh*0.06);
      ctx.lineTo(fx+fs*fw2*0.98, fyTop+bh*0.06);
      ctx.lineTo(fx+fs*fw2*0.98, fyTop+bh*(0.06+P.gl)*kFar);
      ctx.lineTo(x+fs*nw2*0.98, yTop+bh*(0.06+P.gl));
      ctx.closePath();
      ctx.fillStyle="rgba(14,20,28,0.88)"; ctx.fill();
      ctx.fillStyle="rgba(190,214,238,"+(0.10+0.10*hi).toFixed(3)+")"; ctx.fill();
    }
    // belt-line crease running away down the flank — the strongest depth cue
    if(det>0.05){
      ctx.strokeStyle="rgba(255,255,255,"+(0.16*hi*det).toFixed(3)+")";
      ctx.lineWidth=Math.max(1,bh*0.025);
      ctx.beginPath(); ctx.moveTo(x+fs*nw1,yBelt); ctx.lineTo(fx+fs*fw1,fyBelt); ctx.stroke();
    }
    // wheels along the flank, foreshortened with it
    // TYRE SIZE COMES FROM THE CAR, not from how much flank happens to be
    // showing. It was wl = flank*0.19, so a long flank (close range, or a bus)
    // inflated the wheels into black balloons just as the car faded out.
    // Diameter is a fixed fraction of the drawn body; only its FORESHORTENING
    // along the flank tracks the viewing angle.
    const wdia=wdiaBase;                                   // screen diameter of a wheel
    const fore=Math.min(1, flank/Math.max(1, lenM*sc));    // 0 = end-on, 1 = full broadside
    const wl=Math.max(1.2, wdia*fore), wr=Math.max(1.2, wdia*0.5);
    // TYRES BELONG TO THE BODY. They were laid out along the raw flank while the
    // body was being clamped, so the moment the clamp bit they kept marching off
    // down the old geometry — a lone black ellipse sitting on the road with no
    // car attached. Two rules: don't draw them once the side is a fabrication,
    // and never place one outside the body's actually-drawn span.
    if(!flankClamped){
      const eX=x+fs*(flank+fw0), lo=Math.min(x,eX), hi=Math.max(x,eX);
      ctx.fillStyle="#0a0b0d";
      for(const t of (P.wh||[0.22,0.78])){
        const wx=x+fs*(nw0*(1-t)+ (flank+fw0)*t), wgy=gy-rise*t;         // ground recedes down the flank
        if(wx<lo||wx>hi) continue;                                       // off the body: not ours to draw
        const wk=1-(1-kFar)*t;                                           // and the far tyre is smaller
        ctx.beginPath(); ctx.ellipse(wx, wgy-wr*wk, wl*0.5*wk, wr*wk, 0, 0, 7); ctx.fill();
      }
    }
  }
  // ---- NEAR-SIDE WHEELS under the face (squeeze with it) ------------------
  ctx.fillStyle="#0c0d0f";
  const twW=Math.max(1.5,cwF*0.14*cosB), twH=Math.max(1.8, cwF*0.26*0.92);  // same wheel, seen end-on
  ctx.fillRect(x-hw*0.98, gy-twH, twW, twH);            // bottom ON the ground, top tucked
  ctx.fillRect(x+hw*0.98-twW, gy-twH, twW, twH);        //   up behind the raised body
  // a hint of shadow in the arch, so the gap under the sill reads as air
  ctx.fillStyle="rgba(0,0,0,0.55)";
  ctx.fillRect(x-hw*0.86, gy-ride*0.92, hw*1.72, Math.max(1,ride*0.9));
  // ---- FACE ---------------------------------------------------------------
  carFacePath(x,hw,yB,bodyH,P);
  ctx.fillStyle=c.col; ctx.fill();
  if(isBig){                                      // heavy vehicles: dark glasshouse band
    ctx.save(); carFacePath(x,hw,yB,bodyH,P); ctx.clip();
    ctx.fillStyle="rgba(16,22,30,0.9)";
    ctx.fillRect(x-hw*0.9, yTop+bh*0.06, hw*1.8, bh*(c.type==="semi"?0.26:c.type==="trailer"?0.03:0.17));
    ctx.restore();
  }
  ctx.save(); carFacePath(x,hw,yB,bodyH,P); ctx.clip();
  // cross-body roundness — the crown shifts with the yaw, so the highlight
  // tracks around the body instead of sitting nailed to the centre
  const crown=0.5+0.34*sinB;
  const fg=ctx.createLinearGradient(x-hw,0,x+hw,0);
  fg.addColorStop(0,"rgba(0,0,0,0.44)");
  fg.addColorStop(Math.max(0.02,crown-0.34),"rgba(0,0,0,0.12)");
  fg.addColorStop(crown,"rgba(255,255,255,"+(0.08*hi).toFixed(3)+")");
  fg.addColorStop(Math.min(0.98,crown+0.34),"rgba(0,0,0,0.12)");
  fg.addColorStop(1,"rgba(0,0,0,0.44)");
  ctx.fillStyle=fg; ctx.fillRect(x-hw*1.05,yTop-bh*0.1,hw*2.1,bh*1.2);
  const bg=ctx.createLinearGradient(0,yTop,0,yB);      // lit roof, shaded sill, AO at the sill
  bg.addColorStop(0,"rgba(255,255,255,"+(0.24*hi).toFixed(3)+")");
  bg.addColorStop(0.28,"rgba(255,255,255,0)");
  bg.addColorStop(0.70,"rgba(0,0,0,0)");
  bg.addColorStop(1,"rgba(0,0,0,0.48)");
  ctx.fillStyle=bg; ctx.fillRect(x-hw*1.05,yTop-bh*0.1,hw*2.1,bh*1.2);
  ctx.restore();
  // silhouette rim-light along the crown: separates the car from the road
  if(hi>0.15){
    ctx.strokeStyle="rgba(255,255,255,"+(0.22*hi).toFixed(3)+")";
    ctx.lineWidth=Math.max(0.8,bh*0.022);
    carFacePath(x,hw,yB,bodyH,P); ctx.stroke();
  }
  // ---- FEATURES: every one squeezes and slides with the face --------------
  // local coords: lx in [-1,1] across the face, ly as a fraction of body height
  const FX=(lx)=> x + lx*hw;                       // <- the whole perspective trick, in one line
  const glassTop=yTop+bh*0.055, glassH=bh*(isBig?0.26:0.30);
  if(!isBig){
    ctx.fillStyle="#19212b";                       // greenhouse
    roundRect(FX(-0.72),glassTop,hw*1.44,glassH,Math.max(1,hw*0.14));
    // quarterlight glint sits on the side the body is turning TOWARD
    ctx.fillStyle="rgba(200,220,240,"+(0.10+0.13*hi).toFixed(3)+")";
    const qx=fs>0? -0.66 : 0.06;
    roundRect(FX(qx),glassTop+bh*0.012,hw*0.60,glassH*0.46,Math.max(1,hw*0.07));
  }
  if(det>0.02){
    const a=det, flankF=Math.min(1,flank/Math.max(1,cwF*0.8));  // how open the flank is, 0..1
    ctx.fillStyle="rgba(255,255,255,"+(0.14*hi*a).toFixed(3)+")";   // beltline crease across the face
    ctx.fillRect(FX(-0.88),yBelt,hw*1.76,Math.max(1,bh*0.028));
    ctx.fillStyle="rgba(10,14,20,"+(0.75*a).toFixed(2)+")";          // pillar split
    ctx.fillRect(FX(-0.02+0.28*sinB),glassTop,Math.max(1,hw*0.045),glassH*0.92);
    // door mirrors: the far one hides as the body turns away
    ctx.fillStyle=shade(c.col,0.90);
    const mW=hw*0.13, mH=bh*0.055;
    ctx.fillRect(FX(-1.0)-mW*0.4, yBelt-bh*0.10, mW*(1+0.5*(fs<0?flankF:0)), mH);
    ctx.fillRect(FX( 1.0)-mW*0.6, yBelt-bh*0.10, mW*(1+0.5*(fs>0?flankF:0)), mH);
    // plate
    ctx.fillStyle=(c.dir>=0)?(S.night?"#b7b39a":"#e9e6d6"):"#e6e9ec";
    ctx.fillRect(FX(-0.22),yB-bodyH*0.16,hw*0.44,bodyH*0.12);
  }
  if(c.aggro){                                    // stripes wrap over the crown
    ctx.fillStyle="#f2f2ee";
    ctx.fillRect(FX(-0.23),yTop+bh*0.02,hw*0.15,bodyH*0.96);
    ctx.fillRect(FX( 0.08),yTop+bh*0.02,hw*0.15,bodyH*0.96);
  }
  // ---- LAMPS: positioned in face-space, so they travel around the body ----
  if(c.type==="trailer" && c.dir<0){               // the nose of a box: marker lamps only
    ctx.fillStyle=S.night?"rgba(255,196,86,0.75)":"rgba(210,170,110,0.5)";
    ctx.fillRect(FX(-0.92),yTop+bh*0.10,hw*0.16,bodyH*0.05);
    ctx.fillRect(FX( 0.76),yTop+bh*0.10,hw*0.16,bodyH*0.05);
  } else if(c.dir<0){                              // oncoming: headlights
    ctx.fillStyle=S.night?"#ffe9a8":"#e8edf2";
    ctx.shadowColor="#ffe9a8"; ctx.shadowBlur=S.night?9:4;
    ctx.fillRect(FX(-0.84),yB-bodyH*0.34,hw*0.32,bodyH*0.16);
    ctx.fillRect(FX( 0.52),yB-bodyH*0.34,hw*0.32,bodyH*0.16);
  } else {
    const braking=c.brk>0.2;
    ctx.fillStyle=braking?"#ff2718":"#c93a30";
    ctx.shadowColor="#ff3a28"; ctx.shadowBlur=braking?9:4;
    const lw=hw*(braking?0.40:0.32), lh=bodyH*(braking?0.18:0.14);
    ctx.fillRect(FX(-0.92),yB-bodyH*0.34,lw,lh);
    ctx.fillRect(FX( 0.92)-lw,yB-bodyH*0.34,lw,lh);
    if(braking){ ctx.fillStyle="#ff5040"; ctx.fillRect(FX(-0.20),yTop+bh*0.10,hw*0.40,bh*0.07); }
  }
  if(c.police){                                    // lightbar, extruded along the roof
    const on=Math.floor(S.t*6)%2===0;
    ctx.save(); ctx.shadowBlur=10;
    const by2=yTop-bh*0.05, bh2=bh*0.11;
    ctx.fillStyle=on?"#2a6bff":"#ff2e2e"; ctx.shadowColor=ctx.fillStyle;
    ctx.fillRect(FX(-0.60),by2,hw*0.56,bh2);
    ctx.fillStyle=on?"#ff2e2e":"#2a6bff"; ctx.shadowColor=ctx.fillStyle;
    ctx.fillRect(FX( 0.04),by2,hw*0.56,bh2);
    if(flank>1){                                   // the bar has depth too
      ctx.globalAlpha*=0.75;                       // multiply: never punch through the fade
      ctx.fillRect(x+fs*hw*0.5, by2+rise*-0.15, fs*flank*0.5, bh2*0.8);
    }
    ctx.restore();
  }
  ctx.shadowBlur=0;
  ctx.restore();                                   // closes the near-camera fade wrapper
}

function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.fill();}

/* ============================ COCKPIT =================================== */
/* ═══ DASH STYLES ═════════════════════════════════════════════════════════════
   One row per real Saab cluster. Reference-checked layouts:

   OG 9-3 / 900 NG (1994-2002) — a single soft-cornered RECTANGULAR binnacle with a
     curved upper lip, not the oval this used to draw. Three round sub-bezels
     inside it: tach left with the turbo pressure arc inset low in its face, the
     speedometer centre and visibly the largest, and a combined fuel+coolant dial
     right carrying two needles. A row of tell-tales across the top inside the
     binnacle. Amber SID strip lives at the TOP OF THE CENTRE STACK, not in the
     cluster. Night Panel on the console.
   9000 (1985-1998) — flatter, wider, squarer bezel; the dials are closer to equal
     in size and the boost gauge is its OWN round dial rather than an inset arc,
     which is why 9000 Aero owners talk about it. Shallower cowl.
   9-5 (1997-2009) — very horizontal, deep hooded cowl, three near-equal dials,
     larger SID sat higher. Night Panel is the signature.
   9-3 Sport Sedan (2003-) — angular twin-pod: two big dials, a proper info screen
     between them, chrome-ringed bezels, no soft curves anywhere.

   `dials` are offsets in units of rDial so a style re-proportions the whole
   cluster without touching a single draw call. */
/* @A-TYRES ══════════════════════════════════════════════════════════════════
   Every trim already carried `tyre` (the factory size) and `tyreK` (what that
   fitment is worth in grip) — that data has been sitting in the table unused.
   This is the rest of it: what is actually ON the car right now, how worn it is,
   and what it does to the one number the whole chassis and the AI planner read.

   S.tyre = { kind, wear, rim }   wear 100 = new, 0 = canvas showing.

   Forum picks, because that is what people actually fit:
     ditchfinder  no-name budget. The forum term is not affectionate.
     touring      all-season. Fine. Nobody writes threads about them.
     PS4          Michelin Pilot Sport — the perennial answer to "what tyres".
     AD08         Yokohama Advan Neova / Toyo R888. Semi-slick, loud, brilliant,
                  useless in the wet below 7 °C and gone in a season.
     hakka        Nokian Hakkapeliitta, studded. The only correct answer to snow,
                  and slower than everything else on dry tarmac.
   Rim size is the other half: a wider rim carries a wider tyre (grip) at the cost
   of unsprung mass and ride. Forum wisdom is nothing above 17 on these cars.  */
const TYRES=[
 {id:"bald",   nm:"Bald budget — 3 mm and lying about it", kr:0,    dry:0.80, wet:0.58, snow:0.50, life:1.5,
  sub:"Whatever was on it when you bought it. Hard as a hockey puck and about as communicative."},
 {id:"ditch",  nm:"No-name budget (“ditchfinders”)",      kr:2600, dry:0.90, wet:0.72, snow:0.62, life:1.15,
  sub:"Four for the price of one good one. The name is what the forums call them and it is not affectionate."},
 {id:"touring",nm:"All-season touring",                    kr:4400, dry:0.97, wet:0.90, snow:0.80, life:0.80,
  sub:"Competent at everything, remarkable at nothing, and they last forever. The sensible answer nobody enjoys hearing."},
 {id:"ps4",    nm:"Michelin Pilot Sport",                  kr:7600, dry:1.10, wet:0.98, snow:0.52, life:1.00,
  sub:"The perennial forum answer to “what tyres”. Turn-in you can feel through a Saab's slightly numb rack, and they talk to you before they let go."},
 {id:"ad08",   nm:"Semi-slick (Advan AD08 / Toyo R888)",   kr:11500,dry:1.22, wet:0.78, snow:0.28, life:1.60,
  sub:"Track rubber with a road label. Enormous dry grip, frightening under 7 °C, and a season is optimistic."},
 {id:"hakka",  nm:"Nokian Hakkapeliitta — studded",        kr:7000, dry:0.86, wet:0.94, snow:1.28, life:1.30,
  sub:"The only correct answer to a Swedish winter. Sounds like a gravel drive on tarmac and does not care."},
];
const RIMS=[
 {id:"steel15", nm:'15" steel + hubcaps',            kr:0,    muK:0.97, kg:0,  sub:"Honest, ugly, and the correct winter wheel."},
 {id:"alloy16", nm:'16" Saab 5-spoke alloy',         kr:3400, muK:1.00, kg:3,  sub:"The standard fitment on most of them and the safest thing to put back on."},
 {id:"aero17",  nm:'17" Saab Aero 3-spoke',          kr:7200, muK:1.05, kg:7,  sub:"The wheel everybody wants. Wider rubber, and enough unsprung mass that you notice it over frost heaves."},
 {id:"light17", nm:'17" Team Dynamics — lightweight', kr:9800, muK:1.06, kg:-3, sub:"Same width, four kilos a corner lighter. The suspension stops fighting the wheel and starts doing its job."},
];
function tyreNow(){ if(!S.tyre) S.tyre={kind:"bald",wear:8,rim:"steel15"};
  return TYRES.find(t=>t.id===S.tyre.kind)||TYRES[0]; }
function rimNow(){ return RIMS.find(r=>r.id===(S.tyre&&S.tyre.rim))||RIMS[0]; }
function tyreWear(){ return Math.max(0,Math.min(100, (S.tyre&&S.tyre.wear!==undefined)? S.tyre.wear : 8)); }
/* THE ONE NUMBER. Compound for the weather on the ground, scaled by what is left
   of the tread and by the rim under it, and finally by the trim's own tyreK so a
   Viggen on 215/45R17 still starts ahead of a 2.0i on 195/60R15. Read by the
   chassis AND by aiCornerMu, so the planner and the physics can never disagree
   about how much grip there is — which is what makes the AI trustworthy. */
function tyreMu(){
  const t=tyreNow(), w=S.wx?S.wx.type:"clear";
  const base = (w==="snow")? t.snow : (w==="rain")? t.wet : t.dry;
  const worn = 0.72 + 0.28*(tyreWear()/100);      // bald is 72% of new, not zero
  return base*worn*rimNow().muK*(TRIMS[S.trim].tyreK||1);
}
/* @A-RARITY ══════════════════════════════════════════════════════════════════
   Market border tiers, the way a loot table does it: colour reads rarity at a
   glance before you have read a single word of the ad. Keyed on TRIM LEVEL and
   nothing else — a 1998 Viggen and a 2002 Viggen are the same rarity, because
   what is rare is the car, not the year it left Trollhattan.
     0 white       naturally aspirated — where everyone starts
     1 teal        light-pressure turbo
     2 blue        full-pressure turbo
     3 purple      the hot ones
     4 red         Aero / Viggen — factory flagship
     5 orange      flagship on the later platform
     6 orange dash heavily modified
     7 red dash    heavily modified and past what the factory allowed
     D gold dash   diesel — the outsider, and priced like a secret          */
const RARITY=[
  {nm:"stock",     col:"#e8e8e8", dash:0},
  {nm:"LPT",       col:"#2fb6a8", dash:0},
  {nm:"turbo",     col:"#3d7fd6", dash:0},
  {nm:"hot",       col:"#9b5cd6", dash:0},
  {nm:"flagship",  col:"#d64545", dash:0},
  {nm:"late flagship", col:"#e08a2e", dash:0},
  {nm:"modified",  col:"#e08a2e", dash:1},
  {nm:"built",     col:"#d64545", dash:1},
];
const RARITY_DIESEL={nm:"diesel", col:"#d4af37", dash:1};
/* A listing's tier: the trim's own rarity, pushed up by how far the seller has
   taken it. Two bolt-ons is not "modified"; a staged build with a bigger turbo is. */
function listingRarity(li){
  const t=TRIMS[li.trim];
  if(t.diesel) return RARITY_DIESEL;
  let r=(t.rarity!==undefined)? t.rarity : 0;
  if(li.buildKind==="tasteful"||li.buildKind==="lunatic") r=Math.max(r,7);
  else if(li.buildKind==="marketplace") r=Math.max(r,6);
  else if(li.buildKind==="bolt-ons" && li.mods.length>=3) r=Math.max(r,Math.min(6,r+1));
  return RARITY[Math.min(RARITY.length-1,r)];
}

/* Which cluster is in front of you. Keyed off the engine family and era so a car
   gets the dash it actually had; anything unrecognised falls back to the OG 9-3,
   which is what every existing trim in this game is. */
function dashStyle(){ return DASH_STYLES[(TRIMS[S.trim]||{}).dash || "og93"] || DASH_STYLES.og93; }

   gauge inset low in the dial, speedo centre, temp/fuel right, amber SID
   strip in the centre stack, and the sacred NIGHT PANEL mode.            */
function layout(){
  const portrait=H>W;
  const dashTop = portrait? H*0.66 : H*0.585;
  const rDial = Math.max(26, Math.min(W*0.096, (H-dashTop)*0.285)); // the rounds, a size up — the cluster earns its cowl
  return {portrait, dashTop, rDial,
    cx: portrait? W*0.34 : W*0.30};
}
function glassStep(fdt){
  const g=S.glass; if(!g) return;
  const wet=S.wx.type==="rain", snowy=S.wx.type==="snow";
  const active=wet||snowy;
  if(active){
    g.film=Math.min(1, g.film+fdt*(wet?0.34:0.14));
    const cap=wet?46:34;
    if(g.drops.length<cap && Math.random()<fdt*(wet?26:15))
      g.drops.push({x:Math.random()*W, y:Math.random()*H*0.60,
                    r:1.6+Math.random()*3.4, streak:wet&&Math.random()<0.3});
    g.cool-=fdt;
    if(g.cool<=0 && g.wipeA===null){ g.wipeA=Math.PI*1.13; g.wipeDir=1; g.cool=wet?3.6:5.2; } // intermittent: a sweep, then a pause
  } else {
    g.film=Math.max(0, g.film-fdt*0.5);
    if(g.drops.length && Math.random()<fdt*3) g.drops.pop();
  }
  g.snowArc = snowy? Math.min(1,g.snowArc+fdt*0.03) : Math.max(0,g.snowArc-fdt*0.06);
  for(const d of g.drops){ if(d.streak) d.y+=fdt*(22+d.r*9); }

    if(g.wipeDir>0 && g.wipeA>=Math.PI*1.87){ g.wipeDir=-1; g.film*=0.12; }
    if(g.wipeDir<0 && g.wipeA<=Math.PI*1.13){ g.wipeA=null; }

    const wa=((g.wipeA%(Math.PI*2))+Math.PI*2)%(Math.PI*2);

      for(const pvx of WIP){
        const aa=(Math.atan2(d.y-pvy,d.x-pvx)+Math.PI*2)%(Math.PI*2);
        if(Math.abs(aa-wa)<0.13 && Math.hypot(d.x-pvx,d.y-pvy)<rw) return false;
      }

    });
  }
}
function drawGlass(){
  const g=S.glass; if(!g) return;

  const snowy=S.wx.type==="snow";
  if(g.film>0.01){ // the blur: a misted film that builds between sweeps
    ctx.fillStyle="rgba(165,180,195,"+(g.film*0.16).toFixed(3)+")";
    ctx.fillRect(0,0,W,gb);

    for(let k=0;k<7;k++){const x=(k*151+40)%W;

  }

      ctx.beginPath();ctx.arc(d.x,d.y,d.r*0.9,0,7);ctx.fill(); }

function drawWipers(){

/* --- the dashboard älg: spring-mounted moose, physics-honest -------------
   Lateral G swings him outward, braking nods him at the windshield, throttle
   sets him back, whoops launch him. He is the G-meter Saab never fitted. */
function drawBobble(){
  const L=layout(), v=S.veh, vis=S.vis, fdt=Math.min(0.05, S._fdt||0.016);
  // signed accelerations
  // where the hands actually are — the rendered wheel, whether it's the AI or you
  const steerNow=(S.drv.steerS!==undefined?S.drv.steerS:S.drv.steer)||0;
  const lastSteer=vis._bobLastSteer===undefined?steerNow:vis._bobLastSteer; vis._bobLastSteer=steerNow;
  const steerRate=(steerNow-lastSteer)/Math.max(0.008,fdt);       // the flick itself
  // steering lateral load: a bicycle-model body-lean that builds with speed,
  // plus a jerk pulse so a quick yank throws his head before the spring settles.
  const steerG = steerNow*Math.min(1,v.v/12)*1.05 + steerRate*0.15;
  const latA = (v.v*v.v*(v.curv||0))/CFG.G + (v.driftYaw||0)*1.4 + (v.ts||0)*0.8 + steerG;
  const lastV = vis._bobLastV===undefined? v.v : vis._bobLastV; vis._bobLastV=v.v;
  const lonA = (v.v-lastV)/Math.max(0.008,fdt)/CFG.G;             // + accel, - braking
  const vert = (v.airT? -1.2 : 0) + (v.bounce||0)*2.2;
  // spring-damper head
  vis.bobX=vis.bobX||0; vis.bobVX=vis.bobVX||0; vis.bobY=vis.bobY||0; vis.bobVY=vis.bobVY||0;
  const tx=Math.max(-1.4,Math.min(1.4, -latA*0.9));              // inertia: right turn, head goes left
  const ty=Math.max(-1.2,Math.min(1.2, lonA*0.55 + vert));
  vis.bobVX += ((tx-vis.bobX)*46 - vis.bobVX*5.2)*fdt; vis.bobX += vis.bobVX*fdt;
  vis.bobVY += ((ty-vis.bobY)*40 - vis.bobVY*5.6)*fdt; vis.bobY += vis.bobVY*fdt;
  const bx=W*0.655, by=L.dashTop+H*0.020, sc2=Math.min(W,H)*0.030;
  const hx=bx+vis.bobX*sc2*0.9, hy=by-sc2*1.5+vis.bobY*sc2*0.5;
  // base puck
  ctx.fillStyle="#15171b"; ctx.beginPath(); ctx.ellipse(bx,by,sc2*0.55,sc2*0.20,0,0,7); ctx.fill();
  // the spring — three coils bending toward wherever the head went
  ctx.strokeStyle="#8c9096"; ctx.lineWidth=Math.max(1,sc2*0.10);
  ctx.beginPath();
  for(let i=0;i<=6;i++){ const t=i/6, wob=(i%2?1:-1)*sc2*0.16;
    const px2=bx+(hx-bx)*t+wob*(1-Math.abs(t-0.5)*2)*0.8, py2=by+(hy+sc2*0.55-by)*t;
    i===0?ctx.moveTo(px2,py2):ctx.lineTo(px2,py2); }
  ctx.stroke();

     THE SUN DOES NOT MOVE. A constant position, and deliberately NOT straight
     overhead: dead-vertical light puts the shadow exactly under the object, which
     kills every cue about which way the thing is leaning and reads as uncanny.
     BOB_SUN is high and over the driver's left shoulder — elevation about 62°,
     azimuth off to the left — which is the angle that shows off-centre deflection
     best, because the shadow travels a long way for a small lean.

     THE SHADOW TRACKS THE REAL DEFLECTION. The head's lateral offset is
     sin(lean) x height, so its shadow displaces by that offset PLUS the sun's own
     horizontal throw; the shadow also stretches as the head leans away and
     compresses as it leans toward the light. That is the whole trick — the
     shadow is doing the animating, so the object itself can stay calm.

     At night the cluster replaces the sun: it sits low and close, so the throw
     inverts and shortens, and the shadow lands above the base instead of below.
     Each head gets its own phase so they do not nod in chorus. Nothing else in
     the scene moves any more than it already did. */
  { const row=bobbleEquipped(), nB=row.length;
    const spread=sc2*1.55, scl=sc2*(nB>3? 0.78 : nB>1? 0.88 : 1);
    const SUN={ throwX:-0.86, throwY:0.34, soft:0.62, alpha:0.26 };   // fixed, high, left
    const LAMP={ throwX: 0.30, throwY:-0.26, soft:0.44, alpha:0.20 }; // the cluster, at night
    const L = S.night? LAMP : SUN;
    for(let bi=0; bi<nB; bi++){
      const off=(bi-(nB-1)/2)*spread;
      const ph=vis.bobX*(1 - bi*0.13) + Math.sin(S.t*2.3+bi*1.9)*0.035;
      // where the head actually IS once it has leaned, and how far its shadow goes
      const lean=Math.sin(ph*0.35), h=scl*0.95;
      const shX=hx+off + lean*h + L.throwX*h*0.55;
      const shY=hy + scl*0.30 + L.throwY*scl*0.30;
      const stretch=1 + Math.abs(lean)*0.55*(Math.sign(lean)===Math.sign(-L.throwX)?1:-0.4);
      ctx.save(); ctx.globalAlpha=L.alpha*(1-Math.min(0.45,Math.abs(lean)*0.5));
      ctx.fillStyle=S.night? "#080b10" : "#1a1c14";
      ctx.beginPath();
      ctx.ellipse(shX, shY, scl*L.soft*stretch, scl*0.15, lean*0.5, 0,7);
      ctx.fill(); ctx.restore();
      ctx.save(); ctx.translate(hx+off, hy); ctx.rotate(ph*0.35);
      drawBobbleHead(scl, ph, row[bi]);
      ctx.restore();
    } }
}

const BOBBLES=[

  {id:"hula",   nm:"Hula girl",        kr:220, sub:"Grass skirt, permanent grin, and a hip action that has no relationship to the road surface."},

/* ============== OBD-II: the ECU keeps receipts ========================= */
const DTC_LIB={
 P0172:{nm:"System too rich (Bank 1)",why:"Fuel trim pegged negative. Big injectors, no injector constant in the file — the ECU adds what the map says, the map is wrong. Flash a file with injector cal.",fix:"Tune w/ inj cal"},
 P0300:{nm:"Random/multiple cylinder misfire",why:"Combustion quality collapsed — fouled plugs, dying DI cassette, or a bottom end past its pension. A FLASHING lamp means stop boosting: raw fuel is cooking the cat.",fix:"Plugs/DI or rebuild",flash:1},
 P0106:{nm:"MAP sensor range/performance",why:"Manifold pressure outside anything the 2.0i file can model — because someone bolted a turbo to it. The ECU is not angry, just confused. It needs a conversion file.",fix:"Stage 1 conversion file"},
 P0217:{nm:"Engine over-temperature condition",why:"Coolant past the line the head gasket signed for. Lift, let airflow work, and stop asking for boost until the needle drops.",fix:"Cool down / radiator"},
 P0128:{nm:"Coolant temp below thermostat regulating",why:"Stuck-open thermostat — she never reaches 90. Fuel washes the bores, sludge loves it. An hour of work.",fix:"Thermostat"},
 P0016:{nm:"Crank/cam correlation (Bank 1 Sensor A)",why:"The chain has stretched past what the tensioner can hide — cam timing is drifting off the crank. TSB 210-2554: over 15 mm of tensioner is the whole kit.",fix:"Timing chain kit"},
 P0171:{nm:"System too lean (Bank 1)",why:"Unmetered air past the MAF — a tired crankcase ventilation pulling vacuum leaks. The WIS renovation kit is cheap; sludge is not.",fix:"PCV renovation"},
 P0133:{nm:"O2 sensor slow response (B1 S1)",why:"The front lambda reads mush because an exhaust leak upstream is breathing fresh air over it. New downpipe gasket and studs.",fix:"DP gasket"},
 P0670:{nm:"Glow plug module performance",why:"The TiD\u2019s cold-start crutch is limping — worn glow plugs or a tired module. She\u2019ll still start warm; winter is another negotiation.",fix:"Glow plugs"},
 P0401:{nm:"EGR flow insufficient",why:"The ECU commanded the recirculation valve, watched the airflow trace, and saw nothing happen — because there is a stainless plate where the valve used to breathe. It is not a fault so much as an observation.",fix:"Any tune switches the EGR routine off"},
 P0545:{nm:"Exhaust gas temperature \u2014 high",why:"The manifold is hotter than the sensor is prepared to tolerate, which on a diesel means you are fuelling harder than the air allows. This is the code that arrives shortly before a hole in a piston.",fix:"More air: vanes, hybrid wheels, intercooler. Or less fuel."},
 P0172b:{nm:"Fuel trim \u2014 rich at idle, lean under load",why:"The classic perished-seal signature. Ethanol has hardened the hose and O-rings, so the rail loses pressure under demand while the injectors dribble at idle. The ECU chases it with fuel trim and never catches it, because the fault is rubber and not electronics.",fix:"Ethanol-safe line & Viton seals"},
 P0324:{nm:"Knock control system error",why:"Not a dead sensor \u2014 the sensor is working perfectly and does not like what it is hearing. The knock control loop has run out of authority: it is pulling every degree it has and detonation is STILL what limits the airmass. The ECU stores this and flashes the lamp because the next thing to give is a piston. Colder charge, better octane, or less boost \u2014 those are the only three answers.",fix:"Octane / intercooler / less boost",flash:1},
 P0420:{nm:"Catalyst efficiency below threshold",why:"The race cat flows like a drainpipe and the rear O2 knows it. Not a fault — a consequence. A stage 2+ file recalibrates the monitor.",fix:"Stage 2 file"}
};
function computeDTCs(){
  const out=[], C=hwCeils(), jobs=S.jobs||[];
  const has=id=>jobs.some(x=>x.id===id);
  if((S.o2Foul||0)>0.5) out.push("P0133");
  if((S.o2Foul||0)>0.9 && !out.includes("P0420")) out.push("P0420");
  if(TRIMS[S.trim].diesel && (S.engHealth!==undefined&&S.engHealth<45)) out.push("P0670");
  if(C.overFuel) out.push("P0172");
  if(C.naConversionMissing) out.push("P0106");
  if(S.eng.steam || (S.eng.coolT||88)>119) out.push("P0217");
  if(has("thermostat")) out.push("P0128");
  if(has("chainKit")) out.push("P0016");
  if(has("pcv")) out.push("P0171");
  if(has("dpGasket")) out.push("P0133");
  /* The race-cat complaint is about a LOW-EFFICIENCY cat. With a decat fitted
     there is no cat at all, so this rule has nothing to describe — the decat rule
     below governs, and it is satisfied by any tune. Leaving both live meant a
     decat on stage 1 coded for a cat that was not on the car. */
  if(S.parts.dp && !decatFitted() && S.tune<2) out.push("P0420");
  if((S.engHealth!==undefined&&S.engHealth<=5) || (C.overFuel&&S.tune===0)) out.push("P0300");
  // a fart in the pull IS a misfire, and it should send you to the Tech2 page
  if(S._fartT!==undefined && (S.t||0)-S._fartT < CFG.KNOCK.dtcHoldS && !out.includes("P0300")) out.push("P0300");
  // knock control out of authority, stored for a while after the last event so the
  // lamp does not wink out the instant you lift off
  if(S._knkT!==undefined && (S.t||0)-S._knkT < CFG.KNOCK.dtcHoldS) out.push("P0324");
  if(sealWear()>=35) out.push("P0172b");     // the rubber is the fault, not the sensor
  /* A DECAT IS A MONITOR PROBLEM, NOT A PERMANENT ONE. Every tuner who fits one
     switches the catalyst-efficiency monitor off in the same afternoon — that is
     the normal, expected part of the job. So: straight pipe on the FACTORY file
     and the ECU notices immediately; straight pipe on anybody's map, bought or
     hand-written, and there is nothing to notice with. It still will not pass an
     emissions test, because the cat is genuinely gone — but the dash is clean. */
  if(decatFitted() && !tunedAtAll() && !out.includes("P0420")) out.push("P0420");
  /* An EGR blank on the factory file: the ECU commands the valve, sees no change in
     the airflow trace, and posts a flow fault. Any tune switches the EGR routine
     off entirely — the same afternoon job as the decat. */
  if(S.parts.egr && !tunedAtAll() && !out.includes("P0401")) out.push("P0401");
  if(dsTrim() && (S.egt||0)>780 && !out.includes("P0545")) out.push("P0545");
  return out;
}
function drawSID(x,y,w,h){
  ctx.fillStyle="#0b0a08";roundRect(x,y,w,h,5);
  ctx.strokeStyle="#000";ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);
  ctx.strokeStyle="rgba(150,160,175,0.08)";ctx.lineWidth=1;ctx.strokeRect(x+2,y+2,w-4,h-4);
  let lines=SID_PAGES[S.sidMode%SID_PAGES.length]();
  // KNOCK ALERT overrides the scheduled page. "KNOCK" blinks on the top line;
  // the running total sits steady underneath and does not blink with it, so the
  // number stays readable while the word is still getting your attention. The
  // dark half of the blink is padded to the same width as the lit half, or the
  // fitted font size would jump twice a second.
  const al=S.sidAlert, nowT=S.t||0;
  if(al && nowT < al.until){
    const K=CFG.KNOCK, per=K.sidOn+K.sidOff, ph=(nowT-al.start)%per;
    const knk=Math.round(S.knockCount||0);
    const cnt= knk>=100000? Math.round(knk/1000)+"K"
             : knk>=10000 ? (knk/1000).toFixed(1)+"K" : String(knk);
    lines=[ (ph<K.sidOn? "KNOCK" : "     "), "COUNT   "+cnt ];
  }
  const maxLen=Math.max(lines[0].length,lines[1].length);
  const fpx=Math.min(h*0.34, (w*0.90)/(maxLen*0.62));
  ctx.font="bold "+fpx+"px 'Courier New',monospace";ctx.textAlign="left";ctx.textBaseline="middle";
  /* THE LATER CARS ARE GREEN. Same dot-matrix panel, same pages, a different
     filter over it — the Sport Sedan and late 9-5 SID reads green where the OG 9-3
     reads amber. One colour pair, taken from the dash style, so the panel is
     identical in every other respect. */
  const G = DASH_STYLES[(TRIMS[S.trim]||{}).dash||"og93"] || {};
  const grn = G.sidCol==="green";
  ctx.fillStyle=S.night? (grn?"#12401f":"#5a3a12") : (grn?"#4de07a":"#ff9d2e");
  ctx.shadowColor=S.night?"transparent":(grn?"#1f8a3f":"#a35e10");ctx.shadowBlur=S.night?0:6;
  ctx.fillText(lines[0], x+w*0.05, y+h*0.30);
  ctx.fillText(lines[1], x+w*0.05, y+h*0.72);
  ctx.shadowBlur=0;
  // MIL: amber engine glyph left of the SID. Solid = stored fault.
  // FLASHING = active misfire, per OBD-II — stop boosting, the cat is cooking.
  if((S.dtc||[]).length){
    const flash=(S.dtc||[]).some(c=>DTC_LIB[c]&&DTC_LIB[c].flash);
    if(!flash || Math.floor(S.t*4)%2===0){
      const gx=x-h*0.75, gy=y+h*0.5, gs=h*0.42;
      ctx.fillStyle="#ffb03a"; ctx.shadowColor="#a35e10"; ctx.shadowBlur=7;
      ctx.fillRect(gx-gs*0.55,gy-gs*0.30,gs*1.1,gs*0.62);           // block
      ctx.fillRect(gx-gs*0.20,gy-gs*0.48,gs*0.45,gs*0.20);          // intake hat
      ctx.fillRect(gx+gs*0.55,gy-gs*0.12,gs*0.22,gs*0.26);          // output shaft
      ctx.fillRect(gx-gs*0.80,gy-gs*0.10,gs*0.25,gs*0.22);          // pulley nose
      ctx.shadowBlur=0;
    }
  }
  if(S.eng.knock>0 && !S.night){ ctx.fillStyle="#e3453a";ctx.font="bold "+(h*0.20)+"px Arial";
    ctx.textAlign="right"; ctx.fillText("KNOCK", x+w-6, y+h*0.5); }
}

function drawTempGauge(){

function drawBoostPod(){

  // suction stalk to the glass

  ctx.beginPath();ctx.moveTo(x,y-r*0.9);ctx.lineTo(x,H*0.045);ctx.stroke();
  ctx.fillStyle="#0a0b0d";ctx.beginPath();ctx.arc(x,y,r*1.12,0,7);ctx.fill();

  ctx.fillStyle=S.night?"#4d3213":"#ff9d2e";ctx.font="bold "+(r*0.17)+"px 'Courier New',monospace";

        ctx.fillStyle=on?"#ff2e2e":"#2a6bff"; ctx.shadowColor=ctx.fillStyle;

/* Eagle-eye minimap. The bird flies ahead of the car: the chevron sits low in
   the glass and most of the circle is road to come. Terrain is the real
   per-side biome hash the windshield uses, laid as round-capped ribbons (no
   fanning quads) and tinted by elevAlt in terraced hypsometric steps — pale
   terraces read as height, like a topo map. Forest canopy is texture only:
   it sits UNDER the traffic layer, so the cars stay visible everywhere. */
const MM={};              // minimap presentation state (GPS zoom servo)
/* Bake the minimap terrain: nearest-road-segment Voronoi via a two-pass
   chamfer distance transform, coloured by that segment's per-side biome.
   Grid is world-axis-aligned and centred on the car at bake time; drawMinimap
   rotates/offsets/rescales the bitmap, so this only reruns every ~50-130 m. */
function bakeMMTerrain(cam,sc,RNG,snow,BAND){
  const T=2, N=Math.ceil(2*RNG/T), pts=S.road.pts, n2=N*N;
  MM.cx=cam.x; MM.cy=cam.y; MM.scB=sc; MM.RNG=RNG; MM.T=T; MM.N=N;
  MM.nightB=!!S.night; MM.snowB=snow;
  if(!MM.tex) MM.tex=document.createElement("canvas");
  MM.tex.width=N; MM.tex.height=N;
  const D =(MM._d  && MM._d.length ===n2)? MM._d  : (MM._d =new Float32Array(n2));
  const ID=(MM._id && MM._id.length===n2)? MM._id : (MM._id=new Int32Array(n2));
  const SA=(MM._s  && MM._s.length ===n2)? MM._s  : (MM._s =new Float32Array(n2));
  D.fill(1e9); ID.fill(-1);
  // seed texels under the polyline (points sit <=2.4 px apart at any zoom)
  for(let i=0;i<pts.length;i++){
    const qx=(pts[i].x-cam.x)*sc+RNG, qy=(pts[i].y-cam.y)*sc+RNG;
    const ix=Math.floor(qx/T), iy=Math.floor(qy/T);
    if(ix<0||iy<0||ix>=N||iy>=N) continue;
    const d=Math.hypot(qx-(ix+0.5)*T, qy-(iy+0.5)*T), j=iy*N+ix;
    if(d<D[j]){ D[j]=d; ID[j]=i; }
  }
  // chamfer: forward then backward pass, dragging the nearest seed's id along
  const W1=T, W2=T*1.41421356;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){ const j=y*N+x;
    if(x>0        && D[j-1  ]+W1<D[j]){D[j]=D[j-1  ]+W1;ID[j]=ID[j-1  ];}
    if(y>0        && D[j-N  ]+W1<D[j]){D[j]=D[j-N  ]+W1;ID[j]=ID[j-N  ];}
    if(x>0&&y>0   && D[j-N-1]+W2<D[j]){D[j]=D[j-N-1]+W2;ID[j]=ID[j-N-1];}
    if(x<N-1&&y>0 && D[j-N+1]+W2<D[j]){D[j]=D[j-N+1]+W2;ID[j]=ID[j-N+1];}
  }
  for(let y=N-1;y>=0;y--)for(let x=N-1;x>=0;x--){ const j=y*N+x;
    if(x<N-1        && D[j+1  ]+W1<D[j]){D[j]=D[j+1  ]+W1;ID[j]=ID[j+1  ];}
    if(y<N-1        && D[j+N  ]+W1<D[j]){D[j]=D[j+N  ]+W1;ID[j]=ID[j+N  ];}
    if(x<N-1&&y<N-1 && D[j+N+1]+W2<D[j]){D[j]=D[j+N+1]+W2;ID[j]=ID[j+N+1];}
    if(x>0&&y<N-1   && D[j+N-1]+W2<D[j]){D[j]=D[j+N-1]+W2;ID[j]=ID[j+N-1];}
  }
  // colour pass: per-side biome of the owning segment + terraces + hems
  const tc=MM.tex.getContext("2d"), imd=tc.createImageData(N,N), px=imd.data;
  const bg=S.night?[10,13,9]:[28,36,24];
  const parse=c=>{ if(c[0]==="#"){const v=parseInt(c.slice(1),16);
      return [(v>>16)&255,(v>>8)&255,v&255];}
    const m=c.match(/\d+/g); return [+m[0],+m[1],+m[2]]; };
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const j=y*N+x, o=j*4, i=ID[j], d=D[j]; let cc;
    if(i<0||d>BAND){ SA[j]=-1e9; cc=bg; }
    else{
      const a=pts[i], b=pts[Math.min(i+1,pts.length-1)]; SA[j]=a.s;
      let dx=b.x-a.x, dy=b.y-a.y;
      if(!dx&&!dy){ const p0=pts[Math.max(0,i-1)]; dx=a.x-p0.x; dy=a.y-p0.y; }
      const qx=(x+0.5)*T-RNG, qy=(y+0.5)*T-RNG;
      const side=(-dy*(qx-(a.x-cam.x)*sc)+dx*(qy-(a.y-cam.y)*sc))>=0? 1:-1;
      const bio=biomeAt(a.s,side), P=BIO_GRASS[bio];
      const tEl=Math.floor(Math.max(0,Math.min(1,(elevAlt(a.s)-95)/330))*6)/6;
      let land=S.night?P.n1:P.d1;
      land=mixHex(land, S.night?"#2c3a49":"#e9e2c6", tEl*(S.night?0.55:0.42));
      if(snow) land=mixHex(land,"#c3cad0",0.72);
      // sea takes no altitude tint — the sea is at exactly one elevation
      if(bio==="beach")      cc=parse(d<BAND*CFG.VERGE.mmSandFrac? land : (snow?"#8fa6b6":(S.night?"#0b1522":"#2e4d66")));
      else if(bio==="cliff") cc=parse(d<BAND*CFG.VERGE.mmCliffFrac? land : (S.night?"#0a0d12":"#8f9aa6"));
      else                   cc=parse(land);
    }
    px[o]=cc[0];px[o+1]=cc[1];px[o+2]=cc[2];px[o+3]=255;
  }
  tc.putImageData(imd,0,0);
}
function drawMinimap(){
  const mS2=Math.min(W,H), mirB=Math.max(58,H*0.05)+Math.min(mS2*0.56,300)*0.27+16;
  const r=Math.min(mS2*0.13,56), mx=W-r-12;
  // landscape: the mirror doesn't reach this corner — sit beside it, clear of the pedals
  const my=(W>H*1.25? Math.max(58,H*0.05) : Math.max(mirB,H*0.05+62))+r;
  ctx.save();
  ctx.beginPath();ctx.arc(mx,my,r,0,7);ctx.clip();
  ctx.fillStyle=S.night?"#0a0d09":"#1c2418";ctx.fillRect(mx-r,my-r,2*r,2*r);
  const cam=poseOnRoad(S.veh.s);
  const AH=r*0.5;                       // the eagle looks up the road
  ctx.translate(mx,my+AH);ctx.rotate(-cam.h);
  // GPS ZOOM: a bend ahead pulls the eagle down to a fixed corner floor — the
  // modern-satnav junction zoom — and open road lets it climb back out for
  // overview. Nearer curvature weighs more; the servo keeps the glass calm.
  let bend=0;
  for(let so=0;so<440;so+=30) bend=Math.max(bend, Math.abs(curvAt(S.veh.s+so))*Math.max(0.35,1-so/520));
  const scTgt=0.062+Math.min(1,bend*300)*0.098;              // 0.062 (out) .. 0.16 (corner floor)
  MM.sc = MM.sc===undefined? scTgt : MM.sc+(scTgt-MM.sc)*Math.min(1,(S._fdt||0.042)*2.4);
  const sc=MM.sc, pts=S.road.pts, cull=(r+AH)*(r+AH)*1.6, snow=S.wx.type==="snow";
  ctx.lineCap="round";
  // ---- terrain: nearest-segment field, baked to a tiny texture -----------
  // Fat per-segment ribbons (capsules or quads) can never be right here: the
  // band must reach ~700 m off the road to fill the glass, but hairpin radii
  // go down to 24 m, so one bend's band always buried the other side of the
  // S — the whole map read as one flat colour with blob ghosts. The truth is
  // a Voronoi: every pixel belongs to the NEAREST piece of road, and takes
  // that piece's per-side biome. bakeMMTerrain computes exactly that with a
  // two-pass chamfer distance transform on a ~96px grid, and we re-bake only
  // when the car has moved / the GPS zoom has drifted / night or snow flips.
  const BAND=r*1.9;
  const RNGb=r+AH+12;
  const shift=MM.cx===undefined?1e9:Math.hypot((cam.x-MM.cx)*sc,(cam.y-MM.cy)*sc);
  /* AND RE-BAKE WHEN THE WORLD CHANGES UNDER IT. The Voronoi is seeded from the
     road polyline and coloured by each piece's biome — but the first bake ran on
     whatever road existed at frame zero, before the generator had laid down enough
     of it to have biomes assigned. After that the only triggers were zoom, an 8 px
     pan, night and snow, so a wrong first bake simply stayed wrong. Keyed on the
     polyline itself now: if the road is not the road it was baked from, re-bake. */
  const roadKey = pts.length+"|"+((S.road.pts[0]&&S.road.pts[0].s)|0)+"|"+((S.road.seed||0)|0);
  if(!MM.tex || MM.roadKey!==roadKey || Math.abs(sc/MM.scB-1)>0.05 || shift>8
     || MM.nightB!==!!S.night || MM.snowB!==snow){
    MM.roadKey=roadKey;
    bakeMMTerrain(cam,sc,RNGb,snow,BAND);
  }
  { // the bake is world-axis-aligned; the canvas transform supplies rotation
    const k=sc/MM.scB, ox=(MM.cx-cam.x)*sc, oy=(MM.cy-cam.y)*sc;
    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(MM.tex, ox-MM.RNG*k, oy-MM.RNG*k, 2*MM.RNG*k, 2*MM.RNG*k);
  }
  // forest canopy texture: a fine deterministic stipple over the band — the
  // old discrete blobs scaled with the GPS zoom into a black caterpillar
  // beside the road. Dots are pixel-sized, hash-anchored, and never on it.
  if(!snow) for(let i=0;i+1<pts.length;i++){
    const a=pts[i];
    const ax=(a.x-cam.x)*sc, ay=(a.y-cam.y)*sc;
    if(ax*ax+ay*ay>cull) continue;
    const b=pts[i+1];
    let dx=b.x-a.x, dy=b.y-a.y; const ln=Math.hypot(dx,dy)||1;
    const nx=-dy/ln, ny=dx/ln;
    for(const side of [-1,1]){
      if(biomeAt(a.s,side)!=="forest") continue;
      let hh=(Math.imul(Math.floor(a.s/15),2654435761)^(side>0?0xa53c9e:0x3d1f7b))>>>0; hh=(hh^hh>>>13)>>>0;
      for(let k=0;k<5;k++){                                   // denser canopy: 5 crowns / 15 m
        // scatter both across the band AND a little along the segment, so the
        // crowns read as a thicket rather than a single file of pixels
        const om=(0.16+((hh>>>(k*6)&127)/127)*0.80)*BAND;
        const al=((hh>>>(k*5+3)&15)/15-0.5)*ln;               // along-segment jitter
        const cx0=ax+dx*(0.5+al/ln)+nx*side*om, cy0=ay+dy*(0.5+al/ln)+ny*side*om;
        // ownership gate: a crown far out on a hairpin's inside can sit on
        // ground the field says belongs to ANOTHER stretch of road — skip it
        const wx2=cam.x+cx0/sc, wy2=cam.y+cy0/sc;
        const ixq=Math.floor(((wx2-MM.cx)*MM.scB+MM.RNG)/MM.T),
              iyq=Math.floor(((wy2-MM.cy)*MM.scB+MM.RNG)/MM.T);
        if(ixq>=0&&iyq>=0&&ixq<MM.N&&iyq<MM.N){
          const os=MM._s[iyq*MM.N+ixq];
          if(os>-1e8 && Math.abs(os-a.s)>60) continue;
        }
        const rr=1.4+((hh>>>(k*9+2))&3)*0.55;                 // crown radius 1.4..3.05 px
        // soft green base + darker core = rounded tree crown, not a black fleck
        ctx.fillStyle=S.night?"rgba(12,20,10,0.62)":"rgba(46,74,30,0.60)";
        ctx.beginPath();ctx.arc(cx0,cy0,rr,0,7);ctx.fill();
        ctx.fillStyle=(hh>>>(k*3)&1)? (S.night?"rgba(7,12,6,0.72)":"rgba(24,44,17,0.70)")
                                    : (S.night?"rgba(15,25,12,0.66)":"rgba(38,62,25,0.66)");
        ctx.beginPath();ctx.arc(cx0,cy0,rr*0.6,0,7);ctx.fill();
      }
    }
  }
  // ---- the road ribbon: dark casing + bright fill, like a satnav; ahead glows ----
  for(const pass of [0,1]) for(let i=0;i+1<pts.length;i++){
    const a=pts[i], b=pts[i+1];
    const ax=(a.x-cam.x)*sc, ay=(a.y-cam.y)*sc, bx=(b.x-cam.x)*sc, by=(b.y-cam.y)*sc;
    if(Math.min(ax*ax+ay*ay,bx*bx+by*by)>cull) continue;
    const ahead=a.s>=S.veh.s-8, wRd=Math.max(2.6, halfAt(a.s)*2*sc*1.5);
    if(pass===0){ ctx.strokeStyle=S.night?"#0b0d10":"#181a1e"; ctx.lineWidth=wRd+2.4; }
    else { ctx.strokeStyle=S.night?(ahead?"#8b93a2":"#3a3f48"):(ahead?"#c6cbd3":"#5d626b");
           ctx.lineWidth=wRd; }
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();
  }
  // ---- farmsteads: falu-red roofs seen from above ----
  for(const seg of S.road.segs) for(const f of seg.feat){
    if(f.type!=="farm") continue;
    const p=poseOnRoad(f.s), off=(10+((f.v||0.4)*613%1)*9)*f.side;
    const fx=(p.x-cam.x+Math.cos(p.h)*off)*sc, fy=(p.y-cam.y+Math.sin(p.h)*off)*sc;
    if(fx*fx+fy*fy>cull) continue;
    const rA=((f.v||0.4)*997)%1, rC=((f.v||0.4)*311)%1, flip=rA<0.5?1:-1;   // match the world compound
    ctx.save();ctx.translate(fx,fy);ctx.rotate(p.h);
    ctx.fillStyle=S.night?"#3a1410":"#8f3126";                              // barn (larger)
    ctx.fillRect(flip*2.0-2.4,-2.1,4.8,4.2);
    ctx.fillStyle=S.night?"#241d1a":"#e8e4da"; ctx.fillRect(flip*2.0-2.4,-0.6,4.8,1.2);
    ctx.fillStyle=S.night?"#341210":"#9a3a2e";                              // house (smaller, opposite side)
    ctx.fillRect(-flip*2.4-1.5,-1.5,3.0,3.0);
    ctx.fillStyle=S.night?"#241d1a":"#e8e4da"; ctx.fillRect(-flip*2.4-1.5,-0.5,3.0,1.0);
    if(rC<0.55){ ctx.fillStyle=S.night?"#20232a":"#b9bcc2"; ctx.beginPath();ctx.arc(flip*4.6,0,1.2,0,7);ctx.fill(); } // silo
    ctx.restore();
  }
  // ---- traffic LAST: always visible, whatever grows beside the road ----
  for(const c of S.traffic){
    const p=poseOnRoad(c.s), lo=c.lane||0;                                   // smooth pose + lane, matching the camera
    const dxc=(p.x-cam.x+Math.cos(p.h)*lo)*sc, dyc=(p.y-cam.y+Math.sin(p.h)*lo)*sc;
    if(dxc*dxc+dyc*dyc<cull){ctx.fillStyle=c.dir<0?"#e3a13a":"#8fa4bd";ctx.beginPath();ctx.arc(dxc,dyc,2.8,0,7);ctx.fill();}
  }
  if(S.chase && S.chase.active && S.cop){                                   // the pursuing cop — flashing blues, never culled
    const p=poseOnRoad(S.cop.s), lo=S.cop.lane||0;
    const dxc=(p.x-cam.x+Math.cos(p.h)*lo)*sc, dyc=(p.y-cam.y+Math.sin(p.h)*lo)*sc;
    const on=Math.floor(S.t*6)%2===0;
    ctx.save(); ctx.shadowBlur=8; ctx.fillStyle=on?"#2a6bff":"#ff2e2e"; ctx.shadowColor=ctx.fillStyle;
    ctx.beginPath();ctx.arc(dxc,dyc,3.6,0,7);ctx.fill(); ctx.restore(); ctx.shadowBlur=0;
  }
  ctx.restore();
  ctx.fillStyle="#ff9d2e";ctx.beginPath();
  ctx.moveTo(mx,my+AH-6);ctx.lineTo(mx-4,my+AH+5);ctx.lineTo(mx+4,my+AH+5);ctx.fill();
  ctx.strokeStyle="#2c2f36";ctx.lineWidth=2;ctx.beginPath();ctx.arc(mx,my,r,0,7);ctx.stroke();
}

is bent.": "Den koden \u00e4r skev.","\ud83c\udfae ARCADE DRIFT \u2014 the tail hangs out for the whole corner. Pure driver assist \u2014 the road ahead is unchanged.": "\ud83c\udfae ARCADE-DRIFT \u2014 bakvagnen h\u00e4nger ute genom hela kurvan. Ren f\u00f6rarhj\u00e4lp \u2014 v\u00e4gen fram\u00f6ver \u00e4r of\u00f6r\u00e4ndrad.","Arcade drift off \u2014 the physics take the wheel back.": "Arcade-drift av \u2014 fysiken tar tillbaka ratten.","\ud83d\udee1 EASY MODE \u2014 damage off. Every story, none of the bills.": "\ud83d\udee1 SN\u00c4LLT L\u00c4GE \u2014 skador av. Alla historier, inga r\u00e4kningar.","Easy mode off \u2014 the sheet metal keeps score again.": "Sn\u00e4llt l\u00e4ge av \u2014 pl\u00e5ten h\u00e5ller r\u00e4kningen igen.","Kronor. The parts bin speaks Swedish.": "Kronor. Dell\u00e5dan talar svenska.","Dollars. The exchange desk nods.": "Dollar. V\u00e4xlingsdisken nickar.","NIGHT PANEL. Only what matters.": "NATTPANEL. Bara det som betyder n\u00e5got.","Night panel off.": "Nattpanel av.","\ud83d\udcdf SAAB IDLE \u2014 the AI drives at the limit. Grab the wheel or pedals to override (or WASD). GARAGE \u25b8 for the path.": "\ud83d\udcdf SAAB IDLE \u2014 AI:n k\u00f6r p\u00e5 gr\u00e4nsen. Grip ratten eller pedalerna f\u00f6r att ta \u00f6ver (eller WASD). GARAGE \u25b8 f\u00f6r v\u00e4gen fram\u00e5t.","GEAR": "V\u00c4XEL","rpm \u00d71000": "varv \u00d71000","POWER   ": "EFFEKT  ","TORQUE  ": "MOMENT  ","AIRMASS ": "LUFTMASSA ","CEILING ": "TAK     ","BOOST   ": "TRYCK   ","WG DUTY ": "WG-DUTY ","TRIP    ": "TRIPP   ","BEST    ": "B\u00c4ST    ","SERVICE \u2014 ": "SERVICE \u2014 ","Factory file. Torque limited per gear, boost tapered.": "Fabriksfil. Moment begr\u00e4nsat per v\u00e4xel, laddtryck avtrappat.","More requested airmass, same hardware. T7Suite + a CAN cable.": "Mer beg\u00e4rd luftmassa, samma h\u00e5rdvara. T7Suite + en CAN-kabel.","Map for downpipe + intercooler. Torque limiters raised.": "Mappning f\u00f6r downpipe + intercooler. Momentsp\u00e4rrarna h\u00f6jda.","Full airmass request for the Mitsubishi. Needs fueling.": "Full luftmassebeg\u00e4ran f\u00f6r Mitsubishin. Kr\u00e4ver br\u00e4nsle.","18T/19T request tables. Two days on the dyno, allegedly.": "18T/19T-beg\u00e4rantabeller. Tv\u00e5 dagar i dynon, p\u00e5st\u00e5s det.","GT28 tables. Watch the clutch. Watch everything.": "GT28-tabeller. H\u00e5ll koll p\u00e5 kopplingen. H\u00e5ll koll p\u00e5 allt.","3-bar MAP maxed. Forged bottom end assumed by the file.": "3-bars MAP maxad. Filen f\u00f6ruts\u00e4tter smidd bottendel.","The last page of the dyno binder. Fuel and boost to the end of it.": "Sista sidan i dynop\u00e4rmen. Br\u00e4nsle och tryck \u00e4nda till slutet.","Stage 1 \u2014 ECU remap": "Steg 1 \u2014 ECU-remap","Stage 3 \u2014 breathing map": "Steg 3 \u2014 andningsmapp","Stage 4 \u2014 TD04 map": "Steg 4 \u2014 TD04-mapp","Stage 5 \u2014 hybrid map": "Steg 5 \u2014 hybridmapp","Stage 6 \u2014 big turbo map": "Steg 6 \u2014 storturbomapp","Stage 7 \u2014 built motor": "Steg 7 \u2014 byggd motor","Stage 8 \u2014 send it": "Steg 8 \u2014 k\u00f6r","Stock binary": "Originalbin\u00e4r","American pump swill. RON 91 in honest units. Fine for a commute; the knock sensor earns overtime the moment you ask for boost on a warm day.": "Amerikansk pumpskv\u00e4tt. RON 91 i \u00e4rliga enheter. Duger till pendling; knacksensorn jobbar \u00f6vertid s\u00e5 fort du beg\u00e4r tryck en varm dag.","European standard, US premium \u2014 same molecule, different sticker. The factory file assumes it.": "Europeisk standard, amerikansk premium \u2014 samma molekyl, olika etikett. Fabriksfilen f\u00f6ruts\u00e4tter den.","The best US pumps sell. RON 98 equivalent \u2014 the timing holds on hot pulls and the adaptation banks a little advance.": "Det b\u00e4sta amerikanska pumpar s\u00e4ljer. Motsvarar RON 98 \u2014 t\u00e4ndningen h\u00e5ller p\u00e5 heta drag och adaptionen sparar lite f\u00f6rst\u00e4llning.","Premium. More knock margin \u2014 the ECU keeps its timing on hot days.": "Premium. Mer knackmarginal \u2014 styrdonet beh\u00e5ller t\u00e4ndningen varma dagar.","Flex-fuel conversion. Ethanol cools the charge going in and laughs at knock \u2014 but stoich is 9.8:1, so it drinks 50% more volume. Needs the big injectors.": "Flexifuel-konvertering. Etanolen kyler laddningen p\u00e5 v\u00e4g in och skrattar \u00e5t knack \u2014 men stoich \u00e4r 9,8:1, s\u00e5 den dricker 50 % mer volym. Kr\u00e4ver de stora spridarna.","Blue-tinted, sweet-smelling, and sold by the drum where the Cessnas park. Knock becomes a rumour \u2014 and the lead quietly murders your lambda sond and catalyst. Race day fuel, not commute fuel.": "Bl\u00e5tonat, s\u00f6tluktande och s\u00e5lt p\u00e5 fat d\u00e4r Cessnorna parkerar. Knack blir ett rykte \u2014 och blyet m\u00f6rdar i tysthet din lambdasond och katalysator. T\u00e4vlingsbr\u00e4nsle, inte pendlarbr\u00e4nsle.","Gasol. ~106 RON knock resistance for half the pump price \u2014 but the vapor displaces ~4.5% of your intake air and gives none of petrol\u2019s evaporative cooling. Torque dips, wallet grows.": "Gasol. ~106 RON knackt\u00e5lighet f\u00f6r halva pumppriset \u2014 men \u00e5ngan tr\u00e4nger undan ~4,5 % av insugsluften och ger inget av bensinens avdunstningskyla. Momentet sjunker, pl\u00e5nboken v\u00e4xer.","For the TiD only. Compression ignition doesn\u2019t knock \u2014 it smokes. The limit isn\u2019t octane, it\u2019s how much fuel the air can burn clean.": "Endast f\u00f6r TiD. Kompressionst\u00e4ndning knackar inte \u2014 den ryker. Gr\u00e4nsen \u00e4r inte oktan, utan hur mycket br\u00e4nsle luften kan br\u00e4nna rent.","95 \u2014 pump standard": "95 \u2014 pumpstandard","98 \u2014 premium": "98 \u2014 premium","Regular 91 (import junk)": "Regular 91 (importskr\u00e4p)","109 leaded (the airfield)": "109 blyad (flygf\u00e4ltet)","Two lanes, by the book. Mirror, signal, manoeuvre.": "Tv\u00e5 filer, enligt boken. Spegel, blinkers, man\u00f6ver.","Ten winters of E4 commuting. Reads brake lights two cars ahead.": "Tio vintrar av E4-pendling. L\u00e4ser bromsljus tv\u00e5 bilar fram\u00e5t.","Knows every frost heave by name. Corners on rails, gaps judged to the metre.": "Kan varje tj\u00e4lskott vid namn. Kurvor p\u00e5 r\u00e4ls, luckor bed\u00f6mda p\u00e5 metern.","Will borrow the oncoming inner lane \u2014 only when it is provably empty.": "L\u00e5nar m\u00f6tande innerfil \u2014 bara n\u00e4r den bevisligen \u00e4r tom.","Ex-Viggen pilot. All fourteen metres of road belong to the mission.": "F.d. Viggen-pilot. Alla fjorton meter v\u00e4g tillh\u00f6r uppdraget.","Not a tuner \u2014 the factory's own service programming. Stage 0 lives here: flat torque plateau, per-gear limits, boost tapered for the driveline's pension. The file your dealer swears by.": "Ingen trimmare \u2014 fabrikens egen serviceprogrammering. Steg 0 bor h\u00e4r: platt momentplat\u00e5, gr\u00e4nser per v\u00e4xel, laddtryck avtrappat f\u00f6r drivlinans pension. Filen din handlare sv\u00e4r vid.","St. Gallen. The OEM-blessed house \u2014 dealer-flashed, warranty-friendly, conservative margins, and a top end that keeps pulling. You pay for the handshake.": "St. Gallen. Det OEM-v\u00e4lsignade huset \u2014 handlarflashat, garantiv\u00e4nligt, konservativa marginaler och en topp som forts\u00e4tter dra. Du betalar f\u00f6r handslaget.","\u00d6rebro. The balanced Swede \u2014 Maptuner in the glovebox, strong midrange, injector calibration from stage 3. The forum's default answer.": "\u00d6rebro. Den balanserade svensken \u2014 Maptuner i handskfacket, starkt mellanregister, spridarkalibrering fr\u00e5n steg 3. Forumets standardsvar.","V\u00e4xj\u00f6. The PPC people \u2014 peak power arrives early and hits hard. Thinner margins; the knock sensor earns its salary on hot days.": "V\u00e4xj\u00f6. PPC-folket \u2014 toppeffekten kommer tidigt och sl\u00e5r h\u00e5rt. Tunnare marginaler; knacksensorn tj\u00e4nar sin l\u00f6n varma dagar.","Torque now, horsepower eventually \u2014 a low-end wall of shove that peaks by 5000. The trailer-tow special that embarrasses hot hatches.": "Moment nu, h\u00e4stkrafter s\u00e5 sm\u00e5ningom \u2014 en v\u00e4gg av tryck p\u00e5 botten som toppar vid 5000. Sl\u00e4pvagnsspecialen som f\u00f6r\u00f6dmjukar GTI-bilar.","The open-source way: a BDM header soldered to the ECU and a winter of reading ecuproject. Cheapest files on earth, injector constants set by you from stage 1 \u2014 and every mistake is also yours.": "\u00d6ppen k\u00e4llkods-v\u00e4gen: en BDM-header l\u00f6dd p\u00e5 styrdonet och en vinter av ecuproject-l\u00e4sning. Jordens billigaste filer, spridarkonstanter satta av dig fr\u00e5n steg 1 \u2014 och varje misstag \u00e4r ocks\u00e5 ditt.","Naturally aspirated. No turbo, no lag, no excuses \u2014 the same block the classic 900 carried. Where every build starts.": "Insugsmotor. Ingen turbo, ingen lagg, inga urs\u00e4kter \u2014 samma block som klassiska 900 bar. D\u00e4r varje bygge b\u00f6rjar.","Light-pressure turbo. The honest one.": "L\u00e5gtrycksturbo. Den \u00e4rliga.","Full-pressure GT17. The sensible one. The dealer wants to see you've wrenched before handing over keys.": "Fulltrycks-GT17. Den f\u00f6rnuftiga. Handlaren vill se att du skruvat innan nycklarna byter hand.","TD04HL-15T from the factory. The sleeper.": "TD04HL-15T fr\u00e5n fabrik. Ulven i f\u00e5rakl\u00e4der.","2.3 litres, 350 Nm, lightning blue. The thunderbolt. Earned, never given.": "2,3 liter, 350 Nm, blixtbl\u00e5. \u00c5skviggen. F\u00f6rtj\u00e4nad, aldrig given.","The oddball: a GM-sourced turbodiesel spinning to 4600 with tractor torque at 1800. No spark, no knock, no hurry \u2014 and 5.5 l/100km doing it.": "Den udda: en GM-diesel som varvar till 4600 med traktormoment vid 1800. Ingen gnista, ingen knack, ingen br\u00e5dska \u2014 och 5,5 l/100 km p\u00e5 k\u00f6pet.","Someone already turned the pump up and wound the VNT tighter. Black smoke on full throttle included free of charge.": "N\u00e5gon har redan vridit upp pumpen och sp\u00e4nt VNT:n. Svart r\u00f6k p\u00e5 fullgas ing\u00e5r utan kostnad.","Toroidal tank in the spare-wheel well, reducer off the coolant loop, vapor rail, piggyback controller. Bivalent: starts on petrol, switches on temp.": "Toroidtank i reservhjulsbaljan, f\u00f6rg\u00e5ngare p\u00e5 kylkretsen, gasrail, piggyback-styrning. Bivalent: startar p\u00e5 bensin, v\u00e4xlar p\u00e5 temperatur.","Bigger core, colder thermostat. The mountain is long and the coolant knows it. Buys you whole minutes of full send.": "St\u00f6rre cellpaket, kallare termostat. Berget \u00e4r l\u00e5ngt och kylv\u00e4tskan vet det. K\u00f6per dig hela minuter av fullgas.","Lets the turbine breathe. Faster spool, more top end.": "L\u00e5ter turbinen andas. Snabbare spool, mer topp.","Charge temps decide knock margin. Stock IC heat-soaks above stock boost.": "Laddlufttemperaturen avg\u00f6r knackmarginalen. Original-IC:n v\u00e4rmem\u00e4ttas \u00f6ver originaltryck.","King Cobra style intake pipe. Small gain, great noise.": "Insugsr\u00f6r i King Cobra-stil. Liten vinst, h\u00e4rligt ljud.","Turbo-back 3 inch. Required company for the downpipe.": "Turbo-back 3 tum. Obligatoriskt s\u00e4llskap till downpipen.","The Viggen/Aero unit. Direct bolt-on to the GT17 cars.": "Viggen/Aero-enheten. Direkt bolt-on p\u00e5 GT17-bilarna.","9000 Aero hot side on your TD04. Top-end unlock.": "9000 Aero-hetsida p\u00e5 din TD04. Toppen l\u00e5ses upp.","Billet 18T compressor wheel, machined housing. The classic tuner move.": "Fr\u00e4st 18T-kompressorhjul, bearbetat hus. Det klassiska trimmardraget.","One wheel bigger. Negligible extra lag, real extra air.": "Ett hjul st\u00f6rre. F\u00f6rsumbar extra lagg, riktig extra luft.","Ball-bearing spool with real flow. Custom oil & water lines.": "Kullagrad spool med riktigt fl\u00f6de. Specialdragna olje- och vattenledningar.","Stock fueling dies \u2248300 hp. Green giants + 3-bar sensor.": "Originalbr\u00e4nslet d\u00f6r \u2248300 hk. Gr\u00f6na j\u00e4ttar + 3-bars sensor.","Rising-rate regulator on the stock rail. A quarter-turn buys real fueling headroom at the top \u2014 set with a gauge, not by ear.": "Stigande regulator p\u00e5 originalrailen. Ett kvarts varv k\u00f6per riktigt br\u00e4nsleutrymme i toppen \u2014 st\u00e4lls med manometer, inte p\u00e5 geh\u00f6r.","Fat aluminium rail, braided feed from the tank. The stock hard line starts to starve past 350 hp \u2014 this is the plumbing that doesn\u2019t.": "Tjock aluminiumrail, fl\u00e4tad matning fr\u00e5n tanken. Originalr\u00f6ret b\u00f6rjar sv\u00e4lta \u00f6ver 350 hk \u2014 det h\u00e4r \u00e4r r\u00f6rmokeriet som inte g\u00f6r det.","For the E85 end-game: 50% more volume through the same rail. Idle gets lumpy-rich on petrol \u2014 these are ethanol hardware.": "F\u00f6r E85-slutspelet: 50 % mer volym genom samma rail. Tomg\u00e5ngen blir fet och knagglig p\u00e5 bensin \u2014 det h\u00e4r \u00e4r etanolh\u00e5rdvara.","Stock in-tank pump runs out ~320 hp. Cheap insurance.": "Originalpumpen i tanken tar slut ~320 hk. Billig f\u00f6rs\u00e4kring.","Stock Sachs Viggen pressure plate. Holds what the chassis can use.": "Sachs Viggen-tryckplatta i original. H\u00e5ller vad chassit kan anv\u00e4nda.","Four kilos off the crank nose. The revs answer the pedal instead of debating it, and the plate bites clean on every engagement.": "Fyra kilo av vevaxelnosen. Varven svarar p\u00e5 pedalen i st\u00e4llet f\u00f6r att debattera, och lamellen biter rent varje g\u00e5ng.","Half the throw, twice the certainty. You stop lifting early because the lever stops being a negotiation.": "Halva v\u00e4gen, dubbla s\u00e4kerheten. Du slutar sl\u00e4ppa gasen tidigt f\u00f6r att spaken slutar vara en f\u00f6rhandling.","Thicker shafts, better joints. Wheel hop dies, launches hook up, and the steering stops fighting itself under boost.": "Gr\u00f6vre axlar, b\u00e4ttre knutar. Hjulhoppen d\u00f6r, starterna f\u00e5r f\u00e4ste och styrningen slutar sl\u00e5ss med sig sj\u00e4lv under tryck.","The lump stops rocking a centimetre per gearchange. Shifts land where you aimed them and the torque steer calms a notch.": "Klumpen slutar gunga en centimeter per v\u00e4xling. V\u00e4xlingarna landar d\u00e4r du siktade och torque steer lugnar sig ett sn\u00e4pp.","THE Saab driveline job. The factory diff pin is the fuse in every big-torque FM55 \u2014 this is the rebuild with the steel pin, done before it lets go instead of after.": "Saab-drivlinejobbet med stort J. Fabrikens diffpinne \u00e4r s\u00e4kringen i varje storvriden FM55 \u2014 det h\u00e4r \u00e4r renoveringen med st\u00e5lpinnen, gjord innan den sl\u00e4pper i st\u00e4llet f\u00f6r efter.","Steering-rack brace, rack clamp and firmer engine mounts. Abbott built it because the chassis never asked for 350 Nm \u2014 torque steer drops from character flaw to character.": "Styrv\u00e4xelst\u00e4g, kuggst\u00e5ngsklamma och fastare motorf\u00e4sten. Abbott byggde det f\u00f6r att chassit aldrig bad om 350 Nm \u2014 torque steer g\u00e5r fr\u00e5n karakt\u00e4rsfel till karakt\u00e4r.","22/19 mm bars on poly mounts. The body stops leaning on the outside front and the whole car turns in one motion.": "22/19 mm-stag p\u00e5 polyf\u00e4sten. Karossen slutar luta p\u00e5 yttre framhjulet och hela bilen sv\u00e4nger i en r\u00f6relse.","Every arm and the subframe. Steering gains a nerve it never had; the road gains a voice. Two full evenings with a press.": "Varje l\u00e4nkarm och subframen. Styrningen f\u00e5r en nerv den aldrig haft; v\u00e4gen f\u00e5r en r\u00f6st. Tv\u00e5 hela kv\u00e4llar med press.","T7 bottom ends won't live much past ~300 whp. Build it before it builds itself a window.": "T7-bottendelar lever inte l\u00e4nge \u00f6ver ~300 whp. Bygg den innan den bygger sig ett f\u00f6nster.","Manifold spacer, v-band downpipe, real fuel system. 400 whp country.": "Grenr\u00f6rsdistans, v-bands-downpipe, riktigt br\u00e4nslesystem. 400 function L(str){ return S.lang==="sv"? (SVD[str]||str) : str; }
function trHtml(h){ if(S.lang!=="sv"||!h) return h;

  return h; }

/* SAE display: US mode measures in hp / lb-ft / \u00B0F / lb (psi lives in boostStr) */
function pwrN(ps){ return S.units==="mi"? Math.round(ps*0.9863) : Math.round(ps); }
function tqN(nm){ return S.units==="mi"? Math.round(nm*0.73756) : Math.round(nm); }
function pwrUnit(){ return S.units==="mi"? "hp" : (S.lang==="sv"?"hk":"hp"); }
function pwrStr(ps){ return pwrN(ps)+" "+pwrUnit(); }
function tqStrU(nm){ return tqN(nm)+(S.units==="mi"?" lb-ft":" Nm"); }
function tempStr(c){ return S.units==="mi"? Math.round(c*9/5+32)+"\u00B0F" : Math.round(c)+"\u00B0C"; }
function massStr(kg){ return S.units==="mi"? Math.round(kg*2.2046)+" lb" : Math.round(kg)+" kg"; }
function boostU(k){ return S.units==="mi"? (k*0.145038).toFixed(1)+" psi" : Math.round(k)+" kPa"; }
function KV(l,v){return '<div class="kv"><span>'+l+'</span><b>'+v+'</b></div>';}
function fmt(n){return Math.round(n).toLocaleString("sv-SE");}
const USD_PER_KR=0.095;
function fmtMoney(kr){return S.cur==="usd" ? "$"+Math.round(kr*USD_PER_KR).toLocaleString("en-US") : fmt(kr)+" kr";}
function boostStr(kPa){return S.units==="mi" ? (kPa*0.145038).toFixed(1)+" PSI" : (kPa/100).toFixed(2)+" BAR";}
function distStr(km){return S.units==="mi" ? (km*0.6214).toFixed(1)+" mi" : km.toFixed(1)+" km";}
function spdStr(ms){return S.units==="mi" ? Math.round(ms*2.23694)+" mph" : Math.round(ms*3.6)+" km/h";}
function turboOrder(k){return Object.keys(TURBOS).indexOf(k);}
function tunePrice(tn){return Math.round(tn.kr*Math.max(0.45,PROV().priceK));}

function cfgSecs(cat){ // slider sections for one settings chip
  let h="";
  for(const sec of CFG_SPEC){
    if((sec.cat||"phys")!==cat) continue;
    h+='<h3 class="sec">'+sec.sec+'</h3>';
    for(const r of sec.rows){

      h+='<div class="cfgRow">'
        +'<div class="cfgL"><button class="cfgName" data-cfginfo="'+r.path+'">'+r.nm+'</button>'
        +'<span class="cfgVal'+(mod?' mod':'')+'" data-val-for="'+r.path+'">'+fmtCfg(v,r)+'</span></div>'
        +'<div class="cfgR"><input type="range" data-cfg="'+r.path+'" min="'+r.min+'" max="'+r.max+'" step="'+r.step+'" value="'+v+'"></div>'
        +'</div>';
    }
  }
  return h;
}

// ---- easter egg: quick taps on the distance/trim pill ----------------------
// TEN taps (a pause between them resets the count) drops you into a stock
// lightning-blue 9-3 Viggen — unlocked, owned, fresh, on petrol. Your money,
// badges and total miles are untouched; only the car in the bay changes.
// KEEP GOING TO TWENTY, without pausing, and the parts catalogue empties itself
// into the bay on top of it.
(function(){
  const odo=$("pillOdo"); if(!odo) return;
  odo.style.cursor="pointer";
  // A NEW CAR ARRIVES WITH A NEW BOBBLEHEAD. Exactly what the classifieds do on
  // a shell swap: clear the roll and re-seed, and bobbleKind() rolls a fresh one
  // from prestiges + trim + seed the next time anything asks. Without this the
  // cheat handed you a different car with the last one's moose still glued to
  // the dash — the one thing about a car you don't choose, following you around.
  const reBobble=()=>{ S.bobble=null; S.carSeed=(Math.random()*1e6)|0; };
  function thunderbolt(){
    S.trim=4; S.turboKey=null; S.parts={}; S.tune=0;   // a Viggen as she left Trollhättan
    S.ownedTrims=Array.from(new Set([...(S.ownedTrims||[0]),4]));
    S.unlockedMax=4; S.pendingTrim=4;                  // top of the ladder, honestly or not
    // top licence + a fully-schooled driver: every skill maxed, the ledger kept
    // consistent with the game's own accounting (each level past 1 = one point).
    S.drvLv=DRIVERS[DRIVERS.length-1].id;
    const P=S.player=S.player||{xp:0,lv:1,sp:0,sk:{}};
    P.sk={}; let pts=0;
    for(const sk of SKILLS){ P.sk[sk.id]=sk.max; pts+=sk.max; }
    P.lv=Math.max(P.lv, DRIVERS[DRIVERS.length-1].lvAt, 1+pts); P.sp=0; P.xp=0;
    S.carCol="#274f8f";                                // Lightning blue (301) — the only colour a Viggen wears
    S.engHealth=100; S.knockCount=0; S._blownToast=0; S._limpToast=0; S._chainDue=0; S._pumpDue=0; S.sealWear=0; S._sealMi=0; S._sealT30=0; S._sealT70=0;
    S.jobs=[]; S.bodyDmg=0; S.rust=0; S.pinWear=0; S._pinLash=0; S.carMiles=0; S.crashed=false; S.wreck=false;
    if(S.fuel==="diesel") S.fuel="ron95";              // no oil-burner wears this badge
    S.t7=null; S._cutToast=0;                          // fresh ECU, factory calibration
    reBobble();                                        // new car, new thing on the dash
    toast("\u26A1 THE THUNDERBOLT \u2014 a stock lightning-blue 9-3 Viggen, keys in hand. 2.3, 350 Nm. Flygvapnet licence, every skill learned. "+bobbleName()+" came with her. Earned the honest way, this once.");
    if(typeof renderShop==="function") renderShop();
  }
  // TWENTY — the whole catalogue, top to bottom. Every part fitted with no bench
  // queue (the cheat is the cheat), the turbo the upgrade chain actually ends on
  // rather than a hard-coded key, the highest stage this engine is allowed to
  // run, every pump unlocked, and the BDM header soldered so all six tuning
  // houses are selectable. It deliberately does NOT pick a house for you — that
  // is a character choice, not a rung on a ladder.
  function maxEverything(){
    const T=TRIMS[S.trim], diesel=!!T.diesel;
    S.parts=S.parts||{};
    for(const p of PARTS){
      // the same gate the shop draws over the petrol hardware on an oil-burner
      if(diesel && (p.turbo || p.id==="inj" || p.id==="lpgkit" || p.id==="pistons")) continue;
      if(p.naOnly && TRIMS[S.trim].turbo!=="na") continue;
      S.parts[p.id]=true;
    }
    // ...and drop anything left dangling by that gate. `rail` and `inj875` both
    // hang off `inj`, which the oil-burner never gets, so a flat sweep fitted a
    // fuel rail for injectors that aren't in the head. Prune until stable.
    for(let pass=0,moved=1; moved && pass<8; pass++){ moved=0;
      for(const p of PARTS) if(S.parts[p.id] && p.needPart && !S.parts[p.needPart]){ delete S.parts[p.id]; moved=1; } }
    S.turboKey=null;                                   // derive, never assert
    for(const p of PARTS) if(p.turbo && S.parts[p.id]
      && turboOrder(p.turbo)>turboOrder(S.turboKey||T.turbo)) S.turboKey=p.turbo;
    // A HOME MAP IS NOT A LADDER, SO THERE IS NOTHING TO MAX. If you are on the
    // DIY house the cheat hands the ECU back to the last standard house you used
    // and tops out ITS stages \u2014 your own tables are left exactly as you wrote
    // them, waiting on the laptop for whenever you take it home again.
    if(PROV().diy) S.prov = (S.provLast && PROVIDERS.some(q=>q.id===S.provLast && !q.diy))? S.provLast : "maptun";
    for(let i=TUNES.length-1;i>=0;i--) if(tuneAllowed(TUNES[i].id)){ S.tune=TUNES[i].id; break; }
    // every pump this engine can drink, bought. The tank gets E85: the avgas
    // out-octanes it and then quietly plates the lambda sond, and the gasol
    // caps fuelMgc and displaces intake air — neither is an upgrade at the top.
    S.fuelsOwned=S.fuelsOwned||{};
    for(const f of FUELS) if(!!f.dieselOnly===diesel) S.fuelsOwned[f.id]=1;
    S.fuel = diesel? "diesel" : "e85";
    S.jobs=[]; S.staged=null;                          // nothing left on the bench, nothing on the counter
    S.engHealth=100; S.knockCount=0; S._blownToast=0; S._limpToast=0;
    S.bodyDmg=0; S.rust=0; S.pinWear=0; S._pinLash=0; S.crashed=false; S.wreck=false;
    // WHOEVER WRITES YOUR FILES TODAY WRITES THIS ONE. No BDM header handed over,
    // no house switched behind your back — the stage ladder is topped out through
    // the tuner already in S.prov, so their curve shape, their safety margin and
    // their injector cal are all still what you're driving. The house is a
    // character choice; the stages are a ladder, and only the ladder gets maxed.
    const HS=PROV(), d=estDyno(), C=hwCeils(), tb=TURBOS[S.turboKey||T.turbo];
    toast("\uD83D\uDD27 THE WHOLE CATALOGUE \u2014 every part fitted, "+(tb?tb.name:"stock turbo")+", "
      +TUNES[S.tune].nm+" flashed by "+HS.nm+", "+(diesel?"diesel":"E85")+" in the tank. "
      +d.hp+" hp on the rollers, limited by "+d.limit+"."
      +(C.overFuel?" It runs RICH \u2014 this file has no injector cal.":""));
    if(typeof checkUnlocks==="function") checkUnlocks();
    if(typeof renderWorkbench==="function") renderWorkbench();
    if(typeof renderShop==="function") renderShop();
  }
  let taps=0, last=0;
  odo.addEventListener("click",()=>{
    const now=performance.now();
    taps=(now-last<800)?taps+1:1;                 // must be a quick run; hesitate and it resets
    last=now;
    if(taps===10) thunderbolt();                  // ...and the count keeps running
    else if(taps>=20){ taps=0; maxEverything(); } // twenty gets the catalogue on top
  });
})();
