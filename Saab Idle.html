      const ref=PACE_REF[t]||{t:0,v:0};
      const top=vmax*3.6;
      // 0-100 is the real check. The speed column is only a sanity floor: the
      // bench runs on a real road, so the car is corner-limited long before Vmax
      // and "top speed" here means "reached", not "terminal". A dead drivetrain
      // (the diesels) still shows up instantly as a near-zero.
      // Tolerance is for catching BREAKAGE, not for grading. A trim 8% off the
      // factory figure is a tuning opinion; a trim that lost its drivetrain is
      // a bug. Flag the second, stay quiet about the first.
      const okT = t100!==null && Math.abs(t100-ref.t) <= Math.max(2.5, ref.t*0.35);
      const okV = top >= ref.v*0.55;
      out[t]={i:t, nm:TRIMS[t].nm, t100, top, ref, hp:hpPk, tq:tqPk, split, roll,
                rHp:TRIMS[t].hp, rTq:TRIMS[t].tqNm, ok:okT&&okV};
    }
  }catch(e){ out.push({err:(e&&e.message)||String(e)}); }
  S.veh=keepVeh; S.eng=keepEng; S.dt=keepDt; S.input=keepIn; S.traffic=keepTr;
  S.odo=keep.odo; S.tripOdo=keep.trip; S.carMiles=keep.miles; S.bestHp=keep.best;
  S.pinWear=keep.pin; S._pinLash=keep.lash; S.bodyDmg=keep.body; S.kr=keep.kr;
  S.t=keep.t; S.wreck=keep.wreck; S.night=keep.night;
  S.seed=keep.seed; R=rng(S.seed); initRoad();      // and the world the player will drive
  S.trim=JSON.parse(save).trim; S.tune=JSON.parse(save).tune; S.parts=JSON.parse(save).parts;
  S.aiMode=JSON.parse(save).mode;
  /* AND REPAINT THE PILL. The bench drives every car in Racing, and something in
     the render path repainted the badge while it was doing so — so the game came up
     saying RACING while S.aiMode had already been put back to Spirited. The state
     was right the whole time and the label was lying, which is the worse of the two
     to debug. Restoring a value means restoring what the player can SEE of it. */
  if(typeof updAIPill==="function") updAIPill();
  // put the garage back exactly as it was found
  S.fuel=keep.fuel; S.prov=keep.prov; S.turboKey=keep.turboKey; S.t7=keep.t7;
  S.engHealth=keep.health; S.o2Foul=keep.o2; S.knockCount=keep.knocks;
  S.tyre=keep.tyre; S.sealWear=keep.sealWear;
  return out;
}
function paceReport(){
  const el=$("intro"); if(!el) return;
  const box=document.createElement("div");
  box.style.cssText="margin-top:9px;font:600 9px/1.4 ui-monospace,monospace;letter-spacing:.03em;"+
    "color:#cfd6de;text-align:left;min-width:290px";
  box.innerHTML="<div style='color:#9fb6cc;letter-spacing:.10em;margin-bottom:3px'>DRIVETRAIN SELF-TEST"+
    "<span style='float:right;color:#5f7793'>0-100 &nbsp; hp &nbsp; Nm</span></div>";
  el.appendChild(box);
  const rows=document.createElement("div"); box.appendChild(rows);
  const res=[]; S._pace=res;
  let i=0;
  // one trim per tick, so the figures land on the splash as they come in
  const tick=()=>{
    if(i>=TRIMS.length){
      const bad=res.filter(r=>!r.ok).length;
      const f=document.createElement("div");
      f.style.cssText="margin-top:3px;color:"+(bad?"#ffb37a":"#8fd6a0");
      f.textContent=bad? (bad+" of "+res.length+" out of spec") : "all trims within spec";
      box.appendChild(f); return;
    }
    let r;
    try{ r=paceSelfTest(i)[i]; }catch(e){ r={nm:TRIMS[i].nm,err:e.message,ref:PACE_REF[i]||{t:0,v:0}}; }
    res.push(r);
    const line=document.createElement("div");
    const dt = r.t100? (r.t100-r.ref.t) : null;
    const col = r.err? "#ff8a7a" : (r.ok? "#8fd6a0" : "#ffb37a");
    line.style.color=col;
    // Green = the car actually got there. The 0-62 mark is the only one with a
    // sourced factory figure, so it alone is judged against a target; the rest
    // are simply reached or not, and nothing is invented to grade them by.
    const sp=r.split||{};
    const S_=(m)=>{ if(sp[m]===undefined) return "<span style='opacity:.35'>&ndash;</span>";
      let col="#8fd6a0";
      if(m===62 && r.ref && r.ref.t) col=(Math.abs(sp[m]-r.ref.t)<=Math.max(2.5,r.ref.t*0.35))?"#8fd6a0":"#ffb37a";
      return "<span style='color:"+col+"'>"+sp[m].toFixed(1)+"</span>"; };
    line.innerHTML = r.err? ("ERR "+r.nm+" "+r.err)
      : "<div>"+(r.ok?"OK  ":"BAD ")+
          r.nm.replace("9-3 ","").padEnd(13).slice(0,13).replace(/ /g,"&nbsp;")+
          "<span style='float:right'>"+
            (r.t100? r.t100.toFixed(1):"--")+"s"+
            "<span style='opacity:.55'>/"+r.ref.t.toFixed(1)+"</span>"+
            "&nbsp; "+Math.round(r.hp||0)+"<span style='opacity:.55'>/"+r.rHp+"</span>hp"+
            "&nbsp; "+Math.round(r.tq||0)+"<span style='opacity:.55'>/"+r.rTq+"</span>Nm"+
          "</span></div>"+
        "<div style='opacity:.62;padding-left:4px'>30 "+S_(30)+"&nbsp; 60 "+S_(60)+
          "&nbsp; 90 "+S_(90)+"&nbsp; 120 "+S_(120)+"&nbsp; 160 "+S_(160)+
          " mph&nbsp; | 0-62 "+S_(62)+"&nbsp; 0-100 "+S_(100)+"&nbsp; 0-124 "+S_(124)+"</div>"+
        "<div style='padding-left:4px;color:#e7c778'>50-70 in 5th &nbsp;"+
          (r.roll? r.roll.toFixed(1)+"s" : "<span style='opacity:.5'>did not pull</span>")+"</div>";
    rows.appendChild(line);
    i++; setTimeout(tick,16);
  };
  setTimeout(tick,16);
}
try{ paceReport(); }catch(e){ console.warn("pace test failed",e); }
/* TITLE SPLASH — held until dismissed. The drivetrain self-test prints onto the
   card while you wait; once it has finished (or eight seconds have passed, in
   case it throws) the prompt lights up and the splash becomes tappable. */
/* THE TESTS FINISH BEFORE THE GAME STARTS. Dismissing early used to leave the
   pace bench still driving 23 cars on the main thread while you were trying to
   drive your own — stutter, and a card you never got to read. introReady is set
   by arm() once the bench has produced a row for every trim. The failsafe still
   exists so a thrown test can never lock you out permanently. */
let introReady=false;
function introDismiss(){
  if(!introHeld || !introReady) return;
  // introHeld goes false FIRST and in a finally, so that if any single line of the
  // state reset below ever throws, the game still unpauses. A splash that cannot
  // be dismissed is unrecoverable for the player; a slightly odd starting state
  // is not. Learned the hard way.
  introHeld=false;
  try{ introDismissInner(); } catch(err){ console.warn("intro reset partial:",err); }
  try{ last=performance.now(); acc=0; unlockAudio();
       if(typeof updAIPill==="function") updAIPill();
       // the world is fully built by now; throw away anything baked before it was
       if(typeof MM!=="undefined"){ MM.tex=null; MM.roadKey=null; }
     }catch(e){}
}
function introDismissInner(){
  const el=$("intro");
  if(el){ el.style.transition="opacity .45s"; el.style.opacity="0";
          setTimeout(()=>{ if(el.parentNode) el.remove(); }, 520); }
  // START ON THE OPENING STRAIGHT. The pace bench drives all seven trims flat
  // out while you read the card, and it resets the LIVE S.veh/S.eng/S.dt objects
  // between trims rather than swapping clones back — so whatever the last trim
  // was doing when its run timed out is what the car is doing now. With the old
  // auto-fading splash the six seconds of running hid it; with the game properly
  // held it would be the first thing you saw. Put her back on the line.
  S.veh.v=0; S.veh.s=60; S.veh.lane=1.7; S.veh.psi=0; S.veh.curv=0; S.veh.heading=0;
  S.veh.slip=0; S.veh.ts=0; S.veh.latG=0; S.veh.driftYaw=0; S.veh.wheelDmg=0;
  S.eng.rpm=900; S.eng.boost=0; S.eng.iat=WX_AMB[S.wx.type]; S.eng.icT=WX_AMB[S.wx.type];
  S.eng.coolT=88; S.eng.knock=0; S.eng.knockAdapt=0; S.eng.knockEvt=0; S.eng.obT=0;
  S.eng.pop=0; S.eng.fart=0; S.eng.bCut=0; S.knockCount=0; S._knkT=undefined; S._fartT=undefined;
  S.dt.gear=1; S.traffic.length=0; S.wreck=null; S.crashed=false; S.sidAlert=null;
  S.input={gas:false,brake:false,steerOn:false,steer:0};
  S.drv.passState=0; S.drv.passT=0; S.drv.passCool=0; S.drv.passTgt=null; S.drv.heldLane=null; S.drv.holdResume=null;
  // hand the loop a fresh clock: without this the first frame after the splash
  // arrives holding every millisecond spent reading the test card, and the sim
  // integrates the whole splash in one go.
}
{ const el=$("intro"), t0=performance.now();
  if(el){
    const arm=()=>{
      const done=(S._pace && S._pace.length>=TRIMS.length);
      const bailed=(performance.now()-t0>90000);     // something threw; do not trap the player
      if(!done && !bailed){
        const ld0=$("introLoad");
        if(ld0) ld0.textContent="TESTING \u00b7 "+((S._pace||[]).length)+" / "+TRIMS.length+" CARS";
        return setTimeout(arm,120);
      }
      introReady=true;
      const ld=$("introLoad"), tp=$("introTap"), sk=$("introStart");
      if(ld) ld.textContent="READY \u00b7 "+TRIMS.length+" CARS VERIFIED";
      if(tp) tp.classList.add("on");
      if(sk) sk.classList.add("on");
      // ...and if none of the four dismissal paths ever fires, let go anyway.
      setTimeout(()=>{ if(introHeld) introDismiss(); }, 120000);
      // the stage-by-house matrix, printed where it cannot be ignored
      const sc=$("introStages"), M=window._stageMatrix;
      if(sc && M){
        const w7=x=>String(x).padStart(7);
        let hh="<b>STAGE MATRIX</b>  91 E0 \u00b7 top row = the file WITH the hardware it needs, dim row = the file alone on stock parts\n";
        let lt=-1;
        for(const r of M.rows){
          if(r.trim!==lt){ lt=r.trim;
            hh+="\n<b>"+TRIMS[r.trim].nm+"</b>  "+(ENGINES[TRIMS[r.trim].eng]||{}).nm
               +" \u00b7 "+ecuLabel(r.trim)+" \u00b7 stock "+r.stockHp+" hp\n"
               +"                   "+TUNES.map(t=>w7("S"+t.id)).join("")+"\n"; }
          hh+=(r.house.nm+"                  ").slice(0,18)+" "
            +r.cells.map(c=>c.na? w7("\u2014")
              : '<span class="'+(c.back?"red":"grn")+'">'+w7(c.hp)+'</span>').join("")+"\n";
          hh+="   file alone \u2192      "
            +r.cells.map(c=>c.na? w7("\u2014") : '<span class="dim">'+w7(c.bare)+'</span>').join("")+"\n";
        }
        hh+="\n"+(M.pass? '<span class="grn">\u2713 ladder rises on every house and every car \u00b7 nobody exceeds their own limit</span>'
                         : '<span class="red">\u2717 '+M.fails.join("\n\u2717 ")+'</span>');
        if((M.notes||[]).length) hh+='\n<span class="dim">\u00b7 '+M.notes.join("\n\u00b7 ")+'</span>';
        sc.innerHTML=hh;
      }
    };
    setTimeout(arm,1200);
    // dismiss on anything: the splash itself, a key, or a tap that lands on it
    /* ONLY THE BUTTON. Dismissing on any tap made the card unreadable: the whole
       point of a scrollable stage matrix and twenty-three pace rows is that you
       scroll through them, and every scroll gesture was ending the screen. The
       start button is the single way out, so scrolling is just scrolling. */
    const sk0=$("introStart");
    if(sk0){ sk0.addEventListener("click", introDismiss);
             sk0.addEventListener("pointerdown", e=>{ e.preventDefault(); introDismiss(); }); }
  } else introHeld=false;   // no splash in the DOM: never hold the game hostage
}
