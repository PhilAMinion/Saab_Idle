/* ---- 2. THE PEOPLE (cheap variation: kinds x shuffled styles) ---------- */
const PAX_KINDS=[
  {id:"hitchhiker", label:"Hitchhiker",  base:38, coat:"#c86b3a"},
  {id:"commuter",   label:"Commuter",    base:30, coat:"#3f5a86"},
  {id:"nurse",      label:"Off shift",   base:46, coat:"#cfd6dd"},
  {id:"drifter",    label:"Drifter",     base:52, coat:"#7a7f88"},
  {id:"student",    label:"Student",     base:34, coat:"#4f7a52"},
  {id:"stranger",   label:"Stranger",    base:58, coat:"#2b2e34"},
];
const PAX_NAMES=["Sanna","Ove","Lena","Björn","Majken","Tomas","Ingrid","Kaj","Elsie",
  "Rune","Vera","Nils","Signe","Åke","Dagny","Sten","Marit","Loke","Ebba","Gunnar"];
const PAX_STYLES=["#c86b3a","#3f5a86","#8a6f38","#5a7d6a","#9a4f52","#4a4d55","#b39a4e","#6a5a86"];
// independent appearance traits from a per-rider seed, so the person you see
// waiting is the one who climbs in and shows in the mirror — and skin/hair/build
// vary on their own, not locked to the coat colour.
const PAX_SKIN=["#f0d0ae","#e6bd94","#d3a273","#b98153","#8f5d3a","#6d4529"];
const PAX_HAIR=["#1b1610","#33251a","#573922","#7c5a30","#a9a49b","#c9a552","#8a3a25","#0d0d0f"];
function paxLook(seed){
  let h=(seed>>>0)||1; h=(h^h>>>15)>>>0; h=Math.imul(h,2246822519)>>>0; h=(h^h>>>13)>>>0;
  return { skin:PAX_SKIN[h%PAX_SKIN.length], hair:PAX_HAIR[(h>>>5)%PAX_HAIR.length],
           hat:((h>>>11)&3)===0, build:0.88+((h>>>13)&7)/7*0.28 };
}
function paxPickKind(){ return PAX_KINDS[(R()*PAX_KINDS.length)|0]; }
function paxNewId(){ S._paxCtr=(S._paxCtr||0)+1; return "p"+Date.now().toString(36)+(S._paxCtr); }
function storyFor(kind, avoid){
  const pool=STORYLINES.filter(s=>(!s.who||s.who.includes(kind)) && (!avoid||!avoid.has(s.id)));
  const src=pool.length?pool:STORYLINES;
  return src[(R()*src.length)|0];
}

/* ---- 3. THE SPEECH BUBBLE ---------------------------------------------- */
let SPEECH=null;        // {name, text, t0, dur, hold}
let SPEECH_BOX=null;    // last-drawn hit rect, so a tap can dismiss the bubble
// hold=true: the bubble waits for you (tap it, or answer) instead of timing out.
function paxSay(text, name, dur, hold, cont){ SPEECH={ text:trHtml(text), name:name||(S.pax&&S.pax.name)||"", t0:S.t, dur:dur||6.5, hold:!!hold, cont:!!cont }; }
function wrapText(txt, maxW, font){
  ctx.font=font; const words=txt.split(" "), lines=[]; let cur="";
  for(const w of words){ const test=cur?cur+" "+w:w;
    if(ctx.measureText(test).width>maxW && cur){ lines.push(cur); cur=w; } else cur=test; }
  if(cur) lines.push(cur); return lines;
}
function drawSpeech(){
  if(!SPEECH){ SPEECH_BOX=null; return; }
  const age=S.t-SPEECH.t0;
  if(!SPEECH.hold && age>SPEECH.dur){ SPEECH=null; SPEECH_BOX=null; return; }  // transient lines still time out
  const app=Math.min(1,age/0.22);
  const fade=SPEECH.hold?1:Math.min(1,(SPEECH.dur-age)/0.4);                   // held lines never fade out
  const a=Math.max(0,Math.min(1,Math.min(app,fade)));
  const fpx=Math.max(13,Math.min(19,W*0.026));
  const font="600 "+fpx+"px -apple-system,Segoe UI,Arial";
  const maxW=Math.min(W*0.52,360)-24;
  const lines=wrapText(SPEECH.text,maxW,font);
  const lh=fpx*1.32, padX=13, padY=10, nameH=SPEECH.name?fpx*1.05:0;
  let tw=0; for(const l of lines) tw=Math.max(tw,ctx.measureText(l).width);
  if(SPEECH.name){ ctx.font="700 "+(fpx*0.78)+"px -apple-system,Arial"; tw=Math.max(tw,ctx.measureText(SPEECH.name.toUpperCase()).width); }
  const bw=tw+padX*2, bh=lines.length*lh+padY*2+nameH;
  const bx=Math.max(10,W*0.05), by=Math.max(56,H*0.235);
  SPEECH_BOX={x:bx,y:by,w:bw,h:bh+16};   // +16 covers the tail; a tap anywhere on it dismisses
  ctx.save(); ctx.globalAlpha=a;
  // bubble
  ctx.fillStyle="rgba(16,17,20,0.93)"; ctx.strokeStyle="rgba(201,147,42,0.55)"; ctx.lineWidth=1.5;
  roundRect(bx,by,bw,bh,12); ctx.fill();
  ctx.beginPath();ctx.moveTo(bx+12,by);ctx.arcTo(bx+bw,by,bx+bw,by+bh,12);
  ctx.arcTo(bx+bw,by+bh,bx,by+bh,12);ctx.arcTo(bx,by+bh,bx,by,12);ctx.arcTo(bx,by,bx+bw,by,12);ctx.closePath();ctx.stroke();
  // tail toward the passenger seat (down-right)
  ctx.fillStyle="rgba(16,17,20,0.93)";
  ctx.beginPath();ctx.moveTo(bx+bw*0.62,by+bh-1);ctx.lineTo(bx+bw*0.78,by+bh+16);ctx.lineTo(bx+bw*0.80,by+bh-1);ctx.closePath();ctx.fill();
  // name
  let ty=by+padY;
  if(SPEECH.name){ ctx.font="700 "+(fpx*0.78)+"px -apple-system,Arial"; ctx.fillStyle="#c9932a"; ctx.textAlign="left"; ctx.textBaseline="top";
    ctx.fillText(SPEECH.name.toUpperCase(),bx+padX,ty); ty+=nameH; }
  ctx.font=font; ctx.fillStyle="#e7ebf0"; ctx.textAlign="left"; ctx.textBaseline="top";
  for(const l of lines){ ctx.fillText(l,bx+padX,ty); ty+=lh; }
  // a faint tap cue on held lines: rambles continue, questions get set aside
  if(SPEECH.hold && app>=1){ ctx.globalAlpha=a*0.5; ctx.fillStyle="#c9932a";
    ctx.font="600 "+(fpx*0.62)+"px -apple-system,Arial"; ctx.textAlign="right"; ctx.textBaseline="alphabetic";
    ctx.fillText(SPEECH.cont?"tap to continue \u203a":"tap to set aside \u00d7", bx+bw-padX, by-4); }
  ctx.restore();
}
function speechFrame(){ drawSpeech(); }

/* ---- 4. THE RIDER: board, ride, alight; nerves and vitals live here ---- */
let REST_ZONE=CFG.REST.ZONE; // metres either side of a building that count as "the lot" ← CFG.REST (let: CONFIG tab re-syncs)
const REPROMPT_GAP=10;       // seconds after you wave a line away before the rider tries again

/* -- helpers over the writer's data: a `say` is a string or {t,anx}; a
   storyline is looked up by id, a node by key within it. All tolerant of a
   save that points at a storyline/node that no longer exists (the writer
   edited the script since) — in that case the rider simply finishes up. */
function storyOf(p){ return STORYLINES.find(x=>x.id===p.sid)||null; }
function nodeOf(p){ const s=storyOf(p); return s&&s.nodes?s.nodes[p.node]:null; }
function sayText(f){ return typeof f==="string"?f:(f&&f.t)||""; }
function sayAnx(f){ return (f&&typeof f==="object"&&typeof f.anx==="number")?f.anx:0; }
function driverName(){ return S.lang==="sv"?"DU":"YOU"; }

function paxBoard(f){
  const kind = PAX_KINDS.find(k=>k.id===f.kindId) || paxPickKind();
  let id, name, sid, node=null, turns=0, rides=0, resumed=false, look=(f.look!=null?f.look:(Math.random()*4294967296)>>>0);
  if(f.retId && S.paxLog && S.paxLog[f.retId] && !S.paxLog[f.retId].done){
    const L=S.paxLog[f.retId]; id=f.retId; name=L.name; kind.id=L.kind||kind.id;
    sid=L.sid; node=L.node; turns=L.turns||0; rides=L.rides||0; resumed=true;
    if(L.look!=null) look=L.look;                                  // same face as last time
  } else {
    id=paxNewId(); name=PAX_NAMES[(R()*PAX_NAMES.length)|0];
    const avoid=new Set(Object.values(S.paxLog||{}).filter(l=>l.done).map(l=>l.sid));
    sid=storyFor(kind.id,avoid).id;
  }
  let sl=STORYLINES.find(s=>s.id===sid); if(!sl){ sl=STORYLINES[0]; sid=sl.id; }
  const start=sl.start||"s0";
  if(node==null || !sl.nodes[node]){ node=start; resumed=false; }  // fresh, or a resumed node that still exists
  S.pax={ id, name, kind:kind.id, kindLabel:kind.label, style:(f.style!=null?f.style:paxStyleNext()), look,
          coat:kind.coat, anx:kind.base, hr:72, tIn:0, sid, node, turns, rides,
          done:false, boardOdo:S.odo, choiceAt:0, choicesShown:false, pending:null, pendAt:0, repromptAt:0, autoAt:0 };
  f.wait=false; f.used=true; S.paxSeen=(S.paxSeen||0)+1; S._boardCool=2.6;
  toast("👤 "+name+" gets in — "+kind.label.toLowerCase()+". PASSENGER tab in SETTINGS.");
  paxSayNode(node, resumed);   // resuming: don't re-charge nerves or re-count the exchange
  if(typeof addXp==="function") addXp(12);
}
function paxAlight(reason){
  const p=S.pax; if(!p) return;
  S.paxLog=S.paxLog||{};
  S.paxLog[p.id]={ name:p.name, kind:p.kind, sid:p.sid, node:p.node, turns:p.turns||0, look:p.look,
                   rides:(p.rides||0)+1, done:!!p.done };
  // FARE — they settle up on the way out. Time aboard sets the meter, a finished
  // story pays a bonus, and a calm ride earns a tip; a white-knuckle one doesn't.
  const secs=Math.max(0,p.tIn||0);
  const base=35 + Math.round(secs*1.4) + (p.done?70:0);
  const tip=Math.max(0, Math.round((100-(p.anx||0))/100 * base*0.35));
  const fare=Math.round(Math.max(20, base+tip)*CFG.ECON.payK);
  S.kr=(S.kr||0)+fare;
  if(typeof addXp==="function") addXp(p.done?18:8);
  const sl=storyOf(p);
  const flavour = (sl&&sl.payNote) ? (" "+sl.payNote+".")
                 : (p.done ? " That's their whole story." : " The road remembers where you left off.");
  toast("👋 "+p.name+(p.done?" steps out.":" steps out for now.")+flavour+" Fare +"+fmtMoney(fare)+".");
  cheque("\u2b50 FARE +"+fmtMoney(fare)+(tip>0?"  \u00b7 tip "+fmtMoney(tip):(p.done?"":"  \u00b7 part")));
  clearChoices(); SPEECH=null; SPEECH_BOX=null; S.pax=null; S._boardCool=2.6;
}
/* THE RIDER SPEAKS a node's line, then — if that node offers choices — arms
   the choice panel to appear a beat later. A node with no choices is the end
   of their story. `resay` re-shows a line already spoken (a reprompt or a
   resumed ride) without re-charging nerves or re-counting the exchange. */
function paxSayNode(nodeId, resay){
  const p=S.pax; if(!p) return;
  clearChoices(); p.choicesShown=false; p.pending=null; p.repromptAt=0; p.autoAt=0;
  const s=storyOf(p), nd=s&&s.nodes?s.nodes[nodeId]:null;
  if(!nd){ p.done=true; p.choiceAt=0; return; }   // dangling link → wrap them up gracefully
  p.node=nodeId;
  if(!resay){ p.turns=(p.turns||0)+1; const a=sayAnx(nd.say); if(a) p.anx=Math.max(0,Math.min(100,p.anx+a)); }
  const txt=sayText(nd.say);
  const dur=Math.max(4.5,Math.min(9.5, txt.length*0.055+3));
  const hasChoices=!!(nd.choices && nd.choices.length);
  const ramble=!hasChoices && !!nd.next;                 // a line that flows on by itself
  paxSay(txt, p.name, dur, true, ramble);                // held: waits for a tap or an answer; ramble shows "continue"
  if(hasChoices){ p.choiceAt=S.t+Math.min(dur*0.5,2.8); }        // reveal buttons mid-line
  else if(ramble){ p.choiceAt=0; p.autoAt=S.t+Math.max(dur*0.85,2.8); }  // monologue on, at its own pace
  else { p.choiceAt=0; p.done=true; }                            // terminal: story told
}
/* THE DRIVER ANSWERS. Called by a tap on a choice button. Your reply flashes
   in the bubble (transient), then the rider responds a moment later. */
function paxChoose(i){
  const p=S.pax; if(!p) return;
  const nd=nodeOf(p); if(!nd||!nd.choices||!nd.choices[i]) return;
  const ch=nd.choices[i];
  clearChoices(); p.choicesShown=false; p.repromptAt=0;
  if(typeof ch.anx==="number") p.anx=Math.max(0,Math.min(100,p.anx+ch.anx));
  const reply=(ch.r||"").trim();
  if(reply){ paxSay(reply, driverName(), 2.7, false); p.pending=ch.to; p.pendAt=S.t+2.9; }
  else { paxSayNode(ch.to); }
  if(typeof addXp==="function") addXp(4);
}
/* SET ASIDE. Tapping the bubble waves the current line away and clears its
   replies. If it was a line still awaiting your answer, the rider brings it
   back after a short while rather than losing the thread. */
function paxDismiss(){
  if(!SPEECH) return;
  SPEECH=null; SPEECH_BOX=null; clearChoices();
  const p=S.pax; if(!p) return;
  p.choicesShown=false;
  if(p.pending || p.done) return;                 // a reply is already in flight, or the tale's done
  const nd=nodeOf(p); if(!nd) return;
  if(!(nd.choices && nd.choices.length)){         // a ramble line
    if(nd.next){ p.autoAt=0; paxSayNode(nd.next,false); }  // waved on → they carry straight on
    return;
  }
  if(nd.dropTo){ paxSayNode(nd.dropTo,false); }   // they take the hint and move the conversation on
  else { p.choiceAt=0; p.repromptAt=S.t+REPROMPT_GAP; }   // otherwise they'll raise it again later
}

/* ---- FRONT END: the choice buttons ------------------------------------
   A DOM overlay on the left, clear of the wheel (centre) and pedals
   (corners). The CONTAINER ignores touches (pointer-events:none) so driving
   input passes straight through to the canvas everywhere except on an actual
   button — the panel can never block steering or the pedals. */
function showChoices(choices){
  const box=$("paxChoices"); if(!box) return;
  box.innerHTML="";
  choices.forEach((c,i)=>{
    const b=document.createElement("button");
    b.className="paxChoice"; b.dataset.i=i;
    b.textContent="‣ "+trHtml((c.r&&c.r.trim())?c.r:"…");
    box.appendChild(b);
  });
  box.style.display="flex";
  requestAnimationFrame(()=>{ box.style.opacity="1";
    box.querySelectorAll(".paxChoice").forEach((b,i)=>
      setTimeout(()=>{ b.style.opacity="1"; b.style.transform="translateX(0)"; }, 30+i*80)); });
}
function clearChoices(){ const box=$("paxChoices"); if(!box||box.style.display==="none") return;
  box.style.display="none"; box.style.opacity="0"; box.innerHTML=""; }
function paxStep(dt){
  if(S._boardCool>0) S._boardCool-=dt;
  const v=S.veh;
  // vitals + story while someone rides
  const p=S.pax;
  if(p){
    p.tIn+=dt;
    const kind=PAX_KINDS.find(k=>k.id===p.kind)||PAX_KINDS[0];
    // nerves track how you drive: speed, cornering load, near-misses, the dark
    let target=kind.base
      + Math.max(0,(v.v-24))*1.1                       // going fast
      + (v.latG||0)*10                                  // leaning on the tyres
      + (S.drv.warn===2?26:S.drv.warn===1?11:0)         // a warning in the glass
      + (v.offEx?14:0)                                  // off in the rough
      + (S.night?5:0) + ((S.wx&&(S.wx.type==="fog"||S.wx.type==="snow"))?6:0);
    if(S.crashed) target=100;
    target=Math.max(0,Math.min(100,target));
    const rate=target>p.anx?dt*0.9:dt*0.35;             // fear spikes, calm returns slow
    p.anx+=(target-p.anx)*Math.min(1,rate);
    p.hr = Math.round(66 + p.anx*0.85 + Math.min(30,v.v*0.4));
    // conversation flow — no clock rushes it; the ride is as long as the talk.
    const busy = S.menuOpen || S.crashed;               // don't pop choices over a menu/crash card
    if(p.pending && S.t>=p.pendAt){                      // your reply has been read → they respond
      const nx=p.pending; p.pending=null; paxSayNode(nx);
    } else if(p.autoAt && S.t>=p.autoAt && !p.done && !busy){
      const nd=nodeOf(p); p.autoAt=0; if(nd&&nd.next) paxSayNode(nd.next,false);  // ramble flows on by itself
    } else if(p.repromptAt && S.t>=p.repromptAt && !p.done && !busy){
      paxSayNode(p.node, true);                          // you set it aside → they raise it again, gently
    } else if(!p.done && !p.pending && !p.repromptAt && !p.autoAt && p.choiceAt && S.t>=p.choiceAt){
      const nd=nodeOf(p);
      if(nd&&nd.choices&&nd.choices.length){
        if(!busy && !p.choicesShown){ showChoices(nd.choices); p.choicesShown=true; }
        else if(busy && p.choicesShown){ clearChoices(); p.choicesShown=false; }  // hide; re-arm when menu closes
      }
    }
  } else { clearChoices(); }
  // TRANSFER: no reverse in this car — coming to rest off the tarmac anywhere
  // in a rest-stop lot completes the exchange. Board a waiter, or let a rider
  // whose story is done step out.
  const rs=restStopNear(v.s);
  const edge=profAt(v.s).edge;
  // stops are always on the right now, and the apron reaches in past the kerb —
  // so easing toward the right edge and coasting to a stop is enough. No need to
  // plough deep into the rough.
  const offRoad=v.lane>edge-0.7;
  const stopped=v.v<1.3;
  if(rs && offRoad && stopped && (S._boardCool||0)<=0){
    if(!S.pax && rs.wait){ paxBoard(rs); }
    else if(S.pax && S.pax.done){ paxAlight(); }
  }
  /* THE SHOP. Sitting still on a fuel-stop apron puts a button on screen: there
     is a spinner rack by the till and it is the only reason anybody walks in. */
  const shopBtn=$("gasShopBtn");
  if(shopBtn) shopBtn.style.display=(rs && rs.rtype==="gas" && offRoad && stopped)? "block":"none";
}

/* ---- 5. WHERE THE STOPS ARE (scans the live road) ---------------------- */
function restStopNear(s){       // a building whose lot we're sitting in
  let best=null,bd=1e9;
  for(const seg of S.road.segs) for(const f of seg.feat){
    if(f.type!=="reststop") continue;
    const d=Math.abs(f.s-s); if(d<REST_ZONE && d<bd){ bd=d; best=f; }
  }
  return best;
}
function restStopAhead(s){       // nearest building in front — for the HUD
  let best=null,bd=1e9;
  for(const seg of S.road.segs) for(const f of seg.feat){
    if(f.type!=="reststop") continue;
    const d=f.s-s; if(d>-REST_ZONE && d<bd){ bd=d; best=f; }
  }
  return best?{f:best,dist:Math.max(0,bd)}:null;
}
const REST_LABEL={gas:"FUEL STOP",hospital:"CLINIC",food:"ROADSIDE DINER"};
const REST_ICON ={gas:"⛽",hospital:"✚",food:"🍔"};
function drawRestHUD(){
  const info=restStopAhead(S.veh.s); if(!info) return;

  const waiting=info.f.wait;
  const line1=(REST_ICON[info.f.rtype]||"▸")+" "+label+" · "+dstr;
  const line2=(waiting&&near)? "· SOMEONE IS WAITING ·" : "";

  ctx.font="bold 9px 'Courier New',monospace";  const w2=line2?ctx.measureText(line2).width:0;
  const w=Math.max(150, Math.max(w1,w2)+20);                   // fit the box to the text — no truncation
  ctx.fillStyle=near?(blink?"rgba(201,147,42,0.92)":"rgba(120,86,20,0.85)"):"rgba(20,22,26,0.82)";
  roundRect(lx,by-16,w,32,7);

    ctx.fillText(line2,lx+10,by+9); }

/* ---- 6. DRAWING: a person, and the one-building lots -------------------- */
function drawPerson(cx, baseY, ph, col, o){ o=o||{};
  const pw=ph*0.34;

  ctx.fillStyle="rgba(0,0,0,0.28)"; ctx.beginPath();

  ctx.strokeStyle=S.night?shade(col,0.35):col; ctx.lineWidth=Math.max(1.4,pw*0.22); ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(cx+pw*0.42,baseY-ph*0.78);
  if(o.wave){ const w=Math.sin(S.t*6)*0.18; ctx.lineTo(cx+pw*0.72,baseY-ph*(1.02+w)); }
  else ctx.lineTo(cx+pw*0.60,baseY-ph*0.5);

  if(o.bag){ ctx.fillStyle=S.night?"#20242a":"#4a4033"; roundRect(cx-pw*0.9,baseY-ph*0.55,pw*0.5,ph*0.4,pw*0.12); ctx.fill(); }
  ctx.restore();
}
// THE SIDING. The pull-off is drawn as real ground in renderWorld, not as
// billboards. This returns the paved width (in metres, to the RIGHT) at a given
// arclength: it ramps out of the shoulder before the stop, runs full past the
// building, then ramps back in — a little service road you can drive through and
// rejoin. Physics treats this width as pavement, so the drive-through is smooth.
const REST_SIDING_W = CFG.REST.SIDING_W;   // ← CFG.REST (kept as an alias for older call sites)
function sidingLaneAt(sPos){
  // THE SIDING IS A LANE. It tapers in and out with the apron geometry (so it
  // obeys the same seam/road-change rules as everything else), it sits outside
  // the driveable edge, and NO traffic ever targets it — profiles only publish
  // .own/.onc, and this is neither. It exists purely for pulling in.
  const w=restSidingW(sPos);
  if(w<2.2) return null;                       // too narrow to be a lane yet
  return edgeAt(sPos) + w*0.5;
}
function restSidingW(sPos){
  // The apron: a long, gentle entrance taper, a wide full-width run past the
  // building, and an unhurried exit. It used to open 28 m out and reach full
  // width only 10 m before the door — you were threading a needle at speed.
  const RS=CFG.REST;
  let best=0;
  for(const seg of S.road.segs) for(const f of seg.feat){
    if(f.type!=="reststop") continue;
    const d=sPos-f.s;                       // metres relative to the stop
    if(d<RS.IN || d>RS.OUT) continue;
    let w;
    if(d<RS.IN_FULL)       w=(d-RS.IN)/Math.max(1,(RS.IN_FULL-RS.IN));   // entrance taper
    else if(d<=RS.OUT_FULL) w=1;                                          // full width past the building
    else                    w=(RS.OUT-d)/Math.max(1,(RS.OUT-RS.OUT_FULL));// exit taper
    w=Math.max(0,Math.min(1,w))*RS.SIDING_W;
    if(w>best) best=w;
  }
  return best;
}

/* ============================ RENDER ==================================== */
const cv=$("cv"), ctx=cv.getContext("2d");
let W=0,H=0;
function resize(){ W=cv.width=cv.clientWidth; H=cv.height=cv.clientHeight; }
window.addEventListener("resize",resize);

/* ============ FILMIC LOOK — raw WebGL post pass (Settings > Game) =======
   Zero libraries, WebGL1, three hand-written shaders. The 2D canvas keeps
   rendering every frame exactly as before and keeps all pointer input;
   #glcv (pointer-events:none) sits on top and re-presents the finished
   frame through:
     scene -> bright-pass @ 1/2 res -> separable gaussian x2 (ping-pong)
           -> composite: warm bloom off the amber, ACES filmic tonemap,
             edge-only chromatic aberration, vignette, shadow-weighted grain.
   Gated on the GRAPHICS setting (off by default). Physics, input zones and
   the save format are untouched. No WebGL? gfxInit fails, GFX.fail latches,
   #glcv hides and the honest 2D canvas underneath just shows through.   */
const glcv=$("glcv");
const GFX={gl:null,fail:false,w:0,h:0};
const GFX_VS="attribute vec2 p;varying vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}";
const GFX_FS_BRIGHT=
 "precision mediump float;varying vec2 uv;uniform sampler2D t;"+
 "void main(){vec3 c=texture2D(t,uv).rgb;"+
 "float l=dot(c,vec3(.2126,.7152,.0722));"+
 "float k=smoothstep(.50,.90,l);"+                          // soft-knee highlight isolation
 "float warm=clamp(c.r-c.b,0.,1.);"+                          // amber/red elements bloom a touch more
 "gl_FragColor=vec4(c*k*(1.+warm*.35),1.);}";
const GFX_FS_BLUR=
 "precision mediump float;varying vec2 uv;uniform sampler2D t;uniform vec2 dir;"+
 "void main(){vec3 a=texture2D(t,uv).rgb*.227;"+
 "a+=(texture2D(t,uv+dir*1.384).rgb+texture2D(t,uv-dir*1.384).rgb)*.316;"+
 "a+=(texture2D(t,uv+dir*3.23).rgb+texture2D(t,uv-dir*3.23).rgb)*.07;"+
 "gl_FragColor=vec4(a,1.);}";
const GFX_FS_COMP=
 "precision mediump float;varying vec2 uv;"+
 "uniform sampler2D scene;uniform sampler2D bloom;uniform float time;uniform float bloomAmt;uniform float grainAmt;uniform float aberrAmt;"+
 "vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.19*x+.43)+.14),0.,1.);}"+  // filmic highlight rolloff
 "void main(){"+
 "vec2 cc=uv*2.-1.;float r2=dot(cc,cc);"+
 "vec2 off=cc*r2*aberrAmt;"+                           // radial chromatic aberration: nil centre, a hint at the edges
 "vec3 col;"+
 "col.r=texture2D(scene,uv+off).r;"+
 "col.g=texture2D(scene,uv).g;"+
 "col.b=texture2D(scene,uv-off).b;"+
 "col+=texture2D(bloom,uv).rgb*vec3(1.,.9,.72)*bloomAmt;"+                            // warm bloom off the amber dash
 "col=aces(col*1.08);"+                            // slight exposure lift, then filmic tonemap
 "float lum=dot(col,vec3(.2126,.7152,.0722));"+
 "col=mix(vec3(lum),col,1.08);"+                            // restore a little saturation post-tonemap
 "col*=1.-.28*r2;"+                            // vignette
 "float n=fract(sin(dot(uv*vec2(429.,311.)+time,vec2(12.99,78.23)))*43758.5453);"+
 "col+=(n-.5)*grainAmt*(1.-.75*lum);"+                            // film grain, weighted into the shadows
 "gl_FragColor=vec4(clamp(col,0.,1.),1.);}";
function gfxCompile(gl,type,src){
  const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.warn("gfx shader:",gl.getShaderInfoLog(s));return null;}
  return s;
}
function gfxProg(gl,fsSrc){
  const vs=gfxCompile(gl,gl.VERTEX_SHADER,GFX_VS), fs=gfxCompile(gl,gl.FRAGMENT_SHADER,fsSrc);
  if(!vs||!fs)return null;
  const pr=gl.createProgram();gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){console.warn("gfx link:",gl.getProgramInfoLog(pr));return null;}
  pr.u={};for(const n of ["t","dir","scene","bloom","time","night","res","bloomAmt","grainAmt","aberrAmt"])pr.u[n]=gl.getUniformLocation(pr,n);
  pr.aP=gl.getAttribLocation(pr,"p");
  return pr;
}
function gfxTex(gl,w,h){
  const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  if(w)gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  return t;
}
function gfxInit(){
  if(GFX.fail)return false;
  const gl=glcv.getContext("webgl",{alpha:false,antialias:false,depth:false,stencil:false})
        ||glcv.getContext("experimental-webgl",{alpha:false});
  if(!gl){GFX.fail=true;return false;}
  GFX.gl=gl;
  GFX.pBright=gfxProg(gl,GFX_FS_BRIGHT);
  GFX.pBlur=gfxProg(gl,GFX_FS_BLUR);
  GFX.pComp=gfxProg(gl,GFX_FS_COMP);
  if(!GFX.pBright||!GFX.pBlur||!GFX.pComp){GFX.fail=true;GFX.gl=null;return false;}
  GFX.buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,GFX.buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW); // fullscreen triangle
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  gl.disable(gl.DEPTH_TEST);gl.disable(gl.BLEND);
  GFX.scene=gfxTex(gl,0,0);
  GFX.w=GFX.h=0;                                            // force FBO alloc on first frame
  return true;
}
function gfxResize(){
  const gl=GFX.gl;if(!gl)return;
  glcv.width=W;glcv.height=H;GFX.w=W;GFX.h=H;
  GFX.hw=Math.max(1,W>>1);GFX.hh=Math.max(1,H>>1);
  for(const k of ["fboA","fboB"]){
    if(GFX[k]){gl.deleteFramebuffer(GFX[k].fb);gl.deleteTexture(GFX[k].tex);}
    const tex=gfxTex(gl,GFX.hw,GFX.hh), fb=gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
    GFX[k]={fb,tex};
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
}
function gfxDraw(pr){
  const gl=GFX.gl;
  gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER,GFX.buf);
  gl.enableVertexAttribArray(pr.aP);
  gl.vertexAttribPointer(pr.aP,2,gl.FLOAT,false,0,0);
  gl.drawArrays(gl.TRIANGLES,0,3);
}
function gfxFrame(){
  // Filmic post pass, gated on the GRAPHICS setting. When off the overlay stays
  // hidden and the crisp 2D canvas shows through directly. (On by default.)
  if(!S.gfx){ if(glcv.style.display!=="none") glcv.style.display="none"; return; }
  if(GFX.fail){ if(glcv.style.display!=="none") glcv.style.display="none"; return; }
  let gl=GFX.gl;
  if(!gl){ if(!gfxInit()){ glcv.style.display="none"; return; } gl=GFX.gl; }
  if(!W||!H)return;
  if(GFX.w!==W||GFX.h!==H)gfxResize();
  // 1) upload the finished 2D frame
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,GFX.scene);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,cv);
  // 2) bright pass at half res
  gl.bindFramebuffer(gl.FRAMEBUFFER,GFX.fboA.fb);
  gl.viewport(0,0,GFX.hw,GFX.hh);
  gl.useProgram(GFX.pBright);gl.uniform1i(GFX.pBright.u.t,0);
  gfxDraw(GFX.pBright);
  // 3) ping-pong gaussian, radius widening
  gl.useProgram(GFX.pBlur);gl.uniform1i(GFX.pBlur.u.t,0);
  for(let i=0;i<2;i++){
    const rr=1+i*1.6;
    gl.bindFramebuffer(gl.FRAMEBUFFER,GFX.fboB.fb);
    gl.bindTexture(gl.TEXTURE_2D,GFX.fboA.tex);
    gl.useProgram(GFX.pBlur);gl.uniform2f(GFX.pBlur.u.dir,rr/GFX.hw,0);gfxDraw(GFX.pBlur);
    gl.bindFramebuffer(gl.FRAMEBUFFER,GFX.fboA.fb);
    gl.bindTexture(gl.TEXTURE_2D,GFX.fboB.tex);
    gl.uniform2f(GFX.pBlur.u.dir,0,rr/GFX.hh);gfxDraw(GFX.pBlur);
  }
  // 4) composite to screen
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,W,H);
  gl.useProgram(GFX.pComp);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,GFX.scene);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,GFX.fboA.tex);
  gl.uniform1i(GFX.pComp.u.scene,0);gl.uniform1i(GFX.pComp.u.bloom,1);
  gl.uniform1f(GFX.pComp.u.time,S.t%37);
  gl.uniform1f(GFX.pComp.u.bloomAmt,S.gfxBloom==null?0.38:S.gfxBloom);
  gl.uniform1f(GFX.pComp.u.grainAmt,S.gfxGrain==null?0.045:S.gfxGrain);
  // chromatic aberration is hidden by default; a crash slams it to max and it
  // bleeds back to zero over half a minute. (Was 120 s — the fringing outlived
  // the crash by so long it read as a permanent rendering fault, not a hit.)
  const baseAb=S.gfxAberr==null?0:S.gfxAberr;
  const CA_MAX=0.006, CA_DECAY=CFG.CAM.caDecay;
  const crashAb=(S._crashCAt!=null)? Math.max(0, CA_MAX*(1-(S.t-S._crashCAt)/CA_DECAY)) : 0;
  gl.uniform1f(GFX.pComp.u.aberrAmt, baseAb + crashAb);
  gfxDraw(GFX.pComp);
  if(glcv.style.display!=="block") glcv.style.display="block";   // reveal only once a real frame is composited
  gl.bindTexture(gl.TEXTURE_2D,null);                        // unbind unit 1: never leave an FBO tex
  gl.activeTexture(gl.TEXTURE0);                             // bound while we render INTO it next frame
}
glcv.addEventListener("webglcontextlost",e=>{e.preventDefault();GFX.gl=null;});
glcv.addEventListener("webglcontextrestored",()=>{GFX.fail=false;GFX.gl=null;gfxInit();});

/* ===================== SOUND — procedural Web Audio ======================
   Zero samples, zero libraries: the whole soundscape is synthesized from the
   same state the physics writes every substep.
   - EXHAUST: ENGINE-ORDER additive synthesis. A four-stroke four fires each
     cylinder once per two crank revolutions, so its spectrum lives on engine
     orders — multiples of HALF the crank frequency. One band-limited
     PeriodicWave oscillator runs at the 0.5-order fundamental (rpm/120 Hz, the
     full 720° cycle); harmonic k of that wave is engine order k/2, so harmonic
     4 is the firing note (2nd order, loudest), 8/12/16 are the 4th/6th/8th
     orders that fill the body, and the odd + half harmonics sit lower for the
     burble. A COMBUSTION TEXTURE — noise gated by a narrow pulse at the firing
     rate — adds the grit of discrete burns (a chuff at idle that fuses into a
     growl up top). Throttle drives a soft-clip stage into a muffler LP; a
     highpass bleeds the subsonic 0.5/1st orders. RPM/pedal come from S.eng/S.drv.
   - TURBO: white noise band-passed up the tach — intake hiss follows boost
     (louder with the open King Cobra intake fitted), a narrow high-Q whistle
     rides on top, and lifting off above ~0.7 bar gives the soft, dark chuff
     of the RECIRCULATING bypass valve dumping charge back to the intake —
     Trionic cars don't vent to atmosphere, so there's no blow-off 'tsssh'.
   - ROAD: noise voiced by the contact calculations. Clean tarmac whirs
     smooth and low; gravel, dirt and snow get a 24 Hz random clump; rain
     adds wet hiss; black ice (icePatchAt) fades it to a whisper.
   - TIRES: slip (v.slip wheelspin flag, driftYaw) drives a stick-slip squeal
     on tarmac — a low, rough scrub (core ~380-720 Hz, noise-dominated) that
     chirps on momentary spikes and growls when held sideways, judder-broken so
     it never sits on a dead whistle — and converts to scrabble on loose stuff.
   Toggle: CONFIG ▸ GAME. The context is born on the first user gesture
   (autoplay law); S.snd rides in the save code.                          */
const SND={ctx:null,on:false};
function sndCurveCrush(){ // gentle tanh warmth with a trace of grain — muffler, not a fuzz pedal
  const N=4096, c=new Float32Array(N);
  for(let i=0;i<N;i++){ const x=i/(N-1)*2-1, y=Math.tanh(x*1.25);
    const stair=Math.round(y*64)/64;          // fine steps: subtle texture, no chiptune stairs
    c[i]=y*0.86+stair*0.14; }                 // almost entirely smooth saturation
  return c;
}
function sndNoise(ctx){ const b=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
  const d=b.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=ctx.createBufferSource(); src.buffer=b; src.loop=true; src.start(); return src;
}
function sndCabinIR(ctx){ // ~140 ms dark exponential-decay stereo impulse: the
  const sr=ctx.sampleRate, len=Math.floor(sr*0.14);          // cabin, not a hall
  const b=ctx.createBuffer(2,len,sr);
  for(let ch=0;ch<2;ch++){ const d=b.getChannelData(ch);
    let lp=0;                                                 // one-pole LP = soft, boxy tail
    for(let i=0;i<len;i++){ const env=Math.pow(1-i/len,2.4);
      lp+=((Math.random()*2-1)-lp)*0.28; d[i]=lp*env*(ch?0.92:1); } }
  return b;
}
function sndInit(){
  if(SND.ctx) return true;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
  const ctx=SND.ctx=new AC();
  const t=ctx.currentTime;
  // master bus -> limiter -> out. The limiter is the real fidelity win: peaks
  // (bypass chuff, contact thuds, full-boost hiss stacking on the exhaust) used to
  // clip the destination and mush the quiet detail. A gentle brickwall keeps
  // headroom so the two-tone burble stays legible under everything else.
  const master=SND.master=ctx.createGain(); master.gain.value=0;
  const limit=SND.limit=ctx.createDynamicsCompressor();
  limit.threshold.value=-8; limit.knee.value=6; limit.ratio.value=12;
  limit.attack.value=0.003; limit.release.value=0.12;
  master.connect(limit); limit.connect(ctx.destination);
  // MUSIC BUS: the score sits on its own path straight to the limiter, NOT
  // through master — so ENGINE AUDIO and MUSIC toggle independently. A gentle
  // shared lowpass keeps it soft under the cabin, and its gain is the on/off.
  const musicBus=SND.musicBus=ctx.createGain(); musicBus.gain.value=(S.music===false?0:0.5);
  const musicLP=SND.musicLP=ctx.createBiquadFilter(); musicLP.type="lowpass"; musicLP.frequency.value=4200; musicLP.Q.value=0.5; // a touch of lo-fi warmth
  // ...and its OWN limiter to the destination. Both paths used to land on the
  // same brickwall (-8 dB, 12:1, 3 ms attack), which made the engine an
  // accidental sidechain: every throttle stab and every brake bog pumped the
  // whole score down. Turning engine audio on effectively gated the music.
  // Separate limiters mean the two can share a speaker without fighting.
  const mLimit=SND.mLimit=ctx.createDynamicsCompressor();
  mLimit.threshold.value=-5; mLimit.knee.value=8; mLimit.ratio.value=4;
  mLimit.attack.value=0.012; mLimit.release.value=0.22;
  musicLP.connect(musicBus); musicBus.connect(mLimit); mLimit.connect(ctx.destination);
  // CHILLWAVE FX ---------------------------------------------------------
  // (1) a slow BREATHING lowpass the pad lives behind — an LFO drifts the
  //     cutoff, and its base opens as you drive faster (energy = brightness).
  const padLP=SND.padLP=ctx.createBiquadFilter(); padLP.type="lowpass"; padLP.frequency.value=800; padLP.Q.value=0.9;
  padLP.connect(musicLP);
  const padLFO=ctx.createOscillator(); padLFO.type="sine"; padLFO.frequency.value=0.055; // ~18 s breath
  const padLFOg=ctx.createGain(); padLFOg.gain.value=480;
  padLFO.connect(padLFOg); padLFOg.connect(padLP.frequency); padLFO.start();
  // (2) a tempo-synced FEEDBACK DELAY for the lead — that washed, nostalgic echo.
  const dly=SND.mDelay=ctx.createDelay(1.0); dly.delayTime.value=0.34;
  const dfb=SND.mDelayFb=ctx.createGain(); dfb.gain.value=0.34;
  const dwet=ctx.createGain(); dwet.gain.value=0.55;
  dly.connect(dfb); dfb.connect(dly); dly.connect(dwet); dwet.connect(musicLP);
  // reusable noise for the soft kit (snare/hats sample fresh sources off this)
  SND.nbuf=(function(){ const b=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
    const d=b.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1; return b; })();
  SND.music={step:0, nextT:0, bar:0};                          // sequencer state
  // cabin reverb send: a short dark IR on the exhaust+road buses only (the dry
  // turbo/tire bands stay present). Tiny wet — space, not wash.
  const revEnabled=typeof ctx.createConvolver==="function";
  let revSend=null;
  if(revEnabled){ const conv=ctx.createConvolver(); conv.buffer=sndCabinIR(ctx);
    const revWet=SND.revWet=ctx.createGain(); revWet.gain.value=0.10;
    revSend=SND.revSend=ctx.createGain(); revSend.gain.value=1;
    revSend.connect(conv); conv.connect(revWet); revWet.connect(master);  // under master: park/mute silences the wet too
  }
  // ---- exhaust: ENGINE-ORDER additive osc -> drive -> crush -> muffler LP ----
  // Rebuilt from the acoustics rather than a stack of detuned sawtooths (which
  // just piled every osc's full harmonic series up high — that was the buzz).
  // A four-stroke four fires each cylinder once per TWO crank revolutions, so
  // its spectrum lives on ENGINE ORDERS: sinusoids at multiples of half the
  // crank frequency. The firing note is the 2nd order (two cylinders fire per
  // rev); its harmonics (4th, 6th, 8th…) carry the body, and the HALF-orders
  // (0.5, 1.5, 2.5…) — born of cylinder-to-cylinder unevenness — are the lope.
  // So we drive ONE band-limited PeriodicWave oscillator at the 0.5-order
  // fundamental (rpm/120 Hz = one full 720° cycle) and let harmonic k of the
  // wave BE engine order k/2. Harmonic 4 (=2nd order, the firing note) is the
  // loudest; even harmonics 8/12/16 (4th/6th/8th orders) fill in; the odd and
  // half harmonics sit lower for the burble. One oscillator, zero aliasing.
  //   n%4==0 -> firing family (orders 2,4,6…)  : loud, gentle rolloff
  //   n%2==0 -> odd integer orders (1,3,5…)     : mid  (rotational/inertial)
  //   else    -> half orders (0.5,1.5,2.5…)     : quiet (the uneven-fire lope)
  const NH=64, wRe=new Float32Array(NH+1), wIm=new Float32Array(NH+1);
  for(let n=1;n<=NH;n++){ const order=n/2; let a;
    if(n%4===0)      a=1.00*Math.pow(2/order,   0.82);   // 2nd-order firing + its harmonics
    else if(n%2===0) a=0.32*Math.pow(1/order,   0.90);   // odd integer orders
    else             a=0.13*Math.pow(0.5/order, 0.72);   // half orders — the lope
    wIm[n]=a;                                            // sine phase: 4 firing pulses per cycle
  }
  const engWave=ctx.createPeriodicWave(wRe,wIm,{disableNormalization:false});
  const drive=SND.drive=ctx.createGain(); drive.gain.value=1.5;
  const clip=ctx.createWaveShaper(); clip.curve=sndCurveCrush(); clip.oversample="2x"; // 2x tames the alias fizz that read as "retro"; crunch now comes from saturation, not aliasing
  // subsonic trap: the 0.5/1st orders sit at ~4–14 Hz at idle — inaudible cone
  // flap and headroom waste. Bleed them; the firing order (28 Hz idle, up) stays.
  const exHP=SND.exHP=ctx.createBiquadFilter(); exHP.type="highpass"; exHP.frequency.value=34; exHP.Q.value=0.5;
  const muff=SND.muff=ctx.createBiquadFilter(); muff.type="lowpass"; muff.frequency.value=420; muff.Q.value=0.6;
  const exGain=SND.exGain=ctx.createGain(); exGain.gain.value=0;
  drive.connect(clip); clip.connect(exHP); exHP.connect(muff); muff.connect(exGain); exGain.connect(master);
  if(revSend) exGain.connect(revSend);
  const engOsc=SND.engOsc=ctx.createOscillator(); engOsc.setPeriodicWave(engWave);
  const engG=SND.engG=ctx.createGain(); engG.gain.value=0.9;
  engOsc.connect(engG); engG.connect(drive); engOsc.start();
  // COMBUSTION TEXTURE: a band of noise gated by a narrow pulse at the FIRING
  // rate. This is the grit of discrete combustion events — a "chuff-chuff" at
  // idle that fuses into a growl as the pulses run together up the tach. A pure
  // additive tone alone sounds electronic; the pulsed noise is what reads as
  // burning fuel. The pulse osc (cosines in phase = one spike per firing) drives
  // the noise gain; depth is set live from load in sndFrame.
  const pRe=new Float32Array(9), pIm=new Float32Array(9);
  for(let k=1;k<=8;k++) pRe[k]=Math.pow(0.86,k-1);        // in-phase cosines -> a narrow positive spike/cycle
  const combWave=ctx.createPeriodicWave(pRe,pIm,{disableNormalization:false}); // normalized: peak ~1 -> AM depth == combDepth
  const combOsc=SND.combOsc=ctx.createOscillator(); combOsc.setPeriodicWave(combWave);
  const combDepth=SND.combDepth=ctx.createGain(); combDepth.gain.value=0.0; // pulse amplitude -> AM depth (live)
  const combAM=SND.combAM=ctx.createGain(); combAM.gain.value=0.0;          // noise rides through here, gated by the pulse
  combOsc.connect(combDepth); combDepth.connect(combAM.gain); combOsc.start();
  // combustion noise gets its own source so the exhaust tone stays clean
  const combNoise=sndNoise(ctx);
  const combBP=SND.combBP=ctx.createBiquadFilter(); combBP.type="bandpass"; combBP.frequency.value=900; combBP.Q.value=0.8;
  combNoise.connect(combAM); combAM.connect(combBP); combBP.connect(drive);
  // idle-lope jitter: a slow LFO detunes the whole note a few cents so it
  // breathes at low rpm instead of sitting on a dead-perfect pitch
  const lfo=SND.lopeLFO=ctx.createOscillator(); lfo.type="triangle"; lfo.frequency.value=7.5;
  const lfoG=SND.lopeG=ctx.createGain(); lfoG.gain.value=0;
  lfo.connect(lfoG); lfoG.connect(engOsc.detune); lfo.start();
  // ---- turbo: hiss band + whistle band + bypass-valve chuff ----
  const noise=SND.noise=sndNoise(ctx);
  const mkPan=p=>{ if(typeof ctx.createStereoPanner!=="function") return null;
    const n=ctx.createStereoPanner(); n.pan.value=p; n.connect(master); return n; };
  const hissBP=SND.hissBP=ctx.createBiquadFilter(); hissBP.type="bandpass"; hissBP.frequency.value=1200; hissBP.Q.value=0.7;
  const hiss=SND.hiss=ctx.createGain(); hiss.gain.value=0;
  const hissPan=mkPan(0.28);                                 // intake sits right of centre
  noise.connect(hissBP); hissBP.connect(hiss); hiss.connect(hissPan||master);
  const whisBP=SND.whisBP=ctx.createBiquadFilter(); whisBP.type="bandpass"; whisBP.frequency.value=3200; whisBP.Q.value=14;
  const whis=SND.whis=ctx.createGain(); whis.gain.value=0;
  const whisPan=mkPan(0.34);                                 // whistle tracks the hiss
  noise.connect(whisBP); whisBP.connect(whis); whis.connect(whisPan||master);
  // Saab runs a RECIRCULATING bypass valve, not an atmospheric blow-off. The
  // charge is dumped back upstream of the compressor, so there's no bright
  // "tsssh" — just a soft, dark, contained chuff as the compressor unloads
  // (stock, it's nearly silent). Low bandpass, low gain, a gentle downward
  // drift as pressure bleeds off, muffled by the intake tract it vents into.
  const bpvBP=SND.bpvBP=ctx.createBiquadFilter(); bpvBP.type="bandpass"; bpvBP.frequency.value=460; bpvBP.Q.value=0.9;
  const bpvLP=SND.bpvLP=ctx.createBiquadFilter(); bpvLP.type="lowpass"; bpvLP.frequency.value=900; bpvLP.Q.value=0.5;
  const bpv=SND.bpv=ctx.createGain(); bpv.gain.value=0;
  noise.connect(bpvBP); bpvBP.connect(bpvLP); bpvLP.connect(bpv); bpv.connect(master);
  if(revSend) bpv.connect(revSend);                          // the chuff lives in the cabin too
  // ---- road: surface noise ----
  const roadLP=SND.roadLP=ctx.createBiquadFilter(); roadLP.type="lowpass"; roadLP.frequency.value=300; roadLP.Q.value=0.4;
  const road=SND.road=ctx.createGain(); road.gain.value=0;
  noise.connect(roadLP); roadLP.connect(road); road.connect(master);
  if(revSend) road.connect(revSend);
  // ---- tires: saw + noise through swept bands = scrub/chirp/squeal ----
  // Tire squeal is stick-slip self-excitation: its energy lives LOW (a core
  // around 500–800 Hz with a rougher formant above it), and it's mostly noisy
  // scrub — not a clean high whistle. The old voice sat ~1 kHz with a 2.6×
  // formant that swept toward ~4.5 kHz: a dog-whistle, not rubber. Dropped the
  // whole thing an octave-ish, widened the bands (lower Q = more scrub, less
  // tone), and tucked the sawtooth UNDER the noise so it reads as rubber.
  const sqOsc=SND.sqOsc=ctx.createOscillator(); sqOsc.type="sawtooth"; sqOsc.frequency.value=520; sqOsc.start();
  const sqOscG=ctx.createGain(); sqOscG.gain.value=0.55;    // tonal core sits beneath the scrub noise
  const sqBP=SND.sqBP=ctx.createBiquadFilter(); sqBP.type="bandpass"; sqBP.frequency.value=560; sqBP.Q.value=5.5; // lower, wider core
  const sqBP2=SND.sqBP2=ctx.createBiquadFilter(); sqBP2.type="bandpass"; sqBP2.frequency.value=1150; sqBP2.Q.value=8; // rough upper formant, no longer a shriek
  const sqBP2g=ctx.createGain(); sqBP2g.gain.value=0.42;
  const sq=SND.sq=ctx.createGain(); sq.gain.value=0;
  const sqNg=ctx.createGain(); sqNg.gain.value=0.95;        // broadband scrub noise dominates the tone
  const sqPan=SND.sqPan=mkPan(0);                            // pans toward the sliding front
  sqOsc.connect(sqOscG); sqOscG.connect(sqBP); noise.connect(sqNg); sqNg.connect(sqBP); sqBP.connect(sq);
  sqOscG.connect(sqBP2); sqNg.connect(sqBP2); sqBP2.connect(sqBP2g); sqBP2g.connect(sq);
  sq.connect(sqPan||master);
  // stick-slip judder: slow filtered noise drives the squeal's own gain so it
  // stutters and breaks up instead of holding a dead-steady whistle. Depth live.
  const sqRoughLP=ctx.createBiquadFilter(); sqRoughLP.type="lowpass"; sqRoughLP.frequency.value=65; sqRoughLP.Q.value=0.5;

function sndFrame(){
  if(!SND.on||!SND.ctx||S.snd===false) return;
  const ctx=SND.ctx;
  if(audioParked()) return;                         // backgrounded OR unfocused: don't touch gains (road/rain bed included), stay parked
  if(ctx.state==="suspended"){ctx.resume&&ctx.resume();return;}
  const t=ctx.currentTime, v=S.veh, e=S.eng, d=S.drv;
  const rpm=Math.max(600,e.rpm||850), pedal=Math.max(0,Math.min(1,d.pedal||0));
  const rpmN=Math.min(1,rpm/6200), vN=Math.min(1,v.v/45);
  // exhaust: one engine-order oscillator at the 0.5-order fundamental (the full
  // 720° cycle) carries every order at once; harmonic 4 IS the firing note.
  const f=rpm/30;                                            // 2nd-order firing Hz (reference)
  SND.engOsc.frequency.setTargetAtTime(rpm/120, t,0.03);     // 0.5-order fundamental -> firing lands on harmonic 4
  // COMBUSTION TEXTURE: pulse the noise at the firing rate. Depth is loudest at
  // idle/low rpm (you hear each event) and under load (harder burn); it recedes
  // relative to the tone up top as the pulses fuse into a continuous growl.
  // BRAKE BOG — declared HERE, above every consumer. It was defined further

  // its temporal dead zone, so sndFrame threw a ReferenceError on EVERY frame
  // and the engine never made a sound at all. That was the "still no audio".

  const bog=Math.max(0, Math.min(1, brkS*1.5 - (Number(pedal)||0)*0.9)) || 0;
  if(SND.combOsc) SND.combOsc.frequency.setTargetAtTime(f, t,0.03);
  if(SND.combDepth){ const grit=(0.9-rpmN*0.45)*(0.5+pedal*0.7)*(1+0.60*bog);   // labouring, not revving
    SND.combDepth.gain.setTargetAtTime(grit, t,0.06); }
  if(SND.combBP) SND.combBP.frequency.setTargetAtTime(700+pedal*700+rpmN*500, t,0.06);

  // When the brakes are beating the engine the note should LOAD UP and go dull
  // — the sound of a motor being dragged down rather than driving the car.
  // This is the audible half of "lift now": you hear the fight before the
  // needle shows it, which is the cue that matters at speed. It keys off the
  // brake actually applied minus whatever throttle is arguing back, so
  // trailing the pedal in cleans the note up again.

    SND.lopeG.gain.setTargetAtTime(9*lope, t,0.12); }        // up to ~9 cents wobble at idle

  const duck=(S.menuOpen?0.35:1)*(S.wreck?0.25:1);
  SND.exGain.gain.setTargetAtTime((0.014+pedal*0.034+rpmN*0.016)*(1+0.22*bog)*duck, t,0.06); // leans forward a touch — the tone does the work, not the level
  // turbo: hiss with boost, louder through the open intake; whistle up the tach

  const intakeK=S.parts.intake?1.5:1;
  SND.hissBP.frequency.setTargetAtTime(900+boostN*3600+rpmN*800, t,0.06);
  SND.hiss.gain.setTargetAtTime(Math.pow(boostN,1.4)*0.21*intakeK*duck, t,0.06);
  SND.whisBP.frequency.setTargetAtTime(2400+rpmN*4600+boostN*1600, t,0.05);
  SND.whis.gain.setTargetAtTime(boostN*boostN*0.07*intakeK*duck, t,0.05);

  // but never the aftermarket "tsssh". Scales with how much boost was dumped.

    const g=(0.05+vent*0.10)*(S.parts.intake?1.35:1)*duck;   // quiet: recirc, not BOV

  SND.road.gain.setTargetAtTime(rGain*duck, t, (loose||snow)?0.015:0.08);

  // on the loose stuff slip is scrabble (already in the clump), on ice silence

  // and it climbs far less with speed so a fast slide growls instead of screaming.

  SND.sqOsc.frequency.setTargetAtTime(sqF, t,0.012);         // faster tracking lets the warble breathe
  SND.sqBP.frequency.setTargetAtTime(sqF*1.05, t,0.012);
  if(SND.sqBP2) SND.sqBP2.frequency.setTargetAtTime(sqF*1.9+(Math.random()-0.5)*300, t,0.012); // rough upper formant, own jitter
  SND.sq.gain.setTargetAtTime(sqG*duck, t, sqG>SND._lastSq?0.03:0.10); // fast attack chirps, slow release cries
  if(SND.sqRough) SND.sqRough.gain.setTargetAtTime(sqG*duck*0.8, t,0.03); // judder depth scales with the squeal (deeper stick-slip break-up)
  if(SND.sqPan) SND.sqPan.pan.setTargetAtTime(Math.max(-0.6,Math.min(0.6,(v.driftYaw||0)*2.2)), t,0.08);

/* ===================== MUSIC — procedural chillwave score ================

   loop (Fmaj7–G7–Em7–Am7 — the lush IVmaj7–V7–iiim7–vim7 turnaround behind a
   thousand city-pop and chillwave records) with proper voice-leading in the
   pad (common tones held, the rest stepping), voiced by:

     the wide, warm, drifting bed.
   - BASS: laid-back triangle — root, then octave and fifth off the beat.
   - DRUMS: soft SINE KICK on 1 & 3 and a reverby noise SNARE on the backbeat
     (2 & 4) — relaxed, not four-on-the-floor — with hats that bloom with speed.
   - LEAD: a sparse, vibrato'd triangle melody that outlines each chord and runs
     into a tempo-synced FEEDBACK DELAY for that washed, nostalgic echo.
   Lookahead scheduler; the arrangement is EMERGENT — it reads live car state and
   the build, and gates each layer behind a different channel so the score writes
   itself as you drive:
     - TEMPO + hats + groove bass  <- road SPEED  (~60 BPM at rest -> ~120+ flat-out)
     - ARP sequence (density/brightness) <- engine RPM (idle -> redline)
     - sub octave + detuned power stabs  <- BOOST (this turbo's own ceiling)
     - four-on-the-floor + ride shimmer  <- combined ENERGY of all three
     - TIMBRE/brightness (soft triangle -> hard saw) <- the SETUP (tune stage +

  {bass:40, up:[55,59,62]},   // Em7   — E2 · G3 B3 D4   (B,D held from G7)

const M_STYLES=[
  {id:0, nm:"CHILLWAVE",       sub:"The original: a laid-back \u201cRoyal Road\u201d loop \u2014 detuned-saw pads behind a breathing filter, a soft backbeat and a dreamy vibrato lead. Only tempo and brightness follow road speed. Calm."},
  {id:1, nm:"NIGHT DRIVE",     sub:"Emergent and moody: an arp emerges with revs, detuned power stabs come in on boost, and a driving kit fills toward four-on-the-floor as speed, rpm and boost stack up. Your build hardens the palette."},
  {id:2, nm:"TOUGE EUROBEAT",  sub:"Full send: a fast four-on-the-floor with a rolling octave bassline, offbeat open hats and bright super-saw stabs. Tempo climbs toward ~160 BPM flat-out. The mountain-pass special."},

  if(o.bp){ const f=ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.value=o.bp; f.Q.value=o.bpQ||1.2; node.connect(f); node=f; }

  const det=0.94+Math.random()*0.12;                           // every horn its own voice
  const vol=0.20*(1-Math.min(0.85,gap/240))+0.05;              // closer is louder

  const beeps = r<0.40? [[0,0.9]] : r<0.75? [[0,0.16],[0.26,0.34]] : [[0,0.3]];

    const o=ctx.createOscillator(), g=ctx.createGain();

    o.frequency.setValueAtTime(fq*det*1.06,t);                 // Doppler: sharp coming,
    o.frequency.setValueAtTime(fq*det*1.06,t+tMeet);           // flat going
    o.frequency.linearRampToValueAtTime(fq*det*0.90,t+tMeet+0.22);
    for(const [on,len] of beeps){

function drawSpeedBolt(){
  // Over the bolt threshold the sky starts objecting. A jagged fork, thrown
  // roughly once a second, with a frame of sheet-flash behind it. Purely
  // theatre — it touches nothing physical, and it stops the instant you lift.
  const F=CFG.SPEEDFX, v=S.veh, mph=v.v*2.23694;
  if(mph<F.boltMph){ S._bolt=null; return; }
  const over=Math.min(1,(mph-F.boltMph)/40);
  // Roll the NEXT interval once, when the bolt is made. Re-rolling it every
  // frame meant the strike fired on whichever frame drew the smallest number,
  // which is a race, not a rate — it came out at nearly double boltHz.
  if(!S._bolt || S.t>=S._bolt.next){
    const gap=(0.45+Math.random()*1.25)/Math.max(0.2,F.boltHz*(0.65+0.5*over));
    S._bolt={t:S.t, next:S.t+gap, x:W*(0.12+Math.random()*0.76),
             seed:Math.random()*1000, life:0.16+Math.random()*0.12};
  }
  const b=S._bolt, age=S.t-b.t;
  if(age>b.life) return;
  const k=1-age/b.life;
  ctx.save();
  ctx.fillStyle="rgba(214,232,255,"+(0.16*k*over).toFixed(3)+")";   // sheet flash
  ctx.fillRect(0,0,W,H*0.62);
  ctx.strokeStyle="rgba(238,246,255,"+(0.95*k).toFixed(2)+")";
  ctx.lineWidth=Math.max(1.4,W*0.004); ctx.shadowColor="#bcd8ff"; ctx.shadowBlur=18;
  let x=b.x, y=0; const yEnd=H*(0.30+0.16*Math.random());
  ctx.beginPath(); ctx.moveTo(x,y);
  let n=0;
  while(y<yEnd && n++<14){

    x += (Math.sin(b.seed+n*2.3)*0.5)*W*0.075;
    ctx.lineTo(x,y);

  ctx.stroke();
  ctx.lineWidth=Math.max(0.8,W*0.0018); ctx.strokeStyle="rgba(255,255,255,"+(0.8*k).toFixed(2)+")";
  ctx.stroke();
  ctx.restore();
}

  else if(wx==="overcast"||wx==="rain"){ sky.addColorStop(0,wx==="rain"?"#232a35":"#39424f");

  else if(wx==="fog"){ sky.addColorStop(0,"#8b93a0"); sky.addColorStop(1,"#b7bcc2"); }
  else if(wx==="snow"){ sky.addColorStop(0,"#5b6572"); sky.addColorStop(1,"#9aa2ac"); }

  if(S.night){
    ctx.fillStyle="rgba(220,230,255,0.5)";
    const starBand=Math.max(40,H*0.34);   // FIXED field: the bobbing horizon must not re-hash star rows
    for(let i=0;i<40;i++){const px=(((i*197-par*0.9)%W)+W)%W, py=(i*89)%starBand;
      if(py<horizon-4)ctx.fillRect(px,py,1.5,1.5);}

      const sun=ctx.createRadialGradient(sunX,horizon,4,sunX,horizon,W*0.36);

  // clouds: soft parallax banks, weather-graded, sharing the ridges' heading

  // under the ridges (hills clip their feet) and under the ground/road/traffic.
  if(wx!=="fog"){
    const overcast=(wx==="overcast"||wx==="rain");
    const nC=overcast?7:5;
    const span=W+560;
    const topC=S.night?"rgba(122,132,150,":overcast?"rgba(66,72,80,":wx==="heat"?"rgba(228,208,182,":wx==="snow"?"rgba(206,212,220,":"rgba(234,238,244,";
    const botC=S.night?"rgba(52,60,74,":overcast?"rgba(40,45,52,":wx==="heat"?"rgba(150,120,96,":wx==="snow"?"rgba(150,158,168,":"rgba(150,164,182,";

      const cy=horizon - H*(0.20+((hh>>>4&63)/63)*0.22);

  ctx.fillStyle=ridgeFar;

  for(let x=0;x<=W;x+=40){ ctx.lineTo(x,horizon+2-26-16*Math.sin((x+par*0.55)*0.0055)); }

  ctx.beginPath(); ctx.moveTo(0,horizon+2);
  for(let x=0;x<=W;x+=32){ ctx.lineTo(x,horizon+2-12-13*Math.sin((x+par)*0.009)+5*Math.sin((x+par)*0.021)); }

  // exactly WITH the hills through a turn — no independent drifting against the
  // world. Only a whisper of cross-sky glide and a shallow altitude bob keep them

  if(!S.night && wx!=="rain" && wx!=="snow" && wx!=="fog"){
    ctx.strokeStyle="rgba(18,24,32,0.85)"; ctx.lineWidth=1.4; ctx.lineCap="round";
    for(let fk=0;fk<2;fk++){

      const fx=(((S.t*sp+fk*977-par)%span)+span)%span-180;   // full par == ridgeNear: welded to the hills
      const fy=horizon-(48+fk*36)+Math.sin(S.t*0.35+fk*2.4)*4;

  // flash that lights the foreground stays on top, at the end of the scene.
  { const fl=S.wx.flash||0;

        ctx.beginPath();ctx.moveTo(bx,by);
        for(let k=1;k<=6;k++){
          sd=(Math.imul(sd,48271)%2147483647+2147483647)%2147483647;
          bx+=((sd%100)/100-0.5)*W*0.07; by=(horizon-2)*k/6;
          ctx.lineTo(bx,by);
        }
        ctx.stroke();ctx.shadowBlur=0;
      }
    }

  ctx.fillStyle=S.night?"#0c1009":(wx==="snow"?"#aeb6bd":"#20281c");
  ctx.fillRect(0,horizon,W,H-horizon);

  // TRUE projection: integrate the road's real heading relative to the car
  // (identical math to the minimap polyline), then perspective-project the
  // actual lateral/forward metres. Windshield == minimap, by construction.
  const slices=[], step=3.2;
  if(v.rollA){ ctx.save(); ctx.translate(W/2,H*0.62); ctx.rotate(v.rollA); ctx.translate(-W/2,-H*0.62); }
  let theta=-(v.driftYaw||0), lx=0, zw=1.4, yAcc=0, camGrade=roadAt(v.s).grade; // nose vs path: the drift angle

  for(let i=slices.length-1;i>0;i--){
    const a=slices[i], b=slices[i-1];

    const pfA=profAt(a.s);
    const wA=halfAt(a.s)*a.sc, wB=halfAt(b.s)*b.sc;   // the road breathes: 2 to 6 lanes
    const sidWA=restSidingW(a.s), sidWB=restSidingW(b.s);   // paved pull-off siding on the right (metres)
    const band=Math.floor(a.s/6)%2===0;
    // START LINE — a broad painted bar across the full width, drawn once, where
    // the prestige run begins.
    { const SL=CFG.ROAD.startLineS;

    // scaling with the road's width. ← CFG.VERGE
    const VG=CFG.VERGE;
    const vxA=(m,sd)=>a.sx+sd*(wA+m*a.sc), vxB=(m,sd)=>b.sx+sd*(wB+m*b.sc);

    else for(const side of [-1,1]){
      const bio=biomeAt(a.s,side), P=BIO_GRASS[bio];
      let col=S.night?(band?P.n1:P.n2):(band?P.d1:P.d2);

        col=(bio==="forest")?col:(band?"#7d6c48":"#746343");
      ctx.fillStyle=bioMix(col, a.s, side, band);

      // wedges when the road sweeps hard through linked corners

      if(side<0) quad(0,a.sy, 0,b.sy, Math.max(0,eB),b.sy, Math.max(0,eA),a.sy);
      else       quad(Math.min(W,eA),a.sy, Math.min(W,eB),b.sy, W,b.sy, W,a.sy);
      // THE COAST CONVERGES. This used to be max(half*4.4, 26px): the pixel floor
      // meant the far slices kept a 26 px wedge of sand no matter how small they

      // out past the county line. In metres it vanishes to the same point the
      // road does, which is what a coastline actually does.

        ctx.fillStyle=S.night?(band?"#0a1420":"#0b1522"):(band?"#33566f":"#2e4d66");
        if(side>0) quad(Math.min(W,oA),a.sy, Math.min(W,oB),b.sy, W,b.sy, W,a.sy);
        else       quad(0,a.sy, 0,b.sy, Math.max(0,oB),b.sy, Math.max(0,oA),a.sy);

        ctx.fillStyle=S.night?(band?"#0a0d12":"#0b0e13"):(band?"#87939f":"#7e8b98");

      :S.night?(band?"#191b1f":"#17191d")

      :(band?"#3a3d43":"#36393f");

      ctx.fillStyle="rgba(190,210,235,"+((S.night?0.10:0.16)*bi).toFixed(3)+")";

    }
    // snow patches, mottled across the lane

    if(sp>0.02){
      const hh=(Math.imul(Math.floor(a.s/22),2246822519)>>>0);

    // uneven gravel shoulder: width wanders, tone mottles
    for(const side of [-1,1]){
      if(side>0 && sidWA>0.6) continue;                  // the paved siding owns the right shoulder here
      const gz=Math.floor((a.s+ (side>0?0:53))/7);
      let gh2=(Math.imul(gz,2654435761)^0x27d4eb2f)>>>0; gh2=(gh2^gh2>>>13)>>>0;
      // THE SHOULDER STARTS WHERE THE ROAD STOPS. It used to start at 0.97 of the
      // half-width — outside the paint on a narrow road, but a hand's width INSIDE
      // the white line of a six-lane, so the loose stuff (sand-toned, in a beach
      // zone) was painted over the edge line and over the rumble strip that was
      // supposed to sit between them. Now: rumble, then gravel, then the biome.
      // IRREGULAR INNER EDGE. The gravel laps over the paved lip by a wandering
      // amount rather than starting on a ruler line — that ragged boundary is
      // most of what makes it read as a shoulder instead of a painted stripe.
      // Hashed on a SHORTER wavelength than the outer edge (2.5 m against 7 m),

      // adjacent pairs disagree about where the rail sat, and the fence read
      // as broken zigzag. Now it runs true through dips and crests.
      if(S.wx.type!=="snow" && biomeAt(a.s,side)==="farm" && wA>2.2){
        const fhA=a.sc*1.05, fhB=b.sc*1.05, fw=Math.max(1,b.sc*0.05);

function mixHex(h1,h2,t){ // lerp two #rrggbb (or rgb() passthrough on t=0/1)

        g=Math.round(((a>>8)&255)*(1-t)+((b>>8)&255)*t),
        bl=Math.round((a&255)*(1-t)+(b&255)*t);

  const into=((sPos%1600)+1600)%1600;

}
function bioMix(col, sPos, side, band){ // fade this cell's colour toward the next
  const t=bioBlendT(sPos); if(t<=0) return col;
  const Q=BIO_GRASS[biomeAt(sPos+160,side)];

function biomeAt(sPos,side){

function fogAt(sPos){ // local fog banks, biome-weighted, ramped at zone edges

  const r=(h%1000)/1000;

  dirt: {d:["#7d6547","#6e583c"], n:["#171208","#140f07"], p:"#5d492f", pn:"#1d1509"},

/* ---- CAR RENDERING — silhouettes that turn --------------------------------
   Cars used to be rounded rectangles painted dead-on: wherever one sat on the
   road you saw the same slab, which is why they read as cardboard. Each car is
   now a real elevation — sills, shoulder, tumblehome, crowned roof — and it
   ROTATES. The apparent yaw comes from geometry we already have: the bearing to
   the car plus the road's heading change between us and it. The body answers by
   squeezing its face (cos), opening a flank (sin), sliding every feature across
   the face, and contouring the greenhouse the opposite way.
   SMOOTHNESS is a design constraint, not an afterthought: every term is a
   continuous function of that one angle, the angle is damped per car, and the
   detail levels fade in on smoothstep instead of switching on at a threshold.
   Nothing pops, so a car rotating past you is one continuous motion.          */
const CAR_PROF={                 // half-widths as fractions of the body, ground-up
  // 'ride' lifts the SILL off the tarmac so the wheels show under the body
  // instead of being swallowed by it — the bodywork used to run to the ground
  // and every car wore a skirt. The roof stays where it was; the body simply
  // starts higher, which is what a car actually looks like.
  //     sill  shoulder roof   beltline  corner  glass  ride
  sedan:{w0:0.90,w1:1.00,w2:0.60,hb:0.56,rr:0.10,gl:0.30,ride:0.15},
  wagon:{w0:0.90,w1:1.00,w2:0.70,hb:0.58,rr:0.09,gl:0.34,ride:0.15},
  hatch:{w0:0.89,w1:1.00,w2:0.63,hb:0.57,rr:0.11,gl:0.30,ride:0.16},
  van:  {w0:0.94,w1:1.00,w2:0.86,hb:0.70,rr:0.08,gl:0.22,ride:0.14},
  lorry:{w0:0.97,w1:1.00,w2:0.95,hb:0.80,rr:0.05,gl:0.14,ride:0.26}, // chassis rails ride high
  semi: {w0:0.96,w1:1.00,w2:0.93,hb:0.60,rr:0.06,gl:0.34,ride:0.20,wh:[0.16,0.70,0.88]}, // steer axle + drive tandem
  trailer:{w0:0.99,w1:1.00,w2:0.99,hb:0.90,rr:0.03,gl:0.02,ride:0.24,wh:[0.74,0.90]}  // bogie at the BACK; the nose rides the tractor
};
function carFacePath(cx, hw, yB, bodyH, P){ // silhouette: sill -> shoulder -> tumblehome -> crown

  const yBelt=yB-bodyH*P.hb, yTop=yB-bodyH, r=Math.max(1,hw*P.rr);

  ctx.quadraticCurveTo(cx-w1, yTop+r*0.7,          cx-w2, yTop+r*0.18); // shoulder tucks in: tumblehome
  ctx.quadraticCurveTo(cx,    yTop-r*0.40,         cx+w2, yTop+r*0.18); // crowned roof
  ctx.quadraticCurveTo(cx+w1, yTop+r*0.7,          cx+w1, yBelt);

  // the camera was treated as if it were the same distance AHEAD — so its

  // end at c.s+len. So every car sat half a length too far away, and that error
  // grows as it closes, which is read as the body swinging round. The ends now
  // straddle the centre at ±len/2. Which end is which follows from direction:

  // side can never be longer than the body actually is.

  // consumer inherited it: the body smeared across the screen, the tyres
