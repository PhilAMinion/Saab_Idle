<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SAAB IDLE — Trionic 7 Touge</title>
<!--
  ============================================================================
  SAAB IDLE  ("the game Initial D Viggen Edition would have been")
  Single-file HTML5 idle driving simulator. One state object. 24 fps render
  cap with servo-smoothed presentation; physics integrated in 3 substeps.

  SPEC / RESEARCH NOTES (sources consulted; see in-game LIBRARY tab):
  - Trionic 7 is a TORQUE-REQUEST system: the pedal asks for torque, the ECU
    converts that to an AIRMASS-PER-COMBUSTION target (mg/c) and arbitrates
    electronic throttle + wastegate duty to deliver it. Ion-sense knock
    detection through the spark plugs. (Wikipedia "Trionic";
    modernclassicsaab.com T7 conversion article; 4saab.com/T7Suite Trionic7.pdf;
    hpacademy forum "understanding saab trionic 7 ecu")
  - Community tuning ladder (SaabCentral "You want more power? Read HERE
    first", uksaabs.co.uk B204 guide, saabnet Viggen turbo strategy thread,
    saablink, motor-talk Viggen thread):
      3" downpipe -> intercooler -> TD04HL-15T (stock on SE HOT + Viggen)
      -> TD04HL-18T/19T hybrid (6 cm^2 hot side) -> GT28RS "Disco Potato"
      -> GT2871R / GT3071 (needs manifold spacer, lines, 3-bar MAP,
      630cc injectors, Walbro 255 pump, Viggen clutch, forged pistons —
      stock T7 bottom ends do not live much past ~300 whp).
      TD04HL-15T flow map is done ~300 hp @ ~170,000 rpm; ~1300 mg/c of
      air per combustion at 5500 rpm is the community number for ~300 PS.
  - Factory 9-3 (1998-2002) engine/turbo matrix (SaabCentral sticky):
      2.0t LPT   B205E  Garrett GT17 (low boost)     154 hp
      2.0t FPT   B205L  Garrett GT17                 185 hp
      2.0T SE HOT B205R Mitsubishi TD04HL-15T 5cm^2  205 hp
      Viggen     B235R  Mitsubishi TD04HL-15T 5cm^2  230 hp / 350 Nm
  - eSID3 / OpenSID: Trionic 7 hides live data (airmass mg/c, boost, IAT,
    calculated power/torque) which the community surfaces on the amber SID
    display (esid.se; saabinfo.se OpenSID guide; open-source T7Suite,
    github.com/mattiasclaesson/TuningSuites). Our SID does the same.
  - Service data (gear ratios, curb weights, torque limiting in low gears)
    cross-checked against saabwisonline.com (community-hosted Saab WIS,
    which itself is the TIS2000-era dealer documentation).
  - Aero: OG 9-3 Cd ~0.31, frontal area ~2.05 m^2 (published Saab figures).
  - CALIBRATION (3rd pass): every FACTORY trim (tune 0, no parts, 95 RON,
    20 C) reproduces its brochure CRANK PS + Nm within ~3%. Anchors:
      2.0i 130/177 . 2.0t LPT 154/240 . 2.0t FPT 185/263 . SE HOT 205/280 .
      Viggen 230/350 . TiD 115/260 . TiD-S 150/320.  Verify anytime with
      dynoSelfTest() in the console (auto-runs once on boot).
  - The engine is AIRMASS-limited: a trim only makes its rated number if the
    turbo can FLOW the airmass that number needs. Two things set that ceiling:
    the turbo's mgcMax (compressor map, a hard wall) and how much boost the ECU
    is allowed to hold. Shrink either and you re-strangle the trim — THIS is
    the recurring "Viggen makes 174 hp" bug. The gt17lp/gt17 mgcMax were the
    wall before this pass; the turbo naVe baseline (1.15) and stock icEff (0.70)
    were the other half.
  - Boost is KNOCK-limited (CFG.ENG.KNOCK_BOOST_MARGIN): the ECU stops adding
    boost once the charge reaches knockPivot + margin. Octane (fuel.knockPivot)
    and the intercooler (icEff) raise that ceiling — which is why 98/E85/an FMIC
    add power, and why a higher tune stage can never deliver LESS than the one
    below it on the same hardware.
  - Accel/top-speed FOLLOW from power once it's right; they are NOT separate
    knobs. Do not chase 0-100 by editing gears/aero/weight — those are the
    published 9-3 figures. Get the dyno green first; the AI throttle + spool +
    shift transients do the rest. Brochure (0-100 km/h . vmax km/h, manual):
      2.0i 10.8/200 . LPT 9.0/215 . FPT 8.2/230 . SE HOT 7.3/235 .
      Viggen 6.4-6.7/250(elec-limited) . TiD 10.9/200 . TiD-S ~9.5/205.

  ARCHITECTURE
  - S = single source of truth. Everything reads/writes S. Rendering reads
    a servo-filtered shadow copy (S.vis) so gauges/camera never jitter.
  - Loop: requestAnimationFrame gated to 24 fps; each rendered frame
    advances physics by 3 substeps of ~1/72 s.
  - Engine: airmass model. tq = mgc * 0.295 Nm/mg * timing factor.
    Boost is a 1st-order lag toward the wastegate target; spool tau and
    ceiling come from the fitted turbo; fuel system and intercooler set
    independent airmass ceilings; the TUNE sets how much the ECU is
    allowed to ask for. Actual = min(everything). That IS the game.
  - Driver AI: pure-pursuit steering, torque-request pedal, targets ~88% of
    the physics limit of the road ahead — and reads that limit from the SAME
    CFG.GRIP budget the tyres actually spend (via aiCornerMu/aiCornerV), behind
    one confidence sandbag (CFG.AI.GRIP_CONF). Skill is a tunable hook; the
    drift/loose "carry" is a deliberate cinematic stretch layered on top.
  - Road: seeded procedural arcs, 1..90 degrees, radii 35..900 m, grades.
    A world polyline is kept so the minimap matches the windshield.
  - Traffic: same-direction + oncoming. Careful AI: follows, passes when
    clear. Any contact = crash = forced prestige.
  - Economy: kr earned by distance x pace. HARDWARE (kr) raises physical
    ceilings; SOFTWARE (kr) raises what the ECU requests, capped by
    hardware; PRESTIGE (new Saab) converts progress into Parts Money
    multiplier + a Badge; BADGES buy trims (super-prestige).
  ============================================================================
-->
<style>
  :root{
    --asphalt:#15171b; --dash:#222429; --dash2:#2b2e34; --seam:#111216;
    --amber:#ff9d2e; --amber-dim:#8a5518; --glow:#d9ffe9; --glow-dim:#5d7a68;
    --viggen:#2b5fa3; --red:#e3453a; --panel:#1a1c21; --ink:#c8cdd4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;height:100dvh;background:#000;overflow:hidden;
    font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;color:var(--ink);
    -webkit-user-select:none;user-select:none}
  #wrap{position:relative;height:100%;width:100%;display:flex}
  #game{flex:1;position:relative;min-width:0}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
  /* ---- shop drawer ---- */
  #shop{width:340px;max-width:85vw;background:var(--panel);border-left:2px solid var(--seam);
    display:flex;flex-direction:column;transition:margin-right .25s ease}
  #shop.closed{margin-right:-340px}
  #shopTabs{display:flex;flex-wrap:wrap;border-bottom:2px solid var(--seam)}
  #shopTabs button{flex:1 1 auto;min-width:28%;background:none;border:0;color:#7f8791;padding:9px 2px;
    font:700 10px/1 "Arial Narrow",Arial;letter-spacing:.09em;cursor:pointer;border-bottom:2px solid transparent}
  #shopTabs button.on{color:var(--amber);border-bottom-color:var(--amber)}
  #shopClose{flex:0 0 38px !important;min-width:38px !important;font-size:14px !important;color:#aab1ba !important}
  #shopBody{flex:1;overflow-y:auto;padding:10px 12px 40px}
  .item{border:1px solid #30343b;border-radius:4px;padding:8px 10px;margin-bottom:8px;background:#1e2026}
  .item.owned{border-color:#2c4634;background:#1a231d}
  .item.locked{opacity:.45}
  .item h4{font-size:13px;color:#e8ecf1;letter-spacing:.04em}
  .item .sub{font-size:11px;color:#8d95a0;margin:3px 0 6px;line-height:1.35}
  .item .cite{font-size:10px;color:#5d6570;font-style:italic;margin-bottom:6px;line-height:1.3}
  .item button{background:var(--viggen);border:0;color:#fff;font:700 11px/1 Arial;
    padding:6px 12px;border-radius:3px;cursor:pointer;letter-spacing:.06em}
  .item button:disabled{background:#3a3e45;color:#767d86;cursor:default}
  .item .tag{display:inline-block;font-size:9px;letter-spacing:.12em;color:var(--amber);
    border:1px solid var(--amber-dim);border-radius:2px;padding:2px 5px;margin-bottom:5px}
  .kv{display:flex;justify-content:space-between;font-size:11px;color:#9aa2ad;margin:1px 0}
  .kv b{color:#dfe4ea;font-weight:700}
  h3.sec{font-size:11px;letter-spacing:.2em;color:#6f7781;margin:14px 0 7px;border-bottom:1px solid #2a2d33;padding-bottom:4px}
  #hudTop{position:absolute;top:8px;left:10px;right:10px;display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:5}
  .pill{background:rgba(14,15,18,.82);border:1px solid #2c2f36;border-radius:4px;
    padding:5px 10px;font-size:12px;letter-spacing:.05em;pointer-events:auto}
  /* The odometer pill carries the longest string on screen (distance, year, and a
     trim name up to "9-3SS 1.9 TTiD 180"). Let it run right up to the fullscreen
     button rather than wrapping or clipping: no shrink, no wrap, and it takes the
     room it needs. */
  #pillOdo{white-space:nowrap;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .pill b{color:var(--amber)}
  #btnShop,#btnNight{cursor:pointer}
  #btnNight.on{color:#3c4148}
  /* ABOVE THE CHAT. Toasts sat at z-index 20 under paxChoices at 22, so anything
     said while a passenger was mid-conversation simply vanished behind the reply
     buttons. They live above it now and stay parked at 17% — well clear of the
     choices at 44% — so nothing is hidden in either direction. */
  #toast{position:absolute;left:10px;top:17%;z-index:26;pointer-events:none;
    background:rgba(10,10,12,.92);border:1px solid var(--amber-dim);color:var(--amber);
    font:700 13px/1.5 "Courier New",monospace;letter-spacing:.06em;padding:12px 20px;border-radius:4px;
    display:none;text-align:left;max-width:75%}
  /* pass cheques: little pay slips stacking up above the driver-mode pill */
  #cheques{position:absolute;left:10px;bottom:52px;z-index:20;display:flex;
    flex-direction:column;gap:5px;pointer-events:none;align-items:flex-start}
  .cheque{background:rgba(18,15,8,.94);border:1px solid var(--amber-dim);color:var(--amber);
    font:700 11px/1 "Courier New",monospace;letter-spacing:.05em;padding:5px 10px;border-radius:3px;
    opacity:0;transform:translateY(7px);transition:opacity .22s,transform .22s;white-space:nowrap}
  #crash{position:absolute;inset:0;background:rgba(60,8,6,.55);display:none;z-index:20;
    align-items:center;justify-content:center;flex-direction:column;text-align:center}
  #crash h1{font:900 42px/1 Arial;color:#ffd9d5;letter-spacing:.1em;text-shadow:0 0 30px #e3453a}
  #crash p{color:#ffc9c4;margin:14px 0 20px;font-size:14px;max-width:420px;line-height:1.5}
  #crash button{background:var(--red);border:0;color:#fff;font:700 14px Arial;padding:12px 26px;border-radius:4px;cursor:pointer}
  /* ---- config tab ---- */
  .cfgRow{display:flex;align-items:center;gap:10px;padding:6px 2px;border-bottom:1px solid #24262c}
  .cfgL{flex:1 1 50%;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
  .cfgR{flex:1 1 50%;min-width:0}
  .cfgName{background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left;
    font:700 12px/1.25 "Arial Narrow",Arial;color:#dfe4ea;letter-spacing:.04em;
    border-bottom:1px dotted #5d6570}
  .cfgName:hover{color:var(--amber);border-bottom-color:var(--amber-dim)}
  .cfgVal{font:11px/1.4 "Courier New",monospace;color:#8d95a0}
  .cfgVal.mod{color:var(--amber);font-weight:700}
  .cfgR input[type=range]{width:100%;accent-color:var(--amber);cursor:pointer;height:22px}
  @media (max-width:760px){ #shop{position:absolute;right:0;top:0;bottom:0;z-index:15} }
  /* ---- passenger dialogue choices ----
     Container ignores pointer events so driving touches pass through the
     empty space to the wheel/pedals; only the buttons themselves are live. */
  #paxChoices{position:absolute;left:10px;top:44%;z-index:22;display:none;
    flex-direction:column;gap:8px;max-width:min(66%,340px);
    pointer-events:none;opacity:0;transition:opacity .25s}
  .paxChoice{pointer-events:auto;text-align:left;cursor:pointer;
    font:600 clamp(13px,2.5vw,16px)/1.28 -apple-system,"Segoe UI",Arial;
    color:var(--amber);background:rgba(16,17,20,.93);
    border:1.5px solid var(--amber-dim);border-radius:11px;padding:9px 13px;
    box-shadow:0 2px 12px rgba(0,0,0,.4);-webkit-tap-highlight-color:transparent;
    opacity:0;transform:translateX(-12px);
    transition:opacity .2s,transform .2s,background .12s,border-color .12s,color .12s}
  .paxChoice:hover{background:rgba(201,147,42,.16);border-color:var(--amber);color:#f2e6cf}
  .paxChoice:active{background:rgba(201,147,42,.3);transform:scale(.98)}
  /* ---- animated title / splash: 6 s on start ---- */
  /* SCROLLS. The boot card now carries the whole stage-by-house matrix and it is
     taller than a phone, so this is a scroll container rather than a flexbox that
     quietly crops the failures off the bottom where nobody reads them. */
  #intro{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;
    justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 10px 30px;
    background:radial-gradient(120% 80% at 50% 34%,#12233f 0%,#0a1526 46%,#05080f 100%);
    font-family:-apple-system,Segoe UI,Arial;color:#eef2f8;cursor:pointer;}
  /* NO auto-fade. The splash used to run introOut at 5.4 s and take the game
     with it whether you were ready or not; now it holds, the sim is frozen
     behind it, and it leaves when you say so. */
  #intro .stagecard{width:min(560px,96vw);margin:14px 0 0;background:rgba(4,8,14,.72);
    border:1px solid #23405f;border-radius:9px;padding:9px 10px;
    font:11px/1.5 "Courier New",monospace;color:#a9c4e0;white-space:pre;overflow-x:auto;}
  #intro .stagecard b{color:#e7c778;font-weight:700;}
  #intro .stagecard .red{color:#e0705a;}
  #intro .stagecard .dim{color:#5f7793;}
  #intro .stagecard .amb{color:#e7c778;}
  #intro .stagecard .cy{color:#5fc9d6;}
  #intro .stagecard .hd{color:#9fb6cc;letter-spacing:.10em;}
  /* A LITTLE NOISE. Static over the whole splash — it is a boot screen on a
     device from 2001 and it should not look like a web page. Pure CSS: a tiny
     SVG turbulence tile, so it costs nothing and needs no asset. */
  #intro::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.055;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
    mix-blend-mode:overlay;animation:introGrain .9s steps(3) infinite;}
  @keyframes introGrain{0%{transform:translate(0,0)}33%{transform:translate(-3px,2px)}66%{transform:translate(2px,-2px)}}
  #intro .startkey{position:sticky;bottom:6px;z-index:4;margin-top:14px;
    display:flex;gap:10px;align-items:center;justify-content:center;
    font:700 13px "Courier New",monospace;letter-spacing:.22em;color:#0b1017;
    background:linear-gradient(180deg,#f0c24a,#d79a22);border:1px solid #8a6414;
    padding:11px 20px;border-radius:22px;opacity:0;transition:opacity .5s;
    box-shadow:0 6px 22px rgba(0,0,0,.55);animation:introPulse 1.6s ease-in-out infinite;}
  #intro .startkey.on{opacity:1;}
  #intro .stagecard .grn{color:#7fc98a;}
  /* STICKY, so a tall test card can never scroll the way out of reach. */
  #intro .tap{position:sticky;bottom:6px;z-index:2;
    font:700 12px "Courier New",monospace;letter-spacing:.30em;color:#e7c778;
    margin-top:16px;padding:9px 14px;border-radius:20px;padding-left:calc(.30em + 14px);
    background:rgba(6,10,18,.92);border:1px solid #3c5f8c;
    opacity:0;transition:opacity .5s;animation:introPulse 1.6s ease-in-out infinite;}
  #intro .tap.on{opacity:1;}
  #intro .badge{position:relative;width:98px;height:98px;border-radius:50%;
    background:radial-gradient(circle at 38% 32%,#2e6ec4,#0b2d63 68%,#071d42);
    border:3px solid #c9a24b;box-shadow:0 0 26px rgba(46,110,196,.5),inset 0 0 14px rgba(0,0,0,.55);}
  #intro .ring{position:absolute;inset:-9px;border-radius:50%;border:3px solid transparent;
    border-top-color:#e7c778;border-right-color:#e7c778;animation:introSpin 1.5s linear infinite;}
  #intro .crest{position:absolute;inset:0;margin:auto;}
  #intro .word{font-weight:800;font-size:min(64px,15vw);letter-spacing:.14em;
    transform:scaleY(1.5) scaleX(.92);transform-origin:center;line-height:1;color:#f2f5fa;
    text-shadow:0 2px 16px rgba(46,110,196,.45);margin:34px 0 0;}
  #intro .sub{font-weight:600;font-size:min(18px,4.6vw);letter-spacing:.52em;color:#8fb4e6;margin:24px 0 0;padding-left:.52em;}
  #intro .bar{width:min(190px,52vw);height:4px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:30px;overflow:hidden;}
  #intro .bar>i{display:block;height:100%;width:0;border-radius:3px;
    background:linear-gradient(90deg,#2e6ec4,#e7c778);animation:introLoad 5.5s ease-out forwards;}
  #intro .load{font:600 11px "Courier New",monospace;letter-spacing:.34em;color:#6f86a8;margin-top:12px;padding-left:.34em;}
  @keyframes introSpin{to{transform:rotate(360deg);}}
  @keyframes introLoad{to{width:100%;}}
  @keyframes introOut{to{opacity:0;visibility:hidden;}}
  @keyframes introPulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.75);}}
  /* NEW LICENCE popup — slides down over the road, reads, leaves */
  .licPop{position:fixed;left:0;right:0;top:0;z-index:240;display:flex;justify-content:center;
    pointer-events:auto;cursor:pointer;opacity:0;transform:translateY(-14px);
    transition:opacity .38s ease, transform .38s ease;}
  .licPop.on{opacity:1;transform:translateY(0);}
  .licInner{width:min(340px,86vw);margin:10px;padding:9px 10px 10px;border-radius:12px;
    background:rgba(12,14,18,.93);border:1px solid #3a4250;
    box-shadow:0 14px 40px rgba(0,0,0,.65);}
  .licTag{font:700 9px "Courier New",monospace;letter-spacing:.24em;color:#f5c542;
    margin:1px 0 7px;text-align:center;}
  .licSub{font:400 10px/1.45 -apple-system,Segoe UI,Arial;color:#9aa6b4;margin-top:8px;text-align:center;}
</style>
</head>
<body>
<div id="wrap">
  <div id="game">
    <canvas id="cv"></canvas>
    <div id="intro">
      <div class="badge"><div class="ring"></div>
        <svg class="crest" viewBox="0 0 100 100" width="58" height="58" aria-hidden="true">
          <path d="M26 62 L21 34 L37 48 L50 26 L63 48 L79 34 L74 62 Z" fill="#e7c778"/>
          <rect x="26" y="62" width="48" height="8" rx="2" fill="#e7c778"/>
          <circle cx="50" cy="45" r="3.2" fill="#0b2d63"/>
        </svg>
      </div>
      <div class="word">SAAB</div>
      <div class="sub">IDLE</div>
      <div class="bar"><i></i></div>
      <div class="stagecard" id="introStages"></div>
      <div class="load" id="introLoad">LOADING&hellip;</div>
      <div class="tap" id="introTap">&#9199; SCROLL FOR THE FULL TEST CARD</div>
      <div class="startkey" id="introStart">&#9654; START THE CAR</div>
    </div>
    <canvas id="glcv" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none"></canvas>
    <div id="hudTop">
      <div class="pill" id="pillKr"><b>0</b> kr</div>
      <div class="pill" id="pillBadge">🛡 <b>0</b></div>
      <div class="pill" id="pillOdo">0.0 mi</div>
      <div style="flex:1"></div>
      <div class="pill" id="btnFull" title="Fullscreen">⛶</div>
      <div class="pill" id="btnNight" title="Night Panel">NIGHT PANEL</div>
      <div class="pill" id="btnShop">GARAGE ▸</div>
    </div>
    <div id="toast"></div>
    <div class="pill" id="btnAI" style="position:absolute;left:10px;bottom:12px;z-index:20">SPIRITED</div>
    <div id="cheques"></div>
    <div id="paxChoices"></div>
<div id="gasshop" style="display:none;position:fixed;inset:0;z-index:260;overflow-y:auto;
  background:rgba(6,9,14,.92);padding:26px 12px 30px;font-family:-apple-system,Segoe UI,Arial"></div>
<button id="gasShopBtn" style="display:none;position:fixed;left:50%;transform:translateX(-50%);
  bottom:104px;z-index:180;background:linear-gradient(180deg,#f0c24a,#d79a22);color:#0b1017;
  border:1px solid #8a6414;border-radius:22px;padding:11px 20px;
  font:700 12px 'Courier New',monospace;letter-spacing:.16em;box-shadow:0 6px 20px rgba(0,0,0,.5)">
  &#128717; SHOP &middot; SPINNER RACK</button>
<div id="classified" style="display:none;position:fixed;inset:0;z-index:60;background:#0c0d10ee;overflow-y:auto;padding:14px;font-family:monospace;color:#dfe3e8"></div>
<div id="workbench" style="display:none;position:fixed;inset:0;z-index:60;background:#0c0d10f4;overflow-y:auto;padding:14px;font-family:monospace;color:#dfe3e8"></div>
<div id="cfgPop" style="display:none;position:fixed;inset:0;z-index:70;background:#0c0d10e6;overflow-y:auto;padding:14px"></div>
<div id="crash">
      <h1 id="crashTitle">CONTACT.</h1>
      <p id="crashTxt"></p>
      <button id="crashBtn">TOW IT HOME · PULL THE CHASSIS STRAIGHT</button>
    </div>
  </div>
  <div id="shop" class="closed">
    <div id="shopTabs">
      <button data-tab="hw" class="on" data-l="GARAGE">GARAGE</button>
      <button data-tab="cfg" data-l="SETTINGS">SETTINGS</button>
      <button data-tab="prest" data-l="PRESTIGE">PRESTIGE</button>
      <button data-tab="lib" data-l="LIBRARY">LIBRARY</button>
      <button data-tab="drv" data-l="DRIVER">DRIVER</button>
      <button id="shopClose" title="Close">✕</button>
    </div>
    <div id="shopBody"></div>
  </div>
</div>
<script>
/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║  EDITING THIS FILE — READ BEFORE YOU PATCH                               ║
   ╚══════════════════════════════════════════════════════════════════════════╝
   Written after losing several hours to patches that silently did nothing. Every
   rule below is a mistake that actually happened, not a style preference.

   1. NEVER MATCH ON WHITESPACE OR PUNCTUATION YOU HAVEN'T COPIED FROM THE FILE.
      This file uses LITERAL UTF-8 for — · ° × ≈ ⁄ Å ä ö. A patch written with
      \u2014 will not match a line containing —. Nor will 6 spaces match 4.
      ALWAYS grep the exact line first and paste it verbatim into the matcher.

   2. ASSERT THE MATCH COUNT, AND WRITE ONLY AT THE END.
      def sub(a,b,n=1): assert s.count(a)==n; s=s.replace(a,b)
      ...then one write after every sub has succeeded. A half-applied patch is
      far worse than a failed one, because it looks like it worked.

   3. AFTER PATCHING, PROVE IT LANDED. grep -c for a distinctive string from the
      NEW text. "Syntax OK" only proves the file still parses — it does not prove
      your edit is in it. Several patches in this file's history printed success
      and changed nothing because the script was written but never executed.

   4. NEVER REPLACE A RANGE DEFINED BY TWO INDEPENDENT ANCHORS without printing
      what lies between them first. Doing that once destroyed 365 unrelated lines
      (STORY, STORYLINES and the whole PAX_* passenger system) and left the game
      throwing a ReferenceError on every animation frame.

   5. TRIMS ARE INDEXED BY POSITION. S.trim is an integer and every save code in
      existence holds one. APPEND new trims; never insert, never reorder.
      Same for DYNO_TARGETS and PACE_REF — they are parallel to TRIMS by index.

   6. IDs MUST EXIST. A fuel/turbo/engine id that isn't in its table falls through
      to a default, and the defaults are not neutral: FUELS[0] is 87 octane, so a
      typo'd refFuel quietly dynoed six cars on the worst petrol in the game and
      cost twenty per cent. Anchored lookups now fall back to the reference value,
      but check your ids against the table anyway.

   7. THE BOOT CARD IS GROUND TRUTH. dynoSelfTest + stageMatrix run on a cold,
      untouched state. A bench harness that runs later measures a warmed car and
      will read up to 17% high. Calibrate against the boot card, never against a
      side harness.

   8. WHEN A NUMBER WON'T MOVE, MEASURE WHAT BINDS IT before changing anything.
      estCurve() returns .who per sample: request / turbo / breathing / fuel /
      block / knock / clutch. Five rounds of turbo resizing did nothing once
      because the car was knock-limited on the wrong fuel the whole time.

   9. GATE ON THE TRIM, NOT THE PART, for anything era-specific. naTrim(),
      ecuOf(), isT5() exist so that a Viggen cannot be affected by NA or T5 code
      even if a save or a cheat puts the part in its list. The boot matrix proves
      the isolation on every launch.

   ── ANCHOR MARKERS ──────────────────────────────────────────────────────────
   Stable, unique, greppable handles for the places most often edited. Search for
   the marker, not for the code around it. Keep them when you edit near them.
     @A-TRIMS        the TRIMS table            @A-ENGINES   the ENGINES table
     @A-TURBOS       the TURBOS table           @A-FUELS     the FUELS table
     @A-TYRES        the TYRES/RIMS tables      @A-RARITY    market border tiers
     @A-DYNOTARGETS  brochure figures           @A-PACEREF   0-100 references
     @A-HWCEILS      hardware ceiling maths     @A-GEARLIM   per-gear torque caps
     @A-MKTCARD      the classifieds listing    @A-DASHSTYLE dash layout table
*/

// fallback by ID, not by index: it used to be PROVIDERS[2], which WAS maptun only
// because the retired TIS card sat at position 0 and pushed everything along one.
function PROV(){ const id=S.prov||"maptun";
  return PROVIDERS.find(p=>p.id===id) || PROVIDERS.find(p=>p.id==="maptun") || PROVIDERS[0]; }
function provBias(rpm){ const p=PROV();
  return 1 + p.lo*Math.max(0,(4200-rpm)/2200) + p.hi*Math.max(0,(rpm-4200)/2200); }
/* provShape — how the HOUSE distributes the same airflow across the rev range
   (cam phasing + boost-by-rpm). A gentle, bounded (±10%) multiplier on delivered
   torque, applied ONLY when a house file is flashed (tune>0). lo lifts the
   bottom, hi lifts the top: Nordic piles it on down low and tapers up top;
   Hirsch backs off the bottom and keeps pulling to redline; Maptun is flat.
   Stage 0 (the factory file / no house) returns 1 — so this NEVER touches the
   stock calibration or the dyno self-test.                                    */
function provShape(rpm){ const p=PROV(); if((S.tune||0)<=0 || p.stage0 || p.diy) return 1;
  const loW=Math.max(0,(4200-rpm)/2200), hiW=Math.max(0,(rpm-4200)/2200);
  const raw=Math.max(0.90, Math.min(1.10, 1 + 0.55*(p.lo*loW + p.hi*hiW)));
  // ...AND THE SAME RULE FOR DELIVERY. provShape scaled the whole delivered
  // torque, so a torque-biased file still handed back less at the top than the
  // factory calibration. It now applies in proportion to how much of the torque
  // is actually the tuner's: a mild stage 1 is nearly all Saab's work and barely
  // shaped at all, while a stage 8 file is mostly the house's and carries their
  // character in full. Keeps the flavour, loses the impossibility.
  const trim=TRIMS[S.trim], add=(TUNES[S.tune]||{}).tq||0;
  const frac=add/Math.max(1, trim.tqNm+add);
  // FLOORED AT 1. Scaling by stage share stopped a torque-biased house dragging a
  // Viggen below stock, but it did not save the NATURALLY-ASPIRATED car: an NA
  // engine is breathing-limited at the top, so raising the request buys nothing
  // while a sub-1.0 delivery shape still takes torque away — Nordic's stage 3 came
  // out at 131 hp against a stock 133, which the three-car matrix caught the first
  // time it ran. A file you paid for may add its character where it likes; it may
  // not hand back a car that is slower anywhere than the factory calibration.
  return Math.max(1, 1 + (raw-1)*frac); }
/* ── HOME TUNING SEAM ───────────────────────────────────────────────────────
   Three functions, and only these three, decide what the ECU asks for. A
   bought stage answers through the house's bias curve; a home map answers
   through your own 3-point table. wotPoint (the dyno), estDyno (the menu) and
   engineStep (the car) all call through here, which is the whole point: the
   bench sheet cannot disagree with what happens on the road, because they are
   reading the same two arrays.                                              */
/* SID KNOCK ALERT. Armed by a backfire or by damage; takes over the TOP line of
   the display for three blinks with the running total sitting steady underneath,
   then hands the display back to whatever page was scheduled. Deliberately does
   NOT stack: an engine that is detonating continuously would re-arm this every
   frame and the SID would never show anything else again. */
function sidKnockAlert(){
  const K=CFG.KNOCK, now=S.t||0;
  if(S.sidAlert && now < S.sidAlert.until) return;      // one alert at a time
  S.sidAlert={ start:now, until: now + K.sidFlashes*(K.sidOn+K.sidOff) };
}
/* THE T5 MAP. Deliberately a different SHAPE from the T7 one: no torque table at
   all, an apc[] where the boost request lives, and one fuel multiplier standing in
   for the load axis of the fuel map. `burns` counts the chips you have been through,
   because that is the number a T5 tuner actually remembers about a car. */
function t5Live(){ const p=PROV(); if(!(p.diy && isT5() && S.t5 && S.t5.on)) return null; return S.t5; }
function t5Default(){
  const trim=TRIMS[S.trim];
  const keep=S.t5; S.t5=null; const C=hwCeils(); S.t5=keep;   // read the stock path
  const b=Math.max(0, Math.round(C.boostCeil));
  return { on:1,
    apc:[Math.round(b*0.70), b, Math.round(b*0.90)],
    fuel:1.00, adv:0,
    revLim: trim.redline||6300,
    boostCut: Math.max(40, Math.round(b*1.22)),
    safe:1.00, burns:0 };
}
function t7Live(){ const p=PROV(); if(!(p.diy && S.t7 && S.t7.on)) return null;
  // heal a map written before the suite grew: missing tables read as factory
  const t=S.t7;
  if(t.adv===undefined) Object.assign(t, t7StockExtras(TRIMS[S.trim]));
  return t; }
function t7At(a, rpm){          // 3-point piecewise linear, flat past either end
  const T=CFG.T7;
  if(!a) return 0;
  if(rpm<=T.rpmLo)  return a[0];
  if(rpm>=T.rpmHi)  return a[2];
  return rpm<=T.rpmMid
    ? a[0]+(a[1]-a[0])*(rpm-T.rpmLo )/Math.max(1,T.rpmMid-T.rpmLo)
    : a[1]+(a[2]-a[1])*(rpm-T.rpmMid)/Math.max(1,T.rpmHi -T.rpmMid);
}
function redlineNow(){
  { const t5=t5Live(); if(t5) return t5.revLim; } const t=t7Live(); return t? t.revLim : (TRIMS[S.trim].redline||6300); }
function reqTqAt(rpm, trim, tune){   // TOTAL requested crank torque (Nm), pre-overboost
  /* THERE IS NO TORQUE REQUEST ON A TRIONIC 5, and until now the T5 bench was still
     being clamped by one — so winding the APC table up produced no power at all,
     because the engine was politely declining to exceed a number the system does
     not possess. T5 fuels and sparks by load and rpm and takes whatever air the
     APC gets it; the fuel map's own load axis is the only ceiling, which is the
     `fuel` multiplier. So: effectively unlimited request, scaled by the map.
     This is the single most important behavioural difference between the two
     benches, and it was the thing making the T5 one feel broken. */
  { const t5=t5Live();
    if(t5) return (trim.tqNm+TUNES[TUNES.length-1].tq) * (t5.fuel||1) * 1.6; }
  const t=t7Live(); if(t) return t7At(t.tq, rpm);
  // THE HOUSE SHAPES WHAT IT ADDS, NOT WHAT SAAB BUILT. This used to multiply the
  // WHOLE request by provBias, which meant a torque-biased house — Nordic run
  // hi:-0.10 — asked for LESS at the top than the factory file it replaced: 232 hp
  // against 239 on a Viggen. Caught by the stage matrix on the boot card. A tuner
  // can only add less up there; they cannot make Saab's own calibration worse.
  /* A DIESEL SMOKE LIMITER IS BOOST-REFERENCED. More air is not just permission
     to burn what you already inject — the ECU sees the boost and injects more, which
     is precisely why an EGR blank and two turns on a vane rod are felt as POWER on
     a car whose fuelling you have not touched. Petrol cars are unaffected: dsAir()
     returns exactly 1 for every one of them. */
  const dsReq = dsTrim()? (1 + (dsAir()-1)*0.55) : 1;
  return (trim.tqNm + (tune.tq||0)*(S.tune>0? provBias(rpm) : 1)) * dsReq;
}
function boostTgtAt(rpm, C, iat){    // what the boost table asks for (kPa), hardware-clamped
  { const t5=t5Live();
    if(t5) return Math.max(0, Math.min(C.boostCeil, t7At(t5.apc, rpm))); }
  // (same rule for boost: the stage's ADDED pressure carries the house's shape,
  //  the turbo's own rating does not)
  const t=t7Live();
  if(t){ let b=Math.min(C.boostCeil, t7At(t.boost, rpm));
    // TEMP COMPENSATION (Tryck_temp_komp). A real T7 pulls boost back as the
    // charge heats — the table that stops a hot day becoming a knock event. It
    // costs top end in summer and it is the only automatic guard you have.
    if(t.iatComp>0 && iat!==undefined) b-=Math.max(0,(iat-(C.knockPivot||60)))*t.iatComp;
    return Math.max(0,b); }
  const add=C.boostStg||0, base=C.boostCeil-add;
  return Math.max(0, Math.min(C.boostCeil, base + add*(S.tune>0? provBias(rpm) : 1)));
}
/* IGNITION AND FUELLING as one pair of numbers BOTH the dyno and the engine
   read, so the sheet can never disagree with the road. advK is the torque
   multiplier from base advance plus the enrichment penalty; pivotShift is what
   those same two choices do to the knock pivot. Advance buys torque and spends
   knock margin. Enrichment spends torque and buys margin back. That is the
   trade, and it is why neither has a best setting. */
function t7AdvK(){ const T0=CFG.T7;
  { const t5=t5Live();
    if(t5) return Math.max(0.55, 1 + (t5.adv||0)*T0.advTqPerDeg
                                   - Math.max(0,(t5.fuel||1)-1)*10*T0.lamTqPer01); }
  const t=t7Live(); if(!t) return 1; const T=CFG.T7;
  return Math.max(0.55, 1 + (t.adv||0)*T.advTqPerDeg
                          - Math.max(0,1-(t.lam||1))*10*T.lamTqPer01); }
function t7PivotShift(){ const T0=CFG.T7;
  { const t5=t5Live();
    // extra fuel cools, advance costs, and the margin knob does LESS than T7's,
    // because one sensor listening through a wider window cannot be as precise.
    if(t5) return Math.max(0,(t5.fuel||1)-1)*10*T0.lamCoolPer01*0.8
                - (t5.adv||0)*T0.advKnockPerDeg
                + ((t5.safe||1)-1)*16; }
  const t=t7Live(); if(!t) return 0; const T=CFG.T7;
  const lam=t.lam||1, rich=Math.max(0,1-lam)*10, lean=Math.max(0,lam-1)*10;
  return rich*T.lamCoolPer01 - lean*T.lamLeanRisk - (t.adv||0)*T.advKnockPerDeg; }
function t7RevCeil(){ const T=CFG.T7;   // what the bottom end will actually survive
  return (TRIMS[S.trim].redline||6300) + (S.parts.pistons? T.revHeadroomForged : T.revHeadroom); }
function t7Default(){
  // THE FACTORY MAP, READ OUT OF THE ECU. Deliberately FLAT across all three
  // breakpoints, because the factory calibration IS flat: stage 0 asks for
  // trim.tqNm at every rpm and lets the wastegate chase whatever airmass that
  // needs, capped at the turbo's rating. So a car taken home and not yet
  // touched makes EXACTLY its brochure figure — same numbers as the dealer
  // file, because they are literally the same two expressions. Every shape in
  // the curve after this is yours, and you can see which tap put it there.
  const trim=TRIMS[S.trim];
  const bHW = Math.max(0, fitTurbo().boostMax
              + (S.parts.dp?6:0) + (S.parts.exh?4:0) + (S.parts.intake?2:0));
  const base = trim.tqNm;
  return { on:1,
    tq:   [base, base, base],
    boost:[bHW,  bHW,  bHW],
    revLim: trim.redline||6300,
    boostCut: Math.max(40, Math.round(bHW*1.25)),   // the factory's own overboost guard
    injCal: 0, safe: 1.00,
    ...t7StockExtras(trim) };
}
/* The five tables beyond request-and-boost, at their factory values. Split out so
   every path that builds a map (factory read-out, stage-equivalent, inherited
   from a house) starts from the same honest baseline. */
function t7StockExtras(trim){
  return { adv:0, lam:1.00, wgP:1.00, wgI:0.00,
    g1:(trim.ob?280:230), g2:Math.round((trim.ob?280:230)*1.35), iatComp:0 };

/* ── INHERIT THE FILE YOU ARE ALREADY RUNNING ──────────────────────────────
   Taking the laptop home does not wipe the ECU. This reads the tables the
   CURRENT house has in there right now — through the very same reqTqAt and
   boostTgtAt the engine reads — and hands them to you as your starting point.
   Switch to DIY on a Maptun stage 5 car and the bench opens on Maptun's stage 5,
   to the newton-metre. MUST be called while the OLD house is still selected. */
/* ── SOMEBODY WHO HAS SEEN ONE BEFORE ─────────────────────────────────────
   An experimental combination has no off-the-shelf file, but it does not follow
   that nobody can help. There is always a bloke two towns over who has done one,
   and he wants five thousand for an afternoon on the rollers. What you get back
   is honest: a base map that is safe, drives properly and leaves real power on
   the table, because he tuned it conservatively and went home. It is a starting
   point that WORKS — which is worth a lot when the alternative is a blank bench

function experimentalFitted(){ return !!(S.parts.headswap || S.parts.t5rotate); }
function tunerBaseMap(){

function t7FromCurrent(){
  const trim=TRIMS[S.trim], T=CFG.T7, p=PROV();
  const keep=S.t7; S.t7=null;                  // read the HOUSE path, not a map
  let tq,bo,C;
  try{

    tq=[T.rpmLo,T.rpmMid,T.rpmHi].map(r=>Math.round(reqTqAt(r,trim,tune)));
    bo=[T.rpmLo,T.rpmMid,T.rpmHi].map(r=>Math.round(Math.max(0,boostTgtAt(r,C))));
  } finally { S.t7=keep; }
  const ex=t7StockExtras(trim);
  // the house's own handwriting, carried over as YOUR starting numbers
  ex.safe = (S.tune>0 && !p.stage0 && p.safe!==undefined)? p.safe : 1.00;
  ex.injCal = (S.parts.inj && S.tune>=(p.injCal!==undefined?p.injCal:99))?1:0;
  // a bought file raises the per-gear ceilings with the stage, exactly as before
  const raise=(S.tune>0? (TUNES[S.tune].tq||0)*0.6 : 0);
  ex.g1=Math.round(ex.g1+raise); ex.g2=Math.round(ex.g2+raise*1.1);
  return { on:1, tq, boost:bo,
    revLim: trim.redline||6300,
    boostCut: Math.max(40, Math.round(Math.max.apply(null,bo)*1.22)),

/* ═══ WHAT THE MANAGEMENT SYSTEM COSTS YOU ═══════════════════════════════════
   The block is the block. What differs between the eras is the brain, and every
   one of these is a real, documented consequence rather than a balance number:

   TRIONIC 5.2/5.5
     · SEMI-SEQUENTIAL INJECTION. No cam sensor, so the ECU cannot tell which
       cylinder is on which stroke and fires the injectors in pairs. Fuel lands on
       a shut valve half the time; mixture distribution suffers and you pay for it
       in torque.
     · COARSER KNOCK DETECTION. One sensor, a slower window, and retard applied
       across all cylinders rather than the one that pinked. The safe pivot has to
       sit lower because the system finds knock later.
     · APC BOOST CONTROL is a slower loop than T7's wastegate PWM, so it corrects
       lazily — the same overshoot the bench's wgP knob models, except you do not
       get a knob for it.
     · SOCKETED EPROM. You tune it by pulling a chip. T7Suite cannot address it.
   TRIONIC 7 — the baseline. Sequential injection off a cam sensor, finer knock
     control, flashable, and the ECU this game's bench was written for.
   TRIONIC 8 — finer still and happy with higher charge temps, but a different
     toolchain again: T7Suite will not talk to it either.
   BOSCH EDC15 — the diesel. Cheated as-is, penalty-free, by request.

   NOTE ON THE 2.0i: this is why it has been reading 140 hp against a 130 PS
   brochure figure and failing its own boot test all along. It is the only Trionic
   5 car in the garage and it was being simulated as though it had T7's fuelling. */
const ECU_PEN={
  /* BOSCH LH 2.4 + A SEPARATE DI/APC BOX. Not Trionic, and this is the correction:
     Trionic was FIRST used on the B204 and B234, so the B202 never had it. The
     classic 900 and the early 9000 ran Lucas/LH-Jetronic for fuel with an entirely
     separate DI/APC unit for ignition and boost — two boxes that barely spoke to
     each other, no ion-sensing, and knock "control" that amounts to a sensor and a
     blunt instrument. There is no chip to burn in the Trionic sense; you tune it
     with a wastegate spring, an APC box and a screwdriver. Hence the biggest
     penalty in the table and no bench access of any kind. */
  lh: {tqK:0.930, pivot:-12, wgLag:1.70, bench:0,
       note:"LH 2.4 + separate DI/APC — two boxes, no ion sensing, blunt knock control"},

  // processor with a coarser knock window; the 9000 crowd will tell you the 5.5

function ecuPen(){ return ECU_PEN[ecuOf()] || ECU_PEN.t7; }
/* ═══ ETHANOL AND THE RUBBER ══════════════════════════════════════════════════
   Ethanol is a solvent. It swells and hardens the nitrile rubber Saab used for
   fuel hose, injector O-rings, pump seals and the tank sender gasket, and it does
   it whether or not the engine is happy — a fuelling upgrade buys you the FLOW,
   it does not buy you the rubber. So there are two separate consequences here and
   the game keeps them separate:

     RUNS BADLY   — too much ethanol for the fuel system's flow. Fixed by
                    injectors and a pump, and already priced into fuelMgc through
                    the stoich term (E85 needs ~50% more volume for the same air).
                    Made worse below, because swollen seals meter badly too.
     EATS ITSELF  — the rubber degrades regardless. One point of seal condition
                    per 25 miles, and NO amount of fuelling hardware stops it.
                    Only ethanol-safe line and Viton seals do.

   ethTol() is what the car will take without complaint. A 2003-on Ecotec car left
   the factory certified for E15; a Trionic 7 car for E10; a Trionic 5 car of the
   early nineties for basically nothing. Fit the line kit and it stops mattering. */
function ethOf(){ const f=FUELS.find(q=>q.id===(S.fuel||"prem91e0")); return (f&&f.eth)||0; }
/* WHAT IT WILL DRINK, BY ERA — and the old ones will not drink it at all.
   Ethanol tolerance is not one number for "old cars": it tracks what the fuel
   system was made of and what the ECU can correct for.
     LH 2.4 + APC  ZERO. Nitrile hose throughout, cork and paper gaskets, a
       mechanical fuel pump seal, and a lambda loop far too slow to trim for a fuel
       15% richer in oxygen. Pump E10 is already outside what this car was built
       for — which is exactly why 1980s Saabs in ethanol markets ate fuel systems.
     T5.2 / T5.5   0.05. Better rubber, a real lambda loop, still no certification.
     T7            0.10. Certified E10.
     T8 / EDC      0.15. Certified E15.
   The Viton line kit makes any of them indifferent, because then the rubber is
   not rubber any more. */
function ethTol(){ if(S.parts.ethlines) return 1;
  const e=ecuOf();
  return e==="t8"? 0.15 : e==="edc"? 0.15 : e==="t7"? 0.10
       : e==="lh"? 0.00 : 0.05; }
/* And it eats the old ones faster for the same excess: 1980s hose in a car that
   has already had thirty years to go hard is not the same material as 2002 hose. */
function ethAgeK(){ const e=ecuOf();
  return e==="lh"? 1.8 : (e==="t52"? 1.35 : 1); }
function sealWear(){ return Math.max(0,Math.min(100, S.sealWear||0)); }
/* Seals leak before they fail. Lost fuel pressure is lost airmass you can burn. */
function sealFlowK(){ return 1 - sealWear()/100*0.34; }
/* The engine in the car, by code, with a tolerant fallback so a trim naming an
   engine this table has never heard of still behaves exactly as it always did. */
function engOf(){ return ENGINES[(TRIMS[S.trim]||{}).eng] || null; }
/* THE ECU IN THE CAR RIGHT NOW. A Trionic 5 car that has had the conversion done
   IS a Trionic 7 car as far as everything downstream is concerned — that is the
   whole point of doing it, and it is the bridge that lets a 1998 B204 use a bench
   built for T7 without pretending the two ECUs were ever the same thing. */
/* THE ECU CAN CHANGE INSIDE ONE MODEL NAME, which is exactly what @A-YEARS is for:
   the 1993 9000 Aero shipped Trionic 5.2 and the 1994 car shipped 5.5, same badge,
   same engine code. A year variant may therefore override the engine's own ECU. */
function ecuOf(){ if(S.parts.t7conv) return "t7";
  const o=yv("ecuOverride", null); if(o) return o;
  const e=engOf(); return e? e.ecu : "t7"; }   // unknown ⇒ behave exactly as before
function isT5(){ const c=ecuOf(); return !!((c==="t5"||c==="t52"||c==="lh") && !S.parts.t7conv); }
function benchOK(){ return !!ecuPen().bench; }   // can T7Suite address this ECU at all?
const ECU_NAMES={lh:"Bosch LH 2.4 + APC",t52:"Trionic 5.2",t5:"Trionic 5.5",
                 t7:"Trionic 7",t8:"Trionic 8",edc:"Bosch EDC15"};
function ecuName(){ return ECU_NAMES[ecuOf()]||"Trionic 7"; }
/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║  BACKLOG — things asked for and not yet built                            ║
   ╚══════════════════════════════════════════════════════════════════════════╝
   Kept here rather than in a head or a chat log, because this file outlives both.
   Roughly in the order they were asked for. Delete a line when it ships.

   ── ASKED FOR, NOT BUILT ────────────────────────────────────────────────────
   [ ] SUSPENSION IS NOT MODELLED, and should be said plainly. `susp`, `arb`, `poly`
       and `lsd` are FLAT GRIP MULTIPLIERS (CFG.GRIP.SUSP 1.08, ARB 1.04, ...) plus one
       visual roll scalar. There is no spring rate, no damper curve, no roll stiffness
       distribution, no anti-dive, no geometry, and no notion that a strut car and a
       multilink car behave differently — so a 9000 on Konis and a Sport Sedan on
       standard springs differ by a single number. A real model would want: front/rear
       rate, roll couple distribution (which is what actually decides understeer
       balance), damping in bump and rebound, and travel/bump-stop behaviour off-road.
       That is a project on the scale of the engine model, not an afternoon.
   [ ] MASS BY YEAR. Kerb weights are now per-trim and researched, and `wf` per-trim
       too — but both are single figures per car. Real ones moved through a model run
       as equipment, safety structure and trim levels changed (a 1998 9-3 is not a 2002
       9-3 on the scales). The @A-YEARS mechanism already supports it: `yv:[{from,to,
       kg,wf}]`. Wants a source per model rather than interpolation.
   [ ] TANK LEVEL. fuelMassDelta() weighs what is in the tank by specific gravity
       and it reaches the physics — but it assumes a FULL tank, because there is no
       level or consumption model in this game. So it is a constant offset per fuel
       rather than a load that lightens as you drive. A real tank level would also
       give the fuel gauge something true to point at and make range matter.
   [ ] PER-MODEL DASH DRAWING. DASH_STYLES (@A-DASHSTYLE) drives dial positions,

/* ═══ @A-YEARS: VARIATION IS BY MODEL YEAR, NOT BY TRIM NAME ══════════════════
   The further back this garage reaches, the less a trim NAME means. "900 SE 2.0T"
   covered four model years, and Saab changed the ECU, the injectors, the ratios and
   the torque limiting inside that span without touching the badge on the boot. Trim
   rows are the wrong granularity for that, and cloning a trim per year would turn
   twenty-three cars into a hundred and make the boot card useless.

   So a trim may carry `yv` — year variants. Each entry is {from, to, ...overrides}
   and the LAST match wins, so you state a baseline once and override a single late
   year without repeating yourself:

     yv:[ {from:1994, to:1997, ecuOverride:"t52"},
          {from:1998, to:2000, ecuOverride:"t5"},
          {from:2002,          gearGate:0.80} ]

   trimY() merges them against S.carYear; yv(key,dflt) reads one fact. Everything
   that depends on a model year should read it through these rather than off TRIMS[]
   directly, so the NEXT year difference anybody finds is a table row instead of
   another special case buried in the physics. The Viggen's low-gear torque gating
   is migrated onto it below as the first real user. */
function trimY(){
  const t=TRIMS[S.trim]||{};
  if(!t.yv || !t.yv.length) return t;
  const y=S.carYear||0;
  let out=t;
  for(const v of t.yv){
    if(y >= (v.from||0) && y <= (v.to||9999)){
      if(out===t) out=Object.assign({}, t);
      for(const k in v){ if(k!=="from" && k!=="to") out[k]=v[k]; }
    }
  }
  return out;
}
function yv(key, dflt){ const t=trimY(); return (t[key]!==undefined)? t[key] : dflt; }

                        //   roughly 1,800 miles of hard driving and a set of
                        //   semi-slicks in about 1,100 — which is honest, and the
                        //   reason nobody sensible daily-drives AD08s.
    sealMiles:      25, // miles per point of seal condition lost to ethanol the car
                        //   was never built for. Rubber does not care how good your
                        //   injectors are; only the Viton kit stops this.
    kitPremium:   1.10, // QUICK-UPGRADE KITS. One button buys the file, every part
                        //   the file needs, and the fitting — no bench queue. The
                        //   premium is the shop's labour for doing in an afternoon
                        //   what would otherwise be five evenings and a barked
                        //   knuckle. Set it to 1.0 and there is no reason left ever
                        //   to use the workbench.
    tradeK:        8.0, // trade-in credit for the shell you are handing over. Kept
                        //   separate from priceK: what your old build is worth to a
                        //   dealer has nothing to do with what a stranger's Saab
                        //   costs, and tying them together meant fixing one broke
                        //   the other.
    rebuildBase:  4200, // ENGINE REBUILD: in-the-door — gaskets, seals, machining
    rebuildPerPt:  260, // ...per point of lost health. A tired engine is a bill; a
                        //   nearly-dead one is nearly a new engine, which is the
                        //   decision the button is there to put in front of you.
    rebuildHpK:     14, // ...per rated PS. A 230 PS lump costs more than a 130.
    replaceBase: 26000, // AT ZERO HEALTH there is nothing to rebuild: a replacement
    replaceHpK:     60, //   unit, fitted — and it arrives bare, so the tune and
                        //   everything bolted to the old engine go with it.
    bodyBase:     2600, // BODY SHOP: in-the-door
    bodyPerPt:     380, // ...per point of bent
    rustPerPt:     240, // ...per point of rust, and ALL of it comes off this time
    bodyWreckK:    1.6, // ...times this once the shell is properly folded (>=85%)
  },
  KNOCK: {              // WHAT DETONATION ACTUALLY COSTS. Replaces the per-second
                        // over-rev grind, which was attrition rather than drama:
                        // you never saw it happen, you just noticed the car was
                        // worse. These are discrete events instead — a knock
                        // either comes out of the tailpipe, or it takes the block.
                        // READ BY: the engineStep knock-event branch.
                        // FEEDS: S.engHealth, e.pop (the backfire flag).
    fullC:          34, // °C past the pivot at which EVERY firing detonates. The
                        //   counter is combustion events × this fraction — a
                        //   four-cylinder four-stroke fires rpm/30 times a second,
                        //   so a healthy engine logs a handful and a badly fuelled
                        //   one logs thousands a minute. Nothing new is measured:
                        //   same charge temp, same pivot the timing loop uses.
    // TWO KINDS OF BANG, and they mean opposite things.
    // OVERRUN POP: off the throttle at high rpm, grabbing the next gear. Unburnt
    //   fuel lighting in a hot downpipe. Sporting, free, and the correct noise.
    // FART IN THE PULL: on the throttle, knocking, AND the fuelling is wrong.
    //   That is a misfire. It costs you the pull and it stores a code, because a
    //   safely modified car does not do this however hard you work it — only a
    //   rich one (big injectors, no injector constant) or a lean one (fuel system
    //   out of flow) does. That is the whole reward for doing it properly.
    popOverrun:   0.008,// chance of a sporting pop per lift-off opportunity. Tiny on
                        //   purpose: with a gearshift every couple of seconds this
                        //   still lands a stock car at three or four in ten minutes,
                        //   which is what an unmodified car should do.
    overrunRpmK:   0.62,// ...only above this fraction of the current limiter
    popExhK:        2.2,// ...multiplied if there is a downpipe/cat-back on it
    popRichK:       3.4,// ...multiplied again if it is running rich
    hardFrac:      0.06,// what counts as HARD knock for the misfire: this fraction
                        //   of firings detonating. Note this is NOT knockBinding —
                        //   only one thing can be the binding airmass limit at a
                        //   time, so "knock-limited AND fuel-limited" is a condition
                        //   that can never be true, and gating the misfire on both
                        //   meant it never fired once in ten minutes of abuse.
                        //   The detonating fraction happily coexists with the fuel
                        //   system being the wall, which is exactly the car we want
                        //   to catch: working hard, detonating, and fuelled wrong.
    fartChance:    0.45,// chance a hard knock WITH a fuelling fault farts, per gap
    fartCut:       0.30, // ...and how much timing that misfire costs while it lasts
    fartHold:      0.35,// ...for this long (s)
    fartGap:        2.0,// MISFIRES GET THEIR OWN, MUCH LONGER COOLDOWN than pops. On
                        //   the pop gap alone a lean engine misfired 942 times in ten
                        //   minutes — 1.6 a second, which is not a lost drag race, it
                        //   is a permanent stutter and an unusable car. At two seconds
                        //   a properly broken one coughs about once per pull: you lose
                        //   the race, you hear it, you go and fix it.
    popGap:       0.18, // minimum gap between audible bangs of either kind (s)
    egtPerSmoke:   900, // °C of exhaust temperature per unit of "fuel ahead of air".
                        //   This is the whole of the oil-burner's risk model: no knock
                        //   sensor, no retard, just a manifold going orange. Raise it
                        //   to make over-fuelling instantly fatal.
    egtMtbs:       150, // seconds at 100°C over the limit before something lets go.
                        //   Slow enough to read the gauge and go and buy air, fast
                        //   enough that ignoring it costs you the engine.
    revMtbs:        25, // seconds spent ABOVE what the bottom end will take before
                        //   something lets go. The bench will let you type any rev
                        //   limiter you like now — this is what typing it costs.
    mtbs:           45, // MEAN SECONDS OF HARD KNOCK AT THE LIMIT before something
                        //   lets go. Not per knock event — per second spent in the
                        //   one state that actually breaks engines (see below). At
                        //   10% a hit, that is ~25 minutes of accumulated abuse to
                        //   kill a motor, which is meant to feel like a long argument
                        //   you slowly lose rather than a coin flip.
    grenadeOver:   1.20, // "past the rated figure" = the trim's brochure PS × this.
                         //   MEASURED, not guessed. At the moment of knock, the
                         //   unretarded figure on a STOCK Viggen (230 PS) peaks at
                         //   245 — 1.07× rated — and falls to 0.73× on bad fuel,
                         //   because the brochure figure is a peak and this is an
                         //   instantaneous number with overboost in it. A BUILT car
                         //   sits at 1.66–1.91× (382–439 PS). 1.20 lands in the gap:
                         //   no factory car can ever reach it, every build clears it.
    grenadeHit:      10, // engine health taken when it lets go (%) at factory revs
    overRevK:       1.5, // ...MULTIPLIED per 1000 rpm over the FACTORY redline.
                        //   Only the home-tuning kit can raise the limiter at all
                        //   — every bought house is bounded by its own file — so
                        //   this is the DIY tuner's bargain and nobody else's: a
                        //   forged Viggen at 8400 takes 4.3× the hit, so 43% of the
                        //   engine in one bang. Building one is gambling; the bet
                        //   should be visible in the numbers.
    sidFlashes:       3, // SID alert: how many times KNOCK blinks on the top line
    sidOn:          0.5, // ...seconds lit
    sidOff:         0.5, // ...seconds dark. 3 × (0.5+0.5) = a three-second alert,
                        //   then the display goes back to whatever page was due.
    dtcHoldS:        30, // how long P0324 stays stored after the last hard knock
  },
  CHASE: {              // hidden-speed-trap chase system (chaseStep/copStep/driverStep)
    triggerOverMs: 8,       // m/s over the posted limit at the trap to trip a chase
    violationThresholdMs: 4,// m/s over the limit that still counts as speeding during a chase
    pullOverAfterS: 7,      // continuous seconds over threshold before Spirited/Calm pull over
    pullOverHoldS: 8,       // seconds stopped on the shoulder before the ticket is written
    loseGapM: 160,          // metres ahead of the cop that counts as shaking the pursuit
    loseHoldS: 4,           // seconds holding that gap before the cop gives up
    maxS: 120,              // hard cap: the cop calls it off after this long regardless
  },
};

// --- compatibility aliases: authoritative values live in CFG above ---------
let GEARS=CFG.DRV.gears, FINAL=CFG.DRV.final, WHEEL_R=CFG.DRV.wheelR;
// GEARBOX LOOKUP. Every trim runs the factory FM55 in CFG.DRV — that is the
// documented spec here, and the driveline part ("the fuse in every big-torque
// FM55") and its failure toast both depend on it. A trim MAY override gears or
// final if a real spec is ever added, but nothing invents ratios: an earlier
// pass fitted the Viggen a made-up FM57 and that was wrong on both the history
// and this game's own canon.
function tyreNow(){ const t=TRIMS[S.trim]; return (t&&t.tyreK)||1; }
function wheelRNow(){ const t=TRIMS[S.trim]; return (t&&t.wheelR)||WHEEL_R; }
function downforceN(){ // kg-force equivalent from the body kit, at this speed
  const t=TRIMS[S.trim], clA=(t&&t.clA)||0, v=S.veh.v;
  return 0.5*1.225*clA*v*v;                    // N, tied straight into normal load
}
function gearsNow(){ const t=TRIMS[S.trim]; return (t&&t.gears)||GEARS; }
function finalNow(){ const t=TRIMS[S.trim]; return (t&&t.final)||FINAL; } // ← CFG.DRV (let: CONFIG tab re-syncs)
let TQ_PER_MG=CFG.DRV.tqPerMg;        // Nm per mg/combustion (≈1300 mg/c ~ 300 PS @5500) ← CFG.DRV
let AIR_KPA=CFG.AIR_KPA;              // ← CFG
const engFric=r=>CFG.ENG.FRIC_BASE + r/CFG.ENG.FRIC_REF_RPM*CFG.ENG.FRIC_SLOPE; // pumping/friction Nm ← CFG.ENG

   it and re-sync the primitive aliases (FINAL, TQ_PER_MG, PROF_LEN, CAM_H…)
   so every call site — physics, dyno, speedo, AI — follows within a frame. */
const CFG_DEFAULT = JSON.parse(JSON.stringify(CFG));
function syncCfgAliases(){
  GEARS=CFG.DRV.gears; FINAL=CFG.DRV.final; WHEEL_R=CFG.DRV.wheelR;
  TQ_PER_MG=CFG.DRV.tqPerMg; AIR_KPA=CFG.AIR_KPA; PROF_LEN=CFG.ROAD.profLen;
  CAM_H=CFG.CAM.h; FOV=CFG.CAM.fov; DRAW=CFG.CAM.draw;
  if(typeof PROFILES!=="undefined") rebuildProfiles();
}
