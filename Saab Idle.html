   sub:"Metres over which the road half-width blends across a profile seam \u2014 the taper where the 6-lane becomes a forest track."},
  {path:"ROAD.looseWetK", nm:"Rain on gravel/dirt", unit:"\u00D7", min:0, max:2.5, step:0.05,
   sub:"How hard weather bites on loose surfaces, broken out from tarmac. 1 = the same grip loss as asphalt; 2 = a wet skogsv\u00E4g becomes a skating rink; 0 = rain never reaches the forest floor."}]},
 {sec:"GROWING UP \u2014 XP & LICENCES", cat:"game", rows:[
  {path:"PROG.xpBase", nm:"XP for level 2", unit:"xp", min:20, max:2000, step:10,
   sub:"The base of the level curve: XP needed = base \u00D7 level^power. Every level teaches the driver one more point of a skill and, at the right levels, hands him the next licence \u2014 so this is really the dial for how quickly he grows brave. Low numbers make a Viggen pilot out of him inside an hour."},
  {path:"PROG.xpPow", nm:"XP curve power", unit:"", min:1, max:3, step:0.05,
   sub:"How steeply the curve steepens. At 1.0 levels arrive at a constant rate forever; the factory 1.6 means the early ones come quickly and mastery takes a proper while."}]},
 {sec:"THE ECONOMY", cat:"game", rows:[
  {path:"ECON.payK", nm:"Payout multiplier", unit:"\u00D7", min:0.1, max:40, step:0.1,
   sub:"Everything you earn \u2014 miles, clean passes, fares \u2014 through one number. Raise it with the car prices below or the classifieds become a museum; lower it and every repair becomes a week of work."},
  {path:"ECON.priceK", nm:"Used-car prices", unit:"\u00D7", min:0.1, max:10, step:0.05,
   sub:"Thumb on the scale for every asking price in the market. It sits at 1.0 because the listings are now priced in absolute money \u2014 a tired 2.0t is a two-thousand-dollar car, a sorted Viggen is a fifteen-thousand-dollar one \u2014 so there is no correction factor baked in any more. Move this only if the whole market feels wrong against your income."},
  {path:"ECON.sealMiles", nm:"Ethanol \u2014 miles per seal point", unit:"mi", min:1, max:500, step:1,
   sub:"How far the car goes on ethanol it was not built for before losing a point of seal condition. Rubber does not care how good your injectors are \u2014 nothing but the Viton line kit stops this, which is exactly the trap real owners fall into once. Raise it to make old hose forgiving; drop it to make E85 in a 1994 car the mistake it actually is."},
  {path:"ECON.kitPremium", nm:"Quick-upgrade premium", unit:"\u00D7", min:1, max:2.5, step:0.01,
   sub:"What the shop charges to fit a whole stage while you wait \u2014 parts, labour and the file, one button, no bench queue. At 1.00 there is no reason ever to open the workbench again; the factory 1.10 makes the DIY route worth the evenings it costs you."},
  {path:"ECON.tradeK", nm:"Trade-in credit", unit:"\u00D7", min:0.1, max:30, step:0.1,
   sub:"What the dealer allows you for the shell you are handing over, scaling the best power you ever made and the miles you put on it. Deliberately separate from the asking-price knob above: what your build is worth to a trade counter has nothing to do with what a stranger wants for his Saab, and having them share a multiplier meant fixing one always broke the other."},
  {path:"ECON.rebuildBase", nm:"Rebuild \u2014 in the door", unit:"kr", min:0, max:40000, step:100,
   sub:"The fixed part of an engine rebuild: gaskets, seals, machining, the bench time it takes regardless of how tired she was."},
  {path:"ECON.rebuildPerPt", nm:"Rebuild \u2014 per point", unit:"kr", min:0, max:2000, step:10,
   sub:"Added per point of lost health, so the bill tracks the damage. This is the number that decides whether nursing a 40% engine is cheaper than running it to zero and replacing it \u2014 which is the whole decision the button exists to offer."},
  {path:"ECON.rebuildHpK", nm:"Rebuild \u2014 per PS", unit:"kr", min:0, max:400, step:1,
   sub:"Added per rated PS. A B235R costs more to put right than a B204i, because it is a bigger, angrier engine with more in it."},
  {path:"ECON.replaceBase", nm:"Replacement engine", unit:"kr", min:0, max:200000, step:500,
   sub:"A whole unit, fitted, when there is nothing left to rebuild. Keep it above a full rebuild or nobody will ever choose the rebuild."},
  {path:"ECON.replaceHpK", nm:"Replacement \u2014 per PS", unit:"kr", min:0, max:800, step:5,
   sub:"Scaled by how special the engine is. Viggen lumps are not lying around."},
  {path:"ECON.bodyBase", nm:"Body shop \u2014 in the door", unit:"kr", min:0, max:40000, step:100,
   sub:"The fixed part of a visit to Pl\u00E5t &amp; Lack, before anyone looks at what is actually bent."},
  {path:"ECON.bodyPerPt", nm:"Body shop \u2014 per point bent", unit:"kr", min:0, max:3000, step:10,
   sub:"Per point of body damage. Panels, rails, jig time."},
  {path:"ECON.rustPerPt", nm:"Body shop \u2014 per point rust", unit:"kr", min:0, max:3000, step:10,
   sub:"Per point of rust \u2014 and unlike before, the visit takes ALL of it off rather than knocking 70 points off and leaving you the rest. Cutting metal out and letting fresh in is the expensive part of any Swedish car."},
  {path:"ECON.bodyWreckK", nm:"Folded-shell surcharge", unit:"\u00D7", min:1, max:5, step:0.05,
   sub:"Multiplier once the shell is 85% bent or worse. At that point they are straightening the car itself rather than replacing panels, and the bill should make scrapping her a real option."}]},
 {sec:"DETONATION \u2014 BANGS & CONSEQUENCES", cat:"phys", rows:[
  {path:"KNOCK.popOverrun", nm:"Overrun pop chance", unit:"\u00D7", min:0, max:1, step:0.005,
   sub:"The sporting bang: off the throttle high in the rev range, grabbing the next gear, unburnt fuel lighting in a hot downpipe. Costs nothing at all \u2014 no code, no power, no SID alert. A stock car does it once or twice in ten minutes; a downpipe and a rich tune turn it into a party trick."},
  {path:"KNOCK.popExhK", nm:"Overrun \u2014 exhaust bonus", unit:"\u00D7", min:1, max:8, step:0.1,
   sub:"Multiplier on the overrun pop once there is a downpipe or cat-back fitted. A straight-through 3-inch is the reason anyone hears these at all."},
  {path:"KNOCK.popRichK", nm:"Overrun \u2014 rich bonus", unit:"\u00D7", min:1, max:10, step:0.1,
   sub:"Multiplier again if the mixture is rich. Unburnt fuel is the fuel that pops, so an over-fuelled car crackles on every upshift."},
  {path:"KNOCK.hardFrac", nm:"Hard-knock threshold", unit:"\u00D7 firings", min:0.005, max:0.6, step:0.005,
   sub:"What fraction of combustion events has to be detonating before a fuelling fault turns into a misfire. Deliberately measured on the detonating fraction rather than on \u2018knock is the binding limit\u2019, because only one thing can be the binding limit at a time \u2014 an engine that is out of fuel is fuel-limited, not knock-limited, so requiring both was a condition that could never be true."},
  {path:"KNOCK.fartChance", nm:"Misfire-in-the-pull chance", unit:"\u00D7", min:0, max:1, step:0.05,
   sub:"The bang that costs you the race \u2014 on the throttle, knock-limited, AND the fuelling wrong (rich from big injectors with no injector constant, or lean from a fuel system out of flow). It pulls real timing, flashes the SID with the count, and stores a misfire code. A car with the right injectors, right file and a pump to match can never satisfy the conditions, so it never does this."},
  {path:"KNOCK.fartCut", nm:"Misfire timing cut", unit:"\u00D7", min:0, max:0.9, step:0.05,
   sub:"How much timing a misfire pulls while it lasts. This is the lost drag race: a whole fart mid-pull should be felt in the seat, not just heard."},
  {path:"KNOCK.fartHold", nm:"Misfire duration", unit:"s", min:0.05, max:3, step:0.05,
   sub:"How long each misfire holds the engine down before it picks back up."},
  {path:"KNOCK.fartGap", nm:"Misfire spacing", unit:"s", min:0.2, max:15, step:0.1,
   sub:"Minimum gap between misfires \u2014 much longer than the pop gap on purpose. Left on the pop gap, a lean engine coughed 1.6 times a second, which is a permanent stutter rather than a lost race. Two seconds puts it at roughly once per pull on a properly broken car."},
  {path:"KNOCK.overRevK", nm:"Over-rev damage scale", unit:"\u00D7 per 1000 rpm", min:0, max:6, step:0.1,
   sub:"Multiplies the damage from a hard-knock failure, per 1000 rpm over the FACTORY redline. Only the home-tuning kit can raise the limiter \u2014 every bought house is bounded by its own file \u2014 so this is purely the DIY tuner's bargain: high risk against high reward, and the bet visible in the numbers. Zero makes the extra revs free."},
  {path:"KNOCK.fullC", nm:"Full-detonation span", unit:"\u00B0C", min:5, max:80, step:1,
   sub:"How far past the pivot the charge has to be before EVERY firing detonates. The knock counter is combustion events \u00D7 that fraction, so this sets the whole scale of the readout: small numbers make the count explode the moment you cross the line, large numbers make it climb gently."},
  {path:"KNOCK.popGap", nm:"Backfire spacing", unit:"s", min:0.05, max:2, step:0.01,
   sub:"Minimum gap between audible pops. Heavy knock would otherwise fire hundreds a second and turn into a buzz; this keeps it a crackle you can actually hear individual bangs in."},
  {path:"KNOCK.revMtbs", nm:"Over-rev time to failure", unit:"s past the ceiling", min:2, max:600, step:1,
   sub:"Seconds spent above what the bottom end will actually survive before something lets go, at 1000 rpm over \u2014 further over is proportionally quicker. Only a home map can put you there, because no bought file will move the limiter at all. This is the whole cost of the bench having no limits: you may type any rev ceiling you like, and this is what typing it buys."},
  {path:"KNOCK.mtbs", nm:"Mean time to failure", unit:"s of hard knock", min:5, max:2000, step:5,
   sub:"Seconds spent in the ONE state that breaks engines \u2014 hard knock, knock-limited on airmass, over the rated figure \u2014 before something lets go. It is not per pull and not per knock event: a well-fuelled build never enters this state at all, so it never pays. Raise it if engines die faster than you can earn."},
  {path:"KNOCK.grenadeOver", nm:"Grenade threshold", unit:"\u00D7 rated PS", min:0.5, max:2.5, step:0.05,
   sub:"How far past the trim's brochure figure the engine has to be making before detonation can kill it. Measured on the UNRETARDED figure \u2014 the power the airmass could make before the ECU pulls timing \u2014 because cylinder pressure is what breaks pistons, and gating on delivered power meant knock had already saved the engine from its own grenade. At 1.00 a factory car pinking on cheap petrol rattles and lives; only the power you found yourself is dangerous."},
  {path:"KNOCK.grenadeHit", nm:"Grenade damage", unit:"% health", min:1, max:100, step:1,
   sub:"Engine health taken in one bang. At 100 the first one ends the engine outright; the factory 20 gives you five warnings and a long walk toward the breaker's yard."}]},
 {sec:"HOME TUNING \u2014 THE T7 BENCH", cat:"phys", rows:[
  {path:"T7.rpmLo", nm:"Breakpoint \u2014 LOW", unit:"rpm", min:1200, max:3400, step:100,
   sub:"Where the low anchor of your request and boost tables sits. Below it both tables hold flat \u2014 that is the spool region, where the turbo cannot deliver whatever you ask anyway."},
  {path:"T7.rpmMid", nm:"Breakpoint \u2014 MID", unit:"rpm", min:2600, max:5400, step:100,
   sub:"The hinge of the whole map. Move it toward the low anchor for a car that hits early and signs off; move it up and the plateau stretches toward the limiter."},
  {path:"T7.rpmHi", nm:"Breakpoint \u2014 HIGH", unit:"rpm", min:4200, max:7600, step:100,
   sub:"The top anchor. Past it both tables hold flat to the limiter. Set it below your rev limiter or the last stretch of the curve is just an extrapolation you never authored."},
  {path:"T7.tqStep", nm:"Request step", unit:"Nm", min:1, max:50, step:1,
   sub:"How much one tap on the torque request moves. Small steps for dialling a plateau flat; big steps for finding the wall quickly."},
  {path:"T7.boostStep", nm:"Boost step", unit:"kPa", min:1, max:25, step:1,
   sub:"How much one tap moves the boost target and the overboost cut."},
  {path:"T7.revHeadroom", nm:"Rev headroom \u2014 cast", unit:"rpm", min:0, max:1500, step:50,
   sub:"How far over the factory redline the limiter can be moved on the bottom end you were given. This is the rope, not permission \u2014 time spent up there still costs engine health."},
  {path:"T7.revHeadroomForged", nm:"Rev headroom \u2014 forged", unit:"rpm", min:0, max:2500, step:50,
   sub:"The same rope with forged pistons in it. Longer, and still a rope."},
  {path:"T7.cutHoldS", nm:"Overboost cut hold", unit:"s", min:0.1, max:3, step:0.1,
   sub:"How long the fuel stays off once the cut trips. Short is a stumble; long is the car parking itself every time the wastegate overshoots on a cold morning."},
  {path:"T7.advTqPerDeg", nm:"Advance \u2014 torque per degree", unit:"\u00D7", min:0, max:0.05, step:0.001,
   sub:"Torque gained per degree of base ignition advance. The factory 0.012 is about 1.2% a degree, which is what a real Trionic 7 gives up before it starts rattling. Raise it and advance becomes free power; the knock cost below is what stops it being free."},
  {path:"T7.advKnockPerDeg", nm:"Advance \u2014 knock cost per degree", unit:"\u00B0C", min:0, max:8, step:0.1,
   sub:"How far the effective knock pivot DROPS for each degree you advance. This is the whole trade: at 2.2 \u00B0C a degree, four degrees on pump petrol costs you nearly nine degrees of charge-temperature headroom, which a hot day will happily eat."},
  {path:"T7.lamCoolPer01", nm:"Enrichment \u2014 cooling per 0.10\u03bb", unit:"\u00B0C", min:0, max:40, step:1,
   sub:"Charge cooling bought by running rich under load, per 0.10 below stoich. Fuel is the cheapest intercooler there is \u2014 this is why every fast turbo car on pump petrol runs fat at the top."},
  {path:"T7.lamTqPer01", nm:"Enrichment \u2014 torque cost per 0.10\u03bb", unit:"\u00D7", min:0, max:0.2, step:0.005,
   sub:"Torque lost per 0.10 richer. You are putting less air through the same hole, and the extra fuel is doing cooling work rather than making power. Set this to zero and rich mixture becomes a free lunch."},
  {path:"T7.lamLeanRisk", nm:"Lean \u2014 pivot cost per 0.10\u03bb", unit:"\u00B0C", min:0, max:60, step:1,
   sub:"How fast the knock pivot collapses when the file runs LEANER than stoich under load. Leaning out at full boost is the single most expensive mistake in the suite and this is the number that says so."},
  {path:"T7.safeMin", nm:"Knock margin \u2014 floor", unit:"\u00D7", min:0.5, max:1, step:0.01,
   sub:"The thinnest margin the bench will let you write. A thin margin sits nearer the knock pivot and starts pulling advance sooner once the charge heats up \u2014 so on marginal fuel it makes LESS power than a conservative file, not more. It only ever bites when knock is actually the binding limit; on E85 behind a big intercooler the charge never gets there."},
  {path:"T7.safeMax", nm:"Knock margin \u2014 ceiling", unit:"\u00D7", min:1, max:1.6, step:0.01,
   sub:"The most conservative file the bench will write. High margins hold their timing on a hot day instead of retarding, which is what a warranty-friendly house is selling. Raising this ceiling lets you out-Hirsch Hirsch."}]},
 {sec:"ROADSIDE \u2014 VERGE & BIOMES", cat:"road", rows:[
  {path:"VERGE.gravelLap", nm:"Gravel lap onto the road", unit:"m", min:0, max:0.3, step:0.01,
   sub:"How far the loose gravel creeps back over the paved lip, at most, wandering slice by slice. That ragged inner boundary is most of what makes the edge read as a shoulder rather than a painted stripe. The lip is 0.30 m wide by construction, so anything under that can never reach the white edge line \u2014 it looks like the shoulder is eating the road without ever actually covering the paint. Zero gives you a suspiciously municipal edge."},
  {path:"VERGE.shoulderMin", nm:"Shoulder \u2014 base width", unit:"m", min:0, max:3, step:0.05,
   sub:"Loose gravel beyond the rumble strip: the width it never drops below. Sits outboard of the paint now, where a shoulder belongs."},
  {path:"VERGE.shoulderVar", nm:"Shoulder \u2014 wander", unit:"m", min:0, max:4, step:0.05,
   sub:"How much the shoulder's width roams on top of the base, re-hashed every 7 m. Zero gives you a suspiciously municipal edge; two metres gives you a road the county forgot."},
  {path:"VERGE.groundIn", nm:"Ground overlap", unit:"m", min:0, max:1, step:0.05,
   sub:"How far the biome ground is tucked UNDER the tarmac before the road is painted over it. Purely a seam guard \u2014 without a little overlap a hairline of sky can flicker along the edge on hard sweepers."},
  {path:"VERGE.seaOff", nm:"Beach \u2014 water line", unit:"m", min:0, max:40, step:0.5,
   sub:"How far past the pavement edge the sand gives way to water. The windscreen and the mirror both read this, so the two views finally agree about where the coast is. In metres it also converges to the vanishing point properly \u2014 the old pixel floor kept a wedge of sand fanning out to the horizon."},
  {path:"VERGE.cliffOff", nm:"Cliff \u2014 drop line", unit:"m", min:0, max:30, step:0.5,
   sub:"Where the ground gives out into the hazed valley. Small numbers are the road cut into the mountainside; large numbers are a comfortable ledge with a view."},
  {path:"VERGE.parapetOff", nm:"Cliff \u2014 parapet", unit:"m", min:0, max:10, step:0.1,
   sub:"Where the stone guard wall stands. Keep it inside the drop line or the wall floats over the valley."},
  {path:"VERGE.fenceOff", nm:"Farm \u2014 fence line", unit:"m", min:0, max:20, step:0.5,
   sub:"How far off the road the post-and-rail fence walks the field boundary."},
  {path:"VERGE.vegOff", nm:"Verge scrub \u2014 offset", unit:"m", min:0, max:15, step:0.5,
   sub:"Nearest the road that undergrowth, dune grass and desert brush will grow."},
  {path:"VERGE.vegSpread", nm:"Verge scrub \u2014 spread", unit:"m", min:0, max:20, step:0.5,
   sub:"How far out from that offset the scrub scatters. Together with the offset it decides how quickly the verge stops being roadside and starts being country."},
  {path:"VERGE.postOff", nm:"Delineator posts", unit:"m", min:0, max:6, step:0.1,
   sub:"How far off the paint the reflective posts stand. Beach zones skip them entirely \u2014 the dunes mark the edge there."},
  {path:"VERGE.treeNear", nm:"Forest \u2014 front rank", unit:"m", min:1, max:40, step:0.5,
   sub:"Where the near treeline stands. Also the outer limit of the scattered individual trunks, so no tree can end up standing in front of its own curtain. The mirror's treeline reads the same number."},
  {path:"VERGE.treeFar", nm:"Forest \u2014 back rank", unit:"m", min:2, max:60, step:0.5,
   sub:"The hazier, taller rank behind. Keep it outside the front rank or the depth reads inside-out."},
  {path:"VERGE.mmSandFrac", nm:"Minimap \u2014 sand band", unit:"\u00D7", min:0.02, max:0.9, step:0.02,
   sub:"MAP ONLY. The satnav glass covers hundreds of metres, so a literal seven-metre beach would be sub-pixel \u2014 this is the stylised fraction of the terrain band drawn as sand before the sea takes over. Small keeps the coast hugging the road the way the windscreen shows it."},
  {path:"VERGE.mmCliffFrac", nm:"Minimap \u2014 clifftop band", unit:"\u00D7", min:0.02, max:0.9, step:0.02,
   sub:"MAP ONLY. Same idea for the clifftop before the valley floor takes over."}]},
 {sec:"CAMERA \u2014 PURE VIEW", cat:"cam", rows:[
  {path:"CAM.dashDrop", nm:"Cluster height", unit:"dial radii", min:1.0, max:3.0, step:0.02,
   sub:"How far below the top of the dash the instrument binnacle sits, measured in dial radii so it scales with the cluster rather than the screen. Bigger drops it. Each car's DASH_STYLE adds a small offset of its own on top, because a 9000's flat cowl genuinely sits lower in the scuttle than a 9-5's deep hood \u2014 this is the master."},
  {path:"CAM.h", nm:"Eye height", unit:"m", min:0.9, max:2.2, step:0.02,
   sub:"Camera eye height above the road. Feeds nothing physical \u2014 sit low like a kart or high like the parts van."},
  {path:"CAM.fov", nm:"Field of view", unit:"rad", min:0.6, max:1.6, step:0.02,
   sub:"Projection field of view. Wide feels faster and bends the apex; narrow is the telephoto touge documentary look."},
  {path:"CAM.draw", nm:"Draw distance", unit:"slices", min:40, max:200, step:5,
   sub:"Render distance in 3.2 m slices. More slices, more mountain, more work per frame \u2014 the one knob here that costs performance."}]},
 {sec:"ROAD TYPES \u2014 LANES & CENTRELINE", cat:"road", rows:[
  {path:"PROF.hw4.laneW", nm:"4-LANE \u2014 lane width", unit:"m", min:2.4, max:4.8, step:0.05,
   sub:"Lane width on the divided 2+2 motorway. Lane centres, drivable edge and half-width all derive from it \u2014 slide it and the painted world reflows around you."},
  {path:"PROF.hw4.cGap", nm:"4-LANE \u2014 centreline gap", unit:"m", min:0, max:2.4, step:0.05,
   sub:"Half-gap at the centreline on the divided 2+2 motorway: how far lane one sits off the paint (or the median). More gap, more breathing room against oncoming."},
  {path:"PROF.hw6.laneW", nm:"6-LANE \u2014 lane width", unit:"m", min:2.4, max:4.8, step:0.05,
   sub:"Lane width on the big 3+3 motorway. Lane centres, drivable edge and half-width all derive from it \u2014 slide it and the painted world reflows around you."},
  {path:"PROF.hw6.cGap", nm:"6-LANE \u2014 centreline gap", unit:"m", min:0, max:2.4, step:0.05,
   sub:"Half-gap at the centreline on the big 3+3 motorway: how far lane one sits off the paint (or the median). More gap, more breathing room against oncoming."},
  {path:"PROF.rural2.laneW", nm:"LANDSV\u00C4G \u2014 lane width", unit:"m", min:2.4, max:4.8, step:0.05,
   sub:"Lane width on the rural two-lane. Lane centres, drivable edge and half-width all derive from it \u2014 slide it and the painted world reflows around you."},
  {path:"PROF.rural2.cGap", nm:"LANDSV\u00C4G \u2014 centreline gap", unit:"m", min:0, max:2.4, step:0.05,
   sub:"Half-gap at the centreline on the rural two-lane: how far lane one sits off the paint (or the median). More gap, more breathing room against oncoming."},
  {path:"PROF.one2.laneW", nm:"ONE-WAY x2 \u2014 lane width", unit:"m", min:2.4, max:4.8, step:0.05,
   sub:"Lane width on two lanes, one direction. Lane centres, drivable edge and half-width all derive from it \u2014 slide it and the painted world reflows around you."},
  {path:"PROF.one2.cGap", nm:"ONE-WAY x2 \u2014 centreline gap", unit:"m", min:0, max:2.4, step:0.05,
   sub:"Half-gap at the centreline on two lanes, one direction: how far lane one sits off the paint (or the median). More gap, more breathing room against oncoming."},
  {path:"PROF.one1.laneW", nm:"ONE-WAY \u2014 lane width", unit:"m", min:2.4, max:4.8, step:0.05,
   sub:"Lane width on single one-way ribbon. Lane centres, drivable edge and half-width all derive from it \u2014 slide it and the painted world reflows around you."},
  {path:"PROF.one1.cGap", nm:"ONE-WAY \u2014 centreline gap", unit:"m", min:0, max:2.4, step:0.05,
   sub:"Half-gap at the centreline on single one-way ribbon: how far lane one sits off the paint (or the median). More gap, more breathing room against oncoming."},
  {path:"PROF.gravel.laneW", nm:"GRUSV\u00C4G \u2014 lane width", unit:"m", min:2.4, max:4.8, step:0.05,
   sub:"Lane width on the gravel road. Lane centres, drivable edge and half-width all derive from it \u2014 slide it and the painted world reflows around you."},
  {path:"PROF.gravel.cGap", nm:"GRUSV\u00C4G \u2014 centreline gap", unit:"m", min:0, max:2.4, step:0.05,
   sub:"Half-gap at the centreline on the gravel road: how far lane one sits off the paint (or the median). More gap, more breathing room against oncoming."},
  {path:"PROF.dirt.laneW", nm:"SKOGSV\u00C4G \u2014 lane width", unit:"m", min:2.4, max:4.8, step:0.05,
   sub:"Lane width on the forest dirt track. Lane centres, drivable edge and half-width all derive from it \u2014 slide it and the painted world reflows around you."},
  {path:"PROF.dirt.cGap", nm:"SKOGSV\u00C4G \u2014 centreline gap", unit:"m", min:0, max:2.4, step:0.05,
   sub:"Half-gap at the centreline on the forest dirt track: how far lane one sits off the paint (or the median). More gap, more breathing room against oncoming."}]},
 {sec:"WORLD GENERATOR", cat:"world", rows:[
  {path:"GEN.straightP", nm:"Straight probability", unit:"", min:0.02, max:0.5, step:0.01,
   sub:"Chance a generated segment is a straight rather than a corner. Driving mode multiplies this: racing stretches it, Arcade Drift halves it."},
  {path:"GEN.straightLen", nm:"Straight length span", unit:"m", min:40, max:600, step:10,
   sub:"How long straights can run (70 m + this). Racing mode multiplies for proper flat-out sections."},
  {path:"GEN.degMin", nm:"Corner sweep \u2014 min", unit:"\u00B0", min:2, max:30, step:1,
   sub:"Minimum corner sweep in degrees. The gentlest kink the generator will bother drawing."},
  {path:"GEN.degSpan", nm:"Corner sweep \u2014 span", unit:"\u00B0", min:20, max:130, step:2,
   sub:"Degrees of sweep on top of the minimum. High span means the hairpins wrap properly around the mountain."},

  // That's the "crash into nothing" at a narrowing. The width now tapers over

  // got. A bought file cannot know; a hand-written one can.

  // A home tuner has no stage to buy — the hardware is the only ceiling, so DIY

  // You still have to not detonate it: bKnock and the cut are both live below.

    diesel:dz, spoolRpm: dz?1300:1900, bpStart: dz?3400:4400,
    dReqT: dz? (r)=>Math.max(0.55, 1-Math.max(0,(r-2600)/2600)*0.22) : (r)=>1,
    dsSmoke: dsSmoke(),                          // fuel ahead of air, 0 when balanced

    airK: fuel.airK||1,                             // LPG vapor displaces intake charge

        * (S.parts.fpr?1.06:1) * (S.parts.rail?1.05:1)
        * dsFuel()                     // ← nozzles and pump, on the oil-burners only
        * ((fuel.stoich||14.7)/14.7)   // stock pump pressure sags at flow; E85 drinks 50% more volume
        * sealFlowK()                  // ...and perished seals leak what is left ← ethanol
        * (ethOf()>ethTol()? 1-Math.min(0.22,(ethOf()-ethTol())*0.30) : 1),

    // A PORTED HEAD IS A FLOW MOD, so it belongs in exactly the same term as the

    // block first and the compressor you bolt on afterwards has less to fight.

    // with breathes a LITTLE worse each tier down — the tuner's ceiling truth
    // WHAT YOU BUILT STAYS BUILT. Applied whether or not a turbo is now bolted to
    // it, because a ported head and 11.5:1 pistons do not stop flowing the day the

  // last solver iteration, which used to read as "turbo" — telling a man whose
  // table only asks for 350 Nm that his GT3076 is out of flow. If nothing beats
  // the request by more than solver noise, the request is the limit.

                 breathing:"BREATHING — the head, cams and exhaust are the wall now. Port it, cam it, or rev it harder — there is no boost coming.",
                 fuel:"FUEL — injectors/pump are out; more boost just leans it",
                 block:"BLOCK — the bottom end and head are the wall now",
                 knock:"KNOCK — charge too hot for this octane; cool it or back off",
                 clutch:"CLUTCH — it is slipping what you already made",
                 "boost cut":"OVERBOOST CUT — the ECU is shutting the fuel off"};
function t7DynoSVG(){
  const pts=estCurve(), trim=TRIMS[S.trim], T=CFG.T7, t=S.t7||t7Default();
  const W2=320,H2=210,mx=34,my=12,pw=W2-mx-30,ph=H2-my-46;
  const red=redlineNow();
  const tqMax=Math.max(150,...pts.map(q=>q.tq))*1.10;
  const hpMax=Math.max(100,...pts.map(q=>q.hp))*1.10;
  const boMax=Math.max(60, t.boostCut, ...pts.map(q=>q.boost))*1.10;
  const X=r=>mx+pw*(r-1600)/Math.max(1,red-1600);
  const Yt=v=>my+ph*(1-v/tqMax), Yh=v=>my+ph*(1-v/hpMax), Yb=v=>my+ph*(1-v/boMax);
  const path=(Y,f)=>pts.map((q,i)=>(i?"L":"M")+X(q.r).toFixed(1)+","+Y(f(q)).toFixed(1)).join(" ");
  let grid="";
  for(let g=100;g<tqMax;g+=100) grid+='<line x1="'+mx+'" y1="'+Yt(g).toFixed(1)+'" x2="'+(mx+pw)+'" y2="'+Yt(g).toFixed(1)+'" stroke="#24272d" stroke-width="1"/>'
    +'<text x="'+(mx-3)+'" y="'+(Yt(g)+3).toFixed(1)+'" fill="#5c6068" font-size="8" text-anchor="end">'+g+'</text>';
  // the three breakpoints you are actually editing
  let bps="";
  [[T.rpmLo,"LOW"],[T.rpmMid,"MID"],[T.rpmHi,"HIGH"]].forEach(([r,lb])=>{
    if(r>red+40) return;
    bps+='<line x1="'+X(r).toFixed(1)+'" y1="'+my+'" x2="'+X(r).toFixed(1)+'" y2="'+(my+ph)+'" stroke="#3d434c" stroke-width="1" stroke-dasharray="2 3"/>'
       +'<text x="'+X(r).toFixed(1)+'" y="'+(my+ph+21)+'" fill="#7b828c" font-size="7" text-anchor="middle">'+lb+'</text>';
  });
  // the overboost cut, on the boost axis
  const cutY=Yb(t.boostCut);
  const cutLine=(cutY>my-2&&cutY<my+ph)
    ? '<line x1="'+mx+'" y1="'+cutY.toFixed(1)+'" x2="'+(mx+pw)+'" y2="'+cutY.toFixed(1)+'" stroke="#ff4d6a" stroke-width="1" stroke-dasharray="5 3" opacity="0.75"/>'
      +'<text x="'+(mx+pw+2)+'" y="'+(cutY+3).toFixed(1)+'" fill="#ff4d6a" font-size="7">CUT</text>' : '';
  // binding-limit strip: one cell per sample, the sim's own answer
  let strip="", cw=pw/Math.max(1,pts.length-1);
  pts.forEach((q,i)=>{ strip+='<rect x="'+(X(q.r)-cw/2).toFixed(1)+'" y="'+(my+ph+3)+'" width="'+(cw+0.6).toFixed(1)
    +'" height="7" fill="'+(T7_LIMCOL[q.who]||"#6b7280")+'" opacity="0.92"/>'; });
  const pk=pts.reduce((a,q)=>q.hp>a.hp?q:a,pts[0]), pkT=pts.reduce((a,q)=>q.tq>a.tq?q:a,pts[0]);
  const amb=WX_AMB[S.wx?S.wx.type:"clear"];
  return '<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;background:#0f1116;border:1px solid #2c2f36;border-radius:6px">'
    +grid+bps+cutLine
    +'<path d="'+path(Yb,q=>q.boost)+'" fill="none" stroke="#4a9edd" stroke-width="1.2" opacity="0.85"/>'
    +'<path d="'+path(Yt,q=>q.tq)+'" fill="none" stroke="#e0a53a" stroke-width="2"/>'
    +'<path d="'+path(Yh,q=>q.hp)+'" fill="none" stroke="#dfe3ea" stroke-width="2"/>'
    +strip
    +'<text x="'+(mx+4)+'" y="'+(my+10)+'" fill="#dfe3ea" font-size="9">'+pwrStr(pk.hp)+' @ '+pk.r+'</text>'
    +'<text x="'+(mx+4)+'" y="'+(my+21)+'" fill="#e0a53a" font-size="9">'+tqStrU(pkT.tq)+' @ '+pkT.r+'</text>'
    +'<text x="'+(mx+4)+'" y="'+(my+32)+'" fill="#4a9edd" font-size="8">boost peak '+boostU(Math.max(...pts.map(q=>q.boost)))+'</text>'
    +'<text x="'+(mx+pw-2)+'" y="'+(my+10)+'" fill="#5c6068" font-size="8" text-anchor="end">'+amb+'\u00B0C \u00B7 '+(S.wx?S.wx.type:"clear")+'</text>'
    +'<text x="'+(mx+pw-2)+'" y="'+(my+21)+'" fill="#5c6068" font-size="8" text-anchor="end">limiter '+red+'</text>'
    +'<text x="'+mx+'" y="'+(my+ph+31)+'" fill="#5c6068" font-size="7">what is holding it back, rpm by rpm \u2191</text>'
    +'</svg>';
}
function t7Probe(rpm){          // one honest sample at a breakpoint
  const {trim,tune,C,amb}=wotEnv();
  return wotPoint(Math.min(rpm,redlineNow()),trim,tune,C,amb,false);
}
/* WHAT THE HARDWARE WILL ACTUALLY TAKE. Not a clamp — a line drawn on the
   bench. You may type anything you like past it; the number turns orange, the
   row tells you what is going to happen, and then it happens. */
function t7Env(){
  const trim=TRIMS[S.trim], C=hwCeils(), t=S.t7||t7Default();
  const naMax=veCurve(4200)*trim.disp/4*CFG.ENG.AIR_MG_PER_L*(C.naVe||0.9);
  return {
    boost: Math.max(0,Math.round(C.boostCeil)),          // past this the wastegate is asking for air the compressor has not got
    tq:    Math.round(Math.max(trim.tqNm, C.mgcHW*CFG.DRV.tqPerMg - engFric(4200))),
    rev:   t7RevCeil(),                                   // past this the bottom end starts keeping score
    cutMin:Math.max.apply(null,t.boost||[0]),             // a cut under your own table cuts on every pull
    safeMin:0.85, safeMax:1.15,
    noTurbo: !(C.boostCeil>0)
  };
}
/* T5 EDITS. No clamps beyond sanity, same as the T7 bench — but every change is
   only a change in RAM until you burn it, which is the T5 experience in one line. */
function t5Adjust(key,dir){
  const T=CFG.T7;
  if(!S.t5 || !S.t5.on) S.t5=t5Default();
  const t=S.t5, g=(x,lo,hi)=>Math.max(lo,Math.min(hi,x));
  if(key==="reset"){ const b=S.t5.burns||0; S.t5=t5Default(); S.t5.burns=b; return; }
  // MATCH THE APC CELLS EXACTLY. `key[0]==="a"` also matched "adv", so every
  // ignition edit went into t.apc[+"d"] — apc[NaN] — and silently did nothing at
  // all while appearing to work. a0/a1/a2 only.
  if(/^a[0-9]$/.test(key)){ const i=+key[1]; t.apc[i]=g(Math.round(t.apc[i]+dir*T.apcStep), 0, 900); }
  else if(key==="fuel") t.fuel   = +(g((t.fuel||1)+dir*T.fuelStep, 0.70, 1.60)).toFixed(2);
  else if(key==="adv")  t.adv    = +(g((t.adv||0)+dir*T.t5AdvStep, -20, 20)).toFixed(1);
  else if(key==="rev")  t.revLim = g(t.revLim + dir*T.revStep, 1500, 14000);
  else if(key==="cut")  t.boostCut=g(t.boostCut + dir*T.apcStep, 0, 900);
  else if(key==="safe") t.safe   = +(g((t.safe||1)+dir*T.safeStep, 0.30, 2.00)).toFixed(2);
  S._cutToast=0;
}
function t7Adjust(key,dir){
  const T=CFG.T7;
  if(!S.t7 || !S.t7.on) S.t7=t7Default();
  const t=S.t7;
  // GUARDS, NOT LIMITS. These only exist so a value cannot become NaN, negative
  // airmass or an infinity that poisons the whole sim. Everything a human would
  // recognise as "too much" is allowed through on purpose — the bench turns it
  // orange and the engine settles the argument later.
  const g=(x,lo,hi)=>Math.max(lo,Math.min(hi,x));
  if(key==="reset"){ S.t7=t7Default(); S._cutToast=0; clearCodes(); return; }
  if(key==="tuner"){
    if(S.kr<5000 || !experimentalFitted()) return;
    S.kr-=5000; S.t7=tunerBaseMap(); S._cutToast=0; clearCodes();
    toast("\u2691 Five grand and an afternoon later. It is not the last word \u2014 he has "
      +"left margin everywhere and you can feel it \u2014 but it drives properly, it is safe, "
      +"and the tables are yours to argue with from here.");
    return; }
  if(key==="inherit"){ const kp=S.prov; S.prov=S.provLast||"maptun";
    let m; try{ m=t7FromCurrent(); } finally { S.prov=kp; }
    S.t7=m; S._cutToast=0; return; }
  if(key[0]==="q"){ const i=+key[1]; t.tq[i]=g(Math.round(t.tq[i]+dir*T.tqStep), 0, 3000); }
  else if(key[0]==="b"){ const i=+key[1]; t.boost[i]=g(Math.round(t.boost[i]+dir*T.boostStep), 0, 900); }
  else if(key==="rev")  t.revLim  = g(t.revLim + dir*T.revStep, 1500, 14000);
  else if(key==="cut")  t.boostCut= g(t.boostCut + dir*T.boostStep, 0, 900);
  else if(key==="safe") t.safe    = g(+(t.safe + dir*T.safeStep).toFixed(2), 0.30, 2.00);
  else if(key==="inj")  t.injCal  = t.injCal?0:1;
  else if(key==="adv")  t.adv     = +(g((t.adv||0)+dir*T.advStep, -20, 20)).toFixed(1);
  else if(key==="lam")  t.lam     = +(g((t.lam||1)+dir*T.lamStep, 0.55, 1.25)).toFixed(2);
  else if(key==="wgp")  t.wgP     = +(g((t.wgP||1)+dir*T.wgStep, 0.30, 3.00)).toFixed(2);
  else if(key==="wgi")  t.wgI     = +(g((t.wgI||0)+dir*T.wgIStep, 0, 2.00)).toFixed(2);
  else if(key==="g1")   t.g1      = g(Math.round((t.g1||230)+dir*T.gearStep), 0, 2000);
  else if(key==="g2")   t.g2      = g(Math.round((t.g2||310)+dir*T.gearStep), 0, 2000);
  else if(key==="iat")  t.iatComp = +(g((t.iatComp||0)+dir*T.iatStep, 0, 4)).toFixed(2);
  S._cutToast=0;                 // new numbers earn a fresh warning if they still cut
}
function estDyno(){ // peak power/torque + binding limit, from the same sweep
  const {trim,tune,C,amb}=wotEnv();
  let hpBest=0,tqBest=0,rpmPk=0,limit="request";
  for(let r=2200;r<=redlineNow();r+=100){
    const p=wotPoint(r,trim,tune,C,amb,false);
    if(p.tq>tqBest)tqBest=p.tq;
    if(p.hp>hpBest){hpBest=p.hp;rpmPk=r;limit=(p.tq>=clutchCap()-1)?"clutch":p.who;}
  }
  return {hp:Math.round(hpBest), tq:Math.round(tqBest), rpm:rpmPk, limit};
}
/* ============================ DYNO SELF-TEST ============================
   THIRD-PASS NOTE TO THE NEXT ROBOT: the engine tuning has been re-broken
   twice. It happens when someone "optimizes" a constant and re-strangles the
   turbo trims (classic symptom: the Viggen makes ~170 hp instead of 230).
   These are CRANK-PS brochure figures for the FACTORY car (tune 0, no parts,
   95 RON, clear/20°C). If you touch engine math, run dynoSelfTest() and keep
   it GREEN. Do NOT "fix" a green trim down to make it feel slower — tune the
   AI / gearing / weight instead. A trim only makes rated power if the turbo
   can FLOW the airmass it needs (turbo.mgcMax + the knock-limited boost cap):
   shrink either and you re-strangle it, which is exactly the recurring bug.
   Sources: SaabCentral engine/turbo matrix, carfolio, automobile-catalog,
   ultimatespecs, zeperfs (see LIBRARY tab).                                */
/* @A-DYNOTARGETS */
const DYNO_TARGETS = [ // [trimId, hpPS, tqNm, tolHp%, tolTq%]
  [0,130,177,7,6],[1,154,240,6,6],[2,185,263,6,6],
  [3,205,280,8,6],[4,230,350,7,6],[5,115,260,8,7],[6,150,320,8,7],
  [7,150,240,8,7],[8,175,265,8,7],[9,210,300,8,7],     // the Sport Sedans
  [10,150,212,8,7],[11,155,240,8,7],[12,185,263,8,7],[13,200,265,8,7],   // 900 NG
  [14,170,263,8,7],
  // The Aero's widened torque band is gone: it was a workaround for a bug, not a
  // property of the car. It lands at 226/338 against 225/342 on the fuel it was
  // actually rated on, so it gets the same tolerance as everything else.
  [15,225,342,8,7],
  [16,170,280,8,7],[17,250,350,8,7],                   // 9-5
  [18,120,260,9,8],[19,120,280,9,8],[20,150,320,9,8],  // the oil-burners
  [21,180,400,9,8],[22,150,320,9,8]
];
/* STAGE MATRIX SELF-TEST. The factory figures only ever prove tune 0. This walks
   EVERY house and EVERY stage that house actually supplies, fits exactly the
   hardware that stage requires (prerequisites and all), and reports what comes
   out. It is the test that catches a renumbered ladder, a stage whose torque
   request went backwards, or a house quietly writing a file it should refuse.
   Three invariants, checked rather than assumed:
     1. power must never go DOWN as the ladder goes up, on any house
     2. no house may deliver a stage above its own maxStage
     3. the same stage on two houses may differ by their published character,
        but never by more than 12%                                           */
/* Which car the stage matrix is run on. The Viggen is the reference because every
   house writes a file for it, but the matrix now also spot-checks one car from
   each management era so a regression on a T5 or T8 ladder cannot hide behind a
   green Viggen row. */
function ecuLabel(ti){ const e=ENGINES[(TRIMS[ti]||{}).eng];
  return ECU_NAMES[e?e.ecu:"t7"]||"Trionic 7"; }
function matrixCars(){
  const out=[4];                                        // the Viggen, always
  for(const era of ["t5","t8"]){
    for(let i=0;i<TRIMS.length;i++){
      const e=ENGINES[TRIMS[i].eng];
      if(e && e.ecu===era && !TRIMS[i].diesel){ out.push(i); break; }
    }
  }
  return out;
}
function stageMatrix(){
  const save={trim:S.trim,tune:S.tune,parts:JSON.parse(JSON.stringify(S.parts||{})),
    turboKey:S.turboKey,fuel:S.fuel,prov:S.prov,t7:S.t7,wx:JSON.parse(JSON.stringify(S.wx))};
  const rows=[], fails=[], notes=[];
  try{
    for(const MTRIM of matrixCars()){
    // each car is graded against ITS OWN stock file, not the Viggen's 239 hp
    S.trim=MTRIM; S.tune=0; S.parts={}; S.turboKey=null; S.t7=null;
    S.prov="maptun"; S.fuel=TRIMS[MTRIM].refFuel||"prem91e0"; S.wx={type:"clear"};
    const stockHp=estDyno().hp;
    for(const h of PROVIDERS){
      if(h.diy) continue;
      const cells=[]; let prevHp=0;
      for(const tn of TUNES){
        if(tn.id>0){ S.prov=h.id; S.tune=0; }
        S.trim=MTRIM; S.parts={}; S.turboKey=null; S.t7=null;
        S.fuel=TRIMS[MTRIM].refFuel||"prem91e0"; S.prov=h.id; S.wx={type:"clear"}; S.tune=0;
        if(tn.id>houseMaxStage()){ cells.push({id:tn.id,na:true}); continue; }
        // (a) THE FILE ON ITS OWN. Bought and flashed onto whatever the car came
        //     with — which is what most people actually do, and the honest measure
        //     of what a remap is worth before you spend on hardware.
        S.tune=tn.id;
        const dBare=estDyno();
        // (b) THE FILE WITH WHAT IT ASKS FOR, prerequisites walked.
        const want=[]; for(let st=1; st<=tn.id; st++) for(const id of (TUNES[st].need||[])) partChain(id,want);
        for(const id of want){ const pp=PARTS.find(q=>q.id===id);
          if(pp){ S.parts[id]=true;
            if(pp.turbo && turboOrder(pp.turbo)>turboOrder(S.turboKey||TRIMS[MTRIM].turbo)) S.turboKey=pp.turbo; } }
        const d=estDyno();
        // A DROP SOMETHING ELSE CAUSED IS NOT A LADDER FAULT. Three real ones:
        //   knock / fuel — the tank cannot feed the stage you bought
        //   block        — the bottom end is already the wall, so a bigger turbo
        //                   delivers the SAME airmass at far higher pressure, which
        //                   means hotter, which means less torque. Measured on the
        //                   2.0i: stage 5 makes 290 hp at 206 kPa and stage 6 makes
        //                   276 at 273, both pinned to blockMgc 1275. The ladder is
        //                   honest; the block is the problem, and the game already
        //                   sells the answer (forged pistons, stage 7).
        // Flagged as notes so a genuine ladder regression cannot hide among them.
        const back = tn.id>0 && d.hp < prevHp-1;
        const notLadder = back && (d.limit==="knock" || d.limit==="fuel" || d.limit==="block");
        if(back && !notLadder)
          fails.push(TRIMS[MTRIM].nm+" / "+h.nm+" stage "+tn.id+" makes LESS than stage "+(tn.id-1)+" ("+d.hp+" < "+prevHp+")");
        else if(notLadder)
          notes.push(TRIMS[MTRIM].nm+" / "+h.nm+" stage "+tn.id+": "+d.hp+" hp, down from "+prevHp
            +" — "+d.limit+"-limited. "
            +(d.limit==="block"? "The bottom end is the wall, so more turbo only means hotter air. Forge it."
                               : "The stage is fine; the tank is the problem."));
        // a file must never make the car WORSE on the hardware it arrived with
        if(tn.id>0 && dBare.hp < stockHp-1)
          fails.push(TRIMS[MTRIM].nm+" / "+h.nm+" stage "+tn.id+" on stock hardware makes "
            +dBare.hp+" hp, BELOW its own stock file ("+stockHp+")");
        // ...and the hardware must never be a downgrade either
        if(d.hp < dBare.hp-1)
          fails.push(TRIMS[MTRIM].nm+" / "+h.nm+" stage "+tn.id+": fitting the supporting hardware LOSES power ("+d.hp+" < "+dBare.hp+")");
        prevHp=d.hp;
        cells.push({id:tn.id,hp:d.hp,bare:dBare.hp,tq:d.tq,lim:d.limit,back});
      }
      rows.push({house:h,cells,trim:MTRIM,stockHp});
    }
    }
    // ISOLATION PROOF — the guard for "do not break the other trims to cram this
    // in". Force every NA-path part onto every NON-NA trim; the dyno must not move
    // by a single horsepower or newton-metre.
    for(let ti=0; ti<TRIMS.length; ti++){
      if(TRIMS[ti].turbo==="na") continue;
      S.trim=ti; S.tune=0; S.turboKey=null; S.t7=null; S.prov="maptun";
      S.fuel=TRIMS[ti].diesel?"diesel":(TRIMS[ti].refFuel||"prem91e0"); S.wx={type:"clear"};
      S.parts={}; const clean=estDyno();
      S.parts={header:true,port:true,cams:true,hicomp:true}; const dirty=estDyno();
      if(clean.hp!==dirty.hp || clean.tq!==dirty.tq)
        fails.push("NA parts LEAKED into "+TRIMS[ti].nm+": "+clean.hp+"/"+clean.tq+" -> "+dirty.hp+"/"+dirty.tq);
      S.parts={};
    }
    for(const ct of matrixCars()) for(const tn of TUNES){
      const got=rows.filter(r=>r.trim===ct).map(r=>r.cells.find(c=>c.id===tn.id)).filter(c=>c&&!c.na).map(c=>c.hp);
      if(got.length>1){ const lo=Math.min.apply(null,got), hi=Math.max.apply(null,got);
        if(hi>lo*1.18) fails.push(TRIMS[ct].nm+" stage "+tn.id+" varies "+Math.round((hi/lo-1)*100)+"% between houses ("+lo+"-"+hi+" hp)"); }
    }
  } finally { Object.assign(S,save); }
  return {rows,fails,notes,pass:fails.length===0};
}
function dynoSelfTest(log){
  const save={trim:S.trim,tune:S.tune,parts:S.parts,turboKey:S.turboKey,fuel:S.fuel,prov:S.prov,
    t7:S.t7, engHealth:S.engHealth, o2Foul:S.o2Foul, knockCount:S.knockCount,
    wx:JSON.parse(JSON.stringify(S.wx))};
  let pass=true, lines=[];
  for(const [id,hp,tq,th,tt] of DYNO_TARGETS){
    // THE REFERENCE FUEL IS PART OF THE RATING. A 1993 9000 Aero's 225 hp was
    // measured in Europe on 98 RON; dynoing it on American 91 E0 and calling the
    // shortfall a calibration error is testing the wrong car. The 9-3 OG figures
    // in this game were always quoted on 91 E0, so they stay there.
    // AND A CLEAN ENGINE. This ran at setTimeout(0) on a state that had not been
    // through a single frame yet, so engine health, o2 fouling and knock adaptation
    // were whatever the default state left them — and the boot card graded a 900 SE
    // 2.0T at 149 hp while the identical call later in the session gave 175. A
    // reference bench must reset EVERY input it reads, not most of them.
    S.trim=id; S.tune=0; S.parts={}; S.turboKey=null; S.t7=null;
    S.engHealth=100; S.o2Foul=0; S.knockCount=0;
    if(S.eng){ S.eng.knockAdapt=0; S.eng.knockEvt=0; S.eng.iat=20; S.eng.icT=20; S.eng.coolT=90; }
    S.fuel=TRIMS[id].diesel?"diesel":(TRIMS[id].refFuel||"prem91e0");
    S.prov="maptun"; S.wx={type:"clear"};
    const d=estDyno();
    const eh=Math.abs(d.hp-hp)/hp*100, et=Math.abs(d.tq-tq)/tq*100, ok=eh<=th&&et<=tt;
    pass=pass&&ok;
    lines.push((ok?"OK   ":"FAIL ")+(TRIMS[id].nm+"                  ").slice(0,18)+" "+d.hp+"hp/"+d.tq+"Nm  (rated "+hp+"/"+tq+", err "+eh.toFixed(0)+"%/"+et.toFixed(0)+"%)");
  }
  Object.assign(S,save);
  if(log!==false){ console.log("DYNO SELF-TEST — "+(pass?"PASS":"*** FAIL — engine tuning is booger'd again ***")); lines.forEach(l=>console.log(l)); }
  const M=stageMatrix();
  if(log!==false){
    console.log("STAGE MATRIX (91 E0, each stage with the hardware it needs) — "
      +(M.pass?"PASS":"*** FAIL ***"));
    let lastT=-1;
    for(const r of M.rows){
      if(r.trim!==lastT){ lastT=r.trim;
        console.log("  "+TRIMS[r.trim].nm+"  ·  "+(ENGINES[TRIMS[r.trim].eng]||{}).nm
          +"  ·  "+ecuLabel(r.trim)+"  ·  stock "+r.stockHp+" hp");
        console.log("                     "+TUNES.map(t=>("S"+t.id).padStart(7)).join("")); }
      console.log("  "+(r.house.nm+"                   ").slice(0,19)
        +r.cells.map(c=>(c.na?"—":String(c.hp)).padStart(7)).join("")+"   (with hardware)");
      console.log("                     "
        +r.cells.map(c=>(c.na?"—":String(c.bare)).padStart(7)).join("")+"   (file alone)");
    }
    M.fails.forEach(f=>console.log("  *** "+f));
    (M.notes||[]).forEach(f=>console.log("  · note: "+f));
  }

  if(S.engHealth===undefined)S.engHealth=100;

    // where the angle is genuinely needed to follow the road or cut an apex.

    // shifts you, so the wheel would feel dead parking or pulling out of a siding.

    // it can never shove the AI sideways when it slows for a tight corner.

  // bench (engine sound, panels straight) earns up to +15%; a limping wreck
  // earns the old base rate. The repair bill comes back as wages.
  const cond=Math.max(0,Math.min(1,(S.engHealth===undefined?100:S.engHealth)/100))

/* ============================ DRIVER AI ================================= */
/* Looks ahead, finds the tightest upcoming curvature, computes the physics
   speed limit v = sqrt(mu_lat * g * R), targets ~88% of it (skill hook),
   requests torque / brake like a right foot, steers pure-pursuit.
   ── ONE GRIP MODEL ──────────────────────────────────────────────────────
   The planner used to guess grip with a hand-tuned 0.92 that drifted out of
   step with the physics in CFG.GRIP; the CONFIG tab claimed the AI "reads the
   same budget" and it didn't, so nudging MU0 quietly made the robot over- or
   under-drive its own tyres, and three separate corner-speed copies disagreed
   about whether the surface even mattered. Both helpers below now spend the
   SAME budget the vehicleStep grip circle does — MU0, the cornering part
   bonuses, and muRoad(s) (weather + snow + ice + loose penalty, worst case per
   wheeltrack) — behind one explicit confidence sandbag (CFG.AI.GRIP_CONF).   */
function aiCornerMu(sPos){          // lateral grip the AI dares to plan against at s
  const G=CFG.GRIP;
  const parts=(S.parts.susp?G.SUSP:1)*(S.parts.lsd?G.LSD_CORNER:1)*(S.parts.arb?G.ARB_CORNER:1);
  // ← @A-TYRES. The planner sees exactly the rubber the chassis is standing on,
  // so a bald car brakes earlier and corners slower BECAUSE the driver knows it
  // is bald, not because a separate difficulty number was turned down.
  return G.MU0*CFG.AI.GRIP_CONF*parts*muRoad(sPos)*tyreMu();
}
function aiCornerV(sPos){            // honest grip-limited corner speed (m/s); Infinity on a straight.

  return cv>1e-5 ? Math.sqrt(aiCornerMu(sPos)*CFG.G/cv) : Infinity; // never in here — the ceiling
}                                   // and the licensed stretch on top of it stay separate.

              racing:{cap:1,aggrK:1.6,marginK:0.72,coolK:0.5,add:0.06,tcs:0,leftV:999,lane3:1,laneAuth:4},
              // DRIFT = RACING + STYLE. Identical appetite for a gap (always pass
              // if there's room, lanes gated by the licence); the only difference

              // on the stopwatch because a real FWD slide costs time — not

              drift:{cap:1,aggrK:1.6,marginK:0.72,coolK:0.5,add:0.06,tcs:0,leftV:999,drift:1,lane3:1,laneAuth:4}}[S.aiMode]||

    // road's edge — so every six-lane→four-lane, every motorway→landsväg, silently
    // handed the car back to autonomous cruise, which then migrated right. That is
    // the "it won't stay in the lane I put it in" bug: you never released the lane,

    { // don't bounce back into a queue: prefer the lane with real headway
      let gL=1e9,gR=1e9;
      for(const c of S.traffic){ if(c.dir>0&&c.s>v.s){ const g=c.s-v.s;
        if(Math.abs(c.lane-LN_L)<1.2)gL=Math.min(gL,g);
        if(Math.abs(c.lane-LN_R)<1.2)gR=Math.min(gR,g); } }
      if(homeLane===LN_L && gR>gL+30) homeLane=LN_R;
      else if(homeLane===LN_R && gL>gR+30 && d.homeL!==false && v.v>MODE.leftV-4) homeLane=LN_L;
    }
    if(homeLane===LN_L){ // keep-right courtesy for someone genuinely quicker
      for(const c of S.traffic){ if(c.dir>0 && Math.abs(c.lane-LN_L)<1 && c.s<v.s && v.s-c.s<48 && c.v>v.v+1){ homeLane=LN_R; break; } }
    }
    { // NEVER merge home into occupied space — stay in the lane you're in
      let occ=false;
      for(const c of S.traffic){ if(c.dir>0 && Math.abs(c.lane-homeLane)<1 && c.s>v.s-16 && c.s<v.s+16+v.v*0.9){ occ=true; break; } }
      if(occ && Math.abs(v.lane-homeLane)>1.7) homeLane=(homeLane===LN_L)?LN_R:LN_L;
    }
  }
  // ── PULLING INTO THE SIDING ───────────────────────────────────────────
  // Treated as an ordinary lane change into an ordinary lane: aim at its
  // centre, ease down, and let the parking logic below bring us to rest. Any
  // hint of "go" — throttle, or the wheel toward the road — hands it straight
  // back and we rejoin. No modal state, nothing to fight.
  { const sLane=sidingLaneAt(v.s);
    const wantOut = S.input.gas || (S.input.steerOn && S.input.steer<-0.12);
    if(wantOut) d.pullIn=0;
    else if(d.restYield && S.input.steerOn && S.input.steer>0.12) d.pullIn=1;   // your hands ask
    else if(d.restYield && d.restWait && !d.pullIn && v.lane>LN_R-0.9) d.pullIn=1;
    if(!sLane) d.pullIn=0;
    if(d.pullIn && sLane!=null){
      d.homeLane=sLane; d.heldLane=sLane;                 // it IS our lane now
      d.vTarget=Math.min(d.vTarget, 7+Math.max(0,(sLane-v.lane))*1.5);
    } else if(sLane!=null && v.lane>edgeAt(v.s)-0.2 && wantOut){
      d.heldLane=null; d.holdResume=null;                 // rejoining: hand the lane back for good
    }
  }
  if(d.restYield){
    // MOVE OVER, DON'T JUST DAWDLE. The old behaviour was to slow in the right
    // lane whether or not anything required it, which turned every rest stop
    // into a speed bump. If there's a free lane to our LEFT (own side only —
    // never the oncoming one) the driver takes it, keeps its pace, and leaves
    // the apron clear for whoever is actually pulling in. It only ends up
    // crawling in the kerb lane when traffic pins it there, or when you take
    // the wheel and head for the apron yourself.
    if(ownD.length>1 && (d.restSide||1)>0 && !S.input.steerOn){
      const away = (homeLane===LN_R)? LN_L : homeLane;    // one lane in from the kerb
      let free=true;
      for(const c of S.traffic){
        if(c.dir>0 && Math.abs(c.lane-away)<1.2 && c.s>v.s-18 && c.s<v.s+26+v.v*1.2){ free=false; break; }
      }
      if(free) homeLane=away;
    }
  }
  // MERGE BEFORE THE NARROWING — as a CRUISE-LANE choice, not a lane hold.
  // (An earlier attempt pinned d.heldLane here, which reads as "I'm holding a
  // lane for a reason" and silently switched the entire overtake machine off:
  // holdOK is (heldLane==null). Bias homeLane instead and passing stays live.)
  // Only engages once the seam is close enough to matter, so it never argues
  // with ordinary lane choice.
  { const look=Math.max(CFG.ROAD.seamBlend, v.v*4.5);
    const ownAh=profAt(v.s+look).own;
    if(ownAh.length && !ownAh.some(l=>Math.abs(l-homeLane)<1.0)){
      let mt=ownAh[0];
      for(const l2 of ownAh) if(Math.abs(l2-homeLane)<Math.abs(mt-homeLane)) mt=l2;
      homeLane=mt;                                  // aim for a lane that will still be there
    }
  }
  d.homeLane=homeLane;
  // scan ahead: braking-distance aware. The horizon is sized by the same
  // deceleration the planner trusts (BRK_SCAN≈BRK_PLAN) so we never look past
  // our own braking point. Straights return Infinity from aiCornerV and simply
  // don't constrain — so the old "|| mR<0.99" guard was a no-op and is gone.
  let vLimit=Infinity, scan=v.v*v.v/(2*CFG.AI.BRK_SCAN)+60;
  for(let s=0;s<scan;s+=12){
    const vc0=aiCornerV(v.s+s);
    if(vc0<Infinity){
      const gS=roadAt(v.s+s).grade;
      const pfAh=profAt(v.s+s);
      // CINEMATIC CARRY (the licensed stretch on top of the honest ceiling):
      // gravel/dirt let a rally-bred Saab lean on the grip that's there instead
      // of tiptoeing, and a committed slide corners past the grip circle because
      // the vehicleStep drift model then delivers the extra lateral. Racing/Drift
      // commit hardest. This is deliberately ABOVE aiCornerV — it's the drama,
      // kept separate from the physics so tuning grip never erases the show.
      const looseCarry=(pfAh.dirt||pfAh.gravel)? (MODE.drift?1.14:1.07) : 1;
      const driftCarry=(MODE.drift && (d.driftA||0)>0.35 ? (S.arcade?1.40:1.18) : 1) * looseCarry;
      const vc=vc0*driftCarry*(1-Math.max(0,-gS)*CFG.AI.GRADE_GRIP);
      // allow higher entry if the curve is far — but gravity eats braking on descents
      const brk=Math.max(CFG.AI.BRK_PLAN_MIN, CFG.AI.BRK_PLAN*muRoad(v.s+s*0.5)*(MODE.tcs?0.78:1)*skillFx().brkK - CFG.G*Math.max(0,-gS)*CFG.AI.GRADE_BRK); // ← CFG.AI
      const vAllow=Math.sqrt(vc*vc+2*brk*s); // calm brakes early
      vLimit=Math.min(vLimit,vAllow);
    }
  }
  const vTop = CFG.AI.V_MAX; // absolute sanity rail (≈280 km/h at the factory value)
  // stock cars cruise with margin; late-tune monsters attack the limit
  // A stock car used to plan at 86% of the grip budget, and traffic doesn't
  // slow for corners at all — so on anything twisty the queue simply walked
  // away and you had to switch to Racing just to keep up. Start higher and let
  // tune widen the gap less: the difference between trims should be power, not
  // an artificial handbrake on the driver.
  const basePush = 0.90 + 0.075*(S.tune/(TUNES.length-1)) + MODE.add;
  // smooth hands waste less of the budget: margin saved becomes pace kept
  let push = Math.min(MODE.cap, basePush*(1+(1-skillFx().marginK)*0.5));
  // STRAIGHT ATTACK: the margin belongs to corner entry, not the flat-out
  // bits. Spirited and up hold the pedal down on a straight — vAllow already
  // banked the braking distance for whatever's coming. Licence tiers close
  // the last of the gap: Körskolan lifts a whisper early, the Viggen pilot
  // simply doesn't. Calm keeps its chauffeur cap; the menu-open guard holds.
  if(!MODE.tcs && !S.menuOpen){
    const cvNear=Math.max(Math.abs(curvAt(v.s+12)), Math.abs(curvAt(v.s+Math.max(24,v.v*1.1))));
    const straightF=Math.max(0,Math.min(1,1-cvNear*340));      // 1 on a true straight, 0 by R≈340 m
    const atk=Math.min(MODE.cap, 0.97 + 0.03*Math.min(1,(S.drvLv||0)/4) + MODE.add);
    push += (Math.max(push,atk)-push)*straightF;
  }
  d.vPlan = Math.min(vLimit, vTop);                             // physics speed the road ahead allows (pre-push) — drives the "lift" cue
  d.vTarget = d.vPlan * push * d.skill/0.95;
  // COMMITTED IN THE ONCOMING LANE = GO. Once we're out there the corner
  // planner was still free to trim the target, so the car would ease off
  // mid-pass, lose the speed advantage that justified it, and still be
  // alongside when the oncoming arrived — then brake, in the worst possible
  // place. While committed, hold at least enough pace to complete: the way out
  // of that lane is forwards. Genuine emergencies (brakeEmg) still override.
  if(d.passState===1 && (d.passLane||0)<0 && d.passTgt){
    d.vTarget=Math.max(d.vTarget, Math.min(vTop, d.passTgt.v+7));
  }
  if(d.restYield){
    // The pace only drops if we're actually the one pulling in: still in the
    // kerb lane (traffic wouldn't let us out), already on the apron, or your
    // hands are steering right / your foot is on the brake. Cleanly past in a
    // left lane? Carry on at pace — no phantom speed bump.
    const inKerb   = v.lane > LN_R-1.2;
    const pullingIn= S.input.steerOn && S.input.steer>0.15;
    if(inKerb || pullingIn || S.input.brake) d.vTarget=Math.min(d.vTarget, d.vRestCap);
  }
  // traffic ahead in my lane? A rig's TRAILER is the thing you actually hit
  // first, and it sits ~10 m behind the cab — scanning only cabs would have the
  // driver measure its gap to a bumper that isn't the nearest one. Follow the
  // rear-most solid part, but keep the CAB as the pass target (you overtake the
  // truck, not the box).
  let lead=null, leadGap=1e9;
  for(const c of S.traffic){
    if(c.dir>0 && c.s>v.s && c.s-v.s<leadGap && Math.abs(c.lane-v.lane)<2.2){lead=c;leadGap=c.s-v.s;}
    if(c.tr && c.dir>0 && c.tr.s>v.s && c.tr.s-v.s<leadGap && Math.abs(c.tr.lane-v.lane)<2.2){
      lead=c; leadGap=c.tr.s-v.s;                 // gap to the trailer, target still the cab
    }
  }
  // pass appetite grows with the build: a stock LPT queues politely,
  // a stage-7 car gets impatient when it can't find space in the fast bits
  const aggr = Math.min(1,(0.30 + 0.70*(S.tune/(TUNES.length-1)))*MODE.aggrK);
  d.passCool=Math.max(0,d.passCool-dt);
  // YOUR FOOT IS NOT THE ROBOT'S APPETITE. The cooldown exists so the AI doesn't
  // spend the whole mountain hunting overtakes; while you are holding the gas it
  // is an instruction, and a line of six dawdlers should cost six moves, not one
  // move and forty seconds of tailgating. Capped, not cleared — a beat of settle
  // between manoeuvres is still right. ← CFG.AI.PASS_GAS_COOL
  if(S.input.gas) d.passCool=Math.min(d.passCool, CFG.AI.PASS_GAS_COOL);
  // While the player is holding a lane, don't go hunting overtakes on your own —
  // hold and follow. Pressing the gas is the signal you WANT to go; that frees
  // the pass machine and drops the hold.
  const holdOK = (d.heldLane==null) || S.input.gas;
  if(lead && d.passState===0 && !d.restYield){
    const gapMin = 12 + v.v*CFG.AI.FOLLOW_MIN_T;       // keep space (time headway)
    // follow smoothly: never close faster than the gap allows. But MATCH the
    // queue — don't sink below it. These cuts used to apply on gap alone, so
    // sitting in traffic meant a standing 20% (and, with the emergency layer,
    // another 10%) off the lead's pace every frame: you slid backwards out of
    // a queue you were keeping station in, which reads as "no throttle".
    const closingRaw = v.v - lead.v;
    // CONSTANT-DECELERATION APPROACH. sqrt, not linear: the distance at which we
    // begin to care grows with the square of the closing speed, which is what
    // "look farther when I'm going fast" actually means in physics. 200 m behind
    // a 108 km/h lorry at 180 km/h this asks for nothing at all; 60 m behind it
    // asks for a real lift. ← CFG.AI.FOLLOW_DECEL
    const room = Math.max(0, leadGap - gapMin);
    d.vTarget = Math.min(d.vTarget, lead.v + Math.sqrt(2*CFG.AI.FOLLOW_DECEL*room));
    if(leadGap < gapMin*0.6*MODE.marginK && closingRaw > 0.5)
      d.vTarget = Math.min(d.vTarget, lead.v*0.8);     // only back off if we're actually gaining on it
    // DECIDE on ACHIEVABLE pace: what this car can actually reach during the
    // move — not the road's theoretical limit. A 154 hp LPT must not commit
    // to a 400 hp overtake.
    const vAch = Math.min(v.v + 7 + 14*aggr, Math.min(vLimit, vTop)*push);
    const advPot = vAch - lead.v;
    const g0 = Math.min(leadGap, 30+vAch*0.5);         // we pull out close behind
    const T = (26+g0)/Math.max(4, advPot*0.7);         // realistic exposure estimate
    const quick = T < 5.6 + 2.2*aggr;                  // stock: short sure moves only
    let vMin=Infinity;                                 // pinned mid-pass by a corner?
    for(let ss=0;ss<vAch*T+40;ss+=15){ const vc=aiCornerV(v.s+ss);
      if(vc<Infinity) vMin=Math.min(vMin, vc*push*(1-Math.max(0,-roadAt(v.s+ss).grade)*CFG.AI.GRADE_GRIP)); }
    const roadOK = vMin > lead.v+4;
    let clear=true; const win=((vAch+24)*T*(0.5-0.1*aggr)+40)*MODE.marginK*LV.marginK*skillFx().winK;
    for(const c of S.traffic){
      if(c.dir<0) continue;                                             // median divides us
      if(Math.abs(c.lane-1.7)<1 && c.s>v.s-6 && c.s<v.s+win) clear=false;
      if(Math.abs(c.lane-1.7)<1 && c.s<v.s && v.s-c.s<24+Math.max(0,c.v-v.v)*3.2*MODE.marginK && c.v>v.v+1) clear=false;
    }
    if(holdOK && leadGap<gapMin*2.6 && advPot>5 && quick && roadOK && clear && d.passCool<=0 && R()<dt*(2.2+1.4*aggr)){
      d.passState=3; d.passT=0;
      if(d.heldLane!=null) d.holdResume=d.heldLane;      // COMMIT: borrow the lane for the run-up
      d.heldLane=null;
    }
    // BOXED-IN, LICENSED: both own lanes walled and the far side provably
    // empty — a Rallylicens borrows it directly. Calm never does.
    else if(holdOK && laneAuth>=3 && !MODE.tcs && d.passCool<=0
            && leadGap<Math.min(30+v.v*0.9,90)
            && Math.min(vTop,vLimit)*push>lead.v+6){
      let wallL=false,wallR=false;
      const paceHere=Math.min(vTop,vLimit)*push;
      for(const c of S.traffic){ if(c.dir>0&&c.s>v.s-8&&c.s<v.s+70+v.v*1.2&&c.v<paceHere-4){
        if(Math.abs(c.lane-LN_L)<1)wallL=true; if(Math.abs(c.lane-LN_R)<1)wallR=true; } }
      if(wallL&&wallR){
        const hzn=(v.v+30)*4.6;
        if(oncClear(1.7,hzn)) commitPass(lead,-1.7);
        else if(laneAuth>=4 && oncClear(5.1,hzn*1.15)) commitPass(lead,-5.1);
      }
    }
  }
  // ── NARROW-ROAD OVERTAKE ──────────────────────────────────────────────
  // Landsväg, grus, skogsväg: one lane each way, so the only way past a
  // dawdler is to borrow the oncoming lane. Timid modes sit and wait; Racing
  // and Drift go for it (laneAuth), and a high licence lets Spirited do it too.
  // Commit only when the oncoming lane is provably empty for the whole
  // exposure plus a fat cushion — the "plenty of time before danger close"
  // the mode is supposed to exploit.
  if(d.passState===0 && !d.restYield && holdOK && lead && singleLane && !pfD.median && (pfD.onc&&pfD.onc.length>0)
     && !MODE.tcs && d.passCool<=0 && laneAuth>=3){
    const paceHere=Math.min(vTop,vLimit)*push;
    const advPot=paceHere-lead.v;
    const oncAbs=Math.abs(pfD.onc[0]);
    const vAch=Math.min(v.v+8+16*aggr, paceHere);
    const closeRate=Math.max(3, vAch-lead.v);
    const T=(34+Math.min(leadGap,45))/(closeRate*0.8);          // seconds on the wrong side
    // an oncoming car eats road at up to its own limit; leave a big cushion,
    // trimmed a little by aggression (Racing accepts tighter, still safe)
    const oncHorizon=(vAch + (pfD.ms||28)) * T * (1.25 - 0.30*aggr) + 55;
    let vMin=Infinity;                                          // pinned mid-pass by a bend?
    for(let ss=0; ss<vAch*T+45; ss+=14){ const vc=aiCornerV(v.s+ss);
      if(vc<Infinity) vMin=Math.min(vMin, vc*push); }
    const roadOK = vMin > lead.v+3;
    if(advPot>4 && leadGap<Math.min(28+v.v*1.2,100) && roadOK && oncClear(oncAbs,oncHorizon)){
      commitPass(lead,-oncAbs);                       // out into the oncoming lane, if one truly exists
    }
  }
  if(d.passState===3){                                 // run-up: full pace, own lane
    d.passT+=dt;
    // (no follow cap — vTarget stays at road pace, we close on the lead)
    let recheck=true;                                  // window still open?
    const vAchR = Math.min(v.v + 7 + 14*aggr, Math.min(vLimit, vTop)*push); // same humility as commit
    for(const c of S.traffic){
      if(c.dir<0) continue;
      const pl=(Math.abs(v.lane-LN_L)<1.7)?LN_R:LN_L;
      if(Math.abs(c.lane-pl)<1 && c.s>v.s-6 && (c.s-v.s) < 22 + Math.max(0,vAchR-c.v)*3.0) recheck=false;
      if(Math.abs(c.lane-pl)<1 && c.s<v.s && v.s-c.s<24+Math.max(0,c.v-v.v)*3.2 && c.v>v.v+1) recheck=false;
    }
    if(!lead || !recheck || d.passT>12){ passDone(); d.passState=0; d.passCool=(5+R()*4)*(1.25-0.85*aggr)*MODE.coolK; }
    else if(leadGap < Math.min(34+v.v*0.75, 110) && (v.v>lead.v+2 || Math.min(vTop,vLimit)*push>lead.v+6)){ // judged on what the car CAN do
      d.passState=1; d.passT=0; d.passTgt=lead;
      d.passLane=(Math.abs(v.lane-LN_L)<1.7)?LN_R:LN_L;
      // both own lanes walled? a licensed driver borrows the far side — never Calm
      let otherBlocked=false;
      for(const c of S.traffic){ if(c!==lead&&c.dir>0&&Math.abs(c.lane-d.passLane)<1&&c.s>v.s-8&&c.s<v.s+55+v.v*1.0&&c.v<v.v-2) otherBlocked=true; }
      if(otherBlocked && !MODE.tcs){
        const hzn=(v.v+30)*4.6;
        if(laneAuth>=3 && oncClear(1.7,hzn)){ const L=laneReal(-1.7); if(L!==null&&laneFree(L,44+v.v*1.7,14)) d.passLane=L; }
        if(laneAuth>=4 && d.passLane!==-1.7 && oncClear(5.1,hzn*1.15)){ const L=laneReal(-5.1); if(L!==null&&laneFree(L,44+v.v*1.7,14)) d.passLane=L; }
      }
    }
  }
  if(d.passState===1){
    d.passT+=dt;
    const pl=d.passLane||LN_L;
    // WIDE LOAD, WIDE BERTH. A semi or a lorry is nearly a metre broader than a
    // sedan, and the pass lane is picked from the lane centres alone — so going
    // by one put our flank about as close as the paint allows, and it clipped.
    // Lean a little further out for anything big, as long as the road has it.
    let plc=pl;
    { const tw=(d.passTgt && VTYPES[d.passTgt.type||"sedan"].w)||1.78;
      if(tw>2.1){ const away=(pl<v.lane? -1:1)*Math.min(0.55,(tw-1.78)*0.7);
        const cand=pl+away;
        if(Math.abs(cand)<edgeAt(v.s)-0.7) plc=cand; } }
    d.steer=(plc-v.lane)*0.9;                          // out into the chosen lane
    if(pl<0){
      // WRONG SIDE OF THE ROAD. Be paranoid: the closing-speed horizon accounts
      // for the oncoming car's own pace, not just ours, and it's LONGER than the
      // commit horizon so we bail before it's a photo finish. And if the pace
      // advantage that justified the pass evaporates — a corner pinned us, the
      // target sped up — get back NOW rather than dawdle head-on. This is where
      // racing used to meet buses.
      const oncMs=(profAt(v.s).ms||28);
      if(!oncClear(Math.abs(pl),(v.v+oncMs)*3.4+40)) (passDone(),d.passState=2);
      // ...and bail if the pace advantage never materialises. This used to give
      // up after 0.6 s unless we were already 3 m/s up on the target — which a
      // car dragging itself out of a slow QUEUE can never be that fast. It read
      // as "pulls out, thinks better of it, parks back in line". Give it time to
      // actually accelerate, and only quit if it truly isn't gaining.
      else if(d.passTgt && d.passT>2.0 && v.v < d.passTgt.v+1.5) (passDone(),d.passState=2);
    } else if(!oncClear(Math.abs(pl),(v.v+30)*3.2)){ (passDone(),d.passState=2); }
    // ABORT early if a faster car is already storming up that lane
    for(const c of S.traffic){
      if(c.dir>0 && Math.abs(c.lane-pl)<1 && c.s<v.s-4 && v.s-c.s<20+Math.max(0,c.v-v.v)*2.6 && c.v>v.v+1){ (passDone(),d.passState=2); break; }
    }
    // CHAIN DOWN THE LINE. Clearing one car used to drop us straight back into
    // the queue — tuck in, cool down, pull out again for the next one. On a
    // single-lane road with a line of dawdlers that's the whole problem: you
    // never get past the LINE, only past one car. If we're already out on the
    // far side, the next one is close, and the oncoming lane is still provably
    // empty for another exposure, take it too.
    // ...and the same is true in the FAST LANE. The chain only ever ran when the
    // pass lane was the oncoming one (pl<0), so on a motorway you still cleared
    // exactly one car per manoeuvre, tucked back into the queue and waited out
    // the cooldown. With your foot down, stay out and take the next one — that
    // is what the lane is for. AI-only frames keep the old oncoming-only rule.
    if(d.passTgt && (pl<0 || S.input.gas) && d.passT<7 && v.s > d.passTgt.s+8){
      let next=null, ng=1e9;
      for(const c of S.traffic){ if(c.dir>0 && c.s>v.s+4){ const g=c.s-v.s;
        if(g<ng && g<CFG.AI.PASS_CHAIN_M+v.v*1.2 && Math.abs(c.lane-(d.homeLane||LN_R))<1.5 && c.v<v.v-1){ next=c; ng=g; } } }
      const chainOK = pl<0? oncClear(Math.abs(pl),(v.v+(pfD.ms||28))*3.0+50)
                          : laneFree(pl, 40+v.v*1.5, 8);   // our own lane, just proven empty ahead
      if(next && chainOK){
        d.passTgt=next; d.passT=Math.min(d.passT,3.0);   // same run, next victim
      }
    }
    // track the TARGET car by reference — lateral offset must not lose it
    const tgt=d.passTgt;
    // BY MEANS BY. 16 m was measured centre-to-centre and fixed, so against a
    // long vehicle — or at speed, where you cover 16 m in half a second — the
    // driver began tucking in while its nose was still level with their door.
    // Clear the actual metal: half of us, half of them, plus a beat of travel.
    const tgtLen=(tgt&&VTYPES[tgt.type||"sedan"].len)||4.5;
    const byBy = 2.32 + tgtLen*0.5 + 6 + v.v*0.45;
    if(!tgt || !S.traffic.includes(tgt) || v.s>tgt.s+byBy || d.passT>8){ (passDone(),d.passState=2); }
    // target moved INTO our pass lane (aggro running its own overtake):
    // there is nothing to go around any more — abort, tuck, follow properly
    else if(Math.abs(tgt.lane-(d.passLane||LN_L))<1.2 && tgt.s>v.s){ (passDone(),d.passState=2); }
  } else if(d.passState===2){
    // NEVER tuck into a gap the brakes can't honor — chain the pass instead
    let next=null,ng=1e9;
    for(const c of S.traffic){ if(c.dir>0&&c.s>v.s&&c.s-v.s<ng&&Math.abs(c.lane-(d.homeLane||LN_R))<1){next=c;ng=c.s-v.s;} }
    if(next && v.v>next.v+3){
      const clos=v.v-next.v, needGap=Math.min(clos*clos/(2*6.5*muRoad(v.s))+10+v.v*0.3, 90+v.v*0.8);
      if(ng<needGap){
        let blocked=false;
        const pl2=(Math.abs(v.lane-LN_L)<1.7)?LN_L:LN_R;   // the lane we're currently out in
        for(const c of S.traffic){ if(c.dir>0 && Math.abs(c.lane-pl2)<1 && c.s>v.s-6 && c.s<v.s+70+v.v*1.2) blocked=true; }
        if(!blocked){ d.passState=1; d.passT=0; d.passTgt=next; d.passLane=pl2; }  // chain in place
        else d.brakeEmg=1;   // boxed in both lanes: max brake
      }
    }
  }
  if(d.passState===2){
    // return ONLY into space: block = a car truly ALONGSIDE (not merely near)
    let block=null;
    const sideOf=(o)=>{ const ds=o.s-v.s;
      const oLen=(VTYPES[o.type||"sedan"].len)||4.5;
      return ds>-(oLen*0.5+4.6+v.v*0.35) && ds<(oLen*0.5+3+v.v*0.12); };
    for(const c of S.traffic){
      if(c.dir>0 && sideOf(c) && Math.abs(c.lane-(d.homeLane||LN_R))<1.2) block=c;
      // a rig's TRAILER is alongside long after its cab has gone by
      if(c.tr && sideOf(c.tr) && Math.abs(c.tr.lane-(d.homeLane||LN_R))<1.2) block=c;
    }
    if(block){
      d.vTarget=Math.min(d.vTarget, block.v*0.80);     // shed speed, fall behind
      if(MODE.lane3 && ownD.length>2 && (d.passLane||LN_L)===LN_L){
        // racing on the 6-lane: if the pass lane is ALSO walled, dive one more inside
        let wall=false;
        for(const c of S.traffic){ if(c.dir>0 && Math.abs(c.lane-LN_L)<1 && c.s>v.s-6 && c.s<v.s+46) wall=true; }
        let l3clr=true;
        for(const c of S.traffic){ if(c.dir>0 && Math.abs(c.lane-LN_3)<1 && c.s>v.s-24 && c.s<v.s+60) l3clr=false; }
        if(wall && l3clr) d.passLane=LN_3;
      }
      d.steer=((d.passLane||LN_L)-v.lane)*0.7;         // hold the outside lane meanwhile
      // slow lead in THIS lane too while boxed — match down harder
      for(const c of S.traffic){ if(c.dir>0 && Math.abs(c.lane-1.7)<1 && c.s>v.s && c.s<v.s+40+v.v*1.2) d.vTarget=Math.min(d.vTarget, c.v*0.9); }
    } else {
      d.steer=((d.homeLane||LN_R)-v.lane)*0.95;
      if(Math.abs(v.lane-(d.homeLane||LN_R))<0.15){
        // manoeuvre complete. Pay moved to the crossing ledger in trafficStep:
        // every car you genuinely clear writes its own cheque the moment its
        // bumper falls behind yours — a line of six pays six, no cooldown on
        // the money. passCool below only paces how often a NEW manoeuvre starts.
        passDone(); d.passState=0; d.passCool=(6+R()*5)*(1.2-0.8*aggr)*MODE.coolK;
      }
    }
  }
  // RACING LINE: racing & drift don't hug a lane through a bend — they use the
  // whole carriageway. Set up wide, clip the apex, track out on exit. Only in
  // pure cruise (state 0) with pace and room; traffic, the pass machine and the
  // emergency layer all outrank the line. Calm/Spirited never do this, so their
  // trajectories stay bit-identical.  Sign convention: understeer washes to
  // -sign(curv) (the outside), so the apex is the +sign(curv) side of the road.
  let rlTarget=null;
  if((S.aiMode==="racing"||S.aiMode==="drift") && !S.menuOpen && !d.restYield && d.passState===0 && v.v>13){
    const edgeR=pfD.edge, outerLim=edgeR-0.4;              // right edge, a hair inside the tarmac
    let innerLim;
    if(pfD.oneway)      innerLim=-(edgeR-0.4);             // no oncoming: the whole road is ours
    else if(pfD.median) innerLim=0.8;                      // divided: hug the median line, never cross it
    else                innerLim=oncClear(1.7,(v.v+26)*2.8)? 0.5    // undivided: straddle the centre
                                 : Math.max(0.9,LN_R-0.8);          //   only if the far side is provably empty
    const lo=Math.min(innerLim,outerLim), hi=Math.max(innerLim,outerLim);
    const apexOf =(sc)=> sc>0? outerLim : innerLim;        // inside of the bend
    const setupOf=(sc)=> sc>0? innerLim : outerLim;        // outside — entry set-up and exit track-out
    const kFull=CFG.AI.LINE_KFULL;                            // curvature that earns the full line ← CFG.AI
    const cvN=curvAt(v.s + (6+v.v*0.35));                  // the bend we're turning into  -> apex
    const cvF=curvAt(v.s + (18+v.v*1.1));                  // the bend still coming         -> set up wide
    const cvB=curvAt(v.s - 9);                             // the bend just behind          -> track out
    let wApex =Math.min(1,Math.abs(cvN)/kFull);
    let wEntry=Math.min(1,Math.abs(cvF)/kFull)*(1-wApex);
    let wExit =Math.min(1,Math.abs(cvB)/kFull)*(1-wApex-wEntry)*CFG.AI.LINE_EXIT_W;
    const wLine=wApex+wEntry+wExit;
    if(wLine>0.05){
      rlTarget = homeLane*(1-wLine)
               + apexOf (Math.sign(cvN||1))*wApex
               + setupOf(Math.sign(cvF||1))*wEntry
               + setupOf(Math.sign(cvB||1))*wExit;
      rlTarget=Math.max(lo,Math.min(hi,rlTarget));
      // never carve into a car sharing the carriageway near the chosen line
      for(const c of S.traffic){
        if(c.dir>0 && Math.abs(c.lane-rlTarget)<1.3 && c.s>v.s-9 && c.s<v.s+(22+v.v*1.5)){ rlTarget=null; break; }
      }
    }
  }
  d._handActive=0;
  if(d.passState!==1 && d.passState!==2){
    let tgtLane=(d.homeLane||LN_R), gain=CFG.AI.LANE_GAIN;   // hold the preferred lane (states 0 and 3) ← CFG.AI
    if(rlTarget!==null){                        // ...unless the line is calling
      tgtLane=rlTarget; gain=CFG.AI.LINE_GAIN;
      if(MODE.drift) gain*=(1-Math.min(1,(d.driftA||0)*1.4));  // once the tail's out, the drift block owns the wheel
    }
    if((d._handT||0)>0){
      // HANDOFF MERGE: you just let go, likely mid-arc with heading wound in. A
      // plain proportional pull at the car's current spot fights that heading and
      // overshoots — the old hard yank. Instead run a critically-damped approach
      // to the target lane that reads the car's own sideways velocity, so it eases
      // the nose back onto the line in one smooth move (routes it a waypoint
      // forward rather than snapping to 'here'). Blends into the firm hold as it
      // finishes. The generic PD/speed-shrink below are skipped while this owns
      // the wheel — this controller does its own damping.
      d._handT=Math.max(0,d._handT-dt); d._handActive=1;
      const latVel=Math.sin(v.psi||0)*v.v;                    // current sideways speed
      const err=tgtLane - v.lane;
      const W=4.0, Z=1.0;                                      // critically damped, ~0.4 s response
      const aLat=W*W*err - 2*Z*W*latVel;                      // desired lateral accel toward the lane
      const ctl=Math.max(-1,Math.min(1,(aLat/Math.max(50,v.v*v.v))/STEER_KAPPA)); // accel → curvature → command
      const blend=Math.min(1, d._handT/0.45);                 // last 0.45 s: ease controller → firm hold
      d.steer=ctl*blend + (tgtLane-v.lane)*gain*(1-blend);
    } else {
      d._handActive=0;
      d.steer=(tgtLane-v.lane)*gain;
    }
  }
  // PD damping: kill the weave. Proportional steering alone overshoots at
  // speed (hold the gas past vTarget and the corrections start slaloming);
  // the lateral-rate term is the hand that settles the wheel.
  const latRate=(v.lane-(d._lastLane===undefined?v.lane:d._lastLane))/Math.max(0.008,dt);
  d._lastLane=v.lane;
  if(!d._handActive){                                  // the handoff controller does its own damping
    d.steer -= latRate*0.16;
    d.steer *= Math.min(1, 26/Math.max(8,v.v));        // high speed: smaller hands
  }
  if(S.parts.poly) d.steer*=1.06;                     // poly bushings: the wheel means it
  d.steer=Math.max(-1,Math.min(1,d.steer));
  // EMERGENCY LAYER: never eat a bumper, whatever state we're in.
  // Warn the human, brake, or swerve — but a held throttle is a signed waiver.
  d.warn=0;
  if(d.ditching){                                     // committed to the shoulder:
    d.ditching-=dt;                                   // this block owns the wheel until
    if(d.ditching<=0){ d.ditching=0; }                // the timer ends or the threat clears
    else {
      const dside=Math.sign(v.lane)||1;
      d.steer=Math.max(-1,Math.min(1,(dside*(profAt(v.s).edge+0.7)-v.lane)*0.55));
      d.brake=1; d.pedal=0; d.warn=2;
    }
  }
  if(lead && Math.abs(lead.lane-v.lane)<2.0){
    const closing=v.v-lead.v + (lead.brk?2.0:0);        // a braking lead will be slower when we arrive
    if(closing>0){
