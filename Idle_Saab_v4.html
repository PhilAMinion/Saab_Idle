  MM.sc = MM.sc===undefined? scTgt : MM.sc+(scTgt-MM.sc)*Math.min(1,(S._fdt||0.042)*2.4);
  const sc=MM.sc, pts=S.road.pts, cull=(r+AH)*(r+AH)*1.6, snow=S.wx.type==="snow";
  ctx.lineCap="round";
  // ---- terrain: nearest-segment field, baked to a tiny texture -----------
  // Fat per-segment ribbons (capsules or quads) can never be right here: the
  // band must reach ~700 m off the road to fill the glass, but hairpin radii
  // go down to 24 m, so one bend's band always buried the other side of the
  // S — the whole map read as one flat colour with blob ghosts. The truth is
  // a Voronoi: every pixel belongs to the NEAREST piece of road, and takes
  // that piece's per-side biome. bakeMMTerrain computes exactly that with a
  // two-pass chamfer distance transform on a ~96px grid, and we re-bake only
  // when the car has moved / the GPS zoom has drifted / night or snow flips.
  const BAND=r*1.9;
  const RNGb=r+AH+12;
  const shift=MM.cx===undefined?1e9:Math.hypot((cam.x-MM.cx)*sc,(cam.y-MM.cy)*sc);
  if(!MM.tex || Math.abs(sc/MM.scB-1)>0.05 || shift>8
     || MM.nightB!==!!S.night || MM.snowB!==snow)
    bakeMMTerrain(cam,sc,RNGb,snow,BAND);
  { // the bake is world-axis-aligned; the canvas transform supplies rotation
    const k=sc/MM.scB, ox=(MM.cx-cam.x)*sc, oy=(MM.cy-cam.y)*sc;
    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(MM.tex, ox-MM.RNG*k, oy-MM.RNG*k, 2*MM.RNG*k, 2*MM.RNG*k);
  }
  // forest canopy texture: a fine deterministic stipple over the band — the
  // old discrete blobs scaled with the GPS zoom into a black caterpillar
  // beside the road. Dots are pixel-sized, hash-anchored, and never on it.
  if(!snow) for(let i=0;i+1<pts.length;i++){
    const a=pts[i];
    const ax=(a.x-cam.x)*sc, ay=(a.y-cam.y)*sc;
    if(ax*ax+ay*ay>cull) continue;
    const b=pts[i+1];
    let dx=b.x-a.x, dy=b.y-a.y; const ln=Math.hypot(dx,dy)||1;
    const nx=-dy/ln, ny=dx/ln;
    for(const side of [-1,1]){
      if(biomeAt(a.s,side)!=="forest") continue;
      let hh=(Math.imul(Math.floor(a.s/15),2654435761)^(side>0?0xa53c9e:0x3d1f7b))>>>0; hh=(hh^hh>>>13)>>>0;
      for(let k=0;k<5;k++){                                   // denser canopy: 5 crowns / 15 m
        // scatter both across the band AND a little along the segment, so the
        // crowns read as a thicket rather than a single file of pixels
        const om=(0.16+((hh>>>(k*6)&127)/127)*0.80)*BAND;
        const al=((hh>>>(k*5+3)&15)/15-0.5)*ln;               // along-segment jitter
        const cx0=ax+dx*(0.5+al/ln)+nx*side*om, cy0=ay+dy*(0.5+al/ln)+ny*side*om;
        // ownership gate: a crown far out on a hairpin's inside can sit on
        // ground the field says belongs to ANOTHER stretch of road — skip it
        const wx2=cam.x+cx0/sc, wy2=cam.y+cy0/sc;
        const ixq=Math.floor(((wx2-MM.cx)*MM.scB+MM.RNG)/MM.T),
              iyq=Math.floor(((wy2-MM.cy)*MM.scB+MM.RNG)/MM.T);
        if(ixq>=0&&iyq>=0&&ixq<MM.N&&iyq<MM.N){
          const os=MM._s[iyq*MM.N+ixq];
          if(os>-1e8 && Math.abs(os-a.s)>60) continue;
        }
        const rr=1.4+((hh>>>(k*9+2))&3)*0.55;                 // crown radius 1.4..3.05 px
        // soft green base + darker core = rounded tree crown, not a black fleck
        ctx.fillStyle=S.night?"rgba(12,20,10,0.62)":"rgba(46,74,30,0.60)";
        ctx.beginPath();ctx.arc(cx0,cy0,rr,0,7);ctx.fill();
        ctx.fillStyle=(hh>>>(k*3)&1)? (S.night?"rgba(7,12,6,0.72)":"rgba(24,44,17,0.70)")
                                    : (S.night?"rgba(15,25,12,0.66)":"rgba(38,62,25,0.66)");
        ctx.beginPath();ctx.arc(cx0,cy0,rr*0.6,0,7);ctx.fill();
      }
    }
  }
  // ---- the road ribbon: dark casing + bright fill, like a satnav; ahead glows ----
  for(const pass of [0,1]) for(let i=0;i+1<pts.length;i++){
    const a=pts[i], b=pts[i+1];
    const ax=(a.x-cam.x)*sc, ay=(a.y-cam.y)*sc, bx=(b.x-cam.x)*sc, by=(b.y-cam.y)*sc;
    if(Math.min(ax*ax+ay*ay,bx*bx+by*by)>cull) continue;
    const ahead=a.s>=S.veh.s-8, wRd=Math.max(2.6, halfAt(a.s)*2*sc*1.5);
    if(pass===0){ ctx.strokeStyle=S.night?"#0b0d10":"#181a1e"; ctx.lineWidth=wRd+2.4; }
    else { ctx.strokeStyle=S.night?(ahead?"#8b93a2":"#3a3f48"):(ahead?"#c6cbd3":"#5d626b");
           ctx.lineWidth=wRd; }
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();
  }
  // ---- farmsteads: falu-red roofs seen from above ----
  for(const seg of S.road.segs) for(const f of seg.feat){
    if(f.type!=="farm") continue;
    const p=poseOnRoad(f.s), off=(10+((f.v||0.4)*613%1)*9)*f.side;
    const fx=(p.x-cam.x+Math.cos(p.h)*off)*sc, fy=(p.y-cam.y+Math.sin(p.h)*off)*sc;
    if(fx*fx+fy*fy>cull) continue;
    const rA=((f.v||0.4)*997)%1, rC=((f.v||0.4)*311)%1, flip=rA<0.5?1:-1;   // match the world compound
    ctx.save();ctx.translate(fx,fy);ctx.rotate(p.h);
    ctx.fillStyle=S.night?"#3a1410":"#8f3126";                              // barn (larger)
    ctx.fillRect(flip*2.0-2.4,-2.1,4.8,4.2);
    ctx.fillStyle=S.night?"#241d1a":"#e8e4da"; ctx.fillRect(flip*2.0-2.4,-0.6,4.8,1.2);
    ctx.fillStyle=S.night?"#341210":"#9a3a2e";                              // house (smaller, opposite side)
    ctx.fillRect(-flip*2.4-1.5,-1.5,3.0,3.0);
    ctx.fillStyle=S.night?"#241d1a":"#e8e4da"; ctx.fillRect(-flip*2.4-1.5,-0.5,3.0,1.0);
    if(rC<0.55){ ctx.fillStyle=S.night?"#20232a":"#b9bcc2"; ctx.beginPath();ctx.arc(flip*4.6,0,1.2,0,7);ctx.fill(); } // silo
    ctx.restore();
  }
  // ---- traffic LAST: always visible, whatever grows beside the road ----
  for(const c of S.traffic){
    const p=poseOnRoad(c.s), lo=c.lane||0;                                   // smooth pose + lane, matching the camera
    const dxc=(p.x-cam.x+Math.cos(p.h)*lo)*sc, dyc=(p.y-cam.y+Math.sin(p.h)*lo)*sc;
    if(dxc*dxc+dyc*dyc<cull){ctx.fillStyle=c.dir<0?"#e3a13a":"#8fa4bd";ctx.beginPath();ctx.arc(dxc,dyc,2.8,0,7);ctx.fill();}
  }
  if(S.chase && S.chase.active && S.cop){                                   // the pursuing cop — flashing blues, never culled
    const p=poseOnRoad(S.cop.s), lo=S.cop.lane||0;
    const dxc=(p.x-cam.x+Math.cos(p.h)*lo)*sc, dyc=(p.y-cam.y+Math.sin(p.h)*lo)*sc;
    const on=Math.floor(S.t*6)%2===0;
    ctx.save(); ctx.shadowBlur=8; ctx.fillStyle=on?"#2a6bff":"#ff2e2e"; ctx.shadowColor=ctx.fillStyle;
    ctx.beginPath();ctx.arc(dxc,dyc,3.6,0,7);ctx.fill(); ctx.restore(); ctx.shadowBlur=0;
  }
  ctx.restore();
  ctx.fillStyle="#ff9d2e";ctx.beginPath();
  ctx.moveTo(mx,my+AH-6);ctx.lineTo(mx-4,my+AH+5);ctx.lineTo(mx+4,my+AH+5);ctx.fill();
  ctx.strokeStyle="#2c2f36";ctx.lineWidth=2;ctx.beginPath();ctx.arc(mx,my,r,0,7);ctx.stroke();
}

d p\u00e5 ","Half-gap at the centreline on ": "Halvgap vid mittlinjen p\u00e5 ","the divided 2+2 motorway": "den delade 2+2-motorv\u00e4gen","the big 3+3 motorway": "den stora 3+3-motorv\u00e4gen","the rural two-lane": "den tv\u00e5filiga landsv\u00e4gen","two lanes, one direction": "tv\u00e5 filer, en riktning","single one-way ribbon": "ett enkelriktat band","the gravel road": "grusv\u00e4gen","the forest dirt track": "skogsv\u00e4gen",". Lane centres, drivable edge and half-width all derive from it \u2014 slide it and the painted world reflows around you.": ". Filcentrum, k\u00f6rbar kant och halvbredd h\u00e4rleds ur den \u2014 dra i reglaget och den m\u00e5lade v\u00e4rlden fl\u00f6dar om kring dig.",": how far lane one sits off the paint (or the median). More gap, more breathing room against oncoming.": ": hur l\u00e5ngt fil ett ligger fr\u00e5n linjen (eller mittremsan). Mer gap, mer andrum mot m\u00f6tande.","Chance a generated segment is a straight rather than a corner. Driving mode multiplies this: racing stretches it, Arcade Drift halves it.": "Chansen att ett genererat segment blir en raksstr\u00e4cka i st\u00e4llet f\u00f6r en kurva. K\u00f6rl\u00e4get multiplicerar: racing str\u00e4cker ut, Arcade-drift halverar.","How long straights can run (70 m + this). Racing mode multiplies for proper flat-out sections.": "Hur l\u00e5nga rakstr\u00e4ckorna kan bli (70 m + detta). Racingl\u00e4get multiplicerar f\u00f6r riktiga fullgasavsnitt.","Minimum corner sweep in degrees. The gentlest kink the generator will bother drawing.": "Minsta kurvsvep i grader. Den mildaste knix generatorn ens bryr sig om att rita.","Degrees of sweep on top of the minimum. High span means the hairpins wrap properly around the mountain.": "Grader ovanp\u00e5 minimum. H\u00f6gt spann betyder att h\u00e5rn\u00e5larna sveper ordentligt runt berget.","Tightest corner radius the generator deals. Arcade Drift multiplies radii down toward this floor; racing multiplies them up into sweepers.": "Tightaste kurvradien generatorn delar ut. Arcade-drift trycker radierna ner mot golvet; racing lyfter dem till svepare.","Radius range above the minimum. The dice roll is biased tight \u2014 raising the span mostly adds fast sweepers.": "Radieintervall ovanf\u00f6r minimum. T\u00e4rningen \u00e4r viktad tight \u2014 h\u00f6gre spann ger mest snabba svepare.","Traffic spawn rate. Zero is a closed stage; 0.8 is Friday on the E4.": "Trafikens uppkomsttakt. Noll \u00e4r avlyst str\u00e4cka; 0,8 \u00e4r fredag p\u00e5 E4:an.","Traffic multiplier on loose surfaces. The forest roads should be empty \u2014 that is what makes them forest roads.": "Trafikfaktor p\u00e5 l\u00f6st underlag. Skogsv\u00e4garna ska vara tomma \u2014 det \u00e4r det som g\u00f6r dem till skogsv\u00e4gar.","Scales wheel and rim damage from riding the verge and the rough. Zero makes the ditch free; three makes every excursion a story for the bench.": "Skalar hjul- och f\u00e4lgskador fr\u00e5n v\u00e4gren och terr\u00e4ng. Noll g\u00f6r diket gratis; tre g\u00f6r varje utflykt till en historia f\u00f6r b\u00e4nken.","How hard weather bites on loose surfaces, broken out from tarmac. 1 = the same grip loss as asphalt; 2 = a wet skogsv\u00e4g becomes a skating rink; 0 = rain never reaches the forest floor.": "Hur h\u00e5rt v\u00e4dret biter p\u00e5 l\u00f6st underlag, separat fr\u00e5n asfalt. 1 = samma greppf\u00f6rlust som asfalt; 2 = en bl\u00f6t skogsv\u00e4g blir en skridskobana; 0 = regnet n\u00e5r aldrig skogsbotten.","ARCADE DRIFT is a pure driver assist \u2014 it holds the tail out for the whole corner and leaves the road ahead exactly as it was. DRIFT style shapes a proper course: open sweepers with real straights between them, so entry speed stays high. EASY MODE switches every kind of damage off \u2014 the story stays, the bill never arrives. RACING style makes long sweepers and straights \u2014 except on dirt, where it drives the rally line but leaves the world alone.": "ARCADE-DRIFT \u00e4r ren f\u00f6rarhj\u00e4lp \u2014 den h\u00e5ller ut bakvagnen genom hela kurvan och l\u00e4mnar v\u00e4gen fram\u00f6ver exakt som den var. DRIFT-stil formar en riktig bana: \u00f6ppna svepare med riktiga rakor emellan, s\u00e5 ing\u00e5ngsfarten h\u00e5lls h\u00f6g. SN\u00c4LLT L\u00c4GE st\u00e4nger av alla skador \u2014 historien blir kvar, r\u00e4kningen kommer aldrig. RACING-stil ger l\u00e5nga svepare och rakor \u2014 utom p\u00e5 grus, d\u00e4r den k\u00f6r rallylinjen men l\u00e4mnar v\u00e4rlden ifred.","Dials, odometer, dyno sheets and crash reports. US mode measures in SAE: hp, lb-ft, \u00b0F, psi.": "M\u00e4tare, v\u00e4gm\u00e4tare, dynoblad och krockrapporter. USA-l\u00e4get m\u00e4ter i SAE: hp, lb-ft, \u00b0F, psi.","Parts money. Exchange desk says 1 kr \u2248 $": "Delpengar. V\u00e4xlingsdisken s\u00e4ger 1 kr \u2248 $","Every menu, gauge, toast and story line. Bilingual to the bones \u00b7 Tv\u00e5spr\u00e5kig in i m\u00e4rgen.": "Varje meny, m\u00e4tare, notis och ber\u00e4ttelserad. Tv\u00e5spr\u00e5kig in i m\u00e4rgen \u00b7 Bilingual to the bones.","Prices are stored in kronor because the parts come from Trollh\u00e4ttan; dollars are just a courtesy conversion.": "Priserna lagras i kronor eftersom delarna kommer fr\u00e5n Trollh\u00e4ttan; dollar \u00e4r bara en artighetsomvandling.","Live values \u2014 the sim reads them every substep. Tap a name for the full story; amber means modified. Config rides in the save code.": "Levande v\u00e4rden \u2014 simuleringen l\u00e4ser dem varje delsteg. Tryck p\u00e5 ett namn f\u00f6r hela historien; b\u00e4rnsten betyder \u00e4ndrad. Konfigen f\u00f6ljer med sparkoden.","Tap to swap.": "Tryck f\u00f6r att byta.","No cookies in a Saab. Copy this code somewhere safe, paste it back to resume.": "Inga kakor i en Saab. Kopiera koden n\u00e5gonstans s\u00e4kert, klistra in den f\u00f6r att forts\u00e4tta.","CALM \u2014 80% pace cap, brakes 45% earlier, follows at double gap, keeps right, TCS on. Zero drama, g is bent.": "Den koden \u00e4r skev.","\ud83c\udfae ARCADE DRIFT \u2014 the tail hangs out for the whole corner. Pure driver assist \u2014 the road ahead is unchanged.": "\ud83c\udfae ARCADE-DRIFT \u2014 bakvagnen h\u00e4nger ute genom hela kurvan. Ren f\u00f6rarhj\u00e4lp \u2014 v\u00e4gen fram\u00f6ver \u00e4r of\u00f6r\u00e4ndrad.","Arcade drift off \u2014 the physics take the wheel back.": "Arcade-drift av \u2014 fysiken tar tillbaka ratten.","\ud83d\udee1 EASY MODE \u2014 damage off. Every story, none of the bills.": "\ud83d\udee1 SN\u00c4LLT L\u00c4GE \u2014 skador av. Alla historier, inga r\u00e4kningar.","Easy mode off \u2014 the sheet metal keeps score again.": "Sn\u00e4llt l\u00e4ge av \u2014 pl\u00e5ten h\u00e5ller r\u00e4kningen igen.","Kronor. The parts bin speaks Swedish.": "Kronor. Dell\u00e5dan talar svenska.","Dollars. The exchange desk nods.": "Dollar. V\u00e4xlingsdisken nickar.","NIGHT PANEL. Only what matters.": "NATTPANEL. Bara det som betyder n\u00e5got.","Night panel off.": "Nattpanel av.","\ud83d\udcdf SAAB IDLE \u2014 the AI drives at the limit. Grab the wheel or pedals to override (or WASD). GARAGE \u25b8 for the path.": "\ud83d\udcdf SAAB IDLE \u2014 AI:n k\u00f6r p\u00e5 gr\u00e4nsen. Grip ratten eller pedalerna f\u00f6r att ta \u00f6ver (eller WASD). GARAGE \u25b8 f\u00f6r v\u00e4gen fram\u00e5t.","GEAR": "V\u00c4XEL","rpm \u00d71000": "varv \u00d71000","POWER   ": "EFFEKT  ","TORQUE  ": "MOMENT  ","AIRMASS ": "LUFTMASSA ","CEILING ": "TAK     ","BOOST   ": "TRYCK   ","WG DUTY ": "WG-DUTY ","TRIP    ": "TRIPP   ","BEST    ": "B\u00c4ST    ","SERVICE \u2014 ": "SERVICE \u2014 ","Factory file. Torque limited per gear, boost tapered.": "Fabriksfil. Moment begr\u00e4nsat per v\u00e4xel, laddtryck avtrappat.","More requested airmass, same hardware. T7Suite + a CAN cable.": "Mer beg\u00e4rd luftmassa, samma h\u00e5rdvara. T7Suite + en CAN-kabel.","Map for downpipe + intercooler. Torque limiters raised.": "Mappning f\u00f6r downpipe + intercooler. Momentsp\u00e4rrarna h\u00f6jda.","Full airmass request for the Mitsubishi. Needs fueling.": "Full luftmassebeg\u00e4ran f\u00f6r Mitsubishin. Kr\u00e4ver br\u00e4nsle.","18T/19T request tables. Two days on the dyno, allegedly.": "18T/19T-beg\u00e4rantabeller. Tv\u00e5 dagar i dynon, p\u00e5st\u00e5s det.","GT28 tables. Watch the clutch. Watch everything.": "GT28-tabeller. H\u00e5ll koll p\u00e5 kopplingen. H\u00e5ll koll p\u00e5 allt.","3-bar MAP maxed. Forged bottom end assumed by the file.": "3-bars MAP maxad. Filen f\u00f6ruts\u00e4tter smidd bottendel.","The last page of the dyno binder. Fuel and boost to the end of it.": "Sista sidan i dynop\u00e4rmen. Br\u00e4nsle och tryck \u00e4nda till slutet.","Stage 1 \u2014 ECU remap": "Steg 1 \u2014 ECU-remap","Stage 3 \u2014 breathing map": "Steg 3 \u2014 andningsmapp","Stage 4 \u2014 TD04 map": "Steg 4 \u2014 TD04-mapp","Stage 5 \u2014 hybrid map": "Steg 5 \u2014 hybridmapp","Stage 6 \u2014 big turbo map": "Steg 6 \u2014 storturbomapp","Stage 7 \u2014 built motor": "Steg 7 \u2014 byggd motor","Stage 8 \u2014 send it": "Steg 8 \u2014 k\u00f6r","Stock binary": "Originalbin\u00e4r","American pump swill. RON 91 in honest units. Fine for a commute; the knock sensor earns overtime the moment you ask for boost on a warm day.": "Amerikansk pumpskv\u00e4tt. RON 91 i \u00e4rliga enheter. Duger till pendling; knacksensorn jobbar \u00f6vertid s\u00e5 fort du beg\u00e4r tryck en varm dag.","European standard, US premium \u2014 same molecule, different sticker. The factory file assumes it.": "Europeisk standard, amerikansk premium \u2014 samma molekyl, olika etikett. Fabriksfilen f\u00f6ruts\u00e4tter den.","The best US pumps sell. RON 98 equivalent \u2014 the timing holds on hot pulls and the adaptation banks a little advance.": "Det b\u00e4sta amerikanska pumpar s\u00e4ljer. Motsvarar RON 98 \u2014 t\u00e4ndningen h\u00e5ller p\u00e5 heta drag och adaptionen sparar lite f\u00f6rst\u00e4llning.","Premium. More knock margin \u2014 the ECU keeps its timing on hot days.": "Premium. Mer knackmarginal \u2014 styrdonet beh\u00e5ller t\u00e4ndningen varma dagar.","Flex-fuel conversion. Ethanol cools the charge going in and laughs at knock \u2014 but stoich is 9.8:1, so it drinks 50% more volume. Needs the big injectors.": "Flexifuel-konvertering. Etanolen kyler laddningen p\u00e5 v\u00e4g in och skrattar \u00e5t knack \u2014 men stoich \u00e4r 9,8:1, s\u00e5 den dricker 50 % mer volym. Kr\u00e4ver de stora spridarna.","Blue-tinted, sweet-smelling, and sold by the drum where the Cessnas park. Knock becomes a rumour \u2014 and the lead quietly murders your lambda sond and catalyst. Race day fuel, not commute fuel.": "Bl\u00e5tonat, s\u00f6tluktande och s\u00e5lt p\u00e5 fat d\u00e4r Cessnorna parkerar. Knack blir ett rykte \u2014 och blyet m\u00f6rdar i tysthet din lambdasond och katalysator. T\u00e4vlingsbr\u00e4nsle, inte pendlarbr\u00e4nsle.","Gasol. ~106 RON knock resistance for half the pump price \u2014 but the vapor displaces ~4.5% of your intake air and gives none of petrol\u2019s evaporative cooling. Torque dips, wallet grows.": "Gasol. ~106 RON knackt\u00e5lighet f\u00f6r halva pumppriset \u2014 men \u00e5ngan tr\u00e4nger undan ~4,5 % av insugsluften och ger inget av bensinens avdunstningskyla. Momentet sjunker, pl\u00e5nboken v\u00e4xer.","For the TiD only. Compression ignition doesn\u2019t knock \u2014 it smokes. The limit isn\u2019t octane, it\u2019s how much fuel the air can burn clean.": "Endast f\u00f6r TiD. Kompressionst\u00e4ndning knackar inte \u2014 den ryker. Gr\u00e4nsen \u00e4r inte oktan, utan hur mycket br\u00e4nsle luften kan br\u00e4nna rent.","95 \u2014 pump standard": "95 \u2014 pumpstandard","98 \u2014 premium": "98 \u2014 premium","Regular 91 (import junk)": "Regular 91 (importskr\u00e4p)","109 leaded (the airfield)": "109 blyad (flygf\u00e4ltet)","Two lanes, by the book. Mirror, signal, manoeuvre.": "Tv\u00e5 filer, enligt boken. Spegel, blinkers, man\u00f6ver.","Ten winters of E4 commuting. Reads brake lights two cars ahead.": "Tio vintrar av E4-pendling. L\u00e4ser bromsljus tv\u00e5 bilar fram\u00e5t.","Knows every frost heave by name. Corners on rails, gaps judged to the metre.": "Kan varje tj\u00e4lskott vid namn. Kurvor p\u00e5 r\u00e4ls, luckor bed\u00f6mda p\u00e5 metern.","Will borrow the oncoming inner lane \u2014 only when it is provably empty.": "L\u00e5nar m\u00f6tande innerfil \u2014 bara n\u00e4r den bevisligen \u00e4r tom.","Ex-Viggen pilot. All fourteen metres of road belong to the mission.": "F.d. Viggen-pilot. Alla fjorton meter v\u00e4g tillh\u00f6r uppdraget.","Not a tuner \u2014 the factory's own service programming. Stage 0 lives here: flat torque plateau, per-gear limits, boost tapered for the driveline's pension. The file your dealer swears by.": "Ingen trimmare \u2014 fabrikens egen serviceprogrammering. Steg 0 bor h\u00e4r: platt momentplat\u00e5, gr\u00e4nser per v\u00e4xel, laddtryck avtrappat f\u00f6r drivlinans pension. Filen din handlare sv\u00e4r vid.","St. Gallen. The OEM-blessed house \u2014 dealer-flashed, warranty-friendly, conservative margins, and a top end that keeps pulling. You pay for the handshake.": "St. Gallen. Det OEM-v\u00e4lsignade huset \u2014 handlarflashat, garantiv\u00e4nligt, konservativa marginaler och en topp som forts\u00e4tter dra. Du betalar f\u00f6r handslaget.","\u00d6rebro. The balanced Swede \u2014 Maptuner in the glovebox, strong midrange, injector calibration from stage 3. The forum's default answer.": "\u00d6rebro. Den balanserade svensken \u2014 Maptuner i handskfacket, starkt mellanregister, spridarkalibrering fr\u00e5n steg 3. Forumets standardsvar.","V\u00e4xj\u00f6. The PPC people \u2014 peak power arrives early and hits hard. Thinner margins; the knock sensor earns its salary on hot days.": "V\u00e4xj\u00f6. PPC-folket \u2014 toppeffekten kommer tidigt och sl\u00e5r h\u00e5rt. Tunnare marginaler; knacksensorn tj\u00e4nar sin l\u00f6n varma dagar.","Torque now, horsepower eventually \u2014 a low-end wall of shove that peaks by 5000. The trailer-tow special that embarrasses hot hatches.": "Moment nu, h\u00e4stkrafter s\u00e5 sm\u00e5ningom \u2014 en v\u00e4gg av tryck p\u00e5 botten som toppar vid 5000. Sl\u00e4pvagnsspecialen som f\u00f6r\u00f6dmjukar GTI-bilar.","The open-source way: a BDM header soldered to the ECU and a winter of reading ecuproject. Cheapest files on earth, injector constants set by you from stage 1 \u2014 and every mistake is also yours.": "\u00d6ppen k\u00e4llkods-v\u00e4gen: en BDM-header l\u00f6dd p\u00e5 styrdonet och en vinter av ecuproject-l\u00e4sning. Jordens billigaste filer, spridarkonstanter satta av dig fr\u00e5n steg 1 \u2014 och varje misstag \u00e4r ocks\u00e5 ditt.","Naturally aspirated. No turbo, no lag, no excuses \u2014 the same block the classic 900 carried. Where every build starts.": "Insugsmotor. Ingen turbo, ingen lagg, inga urs\u00e4kter \u2014 samma block som klassiska 900 bar. D\u00e4r varje bygge b\u00f6rjar.","Light-pressure turbo. The honest one.": "L\u00e5gtrycksturbo. Den \u00e4rliga.","Full-pressure GT17. The sensible one. The dealer wants to see you've wrenched before handing over keys.": "Fulltrycks-GT17. Den f\u00f6rnuftiga. Handlaren vill se att du skruvat innan nycklarna byter hand.","TD04HL-15T from the factory. The sleeper.": "TD04HL-15T fr\u00e5n fabrik. Ulven i f\u00e5rakl\u00e4der.","2.3 litres, 350 Nm, lightning blue. The thunderbolt. Earned, never given.": "2,3 liter, 350 Nm, blixtbl\u00e5. \u00c5skviggen. F\u00f6rtj\u00e4nad, aldrig given.","The oddball: a GM-sourced turbodiesel spinning to 4600 with tractor torque at 1800. No spark, no knock, no hurry \u2014 and 5.5 l/100km doing it.": "Den udda: en GM-diesel som varvar till 4600 med traktormoment vid 1800. Ingen gnista, ingen knack, ingen br\u00e5dska \u2014 och 5,5 l/100 km p\u00e5 k\u00f6pet.","Someone already turned the pump up and wound the VNT tighter. Black smoke on full throttle included free of charge.": "N\u00e5gon har redan vridit upp pumpen och sp\u00e4nt VNT:n. Svart r\u00f6k p\u00e5 fullgas ing\u00e5r utan kostnad.","Toroidal tank in the spare-wheel well, reducer off the coolant loop, vapor rail, piggyback controller. Bivalent: starts on petrol, switches on temp.": "Toroidtank i reservhjulsbaljan, f\u00f6rg\u00e5ngare p\u00e5 kylkretsen, gasrail, piggyback-styrning. Bivalent: startar p\u00e5 bensin, v\u00e4xlar p\u00e5 temperatur.","Bigger core, colder thermostat. The mountain is long and the coolant knows it. Buys you whole minutes of full send.": "St\u00f6rre cellpaket, kallare termostat. Berget \u00e4r l\u00e5ngt och kylv\u00e4tskan vet det. K\u00f6per dig hela minuter av fullgas.","Lets the turbine breathe. Faster spool, more top end.": "L\u00e5ter turbinen andas. Snabbare spool, mer topp.","Charge temps decide knock margin. Stock IC heat-soaks above stock boost.": "Laddlufttemperaturen avg\u00f6r knackmarginalen. Original-IC:n v\u00e4rmem\u00e4ttas \u00f6ver originaltryck.","King Cobra style intake pipe. Small gain, great noise.": "Insugsr\u00f6r i King Cobra-stil. Liten vinst, h\u00e4rligt ljud.","Turbo-back 3 inch. Required company for the downpipe.": "Turbo-back 3 tum. Obligatoriskt s\u00e4llskap till downpipen.","The Viggen/Aero unit. Direct bolt-on to the GT17 cars.": "Viggen/Aero-enheten. Direkt bolt-on p\u00e5 GT17-bilarna.","9000 Aero hot side on your TD04. Top-end unlock.": "9000 Aero-hetsida p\u00e5 din TD04. Toppen l\u00e5ses upp.","Billet 18T compressor wheel, machined housing. The classic tuner move.": "Fr\u00e4st 18T-kompressorhjul, bearbetat hus. Det klassiska trimmardraget.","One wheel bigger. Negligible extra lag, real extra air.": "Ett hjul st\u00f6rre. F\u00f6rsumbar extra lagg, riktig extra luft.","Ball-bearing spool with real flow. Custom oil & water lines.": "Kullagrad spool med riktigt fl\u00f6de. Specialdragna olje- och vattenledningar.","Stock fueling dies \u2248300 hp. Green giants + 3-bar sensor.": "Originalbr\u00e4nslet d\u00f6r \u2248300 hk. Gr\u00f6na j\u00e4ttar + 3-bars sensor.","Rising-rate regulator on the stock rail. A quarter-turn buys real fueling headroom at the top \u2014 set with a gauge, not by ear.": "Stigande regulator p\u00e5 originalrailen. Ett kvarts varv k\u00f6per riktigt br\u00e4nsleutrymme i toppen \u2014 st\u00e4lls med manometer, inte p\u00e5 geh\u00f6r.","Fat aluminium rail, braided feed from the tank. The stock hard line starts to starve past 350 hp \u2014 this is the plumbing that doesn\u2019t.": "Tjock aluminiumrail, fl\u00e4tad matning fr\u00e5n tanken. Originalr\u00f6ret b\u00f6rjar sv\u00e4lta \u00f6ver 350 hk \u2014 det h\u00e4r \u00e4r r\u00f6rmokeriet som inte g\u00f6r det.","For the E85 end-game: 50% more volume through the same rail. Idle gets lumpy-rich on petrol \u2014 these are ethanol hardware.": "F\u00f6r E85-slutspelet: 50 % mer volym genom samma rail. Tomg\u00e5ngen blir fet och knagglig p\u00e5 bensin \u2014 det h\u00e4r \u00e4r etanolh\u00e5rdvara.","Stock in-tank pump runs out ~320 hp. Cheap insurance.": "Originalpumpen i tanken tar slut ~320 hk. Billig f\u00f6rs\u00e4kring.","Stock Sachs Viggen pressure plate. Holds what the chassis can use.": "Sachs Viggen-tryckplatta i original. H\u00e5ller vad chassit kan anv\u00e4nda.","Four kilos off the crank nose. The revs answer the pedal instead of debating it, and the plate bites clean on every engagement.": "Fyra kilo av vevaxelnosen. Varven svarar p\u00e5 pedalen i st\u00e4llet f\u00f6r att debattera, och lamellen biter rent varje g\u00e5ng.","Half the throw, twice the certainty. You stop lifting early because the lever stops being a negotiation.": "Halva v\u00e4gen, dubbla s\u00e4kerheten. Du slutar sl\u00e4ppa gasen tidigt f\u00f6r att spaken slutar vara en f\u00f6rhandling.","Thicker shafts, better joints. Wheel hop dies, launches hook up, and the steering stops fighting itself under boost.": "Gr\u00f6vre axlar, b\u00e4ttre knutar. Hjulhoppen d\u00f6r, starterna f\u00e5r f\u00e4ste och styrningen slutar sl\u00e5ss med sig sj\u00e4lv under tryck.","The lump stops rocking a centimetre per gearchange. Shifts land where you aimed them and the torque steer calms a notch.": "Klumpen slutar gunga en centimeter per v\u00e4xling. V\u00e4xlingarna landar d\u00e4r du siktade och torque steer lugnar sig ett sn\u00e4pp.","THE Saab driveline job. The factory diff pin is the fuse in every big-torque FM55 \u2014 this is the rebuild with the steel pin, done before it lets go instead of after.": "Saab-drivlinejobbet med stort J. Fabrikens diffpinne \u00e4r s\u00e4kringen i varje storvriden FM55 \u2014 det h\u00e4r \u00e4r renoveringen med st\u00e5lpinnen, gjord innan den sl\u00e4pper i st\u00e4llet f\u00f6r efter.","Steering-rack brace, rack clamp and firmer engine mounts. Abbott built it because the chassis never asked for 350 Nm \u2014 torque steer drops from character flaw to character.": "Styrv\u00e4xelst\u00e4g, kuggst\u00e5ngsklamma och fastare motorf\u00e4sten. Abbott byggde det f\u00f6r att chassit aldrig bad om 350 Nm \u2014 torque steer g\u00e5r fr\u00e5n karakt\u00e4rsfel till karakt\u00e4r.","22/19 mm bars on poly mounts. The body stops leaning on the outside front and the whole car turns in one motion.": "22/19 mm-stag p\u00e5 polyf\u00e4sten. Karossen slutar luta p\u00e5 yttre framhjulet och hela bilen sv\u00e4nger i en r\u00f6relse.","Every arm and the subframe. Steering gains a nerve it never had; the road gains a voice. Two full evenings with a press.": "Varje l\u00e4nkarm och subframen. Styrningen f\u00e5r en nerv den aldrig haft; v\u00e4gen f\u00e5r en r\u00f6st. Tv\u00e5 hela kv\u00e4llar med press.","T7 bottom ends won't live much past ~300 whp. Build it before it builds itself a window.": "T7-bottendelar lever inte l\u00e4nge \u00f6ver ~300 whp. Bygg den innan den bygger sig ett f\u00f6nster.","Manifold spacer, v-band downpipe, real fuel system. 400 whp country.": "Grenr\u00f6rsdistans, v-bands-downpipe, riktigt br\u00e4nslesystem. 400 whp-land.","The last turbo anyone published a dyno sheet for on this chassis. Here be lag.": "Den sista turbon n\u00e5gon publicerat dynoblad f\u00f6r p\u00e5 detta chassi. H\u00e4r finns lagg.","The stock pod reads to 15 psi. TD04 territory needs headroom.": "Originalpodden l\u00e4ser till 15 psi. TD04-land beh\u00f6ver marginal.","Hybrid and GT28 numbers. The needle deserves to mean something.": "Hybrid- och GT28-siffror. N\u00e5len f\u00f6rtj\u00e4nar att betyda n\u00e5got.","Big Garrett face. If this pegs, tell the story at the next fika.": "Stor Garrett-tavla. Om den bottnar \u2014 ber\u00e4tta p\u00e5 n\u00e4sta fika.","One tire is not a drivetrain. Puts the torque steer to work.": "Ett d\u00e4ck \u00e4r ingen drivlina. S\u00e4tter torque steer i arbete.","Koni sport, B&G springs, 22 mm rear bar \u2014 the forum-spec handling kit.": "Koni sport, B&G-fj\u00e4drar, 22 mm bakre stag \u2014 forumspecens v\u00e4gh\u00e5llningskit.","More corner entry confidence for the driver model.": "Mer sj\u00e4lvf\u00f6rtroende i kurving\u00e5ng f\u00f6r f\u00f6rarmodellen.","Variable vanes: full boost by 1800 rpm, breathless past 4200. A different religion.": "Variabla skovlar: fullt tryck vid 1800 varv, andf\u00e5dd \u00f6ver 4200. En annan religion."};
const SVL=Object.keys(SVD).sort((a,b)=>b.length-a.length);
function L(str){ return S.lang==="sv"? (SVD[str]||str) : str; }
function trHtml(h){ if(S.lang!=="sv"||!h) return h;
  for(const k of SVL){ if(h.indexOf(k)!==-1) h=h.split(k).join(SVD[k]); }
  return h; }
function applyLang(){
  document.querySelectorAll("button[data-l]").forEach(b=>b.textContent=L(b.dataset.l));
  const n=$("btnNight"); if(n) n.textContent=L("NIGHT PANEL");
  const g=$("btnShop");  if(g) g.textContent=L("GARAGE")+" \u25B8";
  const t=$("crashTitle"); if(t) t.textContent=L("CONTACT.");
  if(typeof updAIPill==="function") updAIPill();
  if(typeof renderShop==="function" && $("shopBody")) renderShop();
}
/* SAE display: US mode measures in hp / lb-ft / \u00B0F / lb (psi lives in boostStr) */
function pwrN(ps){ return S.units==="mi"? Math.round(ps*0.9863) : Math.round(ps); }
function tqN(nm){ return S.units==="mi"? Math.round(nm*0.73756) : Math.round(nm); }
function pwrUnit(){ return S.units==="mi"? "hp" : (S.lang==="sv"?"hk":"hp"); }
function pwrStr(ps){ return pwrN(ps)+" "+pwrUnit(); }
function tqStrU(nm){ return tqN(nm)+(S.units==="mi"?" lb-ft":" Nm"); }
function tempStr(c){ return S.units==="mi"? Math.round(c*9/5+32)+"\u00B0F" : Math.round(c)+"\u00B0C"; }
function massStr(kg){ return S.units==="mi"? Math.round(kg*2.2046)+" lb" : Math.round(kg)+" kg"; }
function boostU(k){ return S.units==="mi"? (k*0.145038).toFixed(1)+" psi" : Math.round(k)+" kPa"; }
function KV(l,v){return '<div class="kv"><span>'+l+'</span><b>'+v+'</b></div>';}
function fmt(n){return Math.round(n).toLocaleString("sv-SE");}
const USD_PER_KR=0.095;
function fmtMoney(kr){return S.cur==="usd" ? "$"+Math.round(kr*USD_PER_KR).toLocaleString("en-US") : fmt(kr)+" kr";}
function boostStr(kPa){return S.units==="mi" ? (kPa*0.145038).toFixed(1)+" PSI" : (kPa/100).toFixed(2)+" BAR";}
function distStr(km){return S.units==="mi" ? (km*0.6214).toFixed(1)+" mi" : km.toFixed(1)+" km";}
function spdStr(ms){return S.units==="mi" ? Math.round(ms*2.23694)+" mph" : Math.round(ms*3.6)+" km/h";}
function turboOrder(k){return Object.keys(TURBOS).indexOf(k);}
function tunePrice(tn){return Math.round(tn.kr*Math.max(0.45,PROV().priceK));}
const CFG_CATS=[["game","GAME"],["pax","PASSENGER"],["road","ROAD"],["world","WORLD GEN"],["phys","PHYSICS"],["ai","AI DRIVER"],["cam","CAMERA"],["reg","REGION"]];
function tglBtn(attr,on,lbl){
  return '<button data-'+attr+'="1" style="flex:1;padding:11px 6px;border-radius:6px;border:1px solid '
    +(on?"var(--amber)":"#33363c")+';background:'+(on?"#2a2214":"#16181c")+';color:'
    +(on?"var(--amber)":"#9aa0a8")+';font:bold 12px Arial;letter-spacing:.05em;cursor:pointer">'
    +lbl+': '+(on?"ON":"OFF")+'</button>';
}
function gameToggles(){ // ARCADE DRIFT + EASY MODE — also shown on the garage landing
  return '<div style="display:flex;gap:8px;margin:2px 0 10px">'
    +tglBtn("arcade",S.arcade,"\uD83C\uDFAE ARCADE DRIFT")
    +tglBtn("easy",S.easy,"\uD83D\uDEE1 EASY MODE")+'</div>';
}
function renderCfgTab(){
  if(!window.cfgCat)window.cfgCat="game";
  let h='<div style="display:flex;gap:4px;flex-wrap:wrap;padding:4px 0 8px">'
    +CFG_CATS.map(c=>'<button data-cfgcat="'+c[0]+'" style="flex:none;padding:4px 9px;font-size:10px;border-radius:11px;border:1px solid '
      +(window.cfgCat===c[0]?"var(--amber)":"#33363c")+';background:#16181c;color:'
      +(window.cfgCat===c[0]?"var(--amber)":"#9aa0a8")+'">'+c[1]+'</button>').join("")+'</div>';
  if(window.cfgCat==="game"){
    h+='<h3 class="sec">HOW SHE DRIVES</h3>'+gameToggles()
      +'<div class="cite" style="padding:0 2px 8px">ARCADE DRIFT is a pure driver assist \u2014 it holds the tail out for the whole corner and leaves the road ahead exactly as it was. DRIFT style shapes a proper course: open sweepers with real straights between them, so entry speed stays high. EASY MODE switches every kind of damage off \u2014 the story stays, the bill never arrives. RACING style makes long sweepers and straights \u2014 except on dirt, where it drives the rally line but leaves the world alone.</div>'
      +'<div class="item"><h4>AI temperament</h4>'
      +'<div class="sub">'+AI_DESC[S.aiMode]+'</div>'
      +'<button data-set="ai">'+S.aiMode.toUpperCase()+'</button></div>'
      +'<h3 class="sec">SOUND</h3>'
      +'<div class="item"><h4>Engine audio \u2014 procedural Web Audio</h4>'
      +'<div class="sub">No samples: the exhaust is engine-order additive synthesis (the firing note plus its harmonics and the half-order lope) with a combustion-noise grit pulsed at the firing rate, boost feeds the intake hiss and the recirculating bypass-valve chuff, and the road noise is voiced straight from the contact calculations \u2014 smooth whir on tarmac, clumpy on dirt and snow, a low scrub at the slip limit, a whisper on black ice.</div>'
      +'<div style="display:flex;gap:8px">'+tglBtn("snd",S.snd!==false,"\uD83D\uDD0A ENGINE AUDIO")+'</div></div>'
      +'<div class="item"><h4>Music \u2014 procedural score, three styles</h4>'
      +'<div class="sub">All zero-sample, all on the same "Royal Road" loop (Fmaj7\u2013G7\u2013Em7\u2013Am7), each read live from the car. Pick a style: <b style="color:var(--amber)">'+M_STYLES[musicStyle()].nm+'</b> \u2014 '+M_STYLES[musicStyle()].sub+'</div>'
      +'<div style="display:flex;gap:6px;margin-bottom:8px">'
        +M_STYLES.map(function(st){ const on=musicStyle()===st.id;
          return '<button data-musicstyle="'+st.id+'" style="flex:1;padding:9px 4px;border-radius:6px;border:1px solid '
            +(on?"var(--amber)":"#33363c")+';background:'+(on?"#2a2214":"#16181c")+';color:'
            +(on?"var(--amber)":"#9aa0a8")+';font:bold 11px Arial;letter-spacing:.03em;cursor:pointer">'+st.nm+'</button>'; }).join("")
      +'</div>'
      +'<div style="display:flex;gap:8px">'+tglBtn("music",S.music!==false,"\uD83C\uDFB5 MUSIC")+'</div></div>'
      +'<h3 class="sec">GRAPHICS</h3>'
      +'<div class="item"><h4>Enhanced graphics \u2014 raw WebGL</h4>'
      +'<div class="sub">A raw-WebGL post pass over the 2D canvas: warm bloom, filmic tonemapping and fine film grain. Zero libraries. Costs a little GPU, not lap time. Off by default \u2014 tweak it below once it is on.</div>'
      +'<div style="display:flex;gap:8px">'+tglBtn("gfx",S.gfx===true,"\u2728 ENHANCED GRAPHICS")+'</div></div>'
      +(S.gfx===true? ('<div class="cfgRow"><div class="cfgL"><span class="cfgName">Bloom</span><span class="cfgVal" data-gfxval-for="Bloom">'+(+S.gfxBloom).toFixed(3)+'</span></div><div class="cfgR"><input type="range" data-gfxr="Bloom" min="0" max="0.8" step="0.02" value="'+S.gfxBloom+'"></div></div>'
        +'<div class="cfgRow"><div class="cfgL"><span class="cfgName">Film grain</span><span class="cfgVal" data-gfxval-for="Grain">'+(+S.gfxGrain).toFixed(3)+'</span></div><div class="cfgR"><input type="range" data-gfxr="Grain" min="0" max="0.12" step="0.005" value="'+S.gfxGrain+'"></div></div>'
        +'<div class="cfgRow"><div class="cfgL"><span class="cfgName">Chromatic aberration</span><span class="cfgVal" data-gfxval-for="Aberr">'+(+S.gfxAberr).toFixed(4)+'</span></div><div class="cfgR"><input type="range" data-gfxr="Aberr" min="0" max="0.006" step="0.0002" value="'+S.gfxAberr+'"></div></div>')
        :'')
      +cfgSecs("game");
  } else if(window.cfgCat==="reg"){
    h+='<h3 class="sec">REGION</h3>'
      +'<div class="item"><h4>Units</h4><div class="sub">Dials, odometer, dyno sheets and crash reports. US mode measures in SAE: hp, lb-ft, \u00B0F, psi.</div>'
      +'<button data-set="units">'+(S.units==="mi"?"US / SAE (mph \u00B7 hp \u00B7 \u00B0F)":"SVENSK / SI (km/h \u00B7 hk \u00B7 \u00B0C)")+'</button></div>'
      +'<div class="item"><h4>Currency</h4><div class="sub">Parts money. Exchange desk says 1 kr \u2248 $'+USD_PER_KR+'.</div>'

/* ============================ MAIN LOOP ================================= */
/* 24 fps render cap (FRAME below). Each rendered frame integrates SUB=3
   physics substeps of ~1/72 s. All displayed values pass through a 2nd-order
   servo filter (S.vis) so the capped presentation still reads smooth and
   deliberate, like hydraulics. Keep this comment in step with FRAME/SUB.   */
function initRoad(){
  S.road={segs:[],pts:[{x:0,y:0,s:0}],total:0,genHead:0,genX:0,genY:0};
  pushSeg(300,0,0); genRoadAhead();
}
const FRAME=1000/24, SUB=3, DT=FRAME/1000/SUB;
let acc=0,last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  if(document.hidden||winBlurred){ last=now; acc=0; return; }  // backgrounded OR unfocused: freeze the sim; audio parks separately
  acc+=now-last; last=now;
  if(acc<FRAME) return;
  acc=Math.min(acc-FRAME, FRAME*2);
  {
    for(let i=0;i<SUB;i++){
      S.t+=DT;
      driverStep(DT); engineStep(DT); vehicleStep(DT); trafficStep(DT); chaseStep(DT);
    }
    storyStep(); paxStep(FRAME/1000); wxStep(FRAME/1000); glassStep(FRAME/1000); S._fdt=FRAME/1000;
    S.sidT+=FRAME/1000; if(S.sidAuto!==false && S.sidT>4){S.sidT=0;S.sidMode++;}
    radarCheck();                                              // RADAR DETECTOR: is a cop-trap on screen?
  }
  // presentation layer: 2nd-order critically damped — no jumps, no speed steps
  const vz=S.vis, fdt=FRAME/1000;
  s2(vz,'rpm',S.eng.rpm,9,fdt);
  s2(vz,'v',S.veh.v,8,fdt);
  s2(vz,'boost',S.eng.boost,8,fdt);
  s2(vz,'coolT',S.eng.coolT===undefined?88:S.eng.coolT,2.2,fdt);
  const _grip=S.input.steerOn;
  const _steerNow=(S.drv.steerS!==undefined?S.drv.steerS:S.drv.steer)||0;
  s2(vz,'steer',S.drv.steerS+(S.drv.driftCS||0)+(_grip?0:S.veh.curv*S.veh.v*0.16)+S.veh.ts*0.22*Math.sin(S.t*11),
     _grip?18:9,fdt);                                   // your hands: a crisp, near-direct link to the rim
  s2(vz,'camX',S.veh.lane,7,fdt);
  // BODY ROLL — coupled to the SAME steering the rim shows, at a matched speed.
  // The sim only slides your lane (not the world curvature) when you steer, so
  // the honest lean from your own input has to be added here in the presentation
  // — otherwise the rim turns while the world stays flat, and the lean crawls in
  // a second late: the "fakery" that made manual steering and drift feel
  // disconnected. When the AI holds the wheel this added term is zero, so its
  // cornering lean is unchanged; the roll only quickens for your hands or a slide.
  const latSigned=S.veh.v*S.veh.v*S.veh.curv/CFG.G;
  const latRoll=latSigned + (_grip? _steerNow*Math.min(1,S.veh.v/12)*0.85 : 0);
  s2(vz,'roll',Math.max(-0.13,Math.min(0.13, latRoll*0.055*(S.parts.susp?0.55:1)*(1+(S.drv.driftA||0)*0.9))),
     _grip?12:((S.drv.driftA||0)>0.15?8:5),fdt);        // lean tracks the rim, not ~1s behind it
  renderWorld(); drawGlass(); renderCockpit(); drawWipers(); drawBoostPod(); drawTempGauge(); drawMirror(); drawMinimap(); drawRestHUD(); speechFrame();  if(S.drv.warn && Math.floor(S.t*(S.drv.warn===2?10:5))%2===0){ // collision warning
    const wy=H*0.20, sz=S.drv.warn===2?34:24;
    ctx.fillStyle=S.drv.warn===2?"#ff2e1f":"#ffb03a";
    ctx.beginPath();ctx.moveTo(W/2,wy-sz);ctx.lineTo(W/2-sz*0.9,wy+sz*0.6);ctx.lineTo(W/2+sz*0.9,wy+sz*0.6);ctx.fill();
    ctx.fillStyle="#16090a";ctx.font="bold "+(sz*1.1)+"px Arial";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("!",W/2,wy+sz*0.12);
    if(S.drv.warn===2){ctx.fillStyle="#ff5a4d";ctx.font="bold "+(sz*0.7)+"px Arial";
      ctx.fillText("BRAKE",W/2,wy+sz*1.35);}
  }
  if(S.radar && S.radar.on){                                 // RADAR DETECTOR — cop-trap dead ahead
    const bx=W*0.5, by=H*0.085, blink=Math.floor(S.t*4)%2===0;
    ctx.save(); ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillStyle=blink?"rgba(255,60,40,0.92)":"rgba(120,20,10,0.82)";
    roundRect(bx-60, by-15, 120, 30, 6);
    ctx.fillStyle=blink?"#160406":"#e8c9c0"; ctx.font="bold 15px Arial";
    ctx.fillText("\u26A1 RADAR \u00B7 "+Math.round(S.radar.dist)+" m", bx, by+1);
    ctx.restore(); ctx.shadowBlur=0;
  }
  gfxFrame();                                                // enhanced graphics: WebGL re-presents the frame
  sndFrame();                                                // the soundscape reads the same state
  musicFrame();                                              // the score reads road speed for its tempo
  sndHornWatch();                                            // oncoming courtesy: they see you in their lane
  // periodic HUD refresh
  updKrPill();
  $("pillOdo").textContent=distStr(S.odo)+" · "+TRIMS[S.trim].nm;
}
/* --- pointer input: one thumb steers, the other works the pedals ------- */
const PTRS={};
function zoneAt(px,py){
  const zw=ZONES.wheel;
  if(ZONES.gas && px>=ZONES.gas.x&&px<=ZONES.gas.x+ZONES.gas.w&&py>=ZONES.gas.y&&py<=ZONES.gas.y+ZONES.gas.h) return "gas";
  if(ZONES.brake && px>=ZONES.brake.x&&px<=ZONES.brake.x+ZONES.brake.w&&py>=ZONES.brake.y&&py<=ZONES.brake.y+ZONES.brake.h) return "brake";
  if(zw && (px-zw.x)**2+(py-zw.y)**2 < (zw.r*1.25)**2) return "wheel";
  return null;
}
function ptrPos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}
const wheelSteer=px=>Math.max(-1,Math.min(1,(px-ZONES.wheel.x)/(ZONES.wheel.r*0.9)));
cv.addEventListener("pointerdown",e=>{
  const [px,py]=ptrPos(e);
  // tap the speech bubble to set the line aside (and its replies with it)
  if(SPEECH_BOX && px>=SPEECH_BOX.x && px<=SPEECH_BOX.x+SPEECH_BOX.w && py>=SPEECH_BOX.y && py<=SPEECH_BOX.y+SPEECH_BOX.h){
    paxDismiss(); e.preventDefault(); return;
  }
  { // SID touch: LEFT half toggles auto-cycling; RIGHT half pages — back one
    // while auto is on (re-read what just scrolled by), forward one when manual.
    const zs=ZONES.sid;
    if(zs && px>=zs.x-6 && px<=zs.x+zs.w+6 && py>=zs.y-6 && py<=zs.y+zs.h+6){
      if(px < zs.x+zs.w/2){
        S.sidAuto = S.sidAuto===false;
        toast(S.sidAuto? "SID auto-cycle ON \u2014 the pages turn themselves. Right side steps back."
                       : "SID auto-cycle OFF \u2014 tap the right side to page through.");
      } else {
        const n=SID_PAGES.length;
        S.sidMode = S.sidAuto!==false ? (S.sidMode%n+n-1)%n : (S.sidMode+1)%n;
        S.sidT=0;                                     // fresh page gets its full stay
      }
      e.preventDefault(); return;
    }
  }
  const z=zoneAt(px,py); if(!z)return;
  cv.setPointerCapture(e.pointerId); PTRS[e.pointerId]=z;
  if(z==="gas")S.input.gas=true;
  else if(z==="brake")S.input.brake=true;
  else{S.input.steerOn=true;S.input.steer=wheelSteer(px);}
  e.preventDefault();
});
cv.addEventListener("pointermove",e=>{
  if(PTRS[e.pointerId]!=="wheel")return;
  const [px]=ptrPos(e);
  S.input.steer=wheelSteer(px);
});
function ptrEnd(e){
  const z=PTRS[e.pointerId]; if(!z)return; delete PTRS[e.pointerId];
  if(z==="gas")S.input.gas=false;
  else if(z==="brake")S.input.brake=false;
  else{S.input.steerOn=false;S.input.steer=0;}
}
cv.addEventListener("pointerup",ptrEnd); cv.addEventListener("pointercancel",ptrEnd);
/* passenger dialogue: tapping a choice answers the rider */
$("paxChoices").addEventListener("click",e=>{
  const b=e.target.closest(".paxChoice"); if(!b) return;
  e.stopPropagation(); paxChoose(+b.dataset.i);
});
/* keyboard: arrows / WASD do the same */
const KEYS={};
window.addEventListener("keydown",e=>{
  KEYS[e.key]=true; syncKeys();
  if(e.key==="n"||e.key==="N")$("btnNight").click();
});
window.addEventListener("keyup",e=>{KEYS[e.key]=false; syncKeys();});
function syncKeys(){
  const L=KEYS.ArrowLeft||KEYS.a, R2=KEYS.ArrowRight||KEYS.d;
  S.input.gas=!!(KEYS.ArrowUp||KEYS.w);
  S.input.brake=!!(KEYS.ArrowDown||KEYS.s||KEYS[" "]);
  if(L||R2){S.input.steerOn=true;S.input.steer=(R2?1:0)-(L?1:0);}
  else if(!Object.values(PTRS).includes("wheel")){S.input.steerOn=false;S.input.steer=0;}
}
rebuildProfiles(); resize(); initRoad(); renderShop(); applyLang();
toast("📟 SAAB IDLE — the AI drives at the limit. Grab the wheel or pedals to override (or WASD). GARAGE ▸ for the path.");
/* --- background = pause. Web Audio runs on its own thread and keeps playing
   when Chrome is backgrounded on mobile; requestAnimationFrame stops on its
   own. So on hide we explicitly SUSPEND the context (silence) and the loop
   freezes itself; on return we hand time back cleanly and resume. */
function setHidden(h){
  if(h){ if(SND.ctx && SND.ctx.state==="running") SND.ctx.suspend&&SND.ctx.suspend(); }
  else { last=performance.now(); acc=0;            // don't let elapsed background time flood the accumulator
    if((S.snd!==false || S.music!==false) && SND.ctx && SND.ctx.state==="suspended") SND.ctx.resume&&SND.ctx.resume(); }
}
document.addEventListener("visibilitychange",()=>setHidden(document.hidden));
window.addEventListener("pagehide",()=>setHidden(true));            // mobile: app switch / tab close
window.addEventListener("pageshow",()=>{ if(!document.hidden) setHidden(false); });
/* --- FOCUS = the other kind of "away". On desktop the window can lose focus
   while still visible (document.hidden stays false), so the context is NOT
   suspended and the loop keeps running — which left the continuously-running
   ROAD/RAIN noise bed droning on. We park the whole soundscape on blur (ramp
   the engine master AND the music bus to zero) and both sndFrame/musicFrame
   bail while parked so nothing pushes those gains back up; focus restores. */
let winBlurred=false;
function audioParked(){ return document.hidden || winBlurred; }
function audioPark(){
  if(!SND.ctx) return; const t=SND.ctx.currentTime;
  if(SND.master)   SND.master.gain.setTargetAtTime(0,t,0.04);
  if(SND.musicBus) SND.musicBus.gain.setTargetAtTime(0,t,0.04);
}
function audioUnpark(){
  if(!SND.ctx) return; const t=SND.ctx.currentTime;
  if(SND.master)   SND.master.gain.setTargetAtTime(S.snd!==false?0.34:0,t,0.20);
  if(SND.musicBus) SND.musicBus.gain.setTargetAtTime(S.music!==false?0.5:0,t,0.30);
}
window.addEventListener("blur",()=>{ winBlurred=true; audioPark(); });
window.addEventListener("focus",()=>{ winBlurred=false;
  if(!document.hidden){
    if(SND.ctx && SND.ctx.state==="suspended" && (S.snd!==false||S.music!==false)) SND.ctx.resume&&SND.ctx.resume();
    audioUnpark(); last=performance.now(); acc=0;
  }
});
requestAnimationFrame(loop);
// title splash: CSS fades it out at 5.4–6.0 s; drop it from the DOM just after.
setTimeout(()=>{ const el=$("intro"); if(el) el.remove(); }, 6050);
</script>
