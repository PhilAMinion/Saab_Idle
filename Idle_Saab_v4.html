  const bKnock = C.diesel? 1e9 : Math.max(0,(C.knockPivotBase + CFG.ENG.KNOCK_BOOST_MARGIN - ambK)/Math.max(0.05,(1-C.icEff)*0.95)); // boost the charge can take before the ECU pulls timing — octane & IC raise it
  let boostTgt = Math.min(boostNeed, boostCeil, bKnock) * (e.rpm>1900?1:e.rpm/1900);
  if(S.drv.pedal<=0.05) boostTgt = -48*Math.min(1,e.rpm/2600);  // throttle shut = vacuum
  // spool: 1st-order lag; the bypass valve dumps pressure far faster than it builds
  const tau = turbo.tau*spoolF * (e.rpm<3000? 1.7-e.rpm/5000 : 1);
  const tauEff = (boostTgt < e.boost-20)? 0.13 : tau;           // bypass valve recirculates
  e.boost += (boostTgt-e.boost)*Math.min(1,dt/tauEff);
  e.req = (e.req||0) + (boostTgt-(e.req||0))*Math.min(1,dt/0.22); // dash meter = ECU request
  e.boostPk=Math.max((e.boostPk||-60)-dt*3.5, e.boost);          // peak-hold needle
  e.wg = boostTgt>=boostCeil-1?1:boostTgt/boostCeil;
  // --- charge temp & knock margin
  // --- thermal state: IC core + coolant (fatigue under repeated pulls) ---
  const amb=WX_AMB[S.wx.type];
  if(e.icT===undefined) e.icT=amb;
  if(e.coolT===undefined) e.coolT=88;
  const load=S.drv.pedal*Math.min(1,e.rpm/5200);
  const compOut = amb + Math.max(0,e.boost)*0.62;              // compressor discharge temp
  const icMass = S.parts.ic? 0.036 : 0.11;                     // big core soaks slower
  const icCool = (S.parts.ic? 0.085 : 0.055)*(0.30+S.veh.v/26);
  e.icT += ((compOut-e.icT)*icMass*load - (e.icT-amb)*icCool)*dt*0.24; // minute-scale fatigue
  e.icT = Math.max(amb-1, e.icT);
  const kWout = Math.max(0, e.tqOut*e.rpm/9549);
  const hlth = (S.engHealth===undefined?100:S.engHealth);
  e.coolT += ( kWout*0.007*(1+(100-hlth)*0.012)*(1+(S.bodyDmg||0)*0.004)
             - (e.coolT-amb)*(0.0095 + 0.0035*(S.veh.v/30) + (S.parts.rad?0.0032:0)) )*dt;
  e.coolT = Math.max(70, Math.min(133, e.coolT));
  e.steam = e.coolT>118 ? 1 : (e.coolT<109 ? 0 : e.steam||0);  // hysteresis: steams until it cools
  // sustained overheat is not free: past 124\u00B0C the head gasket keeps score,
  // past 132 you are actively machining the deck with coolant
  if(e.coolT>124){
    S.engHealth=Math.max(0,(S.engHealth===undefined?100:S.engHealth) - dt*(e.coolT>132?2.5:0.8)*dmgK());
    if(e.coolT>132 && !S._hgToast){ S._hgToast=1;
      toast("\uD83D\uDD25 HEAD GASKET TERRITORY \u2014 every second up here costs the block"); }
    if(S.engHealth===0 && !S._blownToast){ S._blownToast=1;
      toast("\u2620 THE BOTTOM END IS DONE. She\u2019ll idle home \u2014 the garage sells breaker engines."); }
  } else if(e.coolT<112) S._hgToast=0;
  e.dtcT=(e.dtcT||0)+dt;
  if(e.dtcT>1){ e.dtcT=0; S.dtc=computeDTCs(); }
  // charge temp: air leaves the CORE at core temp + slip past its effectiveness
  const iatTgt = e.icT + (C.iatBonus||0) + (compOut - e.icT)*(1-icEff)*0.9;
  e.iat += (iatTgt-e.iat)*dt*0.5;
  const knockMgc = 2600 - Math.max(0,e.iat-C.knockPivot)*C.knockSlope; // fuel chemistry: pivot AND slope
  // --- actual delivered airmass = min(request, physics, fuel, block, thermal)
  const bpT = 1 - Math.max(0,(e.rpm-C.bpStart)/2600)*C.bpTaper;   // backpressure chokes the top
  const mgcBoost = naMgc*Math.max(30,AIR_KPA+e.boost)/AIR_KPA * (CFG.ENG.T_REF_K/(273+Math.max(0,e.iat))) * bpT;
  e.mgc = Math.min(mgcReq, mgcBoost, mgcHW, fuelMgc, blockMgc, knockMgc*0.97);
  // real knock only when the charge is properly heat-soaked; ECU pulls timing
  e.knock = e.iat>C.knockPivot+22 ? 1 : Math.max(0,e.knock-dt*1.5);
  let timing = e.knock>0?0.90:1;
  // heat retard: the ECU protects the engine by pulling advance — fuel chemistry
  // decides how early and how hard (this is where 98/E85 earn their keep)
  timing *= 1 - Math.min(0.14, Math.max(0,e.iat-C.knockPivot-4)*0.008*(C.knockSlope/20));
  timing *= 1 + C.adaptAdv;                                    // good fuel: the adaptation banks advance
  // KNOCK EVENTS — T7 style. Individual detonations when margin thins:
  // instant retard on the event, plus a long-term adaptation that creeps
  // back only after quiet kilometres. Deterministic (position-hashed).
  if(!C.diesel){
    const margin = C.knockPivot + 4 - e.iat;
    const load = S.drv.pedal*Math.min(1,e.rpm/5200);
    e.knockEvt = Math.max(0, (e.knockEvt||0) - dt*2.2);
    if(margin < 14 && load > 0.72){
      const det = Math.abs(Math.sin(S.veh.s*12.9898 + e.rpm*0.0173)*43758.5453)%1;
      if(det < (14-margin)*0.055*dt){
        e.knockEvt=0.5; e.knockAdapt=Math.min(0.12,(e.knockAdapt||0)+0.018);
        S.knockCount=(S.knockCount||0)+1;
      }
    }
    e.knockAdapt=Math.max(0,(e.knockAdapt||0)-dt*0.0016);
    timing *= (1 - (e.knockEvt>0?0.06:0)) * (1 - (e.knockAdapt||0));
  }
  if(C.leaded && S.drv.pedal>0.2){                             // lead plates the lambda sond
    S.o2Foul=(S.o2Foul||0)+dt*0.0012;
    if(S.o2Foul>0.85 && !(S.jobs||[]).some(x=>x.id==="o2sensor") && !S._o2Job){
      S._o2Job=1; S.jobs=S.jobs||[];
      S.jobs.push({...PROCS.o2sensor,id:"o2sensor",done:[],wear:1});
      toast("\u26a0 The lambda sond reads mush — the leaded fuel finally plated it. Job sheet in the garage.");
    }
  }
  if(C.overFuel){ timing *= (S.tune===0?0.85:0.90);            // pig rich: power washed away
    if(e.rpm<1600) e.knock=Math.max(e.knock,0.4); }            // lumpy idle, fouled plugs
  if(e.steam) timing*=0.75;                                    // limp: protect the head gasket
  if(hlth<=0) timing*=0.5;                                     // a dead engine drags itself home
  e.throttle = mgcReq>0? Math.min(1, e.mgc/Math.max(1,mgcBoost)) : 0;
  // --- torque & power
  const fric = engFric(e.rpm);                       // friction/pumping Nm ← CFG.ENG
  e.tqOut = Math.max(-fric, e.mgc*TQ_PER_MG*timing*provShape(e.rpm) - fric);
  if(S.drv.pedal<=0.02) e.tqOut = -fric - e.rpm/CFG.ENG.FRIC_REF_RPM*CFG.ENG.EBRAKE_NM; // engine braking ← CFG.ENG
  e.hp = Math.max(0, e.tqOut*e.rpm/CFG.ENG.HP_DIV);
  if(e.hp>S.bestHp) S.bestHp=Math.round(e.hp);
}

/* ============================ VEHICLE DYNAMICS ========================== */
// LATERAL HANDLING — KINEMATIC BICYCLE IN THE ROAD FRAME. The car used to be a
// lane-offset slider: the wheel slid it sideways and the road's curve was never
// felt, so a run of reversing bends washed you sideways instead of letting you
// hold a line. Now the car carries a real heading error (v.psi) vs the road
// tangent: the wheel commands a curvature, the road subtracts its own, and the
// lane offset follows from the heading. Hold the wheel dead straight through a
// chicane and the road winds PAST you — you trace a straight world-line through
// the apexes. Steer to match the bend to hold the lane. The AI adds a curvature
// feed-forward + heading damping (below) so idle driving still tracks; a human
// steers the corner themselves.
const STEER_KAPPA = 0.05;   // steering curvature at full lock (1/m) → tightest radius ~20 m
const PSI_MAX     = 0.5;    // cap on heading-vs-road error (rad, ~28°) — plenty to cut an apex
const AI_PSI_DAMP = 5.0;    // AI heading-derivative gain: keeps lane-holding from ringing
function vehicleStep(dt){
  if(S.crashed && !S.wreck) S.crashed=false;         // event flag: readable for one frame, then life goes on
  if(S.wreck){ wreckStep(dt); return; }
  const e=S.eng, v=S.veh, trim=TRIMS[S.trim];
  const m=trim.kg+CFG.CREW_KG, g=CFG.G;
  // gearbox: AI shifts
  const ratio=GEARS[S.dt.gear-1]*FINAL;
  const roadRpm = Math.max(850, v.v/WHEEL_R*ratio*60/(2*Math.PI));
  // CLUTCH PHYSICS: demand past the plate's grip = slip. The engine runs away
  // from the road speed, the plate transmits only its (heat-faded) capacity,
  // and the flywheel-side energy goes into the friction surface as heat.
  e.clutchT = e.clutchT===undefined? 20 : e.clutchT;
  const capCold = clutchCap();
  const cap = capCold * Math.max(0.45, 1 - Math.max(0, e.clutchT-240)/520);  // fade past 240°C
  const demand = Math.max(0, e.tqOut);
  if(demand > cap*(S.parts.flywheel?1.06:1.02) && S.drv.pedal>0.25){
    e.slipping = 1;
    const excess=(demand-cap)/cap;
    e.slipRpm = Math.min(2400, (e.slipRpm||0) + (excess*3600 - (e.slipRpm||0))*dt*5);
    e.clutchT += (e.slipRpm/1000)*demand*0.0011*dt*60*skillFx().clutchK; // slip speed x torque = heat
    S.clutchWear=(S.clutchWear||0)+dt*excess*0.004;
  } else {
    e.slipping=0;
    e.slipRpm = Math.max(0, (e.slipRpm||0) - dt*(S.parts.flywheel?4600:3800)); // plate bites again
  }
  e.clutchT += (20 - e.clutchT)*dt*0.05;                          // bellhousing cools slowly
  e.rpm = Math.min(trim.redline+150, roadRpm + (e.slipRpm||0));
  if(e.slipping && !e._slipToast && e.slipRpm>500){ e._slipToast=1;
    toast("\u26a0 CLUTCH SLIPPING \u2014 the revs run away, the road speed doesn\u2019t. The plate is writing smoke signals."); }
  if(!e.slipping) e._slipToast=0;
  if(e.rpm>trim.redline-(S.parts.shifter?140:250) && S.dt.gear<5 && !e.slipping) S.dt.gear++;
  else if(e.rpm<1900 && S.dt.gear>1) S.dt.gear--;
  // forces: only what the plate can hold reaches the box
  const boxIn=Math.min(e.tqOut, cap);
  if(boxIn>430 && !S.parts.diffpin && !(S.jobs||[]).some(x=>x.id==="diffPin")){
    S.pinWear=(S.pinWear||0)+dt*(boxIn-430)/2600;               // the factory pin keeps score
    if(S.pinWear>=1){ S.pinWear=0;
      S.jobs=S.jobs||[]; S.jobs.push({...PROCS.diffPin,id:"diffPin",done:[]});
      S._pinLash=1;
      toast("\uD83D\uDCA5 CLUNK. The FM55 diff pin walked \u2014 she drives, with lash. The rebuild is on the bench."); }
  }
  let wheelTq = boxIn*ratio*0.90*(S._pinLash?0.93:1);
  let F = wheelTq/WHEEL_R;
  // PER-WHEEL CONTACT: four patches sampled on the actual surface under each
  // corner of the car. On patchy ice the axles disagree — the front ploughs,
  // or the rear steps out. This is where winter driving lives.
  // per-wheel variation lives INSIDE the cells the planner already scans:
  // a patch can coat the whole lane, or only the left or right wheeltrack.
  // muRoad() reports the worst case, so Calm still pre-slows onto every cell.
  const sideBias=(sp,dl)=>{ if(sp<=0) return 0;
    const z=Math.floor(v.s/22);
    const h2=(Math.imul(z,2246822519)^0x9e3779b9)>>>0, m=(h2>>>4)%3;
    return m===0? sp : (m===1? (dl<0?sp:sp*0.25) : (dl>0?sp:sp*0.25)); };
  const wMu=(ds,dl)=>{ const p=sideBias(snowPatchAt(v.s+ds), dl);
    const q=icePatchAt(v.s+ds);                              // full width: no side bias, no mercy
    const base=profAt(v.s).mu*(wxMu()*(1-p)+0.30*p);
    return base*(1-q)+profAt(v.s).mu*0.18*q; };
  const muFL=wMu(1.28,-0.76), muFR=wMu(1.28,0.76), muRL=wMu(-1.28,-0.76), muRR=wMu(-1.28,0.76);
  const muF=(muFL+muFR)/2, muR=(muRL+muRR)/2;
  const iceRef=profAt(v.s).mu*wxMu()*0.62;
  v.wheelIce=[muFL<iceRef?1:0, muFR<iceRef?1:0, muRL<iceRef?1:0, muRR<iceRef?1:0];
  v._iceToastT=Math.max(0,(v._iceToastT||0)-dt);
  if(icePatchAt(v.s+1.28)>0 && v.v>10 && !(v._biT>0)){ v._biT=14;
    toast("\u26A0 SVART IS \u2014 black ice. Hands still, feet off, pray in Swedish."); }
  v._biT=Math.max(0,(v._biT||0)-dt);
  if((v.wheelIce[0]||v.wheelIce[1]) && Math.abs(S.drv.steerS!==undefined?S.drv.steerS:S.drv.steer)>0.35 && v.v>8 && v._iceToastT<=0){
    v._iceToastT=9; toast("\u2744 FRONT AXLE ON ICE \u2014 the nose ploughs straight while the wheel argues."); }
  else if((v.wheelIce[2]||v.wheelIce[3]) && S.drv.pedal>0.5 && Math.abs(v.curv)>0.002 && v._iceToastT<=0){
    v._iceToastT=9; toast("\u2744 REAR AXLE ON ICE \u2014 the back end has opinions now."); }
  // FWD traction: the FRONT wheels do the pulling — their patch is the budget.
  // (F = mu*(0.62mg - 0.19F) solved for F), minus lateral grip-circle use.
  const mu = CFG.GRIP.MU0*(S.parts.lsd?CFG.GRIP.LSD:1)*(S.parts.susp?CFG.GRIP.SUSP:1)*(S.parts.arb?CFG.GRIP.ARB:1)*muF; // ← CFG.GRIP
  const latF = Math.abs(v.latG)*m*g;
  // LOOSE-SURFACE LONGITUDINAL TRACTION: on gravel/dirt the driven tyre shears
  // down into the aggregate and a passive bulldozing (earth-pressure) force adds
  // to drive thrust — peak longitudinal grip lives at high slip, well above the
  // Coulomb mu*N that rules a hard surface. This is why rally cars spin the wheels
  // for drive. LATERAL grip gets none of it (a sideways tyre just ploughs wide),
  // so ONLY the drive term is lifted: the friction ellipse stretches lengthwise,
  // which is exactly what lets the tail come round on power over gravel. Kept
  // under tarmac's budget so hardpack still out-hooks the loose stuff.
  const looseLong=(profAt(v.s).dirt||profAt(v.s).gravel)? 1.20 : 1;
  const budget = Math.max(0.1, CFG.GRIP.PATCH*mu*(m*g*CFG.GRIP.W_FRONT)/(1+CFG.GRIP.PATCH*mu*CFG.GRIP.W_XFER)*looseLong - latF*CFG.GRIP.LAT_SHARE); // ← CFG.GRIP
  // riding the limit IS control — the flag means real wheelspin (>12% over)
  v.slip = F>budget*CFG.GRIP.SLIP_OVER ? 1 : Math.max(0,v.slip-dt*3);
  if(F>budget) F=budget;                                    // clamp at peak slip ratio
  // TORQUE STEER: unequal driveshafts tug the wheel under load (a Saab greeting)
  const tsRaw=Math.max(0,F/Math.max(1,mu*m*g*0.55)-0.30);
  v.ts = tsRaw*(S.parts.lsd?0.28:1)*(S.parts.susp?0.75:1)*(S.parts.rescue?0.52:1)*(S.parts.poly?0.85:1)
             *(S.parts.axles?0.80:1)*(S.parts.mounts?0.90:1);
  v.lane += v.ts*(0.75+0.35*Math.sin(S.t*2.3))*dt*2.1*Math.min(1,v.v/6); // pulls right, squirms — but only rolling
  const Faero = 0.5*CFG.GRIP.RHO*CFG.GRIP.CD*CFG.GRIP.AREA*v.v*v.v;       // ← CFG.GRIP (OG 9-3)
  const Frr = m*g*CFG.GRIP.CRR; // ← CFG.GRIP
  const Fbrake = (S.drv.brakeS!==undefined?S.drv.brakeS:S.drv.brake) * m*g*CFG.GRIP.BRAKE_G*(S.parts.brakes?CFG.GRIP.BRAKE_PART:1)*skillFx().brkK*((muF+muR)/2);
  const prevG=v.grade||0;
  const seg=roadAt(v.s); v.grade=seg.grade; v.curv=curvAt(v.s);
  if((v.grade-prevG)<-0.055 && v.v>23 && !(v.airT>0)){               // the lip lets go of the wheels
    v.airT=Math.min(1.0, v.v*0.020); v.airTot=v.airT;
  }
  let Fgrass=0;
  const edgeW=profAt(v.s).edge + (v.lane>0 ? restSidingW(v.s) : 0);  // the paved pull-off siding is drivable — extend the edge to the right
  if(Math.abs(v.lane)>edgeW){                                        // wheels on the verge
    const rough=Math.min(1,(Math.abs(v.lane)-edgeW)/1.2);
    Fgrass=m*g*(0.14+0.11*rough); v.slip=1;
    const jit=Math.sin(v.s*2.7)+0.6*Math.sin(v.s*6.3+1.4);           // deterministic washboard
    v.bounce=jit*rough*Math.min(1,v.v/16)*7;
    v.lane+=jit*0.018*rough*Math.min(1,v.v/20);                      // the ground steers now
    v.offEx=1;
    if(Math.abs(v.lane)>edgeW+0.5 && v.v>16){
      v.wheelDmg=(v.wheelDmg||0)+dt*(v.v-16)/9*CFG.DMG.offroadK*dmgK();
      if(v.wheelDmg>=1 && !S.wreck){
        v.wheelDmg=0.55; v.v*=0.72; v.bounce=Math.max(v.bounce||0,1.4);
        applyDamage(7*CFG.DMG.offroadK, 9*CFG.DMG.offroadK, "\u2699 The rough eats a rim at "+spdStr(v.v)+" \u2014 she limps but she lives."); }
    }
    if(Math.abs(v.lane)>edgeW+0.6 && !S.wreck && !v._treeCool){       // trees do not negotiate...
      outer: for(const sg of S.road.segs){ if(sg.s0>v.s+6||sg.s0+sg.len<v.s-6) continue;
        for(const ft of sg.feat){ if((ft.type==="tree"||ft.type==="rock"||ft.type==="moose")
            && Math.abs(ft.s-v.s)<2.6 && ft.side===Math.sign(v.lane)){
          const vHit=v.v; v._treeCool=3;
          if(vHit>24){ startWreck("A roadside "+ft.type+" at "+spdStr(vHit)+". Over she goes.",null); }
          else {       // ...but the crumple zones answer for you
            v.v*=0.30; v.lane-=Math.sign(v.lane)*0.9; v.driftYaw=(v.driftYaw||0)-Math.sign(v.lane)*0.25;
            v.bounce=Math.max(v.bounce||0,1.8);
            applyDamage(8+vHit*0.5, 12+vHit*0.8, "\uD83C\uDF32 A roadside "+ft.type+" does not negotiate \u2014 the crumple zone answers at "+spdStr(vHit)+"."); }
          break outer; } } }
    }
    v._treeCool=Math.max(0,(v._treeCool||0)-dt);
  } else {
    const pfS=profAt(v.s);
    if((pfS.dirt||pfS.gravel) && v.v>4){
      // LOOSE-SURFACE TEXTURE: the road is alive under you. On tarmac the tyres
      // ride glass; on grus and skogsväg the body never settles. Deterministic
      // by arclength (same washboard every lap), scaled by speed and by how
      // loose it is — dirt rattles harder than a graded gravel road. This is
      // what stops the forest feeling smooth-and-slow: now it feels fast and
      // busy, exactly as quick as the terrain lets you go.
      const looseK=pfS.dirt?1.0:0.6;
      const tex=Math.sin(v.s*3.1)+0.5*Math.sin(v.s*7.9+2.1)+0.35*Math.sin(v.s*17.3);
      v.bounce=Math.max((v.bounce||0)*0.8, Math.abs(tex)*looseK*Math.min(1,v.v/22)*1.7);
      v.lane += tex*0.004*looseK*Math.min(1,v.v/26);                  // the surface nibbles the line
    } else v.bounce=(v.bounce||0)*0.8;
    if(v.offEx && !S.crashed){ v.offEx=0;                            // back on the black stuff
      v.wheelDmg=0;                                                  // free recovery — no alignment charge
    }
  }
  let Fw=F, Fb=Fbrake, Fr2=Frr;
  if(v.airT>0){ v.airT-=dt; Fw*=0.1; Fb=0; Fr2=0; Fgrass=0;          // airborne: nothing grips
    if(v.airT<=0){ v.bounce=10;
      }
  }
  const a=(Fw-Faero-Fr2-Fb-Fgrass-m*g*Math.sin(v.grade))/m;
  v.v=Math.max(0,v.v+a*dt); v.s+=v.v*dt;
  S.odo+=v.v*dt/1000; S.tripOdo+=v.v*dt/1000;
  // the odometer keeps the score: chains stretch, pumps weep
  S.carMiles=(S.carMiles||0)+v.v*dt/1609;
  S._xpMi=(S._xpMi||0)+v.v*dt/1609; if(S._xpMi>1){ S._xpMi-=1; addXp(3);
    if(!S.easy) S.rust=Math.min(92,(S.rust||0)+0.05);          // Swedish winters keep score
    checkUnlocks(); }
  if(S.engHealth===undefined)S.engHealth=100;
  if(!S._chainDue) S._chainDue=34+(S.engHealth/4);
  if(!S._pumpDue)  S._pumpDue=S._chainDue*1.7;
  S.jobs=S.jobs||[];
  if(TRIMS[S.trim].diesel){
    if(!S._dPumpDue) S._dPumpDue=26+(S.engHealth||100)/5;
    if(S.carMiles>S._dPumpDue && !S.jobs.some(x=>x.id==="dieselPump")){
      S.jobs.push({...PROCS.dieselPump,id:"dieselPump",done:[],wear:1});
      S._dPumpDue=S.carMiles+26+(S.engHealth||100)/5;
      toast("\u2699 The injection pump is weeping \u2014 reseal on the bench or watch the oddball fade.");
    }
  }
  if((S.bodyDmg||0)>30 && !S.jobs.some(x=>x.id==="panels")){
    S.jobs.push({...PROCS.panels,id:"panels",done:[]}); }
  if(S.carMiles>S._chainDue && !S.jobs.some(x=>x.id==="chainKit") && !S._chainDone){
    S._chainDone=1; S.jobs.push({...PROCS.chainKit,id:"chainKit",done:[],wear:1});
    toast("\u26a0 Cold-start rattle from the passenger side. The chain is asking. Job sheet in the garage.");
  }
  if(S.carMiles>S._pumpDue && !S.jobs.some(x=>x.id==="waterPump") && !S._pumpDone){
    S._pumpDone=1; S.jobs.push({...PROCS.waterPump,id:"waterPump",done:[],wear:1});
    toast("\u26a0 Coolant drips at the weep hole. The pump is telling you early. Job sheet in the garage.");
  }
  if(S.jobs.some(x=>x.wear)) S.engHealth=Math.max(0, S.engHealth - v.v*dt/1609*0.5*dmgK()); // ignored wear bites
  // heavy drift held long enough earns the drone shot
  if((S.drv.driftA||0)>0.5 && Math.abs(v.driftYaw||0)>0.20){   // any drifting mode earns the reel
    v.bigDriftT=(v.bigDriftT||0)+dt;
    if(v.bigDriftT>2.6 && S.t-(S.lastDriftRp||-99)>25 && !S.crashed){
      S.lastDriftRp=S.t; v.bigDriftT=0; addXp(25); }
  } else v.bigDriftT=Math.max(0,(v.bigDriftT||0)-dt*2);
  if(muR<muF*0.75 && S.drv.pedal>0.5 && Math.abs(v.curv)>0.0015 && v.v>10){
    v.driftYaw=(v.driftYaw||0)+Math.sign(v.curv)*dt*0.55*(1-muR/muF);   // rear ice: it rotates
  }
  v.latG = v.v*v.v*Math.abs(v.curv)/g;
  // past the grip circle the nose washes wide — understeer toward the outside.
  // GAME-SPACE DRIFT: wheelspin thrown sideways INTO the corner buys lateral
  // grip reality doesn't sell. Yaw aligned with the curve + power on = the car
  // corners past the physics ceiling — attack it sideways, time the exit.
  const muCorner=CFG.GRIP.MU0*(S.parts.lsd?CFG.GRIP.LSD_CORNER:1)*(S.parts.susp?CFG.GRIP.SUSP:1)*(S.parts.arb?CFG.GRIP.ARB_CORNER:1)*(muF*CFG.GRIP.W_FRONT+muR*(1-CFG.GRIP.W_FRONT)); // ← CFG.GRIP
  const yawIn=(v.driftYaw||0)*Math.sign(v.curv||1);
  // DRIFT QUALITY — smooth and intent-led. The driver's commitment (driftA) and
  // how far the tail is already hung (yawIn) both feed it; throttle modulates.
  // No frame-to-frame halving, so a held slide doesn't flicker in and out.
  const driftInt=Math.max(0,Math.min(1,(S.drv.driftA||0)));
  const yawAlign=Math.max(0,Math.min(1, yawIn/0.30));
  const driftQ=Math.max(driftInt*0.62, yawAlign)*Math.min(1, 0.45+S.drv.pedal*0.85);
  v.driftQ=driftQ;
  const aLat=v.v*v.v*Math.abs(v.curv), aMax=muCorner*g*1.02*(1+0.90*driftQ);
  if(aLat>aMax && v.curv!==0){
    const over=aLat-aMax;
    if(driftQ>0.45){
      // COMMITTED DRIFT: the excess doesn't plough the nose wide — the rear
      // rotates to absorb it. The car stays hung out on its line instead of
      // washing out. Counter-steer holds it; throttle keeps it lit. THIS is
      // the payoff the mode promises, and where the old model felt dead.
      v.driftYaw=(v.driftYaw||0)+Math.sign(v.curv)*Math.min(over*0.012,0.6)*dt*3.4;
      v.slip=1;
    } else {
      v.lane -= Math.sign(v.curv)*over*0.30*dt*3.2; v.slip=1;   // grip driving: honest understeer
    }
  }
  v.driftYaw=Math.max(-0.95,Math.min(0.95,v.driftYaw||0));       // held, never fully spun
  const edgeV=profAt(v.s).edge;
  // ROLLOVER RISK: deep in the ditch, fast, sideways — it builds, it warns,
  // and if you keep feeding it, over she goes. Lift early and it bleeds away.
  if(Math.abs(v.lane)>edgeV+0.8 && v.v>15 && !S.wreck){
    v.rollRisk=(v.rollRisk||0) + dt*((v.v-13)/9)*(0.45+Math.abs(v.driftYaw||0)*3.2+(v.bounce||0)*0.4);
    if(v.rollRisk>0.55 && !v._rollWarn){ v._rollWarn=1; toast("\u26A0 TWO WHEELS LIGHT \u2014 lift, straighten, live."); }
    if(v.rollRisk>=1){ v.rollRisk=0; v._rollWarn=0;
      startWreck("Grip is a budget and the account overdrew at "+spdStr(v.v)+". Over she goes.",null); }
  } else { v.rollRisk=Math.max(0,(v.rollRisk||0)-dt*0.8); if((v.rollRisk||0)<0.3)v._rollWarn=0; }
  // lane keeping: the wheel commands a lane rate, but the bend loads the car.
  // lateral velocity needs rolling speed and front grip: nothing slides a
  // parked car sideways, and a ploughing front axle barely answers the wheel
  const steerAuth = Math.min(1, v.v/7) * Math.min(1, 0.30+skillFx().iceAuth+0.70*Math.min(1,muF/0.92))
                    * (1-(S.bodyDmg||0)/100*0.40);            // bent rails answer slowly
  if((S.bodyDmg||0)>25) v.lane += (S.bodyDmg/100)*0.30*dt*Math.min(1,v.v/10);  // she pulls right now
  const steerVal=Math.max(-1,Math.min(1,(S.drv.steerS!==undefined?S.drv.steerS:S.drv.steer)));
  if(Math.abs(v.driftYaw||0)>0.06){                            // a slide is on — the drift system owns the line
    v.lane += steerVal*dt*4.5*steerAuth; v.psi=(v.psi||0)*0.80;
  } else {
    // wheel commands a curvature; the road subtracts its own. psi is the heading
    // error that results — hold straight (kappaCmd 0) and psi winds opposite the
    // bend, drawing a straight world-line across the apexes.
    const kappaCmd=steerAuth*steerVal*STEER_KAPPA;             // curvature the wheel is asking the front for
    // FRONT CONTACT PATCH is the ceiling. The nose can only pull so many lateral g
    // (mu x patch x weight over the front axle). Ask for a tighter line than that
    // and the heading does NOT snap over and fire you across the road — the front
    // washes wide instead. Turning harder past the limit only deepens the
    // understeer, exactly like a real front axle that's run out of grip.
    const aFrontMax=CFG.GRIP.MU0*muF*CFG.GRIP.PATCH*g
                   *(S.parts.susp?CFG.GRIP.SUSP:1)*(S.parts.arb?CFG.GRIP.ARB_CORNER:1);
    const kappaGrip=v.v>5 ? aFrontMax/(v.v*v.v) : STEER_KAPPA*1.5;   // full parking-lot lock at a crawl
    const kappaEff=Math.sign(kappaCmd)*Math.min(Math.abs(kappaCmd), kappaGrip);
    const wash=Math.max(0,(Math.abs(kappaCmd)-kappaGrip)/STEER_KAPPA);  // 0..1+ how far past the front's limit
    v.uSlip=wash;
    v.psi=(v.psi||0) + (kappaEff - (v.curv||0))*v.v*dt;
    // MAX LATERAL TRAVERSE: on a straight it takes very little heading to change
    // lanes, and a big psi just fires you across into the shoulder — so hold the
    // heading error tight when the road is straight and open it up with the bend,
    // where the angle is genuinely needed to follow the road or cut an apex.
    const psiCap=Math.min(PSI_MAX, 0.24 + Math.abs(v.curv||0)/STEER_KAPPA*0.55);
    v.psi=Math.max(-psiCap, Math.min(psiCap, v.psi));
    v.lane += Math.sin(v.psi)*v.v*dt;
    if(wash>0.18){ v.slip=1; }                                 // fronts scrubbing wide — chirp + a little smoke
    // LOW-SPEED MANOEUVRING (human only): at a crawl the kinematic term barely
    // shifts you, so the wheel would feel dead parking or pulling out of a siding.
    // Blend in direct lateral authority that fades out by ~9 m/s. Manual-only, so
    // it can never shove the AI sideways when it slows for a tight corner.
    const crawl=S.input.steerOn ? Math.max(0, 1 - v.v/9) : 0;
    if(crawl>0) v.lane += steerVal*crawl*crawl*dt*3.6*steerAuth;
  }
  const _preLane=v.lane;
  v.lane = Math.max(-(edgeV+1.1), Math.min(edgeV+1.1, v.lane));   // hard stop at the ditches
  if(v.lane!==_preLane) v.psi=(v.psi||0)*0.4;                     // pinned at the verge: bleed heading error, no windup
  // world position/heading for minimap
  v.heading += v.curv*v.v*dt;
  v.x += Math.sin(v.heading)*v.v*dt; v.y -= Math.cos(v.heading)*v.v*dt;
  // earnings: pace pays — and a healthy car pays better. Fresh from the
  // bench (engine sound, panels straight) earns up to +15%; a limping wreck
  // earns the old base rate. The repair bill comes back as wages.
  const cond=Math.max(0,Math.min(1,(S.engHealth===undefined?100:S.engHealth)/100))
            *Math.max(0,1-(S.bodyDmg||0)/120);
  S.kr += v.v*dt*0.09*S.mult*(1+v.v/40)*(1+0.15*cond);
}

/* ============================ DRIVER AI ================================= */
/* Looks ahead, finds the tightest upcoming curvature, computes the physics
   speed limit v = sqrt(mu_lat * g * R), targets ~88% of it (skill hook),
   requests torque / brake like a right foot, steers pure-pursuit.
   ── ONE GRIP MODEL ──────────────────────────────────────────────────────
   The planner used to guess grip with a hand-tuned 0.92 that drifted out of
   step with the physics in CFG.GRIP; the CONFIG tab claimed the AI "reads the
   same budget" and it didn't, so nudging MU0 quietly made the robot over- or
   under-drive its own tyres, and three separate corner-speed copies disagreed
   about whether the surface even mattered. Both helpers below now spend the
   SAME budget the vehicleStep grip circle does — MU0, the cornering part
   bonuses, and muRoad(s) (weather + snow + ice + loose penalty, worst case per
   wheeltrack) — behind one explicit confidence sandbag (CFG.AI.GRIP_CONF).   */
function aiCornerMu(sPos){          // lateral grip the AI dares to plan against at s
  const G=CFG.GRIP;
  const parts=(S.parts.susp?G.SUSP:1)*(S.parts.lsd?G.LSD_CORNER:1)*(S.parts.arb?G.ARB_CORNER:1);
  return G.MU0*CFG.AI.GRIP_CONF*parts*muRoad(sPos);
}
function aiCornerV(sPos){            // honest grip-limited corner speed (m/s); Infinity on a straight.
  const cv=Math.abs(curvAt(sPos));  // cinematic 'carry' (drift/loose) is applied by the CALLER,
  return cv>1e-5 ? Math.sqrt(aiCornerMu(sPos)*CFG.G/cv) : Infinity; // never in here — the ceiling
}                                   // and the licensed stretch on top of it stay separate.
function driverStep(dt){
  const v=S.veh, d=S.drv;
  genRoadAhead();
  const MODE={calm:{cap:0.80,aggrK:0.45,marginK:1.45,coolK:1.8,add:0,tcs:1,leftV:999},
              spirited:{cap:1,aggrK:1,marginK:1,coolK:1,add:0,tcs:0,leftV:27},
              racing:{cap:1,aggrK:1.6,marginK:0.72,coolK:0.5,add:0.06,tcs:0,leftV:999,lane3:1,laneAuth:4},
              drift:{cap:0.94,aggrK:1.05,marginK:1.0,coolK:1.0,add:0.02,tcs:0,leftV:999,drift:1,laneAuth:3}}[S.aiMode]||
             {cap:1,aggrK:1,marginK:1,coolK:1,add:0,tcs:0,leftV:27};
  { const pfM=profAt(v.s);
    if(S.aiMode==="racing" && (pfM.dirt||pfM.gravel)){ MODE.drift=1; MODE.marginK=Math.min(MODE.marginK,0.80); } // rally stage rules: sideways is the line
    if(S.arcade) MODE.drift=1;                                   // ARCADE DRIFT: every corner is an invitation
  }
  if(S.menuOpen){ // hands in the engine bay: whoever's driving backs way off.
    // The wrench might double the horsepower between two corners.
    MODE.cap=Math.min(MODE.cap,0.70); MODE.aggrK=0; MODE.marginK=Math.max(MODE.marginK,1.40);
    MODE.add=0; MODE.tcs=1; MODE.drift=0;
  }
  const pfD=profAt(v.s), ownD=pfD.own;
  // ── YIELD TO A WAITING REST STOP ──────────────────────────────────────
  // When someone's waiting just ahead, the driver stops fighting the pull-in:
  // it eases off the pace and, hands-free, drifts toward the apron on the right
  // so coming to rest in the lot is effortless. Grabbing the wheel still wins.
  d.restYield=0;
  { const ra=restStopAhead(v.s);
    if(ra && ra.f.wait && ra.f.s>v.s+1 && ra.dist<140){       // still ahead — not once we've driven past
      d.restYield=1; d.restSide=ra.f.side||1;
      d.vRestCap = 10 + Math.max(0, ra.dist-6)*0.16;         // ease the pace on approach (not a dead crawl)
    }
  }
  const LN_L=ownD.length>1? ownD[ownD.length-2] : ownD[0];   // pass lane (or the only lane)
  const LN_R=ownD[ownD.length-1];                            // cruise lane
  const LN_3=ownD.length>2? ownD[0] : LN_L;                  // hw6's inside overtaking lane
  const singleLane = ownD.length===1;
  const LV=DRIVERS[S.drvLv||0];
  // effective lane authority: the licence you earned, or the nerve the mode
  // lends you. Racing/Drift will borrow the oncoming lane a Körskola pupil won't.
  const laneAuth = Math.max(LV.lanes, MODE.laneAuth||0);
  const oncClear=(lnAbs,horizonM)=>{ // an oncoming lane is 'provably empty'
    for(const c of S.traffic){ if(c.dir<0 && Math.abs(Math.abs(c.lane)-lnAbs)<1.4 && c.s>v.s-30 && c.s<v.s+horizonM) return false; }
    return true;
  };
  // ── LANE-HOLD LATCH ───────────────────────────────────────────────────
  // Respect the player. When you take the wheel and put the car in a lane,
  // that becomes ITS lane on release — held with normal behaviour until
  // something genuinely demands a change. "Demands" means cornering (the
  // racing line, below) or an imminent collision — NOT merely seeing traffic
  // on the horizon, and never a quiet urge to climb back behind the pack.
  { const I0=S.input;
    if(I0.steerOn){ d._steerActive=1; if(I0.steer) d._lastSteerDir=Math.sign(I0.steer); }
    else if(d._steerActive){                              // just let go of the wheel
      d._steerActive=0;
      const cand=ownD.concat(pfD.onc||[]);                // every lane the road offers
      const proj=v.lane + (d._lastSteerDir||0)*0.9;       // commit toward where the hand was going
      let best=cand[0]; for(const L of cand) if(Math.abs(L-proj)<Math.abs(best-proj)) best=L;
      d.heldLane=best;                                     // this is our lane now
      d._handT=1.6;                                        // ease control back over ~1.6 s (merge controller, below)
    }
    // a held lane the current road can't offer (6-lane → forest track) is void
    if(d.heldLane!=null && Math.abs(d.heldLane)>pfD.edge+0.2) d.heldLane=null;
  }
  let homeLane;
  if(d.heldLane!=null){
    // HOLD IT. No headway-gap reshuffle, no keep-right migration — the player
    // chose this lane and it stays chosen. Following (speed match) and the
    // emergency layer still keep us safe without abandoning the lane.
    homeLane=d.heldLane;
  } else {
    // AUTONOMOUS CRUISE (bit-identical to before when the player never steers):
    // fast cruising favors the second lane — sticky, so slowing for a lead
    // doesn't flip us back INTO the traffic we're passing
    if(v.v>MODE.leftV+2) d.homeL=true;
    if(v.v<MODE.leftV-4 || MODE.leftV>900) d.homeL=false;
    homeLane = d.homeL? LN_L : LN_R;
    { // don't bounce back into a queue: prefer the lane with real headway
      let gL=1e9,gR=1e9;
      for(const c of S.traffic){ if(c.dir>0&&c.s>v.s){ const g=c.s-v.s;
        if(Math.abs(c.lane-LN_L)<1.2)gL=Math.min(gL,g);
        if(Math.abs(c.lane-LN_R)<1.2)gR=Math.min(gR,g); } }
      if(homeLane===LN_L && gR>gL+30) homeLane=LN_R;
      else if(homeLane===LN_R && gL>gR+30 && d.homeL!==false && v.v>MODE.leftV-4) homeLane=LN_L;
    }
    if(homeLane===LN_L){ // keep-right courtesy for someone genuinely quicker
      for(const c of S.traffic){ if(c.dir>0 && Math.abs(c.lane-LN_L)<1 && c.s<v.s && v.s-c.s<48 && c.v>v.v+1){ homeLane=LN_R; break; } }
    }
    { // NEVER merge home into occupied space — stay in the lane you're in
      let occ=false;
      for(const c of S.traffic){ if(c.dir>0 && Math.abs(c.lane-homeLane)<1 && c.s>v.s-16 && c.s<v.s+16+v.v*0.9){ occ=true; break; } }
      if(occ && Math.abs(v.lane-homeLane)>1.7) homeLane=(homeLane===LN_L)?LN_R:LN_L;
    }
  }
  if(d.restYield){
    // Ease the pace so the pull-in is unhurried — but DON'T steer for the player.
    // Getting off the tarmac is their move; the lot logic below then takes over.
  }
  d.homeLane=homeLane;
  // scan ahead: braking-distance aware. The horizon is sized by the same
  // deceleration the planner trusts (BRK_SCAN≈BRK_PLAN) so we never look past
  // our own braking point. Straights return Infinity from aiCornerV and simply
  // don't constrain — so the old "|| mR<0.99" guard was a no-op and is gone.
  let vLimit=Infinity, scan=v.v*v.v/(2*CFG.AI.BRK_SCAN)+60;
  for(let s=0;s<scan;s+=12){
    const vc0=aiCornerV(v.s+s);
    if(vc0<Infinity){
      const gS=roadAt(v.s+s).grade;
      const pfAh=profAt(v.s+s);
      // CINEMATIC CARRY (the licensed stretch on top of the honest ceiling):
      // gravel/dirt let a rally-bred Saab lean on the grip that's there instead
      // of tiptoeing, and a committed slide corners past the grip circle because
      // the vehicleStep drift model then delivers the extra lateral. Racing/Drift
      // commit hardest. This is deliberately ABOVE aiCornerV — it's the drama,
      // kept separate from the physics so tuning grip never erases the show.
      const looseCarry=(pfAh.dirt||pfAh.gravel)? (MODE.drift?1.14:1.07) : 1;
      const driftCarry=(MODE.drift && (d.driftA||0)>0.35 ? (S.arcade?1.26:1.18) : 1) * looseCarry;
      const vc=vc0*driftCarry*(1-Math.max(0,-gS)*CFG.AI.GRADE_GRIP);
      // allow higher entry if the curve is far — but gravity eats braking on descents
      const brk=Math.max(CFG.AI.BRK_PLAN_MIN, CFG.AI.BRK_PLAN*muRoad(v.s+s*0.5)*(MODE.tcs?0.78:1)*skillFx().brkK - CFG.G*Math.max(0,-gS)*CFG.AI.GRADE_BRK); // ← CFG.AI
      const vAllow=Math.sqrt(vc*vc+2*brk*s); // calm brakes early
      vLimit=Math.min(vLimit,vAllow);
    }
  }
  const vTop = CFG.AI.V_MAX; // absolute sanity rail (≈280 km/h at the factory value)
  // stock cars cruise with margin; late-tune monsters attack the limit
  const basePush = 0.86 + 0.11*(S.tune/(TUNES.length-1)) + MODE.add;
  // smooth hands waste less of the budget: margin saved becomes pace kept
  let push = Math.min(MODE.cap, basePush*(1+(1-skillFx().marginK)*0.5));
  // STRAIGHT ATTACK: the margin belongs to corner entry, not the flat-out
  // bits. Spirited and up hold the pedal down on a straight — vAllow already
  // banked the braking distance for whatever's coming. Licence tiers close
  // the last of the gap: Körskolan lifts a whisper early, the Viggen pilot
  // simply doesn't. Calm keeps its chauffeur cap; the menu-open guard holds.
  if(!MODE.tcs && !S.menuOpen){
    const cvNear=Math.max(Math.abs(curvAt(v.s+12)), Math.abs(curvAt(v.s+Math.max(24,v.v*1.1))));
    const straightF=Math.max(0,Math.min(1,1-cvNear*340));      // 1 on a true straight, 0 by R≈340 m
    const atk=Math.min(MODE.cap, 0.97 + 0.03*Math.min(1,(S.drvLv||0)/4) + MODE.add);
    push += (Math.max(push,atk)-push)*straightF;
  }
  d.vTarget = Math.min(vLimit, vTop) * push * d.skill/0.95;
  if(d.restYield) d.vTarget = Math.min(d.vTarget, d.vRestCap);   // slow for the pull-in
  // traffic ahead in my lane?
  let lead=null, leadGap=1e9;
  for(const c of S.traffic){
    if(c.dir>0 && c.s>v.s && c.s-v.s<leadGap && Math.abs(c.lane-v.lane)<2.2){lead=c;leadGap=c.s-v.s;}
  }
  // pass appetite grows with the build: a stock LPT queues politely,
  // a stage-7 car gets impatient when it can't find space in the fast bits
  const aggr = Math.min(1,(0.30 + 0.70*(S.tune/(TUNES.length-1)))*MODE.aggrK);
  d.passCool=Math.max(0,d.passCool-dt);
  // While the player is holding a lane, don't go hunting overtakes on your own —
  // hold and follow. Pressing the gas is the signal you WANT to go; that frees
  // the pass machine and drops the hold.
  const holdOK = (d.heldLane==null) || S.input.gas;
  if(lead && d.passState===0 && !d.restYield){
    const gapMin = 12 + v.v*1.5;                       // keep space
    // follow smoothly: never close faster than the gap allows
    d.vTarget = Math.min(d.vTarget, lead.v + Math.max(0,(leadGap-gapMin))*0.30);
    if(leadGap < gapMin*0.6) d.vTarget = Math.min(d.vTarget, lead.v*0.8);
    // DECIDE on ACHIEVABLE pace: what this car can actually reach during the
    // move — not the road's theoretical limit. A 154 hp LPT must not commit
    // to a 400 hp overtake.
    const vAch = Math.min(v.v + 7 + 14*aggr, Math.min(vLimit, vTop)*push);
    const advPot = vAch - lead.v;
    const g0 = Math.min(leadGap, 30+vAch*0.5);         // we pull out close behind
    const T = (26+g0)/Math.max(4, advPot*0.7);         // realistic exposure estimate
    const quick = T < 5.6 + 2.2*aggr;                  // stock: short sure moves only
    let vMin=Infinity;                                 // pinned mid-pass by a corner?
    for(let ss=0;ss<vAch*T+40;ss+=15){ const vc=aiCornerV(v.s+ss);
      if(vc<Infinity) vMin=Math.min(vMin, vc*push*(1-Math.max(0,-roadAt(v.s+ss).grade)*CFG.AI.GRADE_GRIP)); }
    const roadOK = vMin > lead.v+4;
    let clear=true; const win=((vAch+24)*T*(0.5-0.1*aggr)+40)*MODE.marginK*LV.marginK*skillFx().winK;
    for(const c of S.traffic){
      if(c.dir<0) continue;                                             // median divides us
      if(Math.abs(c.lane-1.7)<1 && c.s>v.s-6 && c.s<v.s+win) clear=false;
      if(Math.abs(c.lane-1.7)<1 && c.s<v.s && v.s-c.s<24+Math.max(0,c.v-v.v)*3.2*MODE.marginK && c.v>v.v+1) clear=false;
    }
    if(holdOK && leadGap<gapMin*2.6 && advPot>5 && quick && roadOK && clear && d.passCool<=0 && R()<dt*(2.2+1.4*aggr)){
      d.passState=3; d.passT=0; d.heldLane=null;        // COMMIT: build the run-up (hold released)
    }
    // BOXED-IN, LICENSED: both own lanes walled and the far side provably
    // empty — a Rallylicens borrows it directly. Calm never does.
    else if(holdOK && laneAuth>=3 && !MODE.tcs && d.passCool<=0
            && leadGap<Math.min(30+v.v*0.9,90)
            && Math.min(vTop,vLimit)*push>lead.v+6){
      let wallL=false,wallR=false;
      const paceHere=Math.min(vTop,vLimit)*push;
      for(const c of S.traffic){ if(c.dir>0&&c.s>v.s-8&&c.s<v.s+70+v.v*1.2&&c.v<paceHere-4){
        if(Math.abs(c.lane-LN_L)<1)wallL=true; if(Math.abs(c.lane-LN_R)<1)wallR=true; } }
      if(wallL&&wallR){
        const hzn=(v.v+30)*4.6;
        if(oncClear(1.7,hzn)){ d.passState=1;d.passT=0;d.passTgt=lead;d.passLane=-1.7;d.heldLane=null; }
        else if(laneAuth>=4 && oncClear(5.1,hzn*1.15)){ d.passState=1;d.passT=0;d.passTgt=lead;d.passLane=-5.1;d.heldLane=null; }
      }
    }
  }
  // ── NARROW-ROAD OVERTAKE ──────────────────────────────────────────────
  // Landsväg, grus, skogsväg: one lane each way, so the only way past a
  // dawdler is to borrow the oncoming lane. Timid modes sit and wait; Racing
  // and Drift go for it (laneAuth), and a high licence lets Spirited do it too.
  // Commit only when the oncoming lane is provably empty for the whole
  // exposure plus a fat cushion — the "plenty of time before danger close"
  // the mode is supposed to exploit.
  if(d.passState===0 && !d.restYield && holdOK && lead && singleLane && !pfD.median && (pfD.onc&&pfD.onc.length>0)
     && !MODE.tcs && d.passCool<=0 && laneAuth>=3){
    const paceHere=Math.min(vTop,vLimit)*push;
    const advPot=paceHere-lead.v;
    const oncAbs=Math.abs(pfD.onc[0]);
    const vAch=Math.min(v.v+8+16*aggr, paceHere);
    const closeRate=Math.max(3, vAch-lead.v);
    const T=(34+Math.min(leadGap,45))/(closeRate*0.8);          // seconds on the wrong side
    // an oncoming car eats road at up to its own limit; leave a big cushion,
    // trimmed a little by aggression (Racing accepts tighter, still safe)
    const oncHorizon=(vAch + (pfD.ms||28)) * T * (1.25 - 0.30*aggr) + 55;
    let vMin=Infinity;                                          // pinned mid-pass by a bend?
    for(let ss=0; ss<vAch*T+45; ss+=14){ const vc=aiCornerV(v.s+ss);
      if(vc<Infinity) vMin=Math.min(vMin, vc*push); }
    const roadOK = vMin > lead.v+3;
    if(advPot>4 && leadGap<Math.min(28+v.v*1.2,100) && roadOK && oncClear(oncAbs,oncHorizon)){
      d.passState=1; d.passT=0; d.passTgt=lead; d.passLane=-oncAbs; d.heldLane=null;   // out into the oncoming lane
    }
  }
  if(d.passState===3){                                 // run-up: full pace, own lane
    d.passT+=dt;
    // (no follow cap — vTarget stays at road pace, we close on the lead)
    let recheck=true;                                  // window still open?
    const vAchR = Math.min(v.v + 7 + 14*aggr, Math.min(vLimit, vTop)*push); // same humility as commit
    for(const c of S.traffic){
      if(c.dir<0) continue;
      const pl=(Math.abs(v.lane-LN_L)<1.7)?LN_R:LN_L;
      if(Math.abs(c.lane-pl)<1 && c.s>v.s-6 && (c.s-v.s) < 22 + Math.max(0,vAchR-c.v)*3.0) recheck=false;
      if(Math.abs(c.lane-pl)<1 && c.s<v.s && v.s-c.s<24+Math.max(0,c.v-v.v)*3.2 && c.v>v.v+1) recheck=false;
    }
    if(!lead || !recheck || d.passT>12){ d.passState=0; d.passCool=(5+R()*4)*(1.25-0.85*aggr)*MODE.coolK; }
    else if(leadGap < Math.min(34+v.v*0.75, 110) && (v.v>lead.v+2 || Math.min(vTop,vLimit)*push>lead.v+6)){ // judged on what the car CAN do
      d.passState=1; d.passT=0; d.passTgt=lead;
      d.passLane=(Math.abs(v.lane-LN_L)<1.7)?LN_R:LN_L;
      // both own lanes walled? a licensed driver borrows the far side — never Calm
      let otherBlocked=false;
      for(const c of S.traffic){ if(c!==lead&&c.dir>0&&Math.abs(c.lane-d.passLane)<1&&c.s>v.s-8&&c.s<v.s+55+v.v*1.0&&c.v<v.v-2) otherBlocked=true; }
      if(otherBlocked && !MODE.tcs){
        const hzn=(v.v+30)*4.6;
        if(laneAuth>=3 && oncClear(1.7,hzn)) d.passLane=-1.7;
        if(laneAuth>=4 && d.passLane!==-1.7 && oncClear(5.1,hzn*1.15)) d.passLane=-5.1;
      }
    }
  }
  if(d.passState===1){
    d.passT+=dt;
    const pl=d.passLane||LN_L;
    d.steer=(pl-v.lane)*0.9;                           // out into the chosen lane
    if(pl<0 && !oncClear(Math.abs(pl),(v.v+30)*3.2)){ d.passState=2; }
    // ABORT early if a faster car is already storming up that lane
    for(const c of S.traffic){
      if(c.dir>0 && Math.abs(c.lane-pl)<1 && c.s<v.s-4 && v.s-c.s<20+Math.max(0,c.v-v.v)*2.6 && c.v>v.v+1){ d.passState=2; break; }
    }
    // track the TARGET car by reference — lateral offset must not lose it
    const tgt=d.passTgt;
    if(!tgt || !S.traffic.includes(tgt) || v.s>tgt.s+16 || d.passT>8){ d.passState=2; }
    // target moved INTO our pass lane (aggro running its own overtake):
    // there is nothing to go around any more — abort, tuck, follow properly
    else if(Math.abs(tgt.lane-(d.passLane||LN_L))<1.2 && tgt.s>v.s){ d.passState=2; }
  } else if(d.passState===2){
    // NEVER tuck into a gap the brakes can't honor — chain the pass instead
    let next=null,ng=1e9;
    for(const c of S.traffic){ if(c.dir>0&&c.s>v.s&&c.s-v.s<ng&&Math.abs(c.lane-(d.homeLane||LN_R))<1){next=c;ng=c.s-v.s;} }
    if(next && v.v>next.v+3){
      const clos=v.v-next.v, needGap=Math.min(clos*clos/(2*6.5*muRoad(v.s))+10+v.v*0.3, 90+v.v*0.8);
      if(ng<needGap){
        let blocked=false;
        const pl2=(Math.abs(v.lane-LN_L)<1.7)?LN_L:LN_R;   // the lane we're currently out in
        for(const c of S.traffic){ if(c.dir>0 && Math.abs(c.lane-pl2)<1 && c.s>v.s-6 && c.s<v.s+70+v.v*1.2) blocked=true; }
        if(!blocked){ d.passState=1; d.passT=0; d.passTgt=next; d.passLane=pl2; }  // chain in place
        else d.brakeEmg=1;   // boxed in both lanes: max brake
      }
    }
  }
  if(d.passState===2){
    // return ONLY into space: block = a car truly ALONGSIDE (not merely near)
    let block=null;
    for(const c of S.traffic){ const ds=c.s-v.s;
      if(c.dir>0 && ds>-(13+v.v*0.35) && ds<5+v.v*0.12 && Math.abs(c.lane-(d.homeLane||LN_R))<1) block=c; }
    if(block){
      d.vTarget=Math.min(d.vTarget, block.v*0.80);     // shed speed, fall behind
      if(MODE.lane3 && ownD.length>2 && (d.passLane||LN_L)===LN_L){
        // racing on the 6-lane: if the pass lane is ALSO walled, dive one more inside
        let wall=false;
        for(const c of S.traffic){ if(c.dir>0 && Math.abs(c.lane-LN_L)<1 && c.s>v.s-6 && c.s<v.s+46) wall=true; }
        let l3clr=true;
        for(const c of S.traffic){ if(c.dir>0 && Math.abs(c.lane-LN_3)<1 && c.s>v.s-24 && c.s<v.s+60) l3clr=false; }
        if(wall && l3clr) d.passLane=LN_3;
      }
      d.steer=((d.passLane||LN_L)-v.lane)*0.7;         // hold the outside lane meanwhile
      // slow lead in THIS lane too while boxed — match down harder
      for(const c of S.traffic){ if(c.dir>0 && Math.abs(c.lane-1.7)<1 && c.s>v.s && c.s<v.s+40+v.v*1.2) d.vTarget=Math.min(d.vTarget, c.v*0.9); }
    } else {
      d.steer=((d.homeLane||LN_R)-v.lane)*0.95;
      if(Math.abs(v.lane-(d.homeLane||LN_R))<0.15){
        // manoeuvre complete. Pay moved to the crossing ledger in trafficStep:
        // every car you genuinely clear writes its own cheque the moment its
        // bumper falls behind yours — a line of six pays six, no cooldown on
        // the money. passCool below only paces how often a NEW manoeuvre starts.
        d.passState=0; d.passCool=(6+R()*5)*(1.2-0.8*aggr)*MODE.coolK;
      }
    }
  }
  // RACING LINE: racing & drift don't hug a lane through a bend — they use the
  // whole carriageway. Set up wide, clip the apex, track out on exit. Only in
  // pure cruise (state 0) with pace and room; traffic, the pass machine and the
  // emergency layer all outrank the line. Calm/Spirited never do this, so their
  // trajectories stay bit-identical.  Sign convention: understeer washes to
  // -sign(curv) (the outside), so the apex is the +sign(curv) side of the road.
  let rlTarget=null;
  if((S.aiMode==="racing"||S.aiMode==="drift") && !S.menuOpen && !d.restYield && d.passState===0 && v.v>13){
    const edgeR=pfD.edge, outerLim=edgeR-0.4;              // right edge, a hair inside the tarmac
    let innerLim;
    if(pfD.oneway)      innerLim=-(edgeR-0.4);             // no oncoming: the whole road is ours
    else if(pfD.median) innerLim=0.8;                      // divided: hug the median line, never cross it
    else                innerLim=oncClear(1.7,(v.v+26)*2.8)? 0.5    // undivided: straddle the centre
                                 : Math.max(0.9,LN_R-0.8);          //   only if the far side is provably empty
    const lo=Math.min(innerLim,outerLim), hi=Math.max(innerLim,outerLim);
    const apexOf =(sc)=> sc>0? outerLim : innerLim;        // inside of the bend
    const setupOf=(sc)=> sc>0? innerLim : outerLim;        // outside — entry set-up and exit track-out
    const kFull=CFG.AI.LINE_KFULL;                            // curvature that earns the full line ← CFG.AI
    const cvN=curvAt(v.s + (6+v.v*0.35));                  // the bend we're turning into  -> apex
    const cvF=curvAt(v.s + (18+v.v*1.1));                  // the bend still coming         -> set up wide
    const cvB=curvAt(v.s - 9);                             // the bend just behind          -> track out
    let wApex =Math.min(1,Math.abs(cvN)/kFull);
    let wEntry=Math.min(1,Math.abs(cvF)/kFull)*(1-wApex);
    let wExit =Math.min(1,Math.abs(cvB)/kFull)*(1-wApex-wEntry)*CFG.AI.LINE_EXIT_W;
    const wLine=wApex+wEntry+wExit;
    if(wLine>0.05){
      rlTarget = homeLane*(1-wLine)
               + apexOf (Math.sign(cvN||1))*wApex
               + setupOf(Math.sign(cvF||1))*wEntry
               + setupOf(Math.sign(cvB||1))*wExit;
      rlTarget=Math.max(lo,Math.min(hi,rlTarget));
      // never carve into a car sharing the carriageway near the chosen line
      for(const c of S.traffic){
        if(c.dir>0 && Math.abs(c.lane-rlTarget)<1.3 && c.s>v.s-9 && c.s<v.s+(22+v.v*1.5)){ rlTarget=null; break; }
      }
    }
  }
  d._handActive=0;
  if(d.passState!==1 && d.passState!==2){
    let tgtLane=(d.homeLane||LN_R), gain=CFG.AI.LANE_GAIN;   // hold the preferred lane (states 0 and 3) ← CFG.AI
    if(rlTarget!==null){                        // ...unless the line is calling
      tgtLane=rlTarget; gain=CFG.AI.LINE_GAIN;
      if(MODE.drift) gain*=(1-Math.min(1,(d.driftA||0)*1.4));  // once the tail's out, the drift block owns the wheel
    }
    if((d._handT||0)>0){
      // HANDOFF MERGE: you just let go, likely mid-arc with heading wound in. A
      // plain proportional pull at the car's current spot fights that heading and
      // overshoots — the old hard yank. Instead run a critically-damped approach
      // to the target lane that reads the car's own sideways velocity, so it eases
      // the nose back onto the line in one smooth move (routes it a waypoint
      // forward rather than snapping to 'here'). Blends into the firm hold as it
      // finishes. The generic PD/speed-shrink below are skipped while this owns
      // the wheel — this controller does its own damping.
      d._handT=Math.max(0,d._handT-dt); d._handActive=1;
      const latVel=Math.sin(v.psi||0)*v.v;                    // current sideways speed
      const err=tgtLane - v.lane;
      const W=4.0, Z=1.0;                                      // critically damped, ~0.4 s response
      const aLat=W*W*err - 2*Z*W*latVel;                      // desired lateral accel toward the lane
      const ctl=Math.max(-1,Math.min(1,(aLat/Math.max(50,v.v*v.v))/STEER_KAPPA)); // accel → curvature → command
      const blend=Math.min(1, d._handT/0.45);                 // last 0.45 s: ease controller → firm hold
      d.steer=ctl*blend + (tgtLane-v.lane)*gain*(1-blend);
    } else {
      d._handActive=0;
      d.steer=(tgtLane-v.lane)*gain;
    }
  }
  // PD damping: kill the weave. Proportional steering alone overshoots at
  // speed (hold the gas past vTarget and the corrections start slaloming);
  // the lateral-rate term is the hand that settles the wheel.
  const latRate=(v.lane-(d._lastLane===undefined?v.lane:d._lastLane))/Math.max(0.008,dt);
  d._lastLane=v.lane;
  if(!d._handActive){                                  // the handoff controller does its own damping
    d.steer -= latRate*0.16;
    d.steer *= Math.min(1, 26/Math.max(8,v.v));        // high speed: smaller hands
  }
  if(S.parts.poly) d.steer*=1.06;                     // poly bushings: the wheel means it
  d.steer=Math.max(-1,Math.min(1,d.steer));
  // EMERGENCY LAYER: never eat a bumper, whatever state we're in.
  // Warn the human, brake, or swerve — but a held throttle is a signed waiver.
  d.warn=0;
  if(d.ditching){                                     // committed to the shoulder:
    d.ditching-=dt;                                   // this block owns the wheel until
    if(d.ditching<=0){ d.ditching=0; }                // the timer ends or the threat clears
    else {
      const dside=Math.sign(v.lane)||1;
      d.steer=Math.max(-1,Math.min(1,(dside*(profAt(v.s).edge+0.7)-v.lane)*0.55));
      d.brake=1; d.pedal=0; d.warn=2;
    }
  }
  if(lead && Math.abs(lead.lane-v.lane)<2.0){
    const closing=v.v-lead.v + (lead.brk?2.0:0);        // a braking lead will be slower when we arrive
    if(closing>0){
      const brkCap=Math.max(CFG.AI.BRK_DRV_MIN, CFG.AI.BRK_DRV*muRoad(v.s)*skillFx().brkK - CFG.G*Math.max(0,-(v.grade||0))*CFG.AI.GRADE_BRK); // gravity eats brakes downhill ← CFG.AI
      const stopGap = closing*closing/(2*brkCap) + 15 + v.v*0.48;
      if(leadGap < stopGap*1.30) d.warn=1;                       // heads up
      if(leadGap < stopGap*0.75) d.warn=2;                       // BRAKE NOW
      // DITCH DODGE: if even full braking won't clear it and no lane is open,
      // aim for the shoulder — the ditch is bouncy, the bumper is expensive
      if(leadGap < stopGap*0.40 && (v.v-lead.v)>9 && lead.v<8 && !d.ditching && d.passState!==1){
        let laneFree=false;
        for(const alt of ownD){ if(Math.abs(alt-v.lane)>0.8){
          let clr=true;
          for(const o of S.traffic){ if(o.dir>0&&Math.abs(o.lane-alt)<1.1&&o.s>v.s-8&&o.s<v.s+leadGap+16) clr=false; }
          if(clr){ laneFree=true; break; } } }
        if(!laneFree && !stopBlocksShoulder(v.s, v.s+leadGap+16, Math.sign(v.lane)||1)){ d.ditching=1.6; d._ditchArm=1; d.heldLane=null; }
      }
      if(d.ditching && leadGap>stopGap*1.3) d.ditching=0;        // threat cleared: release
      if(leadGap < stopGap){
        if(d.passState===3){ d.passState=1; d.passT=0; d.passTgt=lead; } // committed: go around
        else if(d.passState!==1){
          d.vTarget=Math.min(d.vTarget, lead.v*0.9);
          d.brakeEmg=Math.min(1,(stopGap-leadGap)/stopGap*1.8);
        } else if(lead!==d.passTgt && Math.abs(lead.lane-v.lane)<1.3){
          // a DIFFERENT car squatting in the pass lane is a wall, not a target:
          // full emergency, full distance
          d.vTarget=Math.min(d.vTarget, lead.v*0.9);
          d.brakeEmg=Math.min(1,(stopGap-leadGap)/stopGap*1.8);
        } else if(Math.abs(lead.lane-v.lane)<1.3 && leadGap<stopGap*0.55){
          // our own target, not laterally clear yet: brake AND steer
          d.brakeEmg=Math.min(1,(stopGap*0.55-leadGap)/(stopGap*0.55)*1.8);
        }
      }
      // human is flooring it into a bumper: AI grabs the wheel if a gap exists
      if(S.input.gas && !S.input.steerOn && d.passState===0 && leadGap<stopGap*0.9){
        let clr=true;
        for(const c of S.traffic){ if(c.dir<0 && c.s>v.s-10 && c.s<v.s+150+v.v*3.5) clr=false; }
        if(clr){ d.passState=1; d.passT=0; d.passTgt=lead; d.heldLane=null; }
      }
    }
  }
  // ===== CHASE: fleeing-car behaviours, layered on top of the MODE table =====
  if(S.chase && S.chase.active){
    // CALM is the law-abiding one: with a cop on the radar or actively chasing,
    // it eases to the posted limit — so it neither trips the trap nor racks up a
    // violation — UNLESS the player is holding the gas. (Chase-context only; it
    // never touches Calm's normal idle cruising away from a cop.)
    if(S.aiMode==="calm" && !S.input.gas){
      d.vTarget=Math.min(d.vTarget, roadSpeedLimitAt(v.s)+1);
    }
    // PULL-OVER: Spirited yields once it has been over the line long enough;
    // Calm only if the player forced it over (see governor above). Racing and
    // Drift never pull over — their only exit is to outrun the cop.
    const canPullOver = (S.aiMode==="spirited" || S.aiMode==="calm");
    if(!S.chase.pulledOver && canPullOver && S.chase.violationT > CFG.CHASE.pullOverAfterS){
      S.chase.pulledOver=true; S.chase.pullOverT=CFG.CHASE.pullOverHoldS; S.chase.violationT=0;
    }
    if(S.chase.pulledOver){
      S.chase.pullOverT-=dt;
      d.vTarget=0;                                         // brake to a stop (longitudinal below honors it)
      const dside=Math.sign(v.lane)||1;                    // ease onto the shoulder — same pattern as d.ditching
      d.steer=Math.max(-1,Math.min(1,(dside*(profAt(v.s).edge+0.6)-v.lane)*0.55));
      if(S.chase.pullOverT<=0){ d.steer=0; bustChase(); }  // ticket written, cop departs
    }
  }
  // longitudinal control — full commitment, not a chauffeur
  if(d.hot){ d.vTarget=Math.min(d.vTarget, v.v>24? v.v-1 : 24); }   // let it breathe
  const err=d.vTarget-v.v;
  if(err>0){ d.pedal=Math.min(1, d.pedal+dt*6, 0.30+err*0.9); d.brake=0; }
  else { d.pedal=Math.max(0,d.pedal-dt*8); d.brake=Math.min(1, -err*0.35); if(-err>5.5)d.panic=1; } // hairpins get the stamp too
  if(d.brakeEmg){ d.brake=Math.max(d.brake,d.brakeEmg); d.pedal=0; d.brakeEmg=0; d.panic=1; }
  if(d.hot)        d.pedal=Math.min(d.pedal,0.55);                   // coolant diplomacy
  else if(d.hotIC) d.pedal=Math.min(d.pedal,0.72);                   // let the core breathe
  // Calm's TCS is PREDICTIVE: it knows the budget and never asks for more.
  if(MODE.tcs){
    const trim=TRIMS[S.trim], m=trim.kg+CFG.CREW_KG, g=CFG.G;
    const muV=CFG.GRIP.MU0*(S.parts.lsd?CFG.GRIP.LSD:1)*(S.parts.susp?CFG.GRIP.SUSP:1)*(S.parts.arb?CFG.GRIP.ARB:1)*muRoad(v.s); // ← CFG.GRIP
    const looseLong=(profAt(v.s).dirt||profAt(v.s).gravel)? 1.20 : 1;   // same drive-traction model as vehicleStep — don't ask for less than the tyre can bulldoze
    const budget=0.95*muV*(m*g*0.62)/(1+0.95*muV*0.19)*looseLong - Math.abs(v.latG)*m*g*0.55;
    const FperTq=GEARS[S.dt.gear-1]*FINAL*0.90/WHEEL_R;
    const tqMax=Math.max(30, budget/FperTq);
    d.pedal=Math.min(d.pedal, (tqMax*1.02)/(trim.tqNm+TUNES[S.tune].tq));
  }
  // ---- MANUAL OVERRIDES: your hands beat the robot ----
  const I=S.input;
  // your hands beat the robot. An expo curve softens the first part of the
  // wheel travel (less darty on a straight / small corrections) while keeping
  // full lock available for the tight stuff. Only the human input is shaped;
  // the AI's steer stays linear so its feed-forward math holds.
  if(I.steerOn){ const s=Math.max(-1,Math.min(1,I.steer));
    d.steer = s*(0.50+0.50*s*s); d.passState=0; }   // progressive per side, but real authority mid-travel; full lock at the edge
  if(I.gas){ d.pedal=1; d.brake=0;
    if(!I.steerOn){ // weave through: steer for the lane with the most headway
      const lanes=[LN_L,LN_R];
      const hzn=(v.v+30)*4.2;
      if(LV.lanes>=3 && oncClear(1.7,hzn)) lanes.push(-1.7);
      if(LV.lanes>=4 && oncClear(5.1,hzn*1.15)) lanes.push(-5.1);
      const head=lanes.map(L=>{ let g=1e9;
        for(const c of S.traffic){ if(c.s>v.s && Math.abs(c.lane-L)<1.2 && (c.dir>0||L<0)){ g=Math.min(g,c.s-v.s); } }
        return g; });
      const curI=lanes.reduce((bi,L,i)=>Math.abs(v.lane-L)<Math.abs(v.lane-lanes[bi])?i:bi,0);
      if(head[curI] < 60+v.v*1.0){
        let bi=curI; for(let i=0;i<lanes.length;i++) if(head[i]>head[bi]) bi=i;
        let occ=false;
        for(const c of S.traffic){ if(Math.abs(c.lane-lanes[bi])<1.2&&c.s>v.s-14&&c.s<v.s+10) occ=true; }
        if(!occ) d.steer=(lanes[bi]-v.lane)*0.9;
      }
    }
  }
  if(I.brake){ d.brake=1; d.pedal=0; }
  // HEAT MANAGEMENT: the long game. Each temperament has a coolant line it
  // respects — cross it and the right foot gets diplomatic until things cool.
  { const th={calm:100,spirited:106,racing:112,drift:108}[S.aiMode]||106;
    const e2=S.eng;
    if(e2.coolT!==undefined){
      if(e2.coolT>th || e2.steam) d.hot=1;
      else if(e2.coolT<th-7) d.hot=0;
    }
    if(e2.iat!==undefined && e2.iat> (hwCeils().knockPivot+16)) d.hotIC=1;
    else if(e2.iat!==undefined && e2.iat< (hwCeils().knockPivot+6)) d.hotIC=0;
  }
  // DRIFT: throw the weight. Entry flick -> tail steps toward the outside ->
  // counter-steer catch -> gather it up and blend into the road at exit. Only
  // clean corners, only with room; the pass machine always outranks the show.
  d._drifting=0;
  if(MODE.drift && d.passState===0 && !S.input.steerOn){
    const cv=curvAt(v.s+8);
    let room=true;
    for(const c of S.traffic){ if(Math.abs(c.s-v.s)<46 && Math.abs(c.lane-v.lane)<3) room=false; }
    const want=Math.abs(cv)>1/(S.arcade?320:250) && v.v>(S.arcade?12:15) && room;
    if(want && !(d.driftA>0)) d.driftT=0;                       // fresh corner, fresh throw
    if(want) d.driftA=Math.min(1,(d.driftA||0)+dt*2.4);
    else     d.driftA=Math.max(0,(d.driftA||0)-dt*2.8);
    if(want && d.driftA>0.02){
      d._drifting=1;                                            // actively holding a slide
      const dir=Math.sign(cv||d.driftDir||1); d.driftDir=dir;
      d.driftT=(d.driftT||0)+dt;
      const entry=Math.max(0,1-d.driftT/0.5);                   // first half second
      let sl=(d.driftT<2.4? Math.sin(Math.min(Math.PI,d.driftT/2.4*Math.PI))
                            : 0.72+0.10*Math.sin(d.driftT*7))*d.driftA;
      // ARCADE: the assist holds the tail out for the WHOLE curve — the slide
      // lives exactly as long as the corner does, then hands the car back.
      if(S.arcade && Math.abs(curvAt(v.s+12))>1/300) sl=Math.max(sl, 0.80*d.driftA);
      // ATTACK: brake stab shifts the weight onto the nose, steering flicks in
      d.brake=Math.max(d.brake, 0.55*entry);
      d.steer += dir*1.3*entry;
      // THE THROW: a real angle now — the nose points well into the corner
      // while the path continues. Bigger and quicker than the old timid wobble.
      const yawTgt=dir*0.42*sl;
      v.driftYaw=(v.driftYaw||0)+(yawTgt-(v.driftYaw||0))*Math.min(1,dt*8);
      // tail steps toward the outside; the driver holds it there
      const pfDft=profAt(v.s), innDft=pfDft.own.length? Math.max(0.8,pfDft.own[0]-0.7) : 0.8;
      v.lane=Math.min(pfDft.edge-0.5,Math.max(innDft, v.lane - dir*sl*dt*2.2)); // was hardcoded 1.0..6.6 — off-road on dirt, timid on 6-lanes
      // POWER-OVER: throttle held through the slide keeps it rotating
      if(d.driftT>0.4) d.pedal=Math.max(d.pedal, 0.76*sl);
      d.driftCS = -dir*sl*1.25;                                 // big visible counter-steer
      v.slip=Math.max(v.slip,0.70*sl);                          // tires narrating
    }
  } else if(d.driftA){ d.driftA=Math.max(0,d.driftA-dt*2.8); }
  // ── DRIFT EXIT — gather it up and blend into the road ahead ──────────────
  // No snap to straight. The nose unwinds toward the road's tangent while the
  // last of the slide scoots the car square in its lane, and the counter-steer
  // bleeds off in step. The unwind quickens as the exit opens out, so the nose
  // arrives on the new straight — not on the corner it just left.
  if(!d._drifting && (Math.abs(v.driftYaw||0)>0.004 || Math.abs(d.driftCS||0)>0.008 || d.driftA>0.02)){
    const cvAhead=Math.abs(curvAt(v.s + 9 + v.v*0.7));
    const straightening=Math.max(0, 1 - cvAhead*300);        // 1 once the road ahead has opened up
    const rate=Math.min(1, dt*(2.0 + 3.2*straightening));    // gentle in a bend, brisk on the open exit
    v.driftYaw=(v.driftYaw||0)*(1-rate);                     // rotation eases to zero = aligned with the path
    // Square up in the lane we're EXITING through — the nearest lane centre to
    // where the slide left us — NOT a migration to the mode's far cruise lane.
    // (Ordinary lane-keeping can drift us home later, gently, on the straight.)
    const pfEx=profAt(v.s), cand=pfEx.own.concat(pfEx.onc||[]);
    let sq=cand.length?cand[0]:v.lane;
    for(const L of cand) if(Math.abs(L-v.lane)<Math.abs(sq-v.lane)) sq=L;
    v.lane += (sq - v.lane) * rate * 0.85;                   // the last of the slide scoots us square
    d.driftCS=(d.driftCS||0)*(1-rate);                       // counter-steer unwinds with the angle
    // blend the hands off the slide and onto the square-up line while any
    // angle remains, then hand cleanly back to normal steering
    const gatherW=Math.min(1, Math.abs(v.driftYaw||0)/0.10 + (d.driftA||0)*3);
    if(gatherW>0.04) d.steer = d.steer*(1-gatherW) + (sq - v.lane)*1.2*gatherW;
    d.driftA=Math.max(0,(d.driftA||0)-dt*3.0);
    if((v.slip||0)>0) v.slip=Math.max(0, v.slip - dt*2.0);   // grip returns as it squares up
  }
  // ── CASUAL PARKING ────────────────────────────────────────────────────
  // Once you've eased off the tarmac beside a stop, the driver hands you the
  // car and suspends its own throttle. With no pedal input: a hand on the wheel
  // creeps forward at walking pace so you can position; letting go eases to a
  // stop. Your own gas/brake always win. Steer back onto the road and normal
  // driving takes over again — he'll take off.
  { const rsLot=restStopNear(v.s);
    const inLot = rsLot && v.lane > pfD.edge-0.6;      // off the tarmac, on the apron (stops are always on the right)
    if(inLot && !I.gas && !I.brake){
      d.passState=0; d.ditching=0; d.brakeEmg=0; d.driftA=0; d.warn=0;
      if(I.steerOn){                                    // a hand on the wheel
        const leaving = I.steer < -0.15;                // steering left = heading back onto the tarmac
        const cap = leaving ? 7.5 : 3.6;                // roll out when leaving; gentle creep when positioning
        const err = cap - v.v;
        d.pedal = err>0 ? Math.min(leaving?0.35:0.20, err*0.09) : 0;
        d.brake = v.v>cap+1.5 ? 0.25 : 0;
      } else {                                          // hands off in the lot: settle to a stop
        d.pedal = 0; d.brake = Math.min(1, 0.30 + v.v*0.05); d.panic=1;
      }
    }
  }
  // CORNERING FEED-FORWARD + HEADING DAMPING: the car now carries a heading
  // error through a bend (see vehicleStep). The AI matches the road's curvature
  // and damps that error so idle driving tracks its line without ringing. A human
  // gets none of this — they steer the corner, and holding straight draws a
  // straight line through the apexes.
  if(!I.steerOn && Math.abs(v.driftYaw||0)<=0.06){
    const authP=Math.max(0.15, Math.min(1, v.v/7));
    // during the release handoff, the merge controller (above) owns heading with
    // its own gentle damping — the gain-5 psi slam here is exactly the old hard
    // yank, so suppress it and keep only the cornering feed-forward.
    const psiDamp = d._handActive ? 0 : (v.psi||0)*AI_PSI_DAMP;
    d.steer += (v.curv||0)/(authP*STEER_KAPPA) - psiDamp;
    d.steer = Math.max(-1, Math.min(1, d.steer));
  }
  // slew limits: hands and feet move at human speed
  d.steerS=d.steerS||0;
  // MANUAL beats the robot: the player's wheel is a near-instant connection to
  // the front axle, NOT filtered by driver-skill (LV.slew) or the AI's hand
  // speed. The AI's own rates (the else branch) are untouched, so with no input
  // held the AI-vs-AI trajectory is bit-identical to before.
  // The wheel unwinds toward centre faster than it winds away from it: turn-in
  // is smooth and deliberate, recovery is quick, which kills the darty feel.
  const returning = (d.steer - d.steerS)*d.steerS < 0;   // stepping back toward zero?
  const sRate = S.input.steerOn ? (returning ? 30 : 21)*dt
                                : (d._handActive ? 14*dt                       // catch the release briskly
                                : (d.passState?5.6:3.4)*LV.slew*dt); // skill sharpens the AI's hands
  d.steerS+=Math.max(-sRate,Math.min(sRate, d.steer-d.steerS));
  d.brakeS=d.brakeS||0;
  // a HELD brake pedal is hard too; released, it falls back to the AI's normal
  // release rate so a recent manual stab still bleeds off like a human foot.
  const bUp = S.input.brake ? 60*dt : (d.panic?28:6)*dt;   // panic stamps the pedal, smoothness be damned
  const bDn = S.input.brake ? 60*dt : 9*dt;
  d.brakeS+=Math.max(-bDn,Math.min(bUp, d.brake-d.brakeS));
  d.panic=0;
}

/* ============================ TRAFFIC =================================== */
const VTYPES={
  sedan:{len:4.5, w:1.78, hK:1.00, vK:1.00,  wt:30},
  wagon:{len:4.75,w:1.78, hK:1.06, vK:0.98,  wt:22},
  hatch:{len:3.92,w:1.70, hK:0.98, vK:1.02,  wt:16},
  van:  {len:5.40,w:1.90, hK:1.45, vK:0.90,  wt:12},
  lorry:{len:9.60,w:2.45, hK:1.85, vK:0.62,  wt:12},
  bus:  {len:12.0,w:2.50, hK:1.75, vK:0.70,  wt:6}
};
function pickVType(r){ let acc=0,tot=0; for(const k in VTYPES)tot+=VTYPES[k].wt;
  r*=tot; for(const k in VTYPES){acc+=VTYPES[k].wt; if(r<acc)return k;} return "sedan"; }
/* Free-flow target for a same-direction traffic car, expressed RELATIVE to the
   posted limit. A 'lane' car ebbs from limit-5 up to the limit; a 'fast' car
   cruises from the limit up to limit+5 — both wandering slowly on their own
   phase. Scaled by the vehicle's vK so a lorry stays a lorry even at speed. */
function roleTargetSpeed(c, limitMs, t){
  const wander = 2.5*Math.sin(t/(c.oscPeriod||10) + (c.oscPhase||0));
  const base = c.role==='fast' ? limitMs+2.5+wander : limitMs-2.5+wander;
  return Math.max(6, base*(VTYPES[c.type||"sedan"].vK||1));
}
function trafficStep(dt){
  const v=S.veh;
  // spawn — the forest roads are empty; the motorway is not
  const pfT=profAt(v.s+300);
  const spawnK=(pfT.dirt||pfT.gravel)? CFG.GEN.looseTrafficK : 1;
  if(S.traffic.length<8 && R()<dt*CFG.GEN.trafficRate*spawnK){
    let dir = R()<0.42?-1:1;
    const sSpawn = v.s + (dir>0? 240+R()*300 : (S.drv.passState? 760:420)+R()*400); // no mid-pass ambushes
    const pfS = profAt(sSpawn);                                // the road THEY stand on
    if(dir<0 && pfS.onc.length===0) dir=1;                     // one-way: nothing comes at you
    const vt=pickVType(R());
    const set = dir>0? pfS.own : pfS.onc.map(x=>-x);           // lane menus per profile
    const lanePick = set.length>1 ? (R()<0.68? set[set.length-1] : set[0]) : set[0];
    // ROLE (same-direction only): Fast Lane Cars cruise at/above the limit and
    // pick off Lane Cars; Lane Cars ebb below it and rarely pass. Heavy vehicles
    // and single-lane roads are always plodders.
    const heavy=(vt==="lorry"||vt==="bus");
    const role = dir>0 ? ((heavy||pfS.own.length<=1)? 'lane' : (R()<0.35?'fast':'lane')) : null;
    const oscPhase=R()*Math.PI*2, oscPeriod=8+R()*6;
    const spawnV = dir>0
        ? roleTargetSpeed({role,type:vt,oscPhase,oscPeriod}, roadSpeedLimitAt(sSpawn), S.t)
        : (16+R()*9)*VTYPES[vt].vK;
    S.traffic.push({
      s: sSpawn,
      v: spawnV,
      dir, lane: dir>0? lanePick : -lanePick,
      type:vt, role, oscPhase, oscPeriod,
      col: ["#8a8f96","#5b6a7e","#7e5b5b","#4e5e4e","#c8c9cc"][Math.floor(R()*5)]
    });
    const nc=S.traffic[S.traffic.length-1];
    // only Fast Lane Cars hunt overtakes — Lane Cars essentially never spawn aggro
    if(dir>0 && role==='fast' && R()<0.55 && pfS.own.length>1){ nc.aggro=true; nc.col="#2f3338"; } // stripes need room
    if(dir>0 && pfS.median && R()<0.18) nc.exiter=true;        // someone's getting off ahead
  }
  // NPC car-following: same-direction traffic brakes for whatever is ahead
  // of it in its lane — the player included. Nobody drives blind here.
  for(const c of S.traffic){
    if(c.dir>0){
      if(c.v0===undefined)c.v0=c.v;
      // free-flow target: role-relative to the posted limit, wandering slowly.
      // A car mid-overtake (npass) gets a temporary boost over its role target
      // (+10 for a Fast Lane Car, +7 for a Lane Car).
      const limitMs=roadSpeedLimitAt(c.s);
      let freeFlow = c.role ? roleTargetSpeed(c, limitMs, S.t) : c.v0;
      if(c.npass) freeFlow = roleTargetSpeed(c, limitMs, S.t) + (c.role==='fast'?10:7);
      let ga=1e9, tv=0;
      if(v.s>c.s && v.s-c.s<ga && Math.abs(v.lane-c.lane)<2.0){ga=v.s-c.s;tv=v.v;}
      for(const o of S.traffic){ if(o!==c&&o.dir>0&&o.s>c.s&&o.s-c.s<ga&&Math.abs(o.lane-c.lane)<2.0){ga=o.s-c.s;tv=o.v;} }
      const need=(c.aggro?6+c.v*0.9:10+c.v*1.4)
                 + Math.max(0,c.v-tv)*2.4;             // closing fast = hang back further
      // the mountain taxes everyone — but the stripe crowd has the power to pay
      const gN=roadAt(c.s).grade;
      const gF=Math.max(0.55,Math.min(1.22, 1 - Math.max(0,gN)*(c.aggro?1.4:2.6) + Math.max(0,-gN)*1.1));
      let vt=freeFlow*gF, cornerBound=false;
      for(const la of [16,45,85,150]){                 // braking-distance corner scan, NPC edition
        const cvN=Math.abs(curvAt(c.s+la));
        if(cvN>1e-4){
          const vc2=Math.sqrt(muRoad(c.s+la)*CFG.G/cvN)*0.92;
          const vAllow=Math.sqrt(vc2*vc2 + 2*2.9*la);  // plan gently, brake with reserve
          if(vAllow<vt){ vt=vAllow; cornerBound=true; }
        }
      }
      if(ga<need){
        const panic = ga<need*0.45;                    // brake lights and religion
        const nv=Math.max(Math.min(tv*0.95,c.v), c.v-(panic?9.2:6.5)*dt);
        c.brk = nv<c.v-0.01 ? 1 : Math.max(0,(c.brk||0)-dt*3); c.v=nv; }
      else { const acc=2.5*Math.max(0.35,1-Math.max(0,gN)*6);      // uphill pulls sap NPC torque too
        if(c.v<vt) c.v=Math.min(vt, c.v+acc*dt);
        else if(c.v>vt+0.5) c.v=Math.max(vt, c.v-(cornerBound?5.0:1.1)*dt);
        c.brk=Math.max(0,(c.brk||0)-dt*3); }
      // aggro overtakes: pull out when stuck, clear of oncoming AND the player
      if(c.aggro){
        c.lnT=(c.lnT===undefined?c.lane:c.lnT);
        const pfC=profAt(c.s), ownC=pfC.own;
        const LNC=ownC[ownC.length-1], LNP=ownC.length>1? ownC[ownC.length-2] : ownC[0];
        if(!c.npass){
          if(ownC.length>1 && ga<need*1.7 && tv<c.v0-3 && Math.abs(c.lane-LNC)<1){
            let clr=true;
            for(const o of S.traffic){ if(o!==c&&o.dir>0&&Math.abs(o.lane-LNP)<1&&o.s>c.s-30&&o.s<c.s+70) clr=false; }
            // the player counts if IN the pass lane OR heading there — and the
            // behind-window scales with closure (a 70 mph Saab eats 50 m fast)
            const pIn = Math.abs(v.lane-LNP)<2.4 || (S.drv.passState && (S.drv.passLane||0)<LNP+1.3);
            if(pIn && v.s>c.s-(40+Math.max(0,v.v-c.v)*3.5) && v.s<c.s+90) clr=false;
            if(clr){ c.npass=1; c.lnT=LNP; }
          }
        } else {
          let stillBlocked=false;
          for(const o of S.traffic){ if(o!==c&&o.dir>0&&Math.abs(o.lane-LNC)<1&&o.s>c.s-14&&o.s<c.s+12+c.v*1.1) stillBlocked=true; }
          if(v.s>c.s-(26+v.v*1.2) && v.s<c.s+12 && Math.abs(v.lane-LNC)<1) stillBlocked=true; // never cut in on the player
          if(!stillBlocked){ c.npass=0; c.lnT=LNC; }
        }
      }
      // LANE HONESTY — for EVERY same-direction car, aggro or not:
      // settle onto the current profile, MERGE BEFORE the road narrows,
      // zipper politely, take your exit, never cruise the ditch.
      {
        const pfC=profAt(c.s), ownC=pfC.own;
        const LNC=ownC[ownC.length-1];
        // preemptive merge: if the lane you're in won't exist 120 m from now,
        // start moving NOW — signalling at the seam is how vans end up in fields
        if(!c.npass && !c.exiter){
          const pfN=profAt(c.s+120), ownN=pfN.own;
          if(!ownN.some(l=>Math.abs(l-c.lane)<0.9)){
            let tgtM=ownN[0];
            for(const l2 of ownN) if(Math.abs(l2-c.lane)<Math.abs(tgtM-c.lane)) tgtM=l2;
            if(ownC.some(l=>Math.abs(l-tgtM)<0.4)||Math.abs(tgtM)<=pfC.edge) c.lnT=tgtM;
          }
        }
        if(c.exiter){
          let exS=0;
          for(const sg of S.road.segs){ if(sg.s0>c.s+95) break;
            for(const ft of (sg.feat||[])) if(ft.type==="exit" && ft.s>c.s-20 && ft.s<c.s+95){ exS=ft.s; break; }
            if(exS) break; }
          if(exS){ c.lnT=pfC.edge-0.6; if(c.s>exS+35){ c.s=v.s-9999; } }  // signal late, exit crisp, gone
        }
        if(!c.npass){
          // settle only when the lane you wanted no longer EXISTS here —
          // a left-lane cruiser on the motorway is traffic, not a mistake
          const near=ownC.reduce((b,l)=>Math.abs(l-c.lane)<Math.abs(b-c.lane)?l:b, ownC[0]);
          if(c.lnT===undefined) c.lnT=near;
          else if(!c.exiter && !ownC.some(l=>Math.abs(l-c.lnT)<0.4)) c.lnT=near;
        }
        let tgtL=(c.lnT===undefined?LNC:c.lnT);
        const offEdge=Math.abs(c.lane)>pfC.edge-0.3;
        if(offEdge && !(c.exiter&&c.lnT>=pfC.edge-0.9)){ tgtL=LNC; c.lnT=LNC; }
        // ZIPPER: don't slide into an occupied lane — slot in behind instead
        if(Math.abs(tgtL-c.lane)>0.6){
          let occ=null;
          for(const o of S.traffic){ if(o!==c&&o.dir>0&&Math.abs(o.lane-tgtL)<1.2
            && o.s>c.s-12 && o.s<c.s+14+c.v*0.9) occ=o; }
          const pOcc=Math.abs(v.lane-tgtL)<1.3 && v.s>c.s-14 && v.s<c.s+14+c.v*0.9;
          if(occ||pOcc){
            c.v=Math.max(5, c.v-6.5*dt); c.brk=1;          // brake to open the zipper gap
            if(!offEdge) tgtL=c.lane;                       // hold your lane while it opens
          }
        }
        const ez=offEdge? 4.8 : 3;   // in the ditch: hurry back
        c.lane += Math.max(-ez*dt, Math.min(ez*dt, tgtL-c.lane));
      }
    }
    if(c.dir<0){                                   // oncoming keeps its lane honest too:
      const pfO=profAt(c.s), oncO=pfO.onc;         // a -5.1 car entering a landsväg
      if(oncO.length){                              // slides to -1.7, not into the birches
        let tgt=oncO[0]; for(const l2 of oncO) if(Math.abs(l2-c.lane)<Math.abs(tgt-c.lane)) tgt=l2;
        c.lane += Math.max(-2.2*dt, Math.min(2.2*dt, tgt-c.lane));
      }
    }
    c.s += (c.dir>0? c.v : -c.v)*dt;
  }
  // cull
  S.traffic=S.traffic.filter(c=> c.s>v.s-120 && c.s<v.s+900);
  // CLEAN PASS ledger: every same-direction car you genuinely drive past
  // writes its own little cheque the moment it falls behind — a line of six
  // pays six, stacked above the driver pill. 'Clean' means you never touched
  // THAT car; contact marks it dirty for life. Each car pays exactly once.
  for(const c of S.traffic){
    if(c.dir<0) continue;
    const halfLen=(VTYPES[c.type||"sedan"].len||4.5)/2;
    if(c.s > v.s+2) c._wasAhead=true;
    else if(c._wasAhead && c.s < v.s-(halfLen+2.5)){
      c._wasAhead=false;
      if(!c._passPaid && !c._dirty && !S.wreck && v.v>c.v+0.5 && v.v>9){
        c._passPaid=1;
        // a crawling lorry pays pocket money; hunting down the stripe crowd pays real kronor
        const pay=Math.round((60 + Math.pow(Math.max(0,c.v-8),1.9)*6) * S.mult * (c.aggro?1.5:1));
        S.kr+=pay; addXp(c.aggro?30:18);
        cheque("\u2713 CLEAN PASS +"+fmtMoney(pay)+(c.v>22?" — FAST ONE":""));
      }
    }
  }
  // collision check — true-width hitboxes, contact RESOLUTION, and re-arming
  // cooldowns. (Was: half-width lat boxes from a stale /1.9 unit conversion,
  // plus one-shot _scr/_hard latches that made a car intangible after the
  // first kiss, plus no rear-end case — a tailgate tap read as a HARD HIT.)
  for(const c of S.traffic){
    c._scrT=Math.max(0,(c._scrT||0)-dt); c._hardT=Math.max(0,(c._hardT||0)-dt);
    c._nudgeT=Math.max(0,(c._nudgeT||0)-dt);
    if(S.crashed) continue;
    const T=VTYPES[c.type||"sedan"];
    const hitLen=(T.len+4.63)/2, hitLat=(T.w+1.76)/2*0.90;   // metres, honest widths (10% forgiveness)
    const dS=c.s-v.s, dL=c.lane-v.lane;
    if(Math.abs(dS)<hitLen && Math.abs(dL)<hitLat){
      c._dirty=1;                                            // touched: THIS car never pays a clean-pass cheque
      const closing=Math.abs(v.v-(c.dir>0?c.v:-c.v));
      const latOverlap=hitLat-Math.abs(dL);
      if(c.dir>0 && closing<7 && latOverlap>=hitLat*0.5){
        // BUMPER TAP — the tailgate case: match speeds, resolve the overlap,
        // stay tangible. No phantom hard hits, no ghosting through the boot.
        if(dS>0){ v.s=c.s-hitLen; v.v=Math.min(v.v,c.v); c.brk=1; }
        else    { c.s=v.s-hitLen; c.v=Math.min(c.v,v.v); c.brk=1; }
        v.bounce=Math.max(v.bounce||0,0.7);
        if(!(c._nudgeT>0)){ c._nudgeT=1.5; sndThud(0.35);
          if(!S.easy){ S.bodyDmg=Math.min(100,(S.bodyDmg||0)+0.5); }
          toast("BUMPER TAP \u2014 bumpers do their one job. Mind the gap."); }
      } else if(c.dir>0 && closing<7){
        // A SCRAPE: mirrors kiss, paint trades. Costs money, not the car.
