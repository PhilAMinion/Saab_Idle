/* ============================ CHASE ==================================== */
/* Hidden speed traps trip a chase when you blow past over the limit. A cop
   pulls off the shoulder, lights blazing, and runs the reduced-state pursuit
   controller in copStep(). The fleeing car keeps its normal MODE-table driving
   from driverStep — the chase only adds the pull-over / outrun / busted layer. */
function radarCheck(){                       // RADAR DETECTOR HUD: is a cop-trap in range?
  const v=S.veh;
  const rangeM=Math.max(80, Math.min(400, v.v*5));   // ~5 s of warning at current speed
  let hit=null;
  for(const sg of S.road.segs){
    if(sg.s0 > v.s+rangeM) break;
    for(const ft of (sg.feat||[])){
      if(ft.type==="trap" && ft.hasCop && !ft.triggered && ft.s>v.s && ft.s<v.s+rangeM){ hit=ft; break; }
    }
    if(hit) break;
  }
  S.radar = hit ? { on:true, s:hit.s, dist:hit.s-v.s } : { on:false };
}
function trapTriggerCheck(){                  // crossing a live cop-trap while speeding starts the chase
  const v=S.veh;
  if(S.chase.active) return;
  for(const sg of S.road.segs){
    if(sg.s0 > v.s+20) break;
    for(const ft of (sg.feat||[])){
      if(ft.type==="trap" && ft.hasCop && !ft.triggered && ft.s>v.s-3 && ft.s<v.s+3){
        ft.triggered=true;                     // consumed either way — you only cross once
        const overBy = v.v - (roadSpeedLimitAt(v.s) + CFG.CHASE.triggerOverMs);
        if(overBy>0) startChase(ft);
      }
    }
  }
}
function startChase(trap){
  S.chase={active:true, busted:false, pulledOver:false, violationT:0, pullOverT:0, t:0, _loseT:0};
  const edge=profAt(trap.s).edge, side=trap.side||1;
  S.cop={ s:trap.s, lane:side*(edge+0.5), v:0, pullingOut:1.3, pedal:0, brake:0, brk:0,
          type:"sedan", dir:1, col:"#eef1f4", police:1 };   // parked on the shoulder, about to pounce
  toast("\uD83D\uDEA8 SPEED TRAP \u2014 blue lights in the mirror. Lose them, or pull over.");
}
function endChase(evaded){                     // cop turns back — you got away (or it timed out)
  if(evaded){ toast("\uD83D\uDCA8 LOST THEM \u2014 the blue lights fade in the mirror."); addXp(40); }
  S.chase={active:false, busted:false, pulledOver:false, violationT:0, pullOverT:0};
  S.cop=null; S.radar={on:false};
}
function bustChase(){                          // stopped on the shoulder long enough — ticket written
  const fine=Math.round(1500*S.mult);
  if(!S.easy) S.kr=Math.max(0,S.kr-fine);
  toast("\uD83D\uDE94 PULLED OVER \u2014 licence, registration, and a fine of "+fmtMoney(S.easy?0:fine)+". They pull away.");
  S.chase={active:false, busted:true, pulledOver:false, violationT:0, pullOverT:0};
  S.cop=null; S.radar={on:false};
}
function copStep(dt){
  const c=S.cop, v=S.veh;
  if(!c) return;
  if(S.chase.pulledOver){ c.v=0; c.brake=1; c.brk=1; return; }   // holds station behind the stopped car
  if(c.pullingOut>0){                          // the "pulls out, lights blazing" beat
    c.pullingOut-=dt;
    c.v=Math.min(20, c.v+9*dt);
    c.lane += Math.max(-1.4*dt, Math.min(1.4*dt, v.lane*0.6 - c.lane));
    c.s += c.v*dt; c.brk=0;
    return;
  }
  // grip ceiling per fleeing temperament: Racing outpaces the cop by design,
  // the cop never runs a drift FSM of its own — it just follows on grip.
  const ceilByMode={calm:0.55, spirited:0.75, racing:0.95, drift:0.85};
  const grip=ceilByMode[S.aiMode]!==undefined?ceilByMode[S.aiMode]:0.75;
  const followGap=14 + c.v*0.9;                // sit this far behind, never rear-end
  const gapErr=(v.s-followGap) - c.s;
  let vLimit=Infinity;                          // corner-aware cap (same shape as driverStep's scan)
  for(let s=0; s<c.v*c.v/(2*7.5)+60; s+=12){
    const cv=curvAt(c.s+s);
    if(Math.abs(cv)>1e-5){ const mu=0.92*wxMu()*grip;
      vLimit=Math.min(vLimit, Math.sqrt(mu*CFG.G/Math.abs(cv))); }
  }
  // straight-line ceiling scaled by temperament (mirrors the fleeing car's own
  // pace cap): Racing/Drift top out ABOVE the cop, so a long stretch lets them
  // pull away; Calm/Spirited sit well under it, so the cop stays glued to them.
  const vCeil = 78*grip;                        // 78 ≈ the sim's absolute top (vTop)
  const catchUp = gapErr>0 ? (6 + gapErr*0.4) : 0;   // only reel in when actually behind
  const vTarget=Math.min(vLimit, vCeil, v.v + catchUp);
  const err=vTarget-c.v;
  c.pedal=err>0? Math.min(1, 0.3+err*0.3) : 0;
  c.brake=err<0? Math.min(1, -err*0.35) : 0;
  c.brk = c.brake>0.15 ? 1 : 0;                 // brake lights, same shape as traffic
  c.v=Math.max(0, c.v + (c.pedal*8 - c.brake*9)*dt);   // lightweight integrator (traffic-car pattern)
  c.s += c.v*dt;
  c.lane += Math.max(-0.9*dt, Math.min(0.9*dt, v.lane - c.lane));  // pure-pursuit onto the fleeing lane
}
function chaseStep(dt){
  S.chase = S.chase || {active:false};          // survive a load that predates the chase system
  if(!S.chase.active){ trapTriggerCheck(); return; }
  const c=S.cop, v=S.veh;
  copStep(dt);
  if(!c){ S.chase.active=false; return; }
  S.chase.t=(S.chase.t||0)+dt;
  const gap = v.s - c.s;                         // how far ahead the fleeing car is
  // violation timer: over the margin winds it up, under it unwinds (twice as fast)
  const overBy = v.v - (roadSpeedLimitAt(v.s)+CFG.CHASE.violationThresholdMs);
  if(overBy>0 && c.pullingOut<=0 && !S.chase.pulledOver) S.chase.violationT += dt;
  else S.chase.violationT = Math.max(0, S.chase.violationT - dt*2);
  // OUTRUN: hold a big gap for long enough (or exhaust the cop's patience) and it gives up
  if(gap > CFG.CHASE.loseGapM) S.chase._loseT=(S.chase._loseT||0)+dt; else S.chase._loseT=0;
  if(!S.chase.pulledOver && (S.chase._loseT>CFG.CHASE.loseHoldS || S.chase.t>CFG.CHASE.maxS)){ endChase(true); }
}
function stopBlocksShoulder(sLo, sHi, side){    // is an occupied-shoulder 'stop' feature in this range?
  for(const sg of S.road.segs){
    if(sg.s0 > sHi) break;
    for(const ft of (sg.feat||[])){

function dmgK(){ return S.easy? 0 : 1; }             // EASY MODE: the story, never the bill
function applyDamage(eng, body, why){

  S.bodyDmg=Math.min(100,(S.bodyDmg||0)+body*dmgK());

function startWreck(cause,hit){ sndCrash();

function wreckStep(dt){

  v.s+=v.v*dt;

    v.wheelDmg=Math.max(v.wheelDmg||0,0.5); v.rollRisk=0;

const STORY=[];   // the narrative ticker retired — the road speaks for itself

/* ======================================================================= *
 *  RIDERS — the roadside micro-biomes, the people who wait at them, and   *
 *  the speech system that lets them talk. Built so a WRITER never has to   *
 *  touch code: to give the game words, add strings to STORYLINES below.    *
 *  Everything else (who's waiting, boarding, anxiety, the speech bubble,   *
 *  saving progress) is wired up here already.                              *
 * ======================================================================= */

/* ---- 1. THE WRITER'S DESK ---------------------------------------------
   A storyline is now a small BRANCHING CONVERSATION. Still just data — no
   code to touch. The shape:

     { id:"myrider", who:["nurse"],   // who: rider kinds it can attach to
                                       //      (omit or null = anyone)
       start:"s0",                     // which node they open with
       nodes:{
         s0:{ say:"What the rider says.",        // string, OR
              // say:{t:"...", anx:8},           //   {t, anx} to also move nerves
              choices:[                           // what YOU (the driver) can say back
                { r:"Your reply.", to:"next" },   //  r: your line   to: next node
                { r:"Blunt reply.", to:"other", anx:10 }, // a reply can spike nerves
                { r:"(say nothing)", to:"quiet" } // r can be an action in ()
              ] },
         next:{ say:"They answer.", choices:[ ... ] },
         quiet:{ say:{t:"A closing line.", anx:-8} }   // NO choices == the story is told
       } }

   Rules, the whole API:
   - A node with `choices` shows tappable buttons a beat after the line lands.
   - A node with NO choices (or an empty list) is an ENDING — once they say it,
     their story's told and they'll step out at the next rest stop.
   - `next:"nodeId"` on a choiceless node makes a RAMBLE: the line plays, then it
     flows on to `next` on its own a moment later. String several together and a
     rider monologues at their own pace — this is how you get variable length and
     a looser rhythm instead of question-answer-question-answer. Tapping the
     bubble during a ramble just moves it along early.
   - `dropTo:"nodeId"` on a node WITH choices decides what happens if the player
     waves the line away instead of answering: by default they raise the same
     question again later, but with `dropTo` they take the hint and move on to
     that node. (No dropTo + a ramble `next` still moves on when dismissed.)
   - `anx` on a `say` moves the rider's nerves when THEY speak it; `anx` on a
     choice moves them when YOU pick it. Negative calms, positive rattles.

];
const PAX_NAMES=["Sanna","Ove","Lena","Björn","Majken","Tomas","Ingrid","Kaj","Elsie",
  "Rune","Vera","Nils","Signe","Åke","Dagny","Sten","Marit","Loke","Ebba","Gunnar"];
const PAX_STYLES=["#c86b3a","#3f5a86","#8a6f38","#5a7d6a","#9a4f52","#4a4d55","#b39a4e","#6a5a86"];
// independent appearance traits from a per-rider seed, so the person you see
// waiting is the one who climbs in and shows in the mirror — and skin/hair/build
// vary on their own, not locked to the coat colour.
const PAX_SKIN=["#f0d0ae","#e6bd94","#d3a273","#b98153","#8f5d3a","#6d4529"];
const PAX_HAIR=["#1b1610","#33251a","#573922","#7c5a30","#a9a49b","#c9a552","#8a3a25","#0d0d0f"];
function paxLook(seed){
  let h=(seed>>>0)||1; h=(h^h>>>15)>>>0; h=Math.imul(h,2246822519)>>>0; h=(h^h>>>13)>>>0;
  return { skin:PAX_SKIN[h%PAX_SKIN.length], hair:PAX_HAIR[(h>>>5)%PAX_HAIR.length],
           hat:((h>>>11)&3)===0, build:0.88+((h>>>13)&7)/7*0.28 };
}
/* a shuffle-bag so consecutive riders don't look/sound the same — cheapest
   variation there is: reshuffle indices, deal them out, reshuffle when empty */
function paxStyleNext(){
  if(!S.paxBag||!S.paxBag.length){
    S.paxBag=PAX_STYLES.map((_,i)=>i);
    for(let i=S.paxBag.length-1;i>0;i--){ const j=(R()*(i+1))|0; const t=S.paxBag[i];S.paxBag[i]=S.paxBag[j];S.paxBag[j]=t; }
  }
  return S.paxBag.pop();
}
function paxPickKind(){ return PAX_KINDS[(R()*PAX_KINDS.length)|0]; }
function paxNewId(){ S._paxCtr=(S._paxCtr||0)+1; return "p"+Date.now().toString(36)+(S._paxCtr); }
function storyFor(kind, avoid){
  const pool=STORYLINES.filter(s=>(!s.who||s.who.includes(kind)) && (!avoid||!avoid.has(s.id)));
  const src=pool.length?pool:STORYLINES;
  return src[(R()*src.length)|0];
}

/* ---- 3. THE SPEECH BUBBLE ---------------------------------------------- */
let SPEECH=null;        // {name, text, t0, dur, hold}
let SPEECH_BOX=null;    // last-drawn hit rect, so a tap can dismiss the bubble
// hold=true: the bubble waits for you (tap it, or answer) instead of timing out.
function paxSay(text, name, dur, hold, cont){ SPEECH={ text:trHtml(text), name:name||(S.pax&&S.pax.name)||"", t0:S.t, dur:dur||6.5, hold:!!hold, cont:!!cont }; }
function wrapText(txt, maxW, font){
  ctx.font=font; const words=txt.split(" "), lines=[]; let cur="";
  for(const w of words){ const test=cur?cur+" "+w:w;
    if(ctx.measureText(test).width>maxW && cur){ lines.push(cur); cur=w; } else cur=test; }
  if(cur) lines.push(cur); return lines;
}
function drawSpeech(){
  if(!SPEECH){ SPEECH_BOX=null; return; }
  const age=S.t-SPEECH.t0;
  if(!SPEECH.hold && age>SPEECH.dur){ SPEECH=null; SPEECH_BOX=null; return; }  // transient lines still time out
  const app=Math.min(1,age/0.22);
  const fade=SPEECH.hold?1:Math.min(1,(SPEECH.dur-age)/0.4);                   // held lines never fade out
  const a=Math.max(0,Math.min(1,Math.min(app,fade)));
  const fpx=Math.max(13,Math.min(19,W*0.026));
  const font="600 "+fpx+"px -apple-system,Segoe UI,Arial";
  const maxW=Math.min(W*0.52,360)-24;
  const lines=wrapText(SPEECH.text,maxW,font);
  const lh=fpx*1.32, padX=13, padY=10, nameH=SPEECH.name?fpx*1.05:0;
  let tw=0; for(const l of lines) tw=Math.max(tw,ctx.measureText(l).width);
  if(SPEECH.name){ ctx.font="700 "+(fpx*0.78)+"px -apple-system,Arial"; tw=Math.max(tw,ctx.measureText(SPEECH.name.toUpperCase()).width); }
  const bw=tw+padX*2, bh=lines.length*lh+padY*2+nameH;
  const bx=Math.max(10,W*0.05), by=Math.max(56,H*0.235);
  SPEECH_BOX={x:bx,y:by,w:bw,h:bh+16};   // +16 covers the tail; a tap anywhere on it dismisses
  ctx.save(); ctx.globalAlpha=a;
  // bubble
  ctx.fillStyle="rgba(16,17,20,0.93)"; ctx.strokeStyle="rgba(201,147,42,0.55)"; ctx.lineWidth=1.5;
  roundRect(bx,by,bw,bh,12); ctx.fill();
  ctx.beginPath();ctx.moveTo(bx+12,by);ctx.arcTo(bx+bw,by,bx+bw,by+bh,12);
  ctx.arcTo(bx+bw,by+bh,bx,by+bh,12);ctx.arcTo(bx,by+bh,bx,by,12);ctx.arcTo(bx,by,bx+bw,by,12);ctx.closePath();ctx.stroke();
  // tail toward the passenger seat (down-right)
  ctx.fillStyle="rgba(16,17,20,0.93)";
  ctx.beginPath();ctx.moveTo(bx+bw*0.62,by+bh-1);ctx.lineTo(bx+bw*0.78,by+bh+16);ctx.lineTo(bx+bw*0.80,by+bh-1);ctx.closePath();ctx.fill();
  // name
  let ty=by+padY;
  if(SPEECH.name){ ctx.font="700 "+(fpx*0.78)+"px -apple-system,Arial"; ctx.fillStyle="#c9932a"; ctx.textAlign="left"; ctx.textBaseline="top";
    ctx.fillText(SPEECH.name.toUpperCase(),bx+padX,ty); ty+=nameH; }
  ctx.font=font; ctx.fillStyle="#e7ebf0"; ctx.textAlign="left"; ctx.textBaseline="top";
  for(const l of lines){ ctx.fillText(l,bx+padX,ty); ty+=lh; }
  // a faint tap cue on held lines: rambles continue, questions get set aside
  if(SPEECH.hold && app>=1){ ctx.globalAlpha=a*0.5; ctx.fillStyle="#c9932a";
    ctx.font="600 "+(fpx*0.62)+"px -apple-system,Arial"; ctx.textAlign="right"; ctx.textBaseline="alphabetic";
    ctx.fillText(SPEECH.cont?"tap to continue \u203a":"tap to set aside \u00d7", bx+bw-padX, by-4); }
  ctx.restore();
}
function speechFrame(){ drawSpeech(); }

/* ---- 4. THE RIDER: board, ride, alight; nerves and vitals live here ---- */
const REST_ZONE=85;          // metres either side of a building that count as "the lot" — roomy, so pulling in is unhurried
const REPROMPT_GAP=10;       // seconds after you wave a line away before the rider tries again

/* -- helpers over the writer's data: a `say` is a string or {t,anx}; a
   storyline is looked up by id, a node by key within it. All tolerant of a
   save that points at a storyline/node that no longer exists (the writer
   edited the script since) — in that case the rider simply finishes up. */
function storyOf(p){ return STORYLINES.find(x=>x.id===p.sid)||null; }
function nodeOf(p){ const s=storyOf(p); return s&&s.nodes?s.nodes[p.node]:null; }
function sayText(f){ return typeof f==="string"?f:(f&&f.t)||""; }
function sayAnx(f){ return (f&&typeof f==="object"&&typeof f.anx==="number")?f.anx:0; }
function driverName(){ return S.lang==="sv"?"DU":"YOU"; }

function paxBoard(f){
  const kind = PAX_KINDS.find(k=>k.id===f.kindId) || paxPickKind();
  let id, name, sid, node=null, turns=0, rides=0, resumed=false, look=(f.look!=null?f.look:(Math.random()*4294967296)>>>0);
  if(f.retId && S.paxLog && S.paxLog[f.retId] && !S.paxLog[f.retId].done){
    const L=S.paxLog[f.retId]; id=f.retId; name=L.name; kind.id=L.kind||kind.id;
    sid=L.sid; node=L.node; turns=L.turns||0; rides=L.rides||0; resumed=true;
    if(L.look!=null) look=L.look;                                  // same face as last time
  } else {
    id=paxNewId(); name=PAX_NAMES[(R()*PAX_NAMES.length)|0];
    const avoid=new Set(Object.values(S.paxLog||{}).filter(l=>l.done).map(l=>l.sid));
    sid=storyFor(kind.id,avoid).id;
  }
  let sl=STORYLINES.find(s=>s.id===sid); if(!sl){ sl=STORYLINES[0]; sid=sl.id; }
  const start=sl.start||"s0";
  if(node==null || !sl.nodes[node]){ node=start; resumed=false; }  // fresh, or a resumed node that still exists
  S.pax={ id, name, kind:kind.id, kindLabel:kind.label, style:(f.style!=null?f.style:paxStyleNext()), look,
          coat:kind.coat, anx:kind.base, hr:72, tIn:0, sid, node, turns, rides,
          done:false, boardOdo:S.odo, choiceAt:0, choicesShown:false, pending:null, pendAt:0, repromptAt:0, autoAt:0 };
  f.wait=false; f.used=true; S.paxSeen=(S.paxSeen||0)+1; S._boardCool=2.6;
  toast("👤 "+name+" gets in — "+kind.label.toLowerCase()+". PASSENGER tab in SETTINGS.");
  paxSayNode(node, resumed);   // resuming: don't re-charge nerves or re-count the exchange
  if(typeof addXp==="function") addXp(12);
}
function paxAlight(reason){
  const p=S.pax; if(!p) return;
  S.paxLog=S.paxLog||{};
  S.paxLog[p.id]={ name:p.name, kind:p.kind, sid:p.sid, node:p.node, turns:p.turns||0, look:p.look,
                   rides:(p.rides||0)+1, done:!!p.done };
  // FARE — they settle up on the way out. Time aboard sets the meter, a finished
  // story pays a bonus, and a calm ride earns a tip; a white-knuckle one doesn't.
  const secs=Math.max(0,p.tIn||0);
  const base=35 + Math.round(secs*1.4) + (p.done?70:0);
  const tip=Math.max(0, Math.round((100-(p.anx||0))/100 * base*0.35));
  const fare=Math.max(20, base+tip);
  S.kr=(S.kr||0)+fare;
  if(typeof addXp==="function") addXp(p.done?18:8);
  const sl=storyOf(p);
  const flavour = (sl&&sl.payNote) ? (" "+sl.payNote+".")
                 : (p.done ? " That's their whole story." : " The road remembers where you left off.");
  toast("👋 "+p.name+(p.done?" steps out.":" steps out for now.")+flavour+" Fare +"+fmtMoney(fare)+".");
  cheque("\u2b50 FARE +"+fmtMoney(fare)+(tip>0?"  \u00b7 tip "+fmtMoney(tip):(p.done?"":"  \u00b7 part")));
  clearChoices(); SPEECH=null; SPEECH_BOX=null; S.pax=null; S._boardCool=2.6;
}
/* THE RIDER SPEAKS a node's line, then — if that node offers choices — arms
   the choice panel to appear a beat later. A node with no choices is the end
   of their story. `resay` re-shows a line already spoken (a reprompt or a
   resumed ride) without re-charging nerves or re-counting the exchange. */
function paxSayNode(nodeId, resay){
  const p=S.pax; if(!p) return;
  clearChoices(); p.choicesShown=false; p.pending=null; p.repromptAt=0; p.autoAt=0;
  const s=storyOf(p), nd=s&&s.nodes?s.nodes[nodeId]:null;
  if(!nd){ p.done=true; p.choiceAt=0; return; }   // dangling link → wrap them up gracefully
  p.node=nodeId;
  if(!resay){ p.turns=(p.turns||0)+1; const a=sayAnx(nd.say); if(a) p.anx=Math.max(0,Math.min(100,p.anx+a)); }
  const txt=sayText(nd.say);
  const dur=Math.max(4.5,Math.min(9.5, txt.length*0.055+3));
  const hasChoices=!!(nd.choices && nd.choices.length);
  const ramble=!hasChoices && !!nd.next;                 // a line that flows on by itself
  paxSay(txt, p.name, dur, true, ramble);                // held: waits for a tap or an answer; ramble shows "continue"
  if(hasChoices){ p.choiceAt=S.t+Math.min(dur*0.5,2.8); }        // reveal buttons mid-line
  else if(ramble){ p.choiceAt=0; p.autoAt=S.t+Math.max(dur*0.85,2.8); }  // monologue on, at its own pace
  else { p.choiceAt=0; p.done=true; }                            // terminal: story told
}
/* THE DRIVER ANSWERS. Called by a tap on a choice button. Your reply flashes
   in the bubble (transient), then the rider responds a moment later. */
function paxChoose(i){
  const p=S.pax; if(!p) return;
  const nd=nodeOf(p); if(!nd||!nd.choices||!nd.choices[i]) return;
  const ch=nd.choices[i];
  clearChoices(); p.choicesShown=false; p.repromptAt=0;
  if(typeof ch.anx==="number") p.anx=Math.max(0,Math.min(100,p.anx+ch.anx));
  const reply=(ch.r||"").trim();
  if(reply){ paxSay(reply, driverName(), 2.7, false); p.pending=ch.to; p.pendAt=S.t+2.9; }
  else { paxSayNode(ch.to); }
  if(typeof addXp==="function") addXp(4);
}
/* SET ASIDE. Tapping the bubble waves the current line away and clears its
   replies. If it was a line still awaiting your answer, the rider brings it
   back after a short while rather than losing the thread. */
function paxDismiss(){
  if(!SPEECH) return;
  SPEECH=null; SPEECH_BOX=null; clearChoices();
  const p=S.pax; if(!p) return;
  p.choicesShown=false;
  if(p.pending || p.done) return;                 // a reply is already in flight, or the tale's done
  const nd=nodeOf(p); if(!nd) return;
  if(!(nd.choices && nd.choices.length)){         // a ramble line
    if(nd.next){ p.autoAt=0; paxSayNode(nd.next,false); }  // waved on → they carry straight on
    return;
  }
  if(nd.dropTo){ paxSayNode(nd.dropTo,false); }   // they take the hint and move the conversation on
  else { p.choiceAt=0; p.repromptAt=S.t+REPROMPT_GAP; }   // otherwise they'll raise it again later
}

/* ---- FRONT END: the choice buttons ------------------------------------
   A DOM overlay on the left, clear of the wheel (centre) and pedals
   (corners). The CONTAINER ignores touches (pointer-events:none) so driving
   input passes straight through to the canvas everywhere except on an actual
   button — the panel can never block steering or the pedals. */
function showChoices(choices){
  const box=$("paxChoices"); if(!box) return;
  box.innerHTML="";
  choices.forEach((c,i)=>{
    const b=document.createElement("button");
    b.className="paxChoice"; b.dataset.i=i;
    b.textContent="‣ "+trHtml((c.r&&c.r.trim())?c.r:"…");
    box.appendChild(b);
  });
  box.style.display="flex";
  requestAnimationFrame(()=>{ box.style.opacity="1";
    box.querySelectorAll(".paxChoice").forEach((b,i)=>
      setTimeout(()=>{ b.style.opacity="1"; b.style.transform="translateX(0)"; }, 30+i*80)); });
}
function clearChoices(){ const box=$("paxChoices"); if(!box||box.style.display==="none") return;
  box.style.display="none"; box.style.opacity="0"; box.innerHTML=""; }
function paxStep(dt){
  if(S._boardCool>0) S._boardCool-=dt;
  const v=S.veh;
  // vitals + story while someone rides
  const p=S.pax;
  if(p){
    p.tIn+=dt;
    const kind=PAX_KINDS.find(k=>k.id===p.kind)||PAX_KINDS[0];
    // nerves track how you drive: speed, cornering load, near-misses, the dark
    let target=kind.base
      + Math.max(0,(v.v-24))*1.1                       // going fast
      + (v.latG||0)*10                                  // leaning on the tyres
      + (S.drv.warn===2?26:S.drv.warn===1?11:0)         // a warning in the glass
      + (v.offEx?14:0)                                  // off in the rough
      + (S.night?5:0) + ((S.wx&&(S.wx.type==="fog"||S.wx.type==="snow"))?6:0);
    if(S.crashed) target=100;
    target=Math.max(0,Math.min(100,target));
    const rate=target>p.anx?dt*0.9:dt*0.35;             // fear spikes, calm returns slow
    p.anx+=(target-p.anx)*Math.min(1,rate);
    p.hr = Math.round(66 + p.anx*0.85 + Math.min(30,v.v*0.4));
    // conversation flow — no clock rushes it; the ride is as long as the talk.
    const busy = S.menuOpen || S.crashed;               // don't pop choices over a menu/crash card
    if(p.pending && S.t>=p.pendAt){                      // your reply has been read → they respond
      const nx=p.pending; p.pending=null; paxSayNode(nx);
    } else if(p.autoAt && S.t>=p.autoAt && !p.done && !busy){
      const nd=nodeOf(p); p.autoAt=0; if(nd&&nd.next) paxSayNode(nd.next,false);  // ramble flows on by itself
    } else if(p.repromptAt && S.t>=p.repromptAt && !p.done && !busy){
      paxSayNode(p.node, true);                          // you set it aside → they raise it again, gently
    } else if(!p.done && !p.pending && !p.repromptAt && !p.autoAt && p.choiceAt && S.t>=p.choiceAt){
      const nd=nodeOf(p);
      if(nd&&nd.choices&&nd.choices.length){
        if(!busy && !p.choicesShown){ showChoices(nd.choices); p.choicesShown=true; }
        else if(busy && p.choicesShown){ clearChoices(); p.choicesShown=false; }  // hide; re-arm when menu closes
      }
    }
  } else { clearChoices(); }
  // TRANSFER: no reverse in this car — coming to rest off the tarmac anywhere
  // in a rest-stop lot completes the exchange. Board a waiter, or let a rider
  // whose story is done step out.
  const rs=restStopNear(v.s);
  const edge=profAt(v.s).edge;
  // stops are always on the right now, and the apron reaches in past the kerb —
  // so easing toward the right edge and coasting to a stop is enough. No need to
  // plough deep into the rough.
  const offRoad=v.lane>edge-0.7;
  const stopped=v.v<1.3;
  if(rs && offRoad && stopped && (S._boardCool||0)<=0){
    if(!S.pax && rs.wait){ paxBoard(rs); }
    else if(S.pax && S.pax.done){ paxAlight(); }
  }
}

/* ---- 5. WHERE THE STOPS ARE (scans the live road) ---------------------- */
function restStopNear(s){       // a building whose lot we're sitting in
  let best=null,bd=1e9;
  for(const seg of S.road.segs) for(const f of seg.feat){
    if(f.type!=="reststop") continue;
    const d=Math.abs(f.s-s); if(d<REST_ZONE && d<bd){ bd=d; best=f; }
  }
  return best;
}
function restStopAhead(s){       // nearest building in front — for the HUD
  let best=null,bd=1e9;
  for(const seg of S.road.segs) for(const f of seg.feat){
    if(f.type!=="reststop") continue;
    const d=f.s-s; if(d>-REST_ZONE && d<bd){ bd=d; best=f; }
  }
  return best?{f:best,dist:Math.max(0,bd)}:null;
}
const REST_LABEL={gas:"FUEL STOP",hospital:"CLINIC",food:"ROADSIDE DINER"};
const REST_ICON ={gas:"⛽",hospital:"✚",food:"🍔"};
function drawRestHUD(){
  const info=restStopAhead(S.veh.s); if(!info) return;
  const inLot=info.dist<REST_ZONE, near=info.dist<340;
  const label=REST_LABEL[info.f.rtype]||"REST STOP";
  const dstr=inLot? "PULL IN" : distStr(info.dist/1000).toUpperCase();
  const waiting=info.f.wait;
  const line1=(REST_ICON[info.f.rtype]||"▸")+" "+label+" · "+dstr;
  const line2=(waiting&&near)? "· SOMEONE IS WAITING ·" : "";
  const lx=10, by=H-58, blink=near&&Math.floor(S.t*3)%2===0;
  ctx.save(); ctx.textAlign="left"; ctx.textBaseline="middle";
  ctx.font="bold 13px 'Courier New',monospace"; const w1=ctx.measureText(line1).width;
  ctx.font="bold 9px 'Courier New',monospace";  const w2=line2?ctx.measureText(line2).width:0;
  const w=Math.max(150, Math.max(w1,w2)+20);                   // fit the box to the text — no truncation
  ctx.fillStyle=near?(blink?"rgba(201,147,42,0.92)":"rgba(120,86,20,0.85)"):"rgba(20,22,26,0.82)";
  roundRect(lx,by-16,w,32,7);
  ctx.fillStyle=near?"#16100a":"#c9cfd6"; ctx.font="bold 13px 'Courier New',monospace";
  ctx.fillText(line1,lx+10,by-2);
  if(line2){ ctx.fillStyle=near?"#3a2a10":"#c9932a"; ctx.font="bold 9px 'Courier New',monospace";
    ctx.fillText(line2,lx+10,by+9); }
  ctx.restore(); ctx.shadowBlur=0;
}

/* ---- 6. DRAWING: a person, and the one-building lots -------------------- */
function drawPerson(cx, baseY, ph, col, o){ o=o||{};
  const pw=ph*0.34;
  ctx.save();
  // shadow
  ctx.fillStyle="rgba(0,0,0,0.28)"; ctx.beginPath();
  ctx.ellipse(cx,baseY,pw*0.9,pw*0.32,0,0,7); ctx.fill();
  // legs
  ctx.fillStyle=S.night?"#111418":"#2b2f36";
  ctx.fillRect(cx-pw*0.34,baseY-ph*0.42,pw*0.28,ph*0.42);
  ctx.fillRect(cx+pw*0.06,baseY-ph*0.42,pw*0.28,ph*0.42);
  // torso / coat
  ctx.fillStyle=S.night?shade(col,0.35):col;
  roundRect(cx-pw*0.5,baseY-ph*0.86,pw,ph*0.5,pw*0.22); ctx.fill();
  // arm — raised in a wave when flagging you down
  ctx.strokeStyle=S.night?shade(col,0.35):col; ctx.lineWidth=Math.max(1.4,pw*0.22); ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(cx+pw*0.42,baseY-ph*0.78);
  if(o.wave){ const w=Math.sin(S.t*6)*0.18; ctx.lineTo(cx+pw*0.72,baseY-ph*(1.02+w)); }
  else ctx.lineTo(cx+pw*0.60,baseY-ph*0.5);
  ctx.stroke();
  // head
  ctx.fillStyle=S.night?"#5a4a3a":"#d8b48c";
  ctx.beginPath();ctx.arc(cx,baseY-ph*0.95,pw*0.42,0,7);ctx.fill();
  if(o.bag){ ctx.fillStyle=S.night?"#20242a":"#4a4033"; roundRect(cx-pw*0.9,baseY-ph*0.55,pw*0.5,ph*0.4,pw*0.12); ctx.fill(); }
  ctx.restore();
}
// THE SIDING. The pull-off is drawn as real ground in renderWorld, not as
// billboards. This returns the paved width (in metres, to the RIGHT) at a given
// arclength: it ramps out of the shoulder before the stop, runs full past the
// building, then ramps back in — a little service road you can drive through and
// rejoin. Physics treats this width as pavement, so the drive-through is smooth.
const REST_SIDING_W = 5.2;
function restSidingW(sPos){
  let best=0;
  for(const seg of S.road.segs) for(const f of seg.feat){
    if(f.type!=="reststop") continue;
    const d=sPos-f.s;                       // metres relative to the stop
    if(d<-28 || d>52) continue;
    let w;
    if(d<-10)      w=(d+28)/18;             // entrance ramp  (-28 → -10)
    else if(d<=40) w=1;                     // full past the building
    else           w=(52-d)/12;             // exit ramp (40 → 52)
    w=Math.max(0,Math.min(1,w))*REST_SIDING_W;
    if(w>best) best=w;
  }
  return best;
}
// THE ANCHOR billboards: the side service point — pump / drive-through / ER —
// that ends up beside the car, and the waiting soul. (The paved apron they stand
// on is the siding ground drawn in renderWorld.)
function drawRestApron(f, sl, wS){
  const em=sl.sc, side=f.side, gy=sl.sy, x=sl.sx;
  if(em<0.4) return;
  const sx=x+side*(wS+em*3.4), bh=em*1.5, bw=em*1.7;            // service point, set into the siding
  if(f.rtype==="gas"){
    ctx.fillStyle=S.night?"#171a20":"#b7bcc2"; ctx.fillRect(sx-em*0.08,gy-bh*0.95,em*0.16,bh*0.95);       // post
    ctx.fillStyle=S.night?"#20242b":"#e9ecef"; ctx.fillRect(sx-bw*0.5,gy-bh*1.05,bw,em*0.22);             // canopy
    ctx.fillStyle="#d24b3a"; ctx.fillRect(sx-bw*0.5,gy-bh*1.05,bw,em*0.09);
    ctx.fillStyle=S.night?"#101319":"#dfe3e8"; roundRect(sx-em*0.28,gy-bh*0.55,em*0.56,bh*0.55,em*0.08); ctx.fill(); // pump
    ctx.fillStyle=S.night?"#0d0f13":"#3a5f8a"; ctx.fillRect(sx-em*0.16,gy-bh*0.44,em*0.32,em*0.2);
  } else if(f.rtype==="hospital"){
    ctx.fillStyle=S.night?"#20242b":"#e9ecef"; roundRect(sx-bw*0.5,gy-bh*0.9,bw,em*0.22,em*0.05); ctx.fill();
    ctx.fillStyle=S.night?"#171a20":"#b7bcc2"; ctx.fillRect(sx-bw*0.44,gy-bh*0.68,em*0.14,bh*0.68); ctx.fillRect(sx+bw*0.30,gy-bh*0.68,em*0.14,bh*0.68);
    const cs=em*0.42, cy2=gy-bh*0.78; ctx.fillStyle="#d13a34";
    ctx.fillRect(sx-cs*0.16,cy2-cs*0.5,cs*0.32,cs); ctx.fillRect(sx-cs*0.5,cy2-cs*0.16,cs,cs*0.32);
  } else {
    ctx.fillStyle=S.night?"#1c1a17":"#c98a3a"; roundRect(sx-bw*0.4,gy-bh*0.8,bw*0.8,bh*0.8,em*0.08); ctx.fill();
    ctx.fillStyle=S.night?"#0d0f13":"#2b2f36"; ctx.fillRect(sx-bw*0.28,gy-bh*0.62,bw*0.56,bh*0.34);
    ctx.fillStyle=S.night?"#171a20":"#b7bcc2"; ctx.fillRect(sx+bw*0.42,gy-bh*0.9,em*0.12,bh*0.9);

/* ============================ RENDER ==================================== */
const cv=$("cv"), ctx=cv.getContext("2d");
let W=0,H=0;
function resize(){ W=cv.width=cv.clientWidth; H=cv.height=cv.clientHeight; }
window.addEventListener("resize",resize);

/* ============ FILMIC LOOK — raw WebGL post pass (Settings > Game) =======
   Zero libraries, WebGL1, three hand-written shaders. The 2D canvas keeps
   rendering every frame exactly as before and keeps all pointer input;
   #glcv (pointer-events:none) sits on top and re-presents the finished
   frame through:
     scene -> bright-pass @ 1/2 res -> separable gaussian x2 (ping-pong)
           -> composite: warm bloom off the amber, ACES filmic tonemap,
             edge-only chromatic aberration, vignette, shadow-weighted grain.
   Gated on the GRAPHICS setting (off by default). Physics, input zones and
   the save format are untouched. No WebGL? gfxInit fails, GFX.fail latches,
   #glcv hides and the honest 2D canvas underneath just shows through.   */
const glcv=$("glcv");
const GFX={gl:null,fail:false,w:0,h:0};
const GFX_VS="attribute vec2 p;varying vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}";
const GFX_FS_BRIGHT=
 "precision mediump float;varying vec2 uv;uniform sampler2D t;"+
 "void main(){vec3 c=texture2D(t,uv).rgb;"+
 "float l=dot(c,vec3(.2126,.7152,.0722));"+
 "float k=smoothstep(.50,.90,l);"+                          // soft-knee highlight isolation
 "float warm=clamp(c.r-c.b,0.,1.);"+                          // amber/red elements bloom a touch more
 "gl_FragColor=vec4(c*k*(1.+warm*.35),1.);}";
const GFX_FS_BLUR=
 "precision mediump float;varying vec2 uv;uniform sampler2D t;uniform vec2 dir;"+
 "void main(){vec3 a=texture2D(t,uv).rgb*.227;"+
 "a+=(texture2D(t,uv+dir*1.384).rgb+texture2D(t,uv-dir*1.384).rgb)*.316;"+
 "a+=(texture2D(t,uv+dir*3.23).rgb+texture2D(t,uv-dir*3.23).rgb)*.07;"+
 "gl_FragColor=vec4(a,1.);}";
const GFX_FS_COMP=
 "precision mediump float;varying vec2 uv;"+
 "uniform sampler2D scene;uniform sampler2D bloom;uniform float time;uniform float bloomAmt;uniform float grainAmt;uniform float aberrAmt;"+
 "vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.19*x+.43)+.14),0.,1.);}"+  // filmic highlight rolloff
 "void main(){"+
 "vec2 cc=uv*2.-1.;float r2=dot(cc,cc);"+
 "vec2 off=cc*r2*aberrAmt;"+                           // radial chromatic aberration: nil centre, a hint at the edges
 "vec3 col;"+
 "col.r=texture2D(scene,uv+off).r;"+
 "col.g=texture2D(scene,uv).g;"+
 "col.b=texture2D(scene,uv-off).b;"+
 "col+=texture2D(bloom,uv).rgb*vec3(1.,.9,.72)*bloomAmt;"+                            // warm bloom off the amber dash
 "col=aces(col*1.08);"+                            // slight exposure lift, then filmic tonemap
 "float lum=dot(col,vec3(.2126,.7152,.0722));"+
 "col=mix(vec3(lum),col,1.08);"+                            // restore a little saturation post-tonemap
 "col*=1.-.28*r2;"+                            // vignette
 "float n=fract(sin(dot(uv*vec2(429.,311.)+time,vec2(12.99,78.23)))*43758.5453);"+
 "col+=(n-.5)*grainAmt*(1.-.75*lum);"+                            // film grain, weighted into the shadows
 "gl_FragColor=vec4(clamp(col,0.,1.),1.);}";
function gfxCompile(gl,type,src){
  const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.warn("gfx shader:",gl.getShaderInfoLog(s));return null;}
  return s;
}
function gfxProg(gl,fsSrc){
  const vs=gfxCompile(gl,gl.VERTEX_SHADER,GFX_VS), fs=gfxCompile(gl,gl.FRAGMENT_SHADER,fsSrc);
  if(!vs||!fs)return null;
  const pr=gl.createProgram();gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){console.warn("gfx link:",gl.getProgramInfoLog(pr));return null;}
  pr.u={};for(const n of ["t","dir","scene","bloom","time","night","res","bloomAmt","grainAmt","aberrAmt"])pr.u[n]=gl.getUniformLocation(pr,n);
  pr.aP=gl.getAttribLocation(pr,"p");
  return pr;
}
function gfxTex(gl,w,h){
  const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  if(w)gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  return t;
}
function gfxInit(){
  if(GFX.fail)return false;
  const gl=glcv.getContext("webgl",{alpha:false,antialias:false,depth:false,stencil:false})
        ||glcv.getContext("experimental-webgl",{alpha:false});
  if(!gl){GFX.fail=true;return false;}
  GFX.gl=gl;
  GFX.pBright=gfxProg(gl,GFX_FS_BRIGHT);
  GFX.pBlur=gfxProg(gl,GFX_FS_BLUR);
  GFX.pComp=gfxProg(gl,GFX_FS_COMP);
  if(!GFX.pBright||!GFX.pBlur||!GFX.pComp){GFX.fail=true;GFX.gl=null;return false;}
  GFX.buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,GFX.buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW); // fullscreen triangle
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  gl.disable(gl.DEPTH_TEST);gl.disable(gl.BLEND);
  GFX.scene=gfxTex(gl,0,0);
  GFX.w=GFX.h=0;                                            // force FBO alloc on first frame
  return true;
}
function gfxResize(){
  const gl=GFX.gl;if(!gl)return;
  glcv.width=W;glcv.height=H;GFX.w=W;GFX.h=H;
  GFX.hw=Math.max(1,W>>1);GFX.hh=Math.max(1,H>>1);
  for(const k of ["fboA","fboB"]){
    if(GFX[k]){gl.deleteFramebuffer(GFX[k].fb);gl.deleteTexture(GFX[k].tex);}
    const tex=gfxTex(gl,GFX.hw,GFX.hh), fb=gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
    GFX[k]={fb,tex};
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
}
function gfxDraw(pr){
  const gl=GFX.gl;
  gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER,GFX.buf);
  gl.enableVertexAttribArray(pr.aP);
  gl.vertexAttribPointer(pr.aP,2,gl.FLOAT,false,0,0);
  gl.drawArrays(gl.TRIANGLES,0,3);
}
function gfxFrame(){
  // Filmic post pass, gated on the GRAPHICS setting. When off the overlay stays
  // hidden and the crisp 2D canvas shows through directly. (On by default.)
  if(!S.gfx){ if(glcv.style.display!=="none") glcv.style.display="none"; return; }
  if(GFX.fail){ if(glcv.style.display!=="none") glcv.style.display="none"; return; }
  let gl=GFX.gl;
  if(!gl){ if(!gfxInit()){ glcv.style.display="none"; return; } gl=GFX.gl; }
  if(!W||!H)return;
  if(GFX.w!==W||GFX.h!==H)gfxResize();
  // 1) upload the finished 2D frame
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,GFX.scene);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,cv);
  // 2) bright pass at half res
  gl.bindFramebuffer(gl.FRAMEBUFFER,GFX.fboA.fb);
  gl.viewport(0,0,GFX.hw,GFX.hh);
  gl.useProgram(GFX.pBright);gl.uniform1i(GFX.pBright.u.t,0);
  gfxDraw(GFX.pBright);
  // 3) ping-pong gaussian, radius widening
  gl.useProgram(GFX.pBlur);gl.uniform1i(GFX.pBlur.u.t,0);
  for(let i=0;i<2;i++){
    const rr=1+i*1.6;
    gl.bindFramebuffer(gl.FRAMEBUFFER,GFX.fboB.fb);
    gl.bindTexture(gl.TEXTURE_2D,GFX.fboA.tex);
    gl.useProgram(GFX.pBlur);gl.uniform2f(GFX.pBlur.u.dir,rr/GFX.hw,0);gfxDraw(GFX.pBlur);
    gl.bindFramebuffer(gl.FRAMEBUFFER,GFX.fboA.fb);
    gl.bindTexture(gl.TEXTURE_2D,GFX.fboB.tex);
    gl.uniform2f(GFX.pBlur.u.dir,0,rr/GFX.hh);gfxDraw(GFX.pBlur);
  }
  // 4) composite to screen
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,W,H);
  gl.useProgram(GFX.pComp);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,GFX.scene);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,GFX.fboA.tex);
  gl.uniform1i(GFX.pComp.u.scene,0);gl.uniform1i(GFX.pComp.u.bloom,1);
  gl.uniform1f(GFX.pComp.u.time,S.t%37);
  gl.uniform1f(GFX.pComp.u.bloomAmt,S.gfxBloom==null?0.38:S.gfxBloom);
  gl.uniform1f(GFX.pComp.u.grainAmt,S.gfxGrain==null?0.045:S.gfxGrain);
  // chromatic aberration is hidden by default; a crash slams it to max and it
  // bleeds back to zero over two minutes (120 s of play).
  const baseAb=S.gfxAberr==null?0:S.gfxAberr;
  const CA_MAX=0.006, CA_DECAY=120;
  const crashAb=(S._crashCAt!=null)? Math.max(0, CA_MAX*(1-(S.t-S._crashCAt)/CA_DECAY)) : 0;
  gl.uniform1f(GFX.pComp.u.aberrAmt, baseAb + crashAb);
  gfxDraw(GFX.pComp);
  if(glcv.style.display!=="block") glcv.style.display="block";   // reveal only once a real frame is composited
  gl.bindTexture(gl.TEXTURE_2D,null);                        // unbind unit 1: never leave an FBO tex
  gl.activeTexture(gl.TEXTURE0);                             // bound while we render INTO it next frame
}
glcv.addEventListener("webglcontextlost",e=>{e.preventDefault();GFX.gl=null;});
glcv.addEventListener("webglcontextrestored",()=>{GFX.fail=false;GFX.gl=null;gfxInit();});

/* ===================== SOUND — procedural Web Audio ======================
   Zero samples, zero libraries: the whole soundscape is synthesized from the
   same state the physics writes every substep.
   - EXHAUST: ENGINE-ORDER additive synthesis. A four-stroke four fires each
     cylinder once per two crank revolutions, so its spectrum lives on engine
     orders — multiples of HALF the crank frequency. One band-limited
     PeriodicWave oscillator runs at the 0.5-order fundamental (rpm/120 Hz, the
     full 720° cycle); harmonic k of that wave is engine order k/2, so harmonic
     4 is the firing note (2nd order, loudest), 8/12/16 are the 4th/6th/8th
     orders that fill the body, and the odd + half harmonics sit lower for the
     burble. A COMBUSTION TEXTURE — noise gated by a narrow pulse at the firing
     rate — adds the grit of discrete burns (a chuff at idle that fuses into a
     growl up top). Throttle drives a soft-clip stage into a muffler LP; a
     highpass bleeds the subsonic 0.5/1st orders. RPM/pedal come from S.eng/S.drv.
   - TURBO: white noise band-passed up the tach — intake hiss follows boost
     (louder with the open King Cobra intake fitted), a narrow high-Q whistle
     rides on top, and lifting off above ~0.7 bar gives the soft, dark chuff
     of the RECIRCULATING bypass valve dumping charge back to the intake —
     Trionic cars don't vent to atmosphere, so there's no blow-off 'tsssh'.
   - ROAD: noise voiced by the contact calculations. Clean tarmac whirs
     smooth and low; gravel, dirt and snow get a 24 Hz random clump; rain
     adds wet hiss; black ice (icePatchAt) fades it to a whisper.
   - TIRES: slip (v.slip wheelspin flag, driftYaw) drives a stick-slip squeal
     on tarmac — a low, rough scrub (core ~380-720 Hz, noise-dominated) that
     chirps on momentary spikes and growls when held sideways, judder-broken so
     it never sits on a dead whistle — and converts to scrabble on loose stuff.
   Toggle: CONFIG ▸ GAME. The context is born on the first user gesture
   (autoplay law); S.snd rides in the save code.                          */
const SND={ctx:null,on:false};
function sndCurveCrush(){ // gentle tanh warmth with a trace of grain — muffler, not a fuzz pedal
  const N=4096, c=new Float32Array(N);
  for(let i=0;i<N;i++){ const x=i/(N-1)*2-1, y=Math.tanh(x*1.25);

  if(SND.ctx){ if(S.snd){ SND.ctx.resume&&SND.ctx.resume();
      SND.master.gain.setTargetAtTime(0.34,SND.ctx.currentTime,0.3); }
    else SND.master.gain.setTargetAtTime(0,SND.ctx.currentTime,0.15); }
  if(!silent)toast(S.snd?"\uD83D\uDD0A ENGINE AUDIO \u2014 engine-order exhaust with combustion grit, turbo hiss, the road under the tires. All synthesized live from the physics."
                        :"Engine audio off \u2014 the mountain goes quiet.");
}
function sndFrame(){

  const ctx=SND.ctx;

  if(ctx.state==="suspended"){ctx.resume&&ctx.resume();return;}
  const t=ctx.currentTime, v=S.veh, e=S.eng, d=S.drv;
  const rpm=Math.max(600,e.rpm||850), pedal=Math.max(0,Math.min(1,d.pedal||0));
  const rpmN=Math.min(1,rpm/6200), vN=Math.min(1,v.v/45);

  // 720° cycle) carries every order at once; harmonic 4 IS the firing note.

  // COMBUSTION TEXTURE: pulse the noise at the firing rate. Depth is loudest at
  // idle/low rpm (you hear each event) and under load (harder burn); it recedes
  // relative to the tone up top as the pulses fuse into a continuous growl.

    SND.combDepth.gain.setTargetAtTime(grit, t,0.06); }
  if(SND.combBP) SND.combBP.frequency.setTargetAtTime(700+pedal*700+rpmN*500, t,0.06);
  // idle lope: cents of detune breathing, strongest at low rpm/closed throttle
  if(SND.lopeG){ const lope=Math.max(0,1-rpmN*2.2)*(1-pedal*0.7);
    SND.lopeG.gain.setTargetAtTime(9*lope, t,0.12); }        // up to ~9 cents wobble at idle

  const duck=(S.menuOpen?0.35:1)*(S.wreck?0.25:1);
  SND.exGain.gain.setTargetAtTime((0.014+pedal*0.034+rpmN*0.016)*duck, t,0.06); // background level: the engine sits well under the music

  SND.hissBP.frequency.setTargetAtTime(900+boostN*3600+rpmN*800, t,0.06);
  SND.hiss.gain.setTargetAtTime(Math.pow(boostN,1.4)*0.21*intakeK*duck, t,0.06);
  SND.whisBP.frequency.setTargetAtTime(2400+rpmN*4600+boostN*1600, t,0.05);
  SND.whis.gain.setTargetAtTime(boostN*boostN*0.07*intakeK*duck, t,0.05);

  // of the compressor. No atmospheric report — a soft, dark chuff that drifts

  // but never the aftermarket "tsssh". Scales with how much boost was dumped.

  // on the loose stuff slip is scrabble (already in the clump), on ice silence

  // and it climbs far less with speed so a fast slide growls instead of screaming.
  const sqF=Math.min(760, 380+slipQ*230+v.v*3.2)+(Math.random()-0.5)*260; // skittering core, capped low

  SND.sqBP.frequency.setTargetAtTime(sqF*1.05, t,0.012);
  if(SND.sqBP2) SND.sqBP2.frequency.setTargetAtTime(sqF*1.9+(Math.random()-0.5)*300, t,0.012); // rough upper formant, own jitter
  SND.sq.gain.setTargetAtTime(sqG*duck, t, sqG>SND._lastSq?0.03:0.10); // fast attack chirps, slow release cries
  if(SND.sqRough) SND.sqRough.gain.setTargetAtTime(sqG*duck*0.8, t,0.03); // judder depth scales with the squeal (deeper stick-slip break-up)
  if(SND.sqPan) SND.sqPan.pan.setTargetAtTime(Math.max(-0.6,Math.min(0.6,(v.driftYaw||0)*2.2)), t,0.08);
  SND._lastSq=sqG;
}

  {id:1, nm:"NIGHT DRIVE",     sub:"Emergent and moody: an arp emerges with revs, detuned power stabs come in on boost, and a driving kit fills toward four-on-the-floor as speed, rpm and boost stack up. Your build hardens the palette."},

  if(o.bp){ const f=ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.value=o.bp; f.Q.value=o.bpQ||1.2; node.connect(f); node=f; }

// SNARE — two-part: a bandpassed body plus a bright noise crack. Straight to the

function mStepEuro(step,tAt,secStep,E){         // STYLE 2 — TOUGE EUROBEAT (fast, driving)

function musicFrame(){

    if(SND.padLP)   SND.padLP.frequency.setTargetAtTime(620+speedN*1250, t,0.5);

    if(SND.padLP)   SND.padLP.frequency.setTargetAtTime(640+speedN*1300+rpmN*700, t,0.5);
    if(SND.musicLP) SND.musicLP.frequency.setTargetAtTime(3600+energy*4200, t,0.4);   // lid off with energy
    if(SND.mDelayFb)SND.mDelayFb.gain.setTargetAtTime(0.30+0.14*energy, t,0.4);        // longer tails when pushing

function sndHorn(c,gap,closing){
  if(!sndReady())return; const ctx=SND.ctx,t=ctx.currentTime;
  const heavy=(c.type==="lorry"||c.type==="bus");
  const f1=heavy?300:415, f2=heavy?375:520;                    // the dual tone
  const det=0.94+Math.random()*0.12;                           // every horn its own voice
  const vol=0.20*(1-Math.min(0.85,gap/240))+0.05;              // closer is louder
  const tMeet=Math.max(0.15,Math.min(2.6,gap/Math.max(6,closing)));
  const r=Math.random();
  const beeps = r<0.40? [[0,0.9]] : r<0.75? [[0,0.16],[0.26,0.34]] : [[0,0.3]];

    o.type="square"; g.gain.value=0;
    o.frequency.setValueAtTime(fq*det*1.06,t);                 // Doppler: sharp coming,
    o.frequency.setValueAtTime(fq*det*1.06,t+tMeet);           // flat going
    o.frequency.linearRampToValueAtTime(fq*det*0.90,t+tMeet+0.22);
    for(const [on,len] of beeps){
      g.gain.setValueAtTime(0.0001,t+on);
      g.gain.linearRampToValueAtTime(vol,t+on+0.02);
      g.gain.setValueAtTime(vol,t+on+len);

}
function sndHornWatch(){ // an oncoming car sees you in its lane: it says so
  if(!sndReady())return;
  const v=S.veh;

    if(c.dir>=0) continue;
    const inPath=Math.abs(c.lane-v.lane)<1.6, gap=c.s-v.s, closing=v.v+c.v;
    c._hornT=Math.max(0,(c._hornT||0)-(S._fdt||0.042));

    sky.addColorStop(0.7,wx==="rain"?"#39414d":"#59636f"); sky.addColorStop(1,"#6d6e6a"); }
  else if(wx==="fog"){ sky.addColorStop(0,"#8b93a0"); sky.addColorStop(1,"#b7bcc2"); }

    const botC=S.night?"rgba(52,60,74,":overcast?"rgba(40,45,52,":wx==="heat"?"rgba(150,120,96,":wx==="snow"?"rgba(150,158,168,":"rgba(150,164,182,";

      ctx.fillStyle="rgba(190,210,235,"+((S.night?0.10:0.16)*bi).toFixed(3)+")";

      const hh=(Math.imul(Math.floor(a.s/22),2246822519)>>>0);
      const off=((hh&255)/255-0.5)*wA*0.7, wid=wA*(0.5+((hh>>>8&255)/255)*0.45);

      stripe(a.sx-wA*(0.18/hA), b.sx-wB*(0.18/hB), "#b8a23e", Math.max(2,lineW));   // twin
      stripe(a.sx+wA*(0.18/hA), b.sx+wB*(0.18/hB), "#b8a23e", Math.max(2,lineW));   // median
      if(band){ const mids=[]; for(let li=0;li+1<pfA.own.length;li++) mids.push((pfA.own[li]+pfA.own[li+1])/2);
        for(const m of mids) for(const sd of [-1,1])

      if(band){ const m=(pfA.own[0]+pfA.own[1])/2;

        stripe(a.sx-wA*(m/hA), b.sx-wB*(m/hB), "#c9c9bd"); } }

    // and never over loose surfaces or buried snow.
    if(!pfA.gravel && !pfA.dirt && S.wx.type!=="snow"){
      const ef=pfA.edge/pfA.half, ecol=S.night?"#c7c9c0":"#dcdcd2";
      stripe(a.sx-wA*ef, b.sx-wB*ef, ecol);
      stripe(a.sx+wA*ef, b.sx+wB*ef, ecol);

    // uneven gravel shoulder: width wanders, tone mottles
    for(const side of [-1,1]){
      if(side>0 && sidWA>0.6) continue;                  // the paved siding owns the right shoulder here

      let gh2=(Math.imul(gz,2654435761)^0x27d4eb2f)>>>0; gh2=(gh2^gh2>>>13)>>>0;
      const wOut=1.04+0.20*((gh2&255)/255), tone=(gh2>>>8)&1;
      ctx.fillStyle=S.night?(tone?"#15130f":"#12100d"):(tone?"#8b8172":"#7d7466");
      quad(a.sx+side*wA*0.97,a.sy,b.sx+side*wB*0.97,b.sy,

      if(band && ((gh2>>>9)&3)===0){ // scattered coarse pebbles
        ctx.fillStyle=S.night?"#1c1a15":"#6a6155";
        const px=a.sx+side*wA*(1.0+0.12*((gh2>>>12&255)/255));

      if(S.wx.type!=="snow" && biomeAt(a.s,side)==="farm" && wA>2.2){
        const fhA=a.sc*1.05, fhB=b.sc*1.05, fw=Math.max(1,b.sc*0.05);

        ctx.beginPath();                                        // two rails, near->far

        ctx.moveTo(fxB,b.sy-fhB*0.50);ctx.lineTo(fxA,a.sy-fhA*0.50);

      // occludes farther cars and the road behind it instead of the whole wall
      // being laid down before any traffic. See drawForestWall + the wall push.
      const bioV=biomeAt(a.s,side);
      // VEGETATION 2.0 — verge life, one hash per 5 m: undergrowth lumps in
      // the forest, straw tufts nodding on the dunes, dry brush in the desert.
      if(S.wx.type!=="snow" && wA>2.6){
        const vz=Math.floor(a.s/5);
        let vh=(Math.imul(vz,3266489917)^(side>0?0xaa11:0x33c7))>>>0; vh=(vh^vh>>>13)>>>0;
        if((vh&3)===0 && Math.floor(a.s/5)!==Math.floor(b.s/5)){

          const ph2=a.sc*(0.24+((vh>>>10&31)/31)*0.34);

            ctx.fillStyle=S.night?"#080c06":"#1e3315";
            ctx.beginPath();ctx.arc(px,a.sy-ph2*0.4,ph2*0.8,3.14,0);ctx.fill();

  }

  const things=[];

  // wholesale in pass one, which let distant cars punch through the near wall)

    for(let i=1;i<slices.length;i++){
      const a=slices[i]; if(!a || halfAt(a.s)*a.sc<=1.3) continue;   // same width gate as the old curtain

  // occludes them — they used to be a single batch painted on top of everything.
  // Cells are short (~6 m) and each firefly is jittered along/across/above the
  // verge, with a variable 0-2 count, so they no longer picket-fence. Only a
  // short bubble around the car is populated; a distance fade (in the draw pass)
  // means they brighten as you close and are invisible out at the edge.
  if(S.night && (S.wx.type==="clear"||S.wx.type==="heat")){

    const c0=Math.floor((v.s+2)/CELL), c1=Math.floor((v.s+FLY_MAX)/CELL);
    for(let cell=c0;cell<=c1;cell++){

          lat:2.6+((gh>>>11&63)/63)*11,                   // metres off centreline
          hgt:0.35+((gh>>>17&31)/31)*1.7,                 // metres above the verge
          ph:((gh>>>5&255)/255)*6.283,                    // blink/drift phase

  // Anything whose ground sits below that line is behind a crest — clip it.
  const wmArr=new Array(slices.length); { let wm=1e9;
    for(let i=0;i<slices.length;i++){ wmArr[i]=wm; wm=Math.min(wm,slices[i].sy); } }

      const wmW=wmArr[ci], behind=a.sy>wmW+2 && ci>2;   // treeline behind a crest: only the tops peek

    }
    if(th.fly){                              // a firefly — a light hovering over the verge
      const fi=Math.min(slices.length-1,Math.max(0,Math.floor(th.d/step)));
      const fa=slices[fi]; if(!fa) continue;
      const fb=slices[Math.min(slices.length-1,fi+1)]||fa;
      const ff=Math.min(1,Math.max(0,th.d/step-fi));
      const sx0=fa.sx+(fb.sx-fa.sx)*ff, sy0=fa.sy+(fb.sy-fa.sy)*ff, sc=fa.sc+(fb.sc-fa.sc)*ff;
      const fo=th.fly;
      const tw=0.5+0.5*Math.sin(S.t*fo.spd+fo.ph);        // the blink
      if(tw<0.18) continue;
      const fade=Math.max(0,Math.min(1,(112-th.d)/72));   // fade in as it nears; dark far off
      if(fade<0.02) continue;
      const fx=sx0+fo.side*fo.lat*sc+Math.sin(S.t*0.5+fo.ph)*sc*0.6;
      const fy=sy0-fo.hgt*sc+Math.sin(S.t*0.8+fo.ph*2)*sc*0.32;
      const col=fo.hue===0?"210,255,150":fo.hue===1?"198,255,128":fo.hue===2?"178,244,120":"226,255,168";
      const wmF=wmArr[fi], behindF=sy0>wmF+2 && fi>2;    // its patch of verge is behind a crest
      if(behindF){ ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,wmF+1); ctx.clip(); }  // only what clears the hill
      ctx.fillStyle="rgba("+col+","+(fade*(0.28+0.60*tw)).toFixed(3)+")";
      ctx.shadowColor="rgba("+col+",0.9)"; ctx.shadowBlur=6*tw*fade;
      ctx.beginPath();ctx.arc(fx,fy,Math.max(0.9,sc*0.045)+tw*0.7,0,7);ctx.fill();
      ctx.shadowBlur=0;
      if(behindF) ctx.restore();
      continue;
    }
    const i=Math.min(slices.length-1,Math.max(0,Math.floor(th.d/step)));
    const sA=slices[i]; if(!sA) continue;
    const sB=slices[Math.min(slices.length-1,i+1)]||sA;
    const f=Math.min(1,Math.max(0,th.d/step-i));
    const sl={sx:sA.sx+(sB.sx-sA.sx)*f, sy:sA.sy+(sB.sy-sA.sy)*f,
              sc:sA.sc+(sB.sc-sA.sc)*f, z:sA.z+(sB.z-sA.z)*f, s:v.s+th.d};
    const wE=Math.max(3.0,halfAt(sl.s))*sl.sc, wm=wmArr[i]; // road-edge width in screen units
    if(sl.sy>wm+2 && i>2){                       // ground hidden behind a crest
      ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,wm+1); ctx.clip(); // tops may peek
      if(th.dl) drawDelineator(sl,wE);
      else if(th.f) drawFeature(th.f,sl,wE);
      else drawCar(th.c,sl,wE);
      ctx.restore();
    } else {
      if(th.dl) drawDelineator(sl,wE);
      else if(th.f) drawFeature(th.f,sl,wE);
      else drawCar(th.c,sl,wE);
    }
  }
  // (fireflies now render inside the far->near feature pass above, so a nearer
  //  car occludes them and they fade in with distance — see the "lightning bugs"
  //  emitter before things.sort and its handler in the draw loop.)
  if(S.veh.rollA){ ctx.restore(); }

  if(S.night){
    const gcone=ctx.createRadialGradient(W/2,H*0.62,10,W/2,H*0.62,H*0.55);
    gcone.addColorStop(0,"rgba(255,240,190,0.13)"); gcone.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=gcone; ctx.fillRect(0,0,W,H);
  }

  if(S.wx.type==="rain"){
    ctx.strokeStyle="rgba(190,205,225,0.30)";ctx.lineWidth=1;
    const slant=Math.min(14,4+v.v*0.22), fall=(S.t*640)%H;
    ctx.beginPath();
    for(let i=0;i<46;i++){const px=(i*131)%W, py=(i*67+fall)%H;
      ctx.moveTo(px,py);ctx.lineTo(px-slant,py+13);}
    ctx.stroke();
  } else if(S.wx.type==="snow"){
    ctx.fillStyle="rgba(240,244,248,0.8)";
    const fall=(S.t*90)%H;
    for(let i=0;i<52;i++){const px=(i*131+Math.sin(S.t+i)*24)%W, py=(i*67+fall)%H;
      ctx.fillRect(px,py,2.2,2.2);}
  }
  // fog: global weather OR a local biome fog bank
  const fogA=Math.max(S.wx.type==="fog"?1:0, fogAt(v.s)*0.85);
  if(fogA>0.03){
    const fgTop=horizon+H*0.16;
    // at night, fog is UNLIT — a dark haze that swallows the distance, not a bright
    // grey wash. The headlights light it only inside the beam (the cone below).
    const fc=S.night?"26,30,40":"178,185,194";
    const fg=ctx.createLinearGradient(0,0,0,fgTop);
    fg.addColorStop(0,"rgba("+fc+","+(0.22*fogA).toFixed(3)+")");
    fg.addColorStop(Math.max(0.05,(horizon-26)/fgTop),"rgba("+fc+","+(0.85*fogA).toFixed(3)+")");
    fg.addColorStop(1,"rgba("+fc+",0)");
    ctx.fillStyle=fg;ctx.fillRect(0,0,W,fgTop);
    if(S.night){                                             // headlights scattering in the fog — the only bright fog at night
      const lit=ctx.createRadialGradient(W/2,H*0.62,10,W/2,H*0.62,H*0.52);
      lit.addColorStop(0,"rgba(214,206,176,"+(0.18*fogA).toFixed(3)+")");
      lit.addColorStop(0.6,"rgba(196,190,168,"+(0.07*fogA).toFixed(3)+")");
      lit.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=lit;ctx.fillRect(0,0,W,fgTop);
    }
  }
  // lightning ambient: the whole scene briefly lights up. Only the soft
  // full-frame wash stays on top — the bright sky flash and the bolt are drawn
  // back in the sky layer, so the foreground occludes them.
  const fl=S.wx.flash||0;
  if(fl>0.03){
    ctx.fillStyle="rgba(205,218,250,"+(fl*0.14).toFixed(3)+")";ctx.fillRect(0,0,W,H);
  }
  ctx.restore();                                              // end body-roll tilt
}
/* biomes: each side of the road gets its own zone sequence. Pure hash of

function mixHex(h1,h2,t){ // lerp two #rrggbb (or rgb() passthrough on t=0/1)
  if(t<=0)return h1; if(t>=1)return h2;
  const p=x=>parseInt(x.slice(1),16), a=p(h1), b=p(h2);
  const r=Math.round(((a>>16)&255)*(1-t)+((b>>16)&255)*t),
        g=Math.round(((a>>8)&255)*(1-t)+((b>>8)&255)*t),
        bl=Math.round((a&255)*(1-t)+(b&255)*t);
  return "rgb("+r+","+g+","+bl+")"; }
function bioBlendT(sPos){ // 0 mid-cell; ->1 approaching the next cell edge
  const into=((sPos%1600)+1600)%1600;
  return into>1450? (into-1450)/150 : 0;
}
function bioMix(col, sPos, side, band){ // fade this cell's colour toward the next
  const t=bioBlendT(sPos); if(t<=0) return col;
  const Q=BIO_GRASS[biomeAt(sPos+160,side)];
  return mixHex(col, S.night?(band?Q.n1:Q.n2):(band?Q.d1:Q.d2), t);
}
function biomeAt(sPos,side){
  const z=Math.floor(sPos/1600);
  let h=(Math.imul(z,2654435761)^(side>0?0x9e3779b9:0x1234567))>>>0;
  h=(h^h>>>13)>>>0; const p=h%12;
  return p<4?"forest":p<6?"beach":p<8?"desert":p<10?"farm":"cliff";
}
const FOG_P={forest:0.30,beach:0.25,desert:0.08,cliff:0.24,farm:0.16};
function fogAt(sPos){ // local fog banks, biome-weighted, ramped at zone edges
  const z=Math.floor(sPos/1600);
  let h=(Math.imul(z,3266489917)^0x51ed270b)>>>0; h=(h^h>>>15)>>>0;
  const r=(h%1000)/1000;
  const p=(FOG_P[biomeAt(sPos,-1)]+FOG_P[biomeAt(sPos,1)])/2;
  if(r>=p) return 0;
  const into=sPos-z*1600, edge=Math.min(into,1600-into);
  return Math.max(0,Math.min(1,edge/70));
}
const BIO_GRASS={
  forest:{d1:"#233021",d2:"#1e2a1c",n1:"#0b0f08",n2:"#0d1109"},
  beach: {d1:"#b9a06b",d2:"#ad9560",n1:"#151209",n2:"#17140b"},
  desert:{d1:"#a1794a",d2:"#966f45",n1:"#120e08",n2:"#151009"},
  cliff: {d1:"#6b6862",d2:"#605d57",n1:"#0d0d0c",n2:"#0f0f0e"},
  farm:  {d1:"#8a8748",d2:"#6f7a3c",n1:"#12110a",n2:"#101208"} // stubble gold / ley green, band = field strips
};
function quad(x1,y1,x2,y2,x3,y3,x4,y4){
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x3,y3);ctx.lineTo(x4,y4);ctx.fill();
}
function drawDelineator(sl,wS){

function drawForestWall(a,b,side){    // one segment of the forest treeline, drawn in painter's order with the cars

  ctx.fillStyle=S.night?"#040704":(S.wx.type==="rain"?"#131c10":"#22371a");

  // serrated crown — each treetop is pinned to a FIXED world arclength and then
  // projected from the two slice endpoints, so it holds station as the road
  // sweeps and simply flows toward you. (It used to sit at the camera-relative
  // segment midpoint with a midpoint-hashed height, so the tips swam and popped
  // through every turn.)

function drawFeature(f,sl,wS){

function drawCar(c,sl,wRoad){        // wRoad = ACTUAL road-half in screen units (caller passes wE)
  const x=sl.sx + c.lane*sl.sc;      // metres -> screen. (Was (c.lane/7.2)*wS with wS=7.2*sc; the 7.2 canceled — position unchanged.)
  const T=VTYPES[c.type||"sedan"];
  // width grows sub-linearly and caps inside the lane; the SIZE reads through height.
  // Sized off the ACTUAL road width now, so traffic stops rendering oversized on
  // narrow profiles (dirt/rural). Pixel-identical on the 4-lane road where half==7.2.
  const cw=Math.max(9, sl.sc*Math.min(3.05, T.w*1.36)), ch=cw*0.62*T.hK; // hard-capped at 3.05 m so a 2.5 m bus fits a 3.4 m lane; size now reads through HEIGHT (hK), not spilled width
  // soft grounded shadow — a squashed radial falloff, not a hard slab
  ctx.save();
  ctx.translate(x, sl.sy+ch*0.02);
  ctx.scale(1, 0.30);
  const shG=ctx.createRadialGradient(0,0,0, 0,0, cw*0.62);
  shG.addColorStop(0,   "rgba(0,0,0,0.46)");
  shG.addColorStop(0.62,"rgba(0,0,0,0.24)");
  shG.addColorStop(1,   "rgba(0,0,0,0)");
  ctx.fillStyle=shG; ctx.beginPath(); ctx.arc(0,0,cw*0.62,0,7); ctx.fill();
  ctx.restore();
  // wheels
  ctx.fillStyle="#0c0d0f";
  ctx.fillRect(x-cw*0.52,sl.sy-ch*0.22,cw*0.14,ch*0.24);
  ctx.fillRect(x+cw*0.38,sl.sy-ch*0.22,cw*0.14,ch*0.24);
  // ---- body: layered shading so it reads as a rounded VOLUME, not a flat blob ----
  const hi=S.night?0.45:1;                       // specular highlights ease off at night
  let bh, br;                                     // body height + corner radius, per type
  if(c.type==="lorry"||c.type==="bus"){ bh=ch*0.96; br=cw*0.05; }
  else if(c.type==="van"){ bh=ch*0.94; br=cw*0.10; }
  else { bh=ch*0.9; br=cw*0.12; }
  const by=sl.sy-ch;                              // body top
  const bodyPath=()=>roundRect(x-cw/2,by,cw,bh,br);
  // base paint
  ctx.fillStyle=c.col; bodyPath();
  // heavy vehicles keep their dark glasshouse box, painted before the shading unifies it
  if(c.type==="lorry"||c.type==="bus"){
    ctx.fillStyle="rgba(16,22,30,0.9)";
    if(c.type==="bus") ctx.fillRect(x-cw*0.42,sl.sy-ch*0.82,cw*0.84,ch*0.3);
    else ctx.fillRect(x-cw*0.34,sl.sy-ch*0.9,cw*0.68,ch*0.16);
  }
  // 1) cross-body roundness: flanks roll into shadow, a soft crown runs down the spine
  const fg=ctx.createLinearGradient(x-cw/2,0,x+cw/2,0);
  fg.addColorStop(0,   "rgba(0,0,0,0.42)");
  fg.addColorStop(0.16,"rgba(0,0,0,0.13)");
  fg.addColorStop(0.5, "rgba(255,255,255,"+(0.07*hi).toFixed(3)+")");
  fg.addColorStop(0.84,"rgba(0,0,0,0.13)");
  fg.addColorStop(1,   "rgba(0,0,0,0.42)");
  ctx.fillStyle=fg; bodyPath();
  // 2) vertical sheen: lit roof up top, shaded sill, an ambient-occlusion kiss at the ground
  const bg=ctx.createLinearGradient(0,by,0,sl.sy);
  bg.addColorStop(0,   "rgba(255,255,255,"+(0.24*hi).toFixed(3)+")");
  bg.addColorStop(0.28,"rgba(255,255,255,0)");
  bg.addColorStop(0.70,"rgba(0,0,0,0)");
  bg.addColorStop(1,   "rgba(0,0,0,0.48)");
  ctx.fillStyle=bg; bodyPath();
  // 3) crisp specular pip on the crown — the glint that sells the curved metal
  if(hi>0.15){
    ctx.fillStyle="rgba(255,255,255,"+(0.30*hi).toFixed(3)+")";
    roundRect(x-cw*0.05, by+bh*0.05, cw*0.11, bh*0.15, cw*0.035);
  }
  // greenhouse + one bright quarterlight
  ctx.fillStyle="#1b232d"; roundRect(x-cw*0.36,sl.sy-ch*0.96,cw*0.72,ch*0.34,cw*0.08);
  ctx.fillStyle="rgba(200,220,240,"+(0.10+0.12*hi).toFixed(3)+")"; roundRect(x-cw*0.34,sl.sy-ch*0.95,cw*0.30,ch*0.14,cw*0.05);
  if(cw>16 && c.type!=="lorry" && c.type!=="bus"){          // panel detail resolves only when it is close enough to read
    ctx.fillStyle="rgba(255,255,255,"+(0.15*hi).toFixed(3)+")";                    // belt-line crease along the flank
    ctx.fillRect(x-cw*0.44,sl.sy-ch*0.5,cw*0.88,Math.max(1,ch*0.03));
    ctx.fillStyle="rgba(10,14,20,0.8)";                                            // C-pillar / rear-glass split
    ctx.fillRect(x-cw*0.01,sl.sy-ch*0.95,Math.max(1,cw*0.02),ch*0.30);
    ctx.fillStyle=c.col;                                                           // door mirrors at the shoulders
    ctx.fillRect(x-cw*0.5,sl.sy-ch*0.66,cw*0.06,ch*0.06);
    ctx.fillRect(x+cw*0.44,sl.sy-ch*0.66,cw*0.06,ch*0.06);
    if(c.dir>=0){ ctx.fillStyle=S.night?"#b7b39a":"#e9e6d6";                        // number plate (rear)
      ctx.fillRect(x-cw*0.11,sl.sy-ch*0.24,cw*0.22,ch*0.10); }
    else { ctx.fillStyle="#e6e9ec"; ctx.fillRect(x-cw*0.10,sl.sy-ch*0.26,cw*0.20,ch*0.09); } // front plate
  }
  if(c.aggro){ ctx.fillStyle="#f2f2ee";                       // twin racing stripes
    ctx.fillRect(x-cw*0.115,sl.sy-ch,cw*0.075,ch*0.9);
    ctx.fillRect(x+cw*0.04,sl.sy-ch,cw*0.075,ch*0.9); }
  if(c.dir<0){ ctx.fillStyle=S.night?"#ffe9a8":"#e8edf2";
    ctx.shadowColor="#ffe9a8";ctx.shadowBlur=4;
    ctx.fillRect(x-cw*0.42,sl.sy-ch*0.42,cw*0.16,ch*0.14); ctx.fillRect(x+cw*0.26,sl.sy-ch*0.42,cw*0.16,ch*0.14);
  } else {
    const braking=c.brk>0.2;
    ctx.fillStyle=braking?"#ff2718":"#c93a30";
    ctx.shadowColor="#ff3a28";ctx.shadowBlur=braking?9:4;
    const lw=cw*(braking?0.20:0.16), lh=ch*(braking?0.16:0.12);
    ctx.fillRect(x-cw*0.46,sl.sy-ch*0.42,lw,lh); ctx.fillRect(x+cw*0.46-lw,sl.sy-ch*0.42,lw,lh);
    if(braking){ctx.fillStyle="#ff5040";ctx.fillRect(x-cw*0.10,sl.sy-ch*0.86,cw*0.20,ch*0.07);} // CHMSL
  }
  if(c.police){                                             // roof lightbar, alternating blue/red
    const on=Math.floor(S.t*6)%2===0;
    ctx.save(); ctx.shadowBlur=10;
    ctx.fillStyle=on?"#2a6bff":"#ff2e2e"; ctx.shadowColor=ctx.fillStyle;
    ctx.fillRect(x-cw*0.30, sl.sy-ch*1.03, cw*0.28, ch*0.11);
    ctx.fillStyle=on?"#ff2e2e":"#2a6bff"; ctx.shadowColor=ctx.fillStyle;
    ctx.fillRect(x+cw*0.02, sl.sy-ch*1.03, cw*0.28, ch*0.11);
    ctx.restore();
  }
  ctx.shadowBlur=0;
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);

/* Modeled on the real OG 9-3: cowled 3-dial cluster, tach with the turbo
   gauge inset low in the dial, speedo centre, temp/fuel right, amber SID
   strip in the centre stack, and the sacred NIGHT PANEL mode.            */
function layout(){
  const portrait=H>W;
  const dashTop = portrait? H*0.66 : H*0.585;
  const rDial = Math.max(26, Math.min(W*0.096, (H-dashTop)*0.285)); // the rounds, a size up — the cluster earns its cowl
  return {portrait, dashTop, rDial,
    cx: portrait? W*0.34 : W*0.30};

function glassStep(fdt){
  const g=S.glass; if(!g) return;
  const wet=S.wx.type==="rain", snowy=S.wx.type==="snow";
  const active=wet||snowy;
  if(active){
    g.film=Math.min(1, g.film+fdt*(wet?0.34:0.14));
    const cap=wet?46:34;
    if(g.drops.length<cap && Math.random()<fdt*(wet?26:15))
      g.drops.push({x:Math.random()*W, y:Math.random()*H*0.60,
                    r:1.6+Math.random()*3.4, streak:wet&&Math.random()<0.3});
    g.cool-=fdt;
    if(g.cool<=0 && g.wipeA===null){ g.wipeA=Math.PI*1.13; g.wipeDir=1; g.cool=wet?3.6:5.2; } // intermittent: a sweep, then a pause
  } else {
    g.film=Math.max(0, g.film-fdt*0.5);
    if(g.drops.length && Math.random()<fdt*3) g.drops.pop();
  }
  g.snowArc = snowy? Math.min(1,g.snowArc+fdt*0.03) : Math.max(0,g.snowArc-fdt*0.06);
  for(const d of g.drops){ if(d.streak) d.y+=fdt*(22+d.r*9); }
  g.drops=g.drops.filter(d=>d.y<H*0.64);
  if(g.wipeA!==null){
    g.wipeA+=g.wipeDir*fdt*Math.PI*0.72;
    if(g.wipeDir>0 && g.wipeA>=Math.PI*1.87){ g.wipeDir=-1; g.film*=0.12; }
    if(g.wipeDir<0 && g.wipeA<=Math.PI*1.13){ g.wipeA=null; }

    const wa=((g.wipeA%(Math.PI*2))+Math.PI*2)%(Math.PI*2);

        const aa=(Math.atan2(d.y-pvy,d.x-pvx)+Math.PI*2)%(Math.PI*2);

}
function drawGlass(){

  const snowy=S.wx.type==="snow";
  if(g.film>0.01){ // the blur: a misted film that builds between sweeps
    ctx.fillStyle="rgba(165,180,195,"+(g.film*0.16).toFixed(3)+")";
    ctx.fillRect(0,0,W,gb);
    ctx.strokeStyle="rgba(185,200,215,"+(g.film*0.09).toFixed(3)+")";ctx.lineWidth=2;
    for(let k=0;k<7;k++){const x=(k*151+40)%W;

// Wipers are drawn AFTER renderCockpit so the arms sweep in FRONT of the hood

function drawWipers(){

function renderCockpit(){

    ctx.save();

      const ph=(S.t*1.6+i*0.9)%2, px=W*(0.40+0.05*Math.sin(i*2.1+S.t*3))+i*W*0.028;
      const py=hoodY(0.40+i*0.03)-ph*46-6, r=5+ph*15;

  } else S._steamToast=0;

  ctx.beginPath();ctx.moveTo(W,0);ctx.lineTo(W*0.945,0);ctx.lineTo(W*0.988,dashTop);ctx.lineTo(W,dashTop);ctx.fill();
  ctx.fillStyle="rgba(6,8,14,0.5)"; ctx.fillRect(0,0,W,H*0.04);

  ctx.quadraticCurveTo(W*0.8,dashTop+rD*0.7,W,dashTop+rD*0.4);ctx.stroke();

  roundRect(sx, dashTop+rD*0.55+sh+8, sw*0.47, sh*0.32, 5);
  roundRect(sx+sw*0.53, dashTop+rD*0.55+sh+8, sw*0.47, sh*0.32, 5);
  ctx.strokeStyle="#3d4149";ctx.lineWidth=1;
  ctx.strokeRect(sx, dashTop+rD*0.55+sh+8, sw*0.47, sh*0.32);
  ctx.strokeRect(sx+sw*0.53, dashTop+rD*0.55+sh+8, sw*0.47, sh*0.32);
  // wheel hit zone
  ZONES.wheel={x:cx, y:cy+rD*2.3, r:rD*2.9};
  drawPedals(W, H, rD);
}
const ZONES={wheel:null,gas:null,brake:null,sid:null};
function drawPedals(W,H,rD){

  ctx.strokeStyle=I.gas?"#6fbf5a":"#3a3e45";ctx.lineWidth=2;ctx.strokeRect(gx+1,gy+1,pw-2,gh-2);
  ctx.strokeStyle=I.gas?"#3d6b34":"#2c2f36";

function dialFace(x,y,r){

const inkOn =()=> S.night? "#2a2d31" : "#d9ffe9";     // NIGHT PANEL kills glow
const inkDim=()=> S.night? "#232629" : "#5d7a68";
function radLine(x,y,r,a,k1,k2){ ctx.beginPath();

function drawAux(x,y,r){

/* --- the dashboard älg: spring-mounted moose, physics-honest -------------

function drawBobble(){
  const L=layout(), v=S.veh, vis=S.vis, fdt=Math.min(0.05, S._fdt||0.016);
  // signed accelerations
  // where the hands actually are — the rendered wheel, whether it's the AI or you
  const steerNow=(S.drv.steerS!==undefined?S.drv.steerS:S.drv.steer)||0;
  const lastSteer=vis._bobLastSteer===undefined?steerNow:vis._bobLastSteer; vis._bobLastSteer=steerNow;
  const steerRate=(steerNow-lastSteer)/Math.max(0.008,fdt);       // the flick itself
  // steering lateral load: a bicycle-model body-lean that builds with speed,
  // plus a jerk pulse so a quick yank throws his head before the spring settles.
  const steerG = steerNow*Math.min(1,v.v/12)*1.05 + steerRate*0.15;
  const latA = (v.v*v.v*(v.curv||0))/CFG.G + (v.driftYaw||0)*1.4 + (v.ts||0)*0.8 + steerG;
  const lastV = vis._bobLastV===undefined? v.v : vis._bobLastV; vis._bobLastV=v.v;

  const vert = (v.airT? -1.2 : 0) + (v.bounce||0)*2.2;

  vis.bobX=vis.bobX||0; vis.bobVX=vis.bobVX||0; vis.bobY=vis.bobY||0; vis.bobVY=vis.bobVY||0;
  const tx=Math.max(-1.4,Math.min(1.4, -latA*0.9));              // inertia: right turn, head goes left
  const ty=Math.max(-1.2,Math.min(1.2, lonA*0.55 + vert));
  vis.bobVX += ((tx-vis.bobX)*46 - vis.bobVX*5.2)*fdt; vis.bobX += vis.bobVX*fdt;
  vis.bobVY += ((ty-vis.bobY)*40 - vis.bobVY*5.6)*fdt; vis.bobY += vis.bobVY*fdt;
  const bx=W*0.655, by=L.dashTop+H*0.020, sc2=Math.min(W,H)*0.030;

  ctx.stroke();
  // moose head, tilting with the swing
  ctx.save(); ctx.translate(hx,hy); ctx.rotate(vis.bobX*0.35);
  ctx.fillStyle="#5a4632";                                      // head
  ctx.beginPath(); ctx.ellipse(0,0,sc2*0.46,sc2*0.40,0,0,7); ctx.fill();
  ctx.fillStyle="#6b5540";                                      // the great nose
  ctx.beginPath(); ctx.ellipse(0,sc2*0.30,sc2*0.30,sc2*0.24,0,0,7); ctx.fill();
  ctx.fillStyle="#8c7355";                                      // antler paddles
  ctx.beginPath(); ctx.ellipse(-sc2*0.52,-sc2*0.34,sc2*0.30,sc2*0.16,-0.5,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse( sc2*0.52,-sc2*0.34,sc2*0.30,sc2*0.16, 0.5,0,7); ctx.fill();
  ctx.fillStyle="#1a1408";                                      // eyes, mildly concerned
  ctx.beginPath(); ctx.arc(-sc2*0.16,-sc2*0.06,sc2*0.05,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc( sc2*0.16,-sc2*0.06,sc2*0.05,0,7); ctx.fill();
  ctx.restore();

const DTC_LIB={
 P0172:{nm:"System too rich (Bank 1)",why:"Fuel trim pegged negative. Big injectors, no injector constant in the file — the ECU adds what the map says, the map is wrong. Flash a file with injector cal.",fix:"Tune w/ inj cal"},
 P0300:{nm:"Random/multiple cylinder misfire",why:"Combustion quality collapsed — fouled plugs, dying DI cassette, or a bottom end past its pension. A FLASHING lamp means stop boosting: raw fuel is cooking the cat.",fix:"Plugs/DI or rebuild",flash:1},
 P0106:{nm:"MAP sensor range/performance",why:"Manifold pressure outside anything the 2.0i file can model — because someone bolted a turbo to it. The ECU is not angry, just confused. It needs a conversion file.",fix:"Stage 1 conversion file"},
 P0217:{nm:"Engine over-temperature condition",why:"Coolant past the line the head gasket signed for. Lift, let airflow work, and stop asking for boost until the needle drops.",fix:"Cool down / radiator"},
 P0128:{nm:"Coolant temp below thermostat regulating",why:"Stuck-open thermostat — she never reaches 90. Fuel washes the bores, sludge loves it. An hour of work.",fix:"Thermostat"},
 P0016:{nm:"Crank/cam correlation (Bank 1 Sensor A)",why:"The chain has stretched past what the tensioner can hide — cam timing is drifting off the crank. TSB 210-2554: over 15 mm of tensioner is the whole kit.",fix:"Timing chain kit"},
 P0171:{nm:"System too lean (Bank 1)",why:"Unmetered air past the MAF — a tired crankcase ventilation pulling vacuum leaks. The WIS renovation kit is cheap; sludge is not.",fix:"PCV renovation"},
 P0133:{nm:"O2 sensor slow response (B1 S1)",why:"The front lambda reads mush because an exhaust leak upstream is breathing fresh air over it. New downpipe gasket and studs.",fix:"DP gasket"},
 P0670:{nm:"Glow plug module performance",why:"The TiD\u2019s cold-start crutch is limping — worn glow plugs or a tired module. She\u2019ll still start warm; winter is another negotiation.",fix:"Glow plugs"},
 P0420:{nm:"Catalyst efficiency below threshold",why:"The race cat flows like a drainpipe and the rear O2 knows it. Not a fault — a consequence. A stage 2+ file recalibrates the monitor.",fix:"Stage 2 file"}
};
function computeDTCs(){
  const out=[], C=hwCeils(), jobs=S.jobs||[];
  const has=id=>jobs.some(x=>x.id===id);
  if((S.o2Foul||0)>0.5) out.push("P0133");
  if((S.o2Foul||0)>0.9 && !out.includes("P0420")) out.push("P0420");
  if(TRIMS[S.trim].diesel && (S.engHealth!==undefined&&S.engHealth<45)) out.push("P0670");
  if(C.overFuel) out.push("P0172");
  if(C.naConversionMissing) out.push("P0106");
  if(S.eng.steam || (S.eng.coolT||88)>119) out.push("P0217");
  if(has("thermostat")) out.push("P0128");
  if(has("chainKit")) out.push("P0016");
  if(has("pcv")) out.push("P0171");
  if(has("dpGasket")) out.push("P0133");
  if(S.parts.dp && S.tune<2) out.push("P0420");
  if((S.engHealth!==undefined&&S.engHealth<=5) || (C.overFuel&&S.tune===0)) out.push("P0300");
  return out;
}
function drawSID(x,y,w,h){

  ctx.strokeStyle="rgba(150,160,175,0.08)";ctx.lineWidth=1;ctx.strokeRect(x+2,y+2,w-4,h-4);
  const lines=SID_PAGES[S.sidMode%SID_PAGES.length]();

  const fpx=Math.min(h*0.34, (w*0.90)/(maxLen*0.62));
  ctx.font="bold "+fpx+"px 'Courier New',monospace";ctx.textAlign="left";ctx.textBaseline="middle";
  ctx.fillStyle=S.night?"#5a3a12":"#ff9d2e";
  ctx.shadowColor=S.night?"transparent":"#a35e10";ctx.shadowBlur=S.night?0:6;
  ctx.fillText(lines[0], x+w*0.05, y+h*0.30);

  if((S.dtc||[]).length){
    const flash=(S.dtc||[]).some(c=>DTC_LIB[c]&&DTC_LIB[c].flash);
    if(!flash || Math.floor(S.t*4)%2===0){
      const gx=x-h*0.75, gy=y+h*0.5, gs=h*0.42;
      ctx.fillStyle="#ffb03a"; ctx.shadowColor="#a35e10"; ctx.shadowBlur=7;

      ctx.fillRect(gx-gs*0.20,gy-gs*0.48,gs*0.45,gs*0.20);          // intake hat
      ctx.fillRect(gx+gs*0.55,gy-gs*0.12,gs*0.22,gs*0.26);          // output shaft
      ctx.fillRect(gx-gs*0.80,gy-gs*0.10,gs*0.25,gs*0.22);          // pulley nose
      ctx.shadowBlur=0;

    ctx.textAlign="right"; ctx.fillText("KNOCK", x+w-6, y+h*0.5); }
}
